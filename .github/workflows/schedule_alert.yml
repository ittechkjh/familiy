name: Send Daily Schedule Push Alerts

on:
  schedule:
    # 매일 UTC 12:00 (한국 시간 KST 오후 9:00 = 21:00) 실행
    - cron: '0 12 * * *'
  workflow_dispatch: # GitHub 웹페이지 Actions 탭에서 [Run workflow] 버튼으로 수동 즉시 테스트 가능

jobs:
  send-push-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: false

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      - name: Execute Daily Schedule Alert Script
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY || 'BKBMPraKK0JLJddN66OjYoDCiFyTfUdiYLVmSnJwebiOWL_TWfnR4WWxcdwpIcgZL3tFkBRmPqAiGJXZ_wNpN14' }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY || 'E1aJD5bTWjaPRGfg70EMF3-47y4Xe_58ZIgdiS7C4Ro' }}
          VAPID_SUBJECT: 'mailto:family@ourhome-connect.local'
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || 'AIzaSyC6OW9ACw4LYewILAcZlE3jxhNX5KzmS7w' }}
          FIREBASE_PROJECT_ID: 'family-8fba4'
        run: |
          node scripts/send-schedule-alerts.js
