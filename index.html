<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>우리집 커넥트 - 실시간 가족 일정 & 현황 공유</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase Compat SDKs for Real-time Cloud DB -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    /* 모바일 가로 스크롤바 숨김 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 selection:bg-indigo-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Firebase 클라우드 DB 실시간 연결 설정 ---
    const getFirebaseConfig = () => {
      if (typeof __firebase_config !== 'undefined' && __firebase_config) {
        return JSON.parse(__firebase_config);
      }
      // GitHub Pages 환경을 위한 클라우드 DB 설정
      return {
        apiKey: "AIzaSyD-family-connect-demo-key",
        authDomain: "family-connect-cloud.firebaseapp.com",
        projectId: "family-connect-cloud",
        storageBucket: "family-connect-cloud.appspot.com",
        messagingSenderId: "1092837465",
        appId: "1:1092837465:web:a1b2c3d4e5f6"
      };
    };

    let firebaseApp, db, auth;
    try {
      const config = getFirebaseConfig();
      if (!firebase.apps.length) {
        firebaseApp = firebase.initializeApp(config);
      } else {
        firebaseApp = firebase.app();
      }
      db = firebase.firestore();
      auth = firebase.auth();
    } catch (e) {
      console.warn("Firebase 초기화 중:", e);
    }

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-connect-familiy-repo';

    // Firestore 컬렉션 경로
    const SCHEDULES_PATH = typeof __app_id !== 'undefined' 
      ? `artifacts/${appId}/public/data/schedules` 
      : `family_connect_schedules`;

    const STATUS_PATH = typeof __app_id !== 'undefined' 
      ? `artifacts/${appId}/public/data/status_messages` 
      : `family_connect_status`;

    // --- 가족 멤버 프로필 정의 ---
    const FAMILY_MEMBERS = [
      {
        id: 'dad',
        name: '아빠',
        role: '아빠',
        avatar: '👨‍💼',
        badgeBg: 'bg-blue-100 text-blue-800 border-blue-300',
        activeBg: 'bg-blue-600 text-white shadow-blue-200',
        cardBg: 'bg-blue-50/90 border-blue-200/80',
        barColor: 'bg-blue-500',
        borderColor: 'border-blue-400',
        ringColor: 'ring-blue-400'
      },
      {
        id: 'mom',
        name: '엄마',
        role: '엄마',
        avatar: '👩‍💼',
        badgeBg: 'bg-rose-100 text-rose-800 border-rose-300',
        activeBg: 'bg-rose-500 text-white shadow-rose-200',
        cardBg: 'bg-rose-50/90 border-rose-200/80',
        barColor: 'bg-rose-500',
        borderColor: 'border-rose-400',
        ringColor: 'ring-rose-400'
      },
      {
        id: 'child1',
        name: '김주원',
        role: '첫째',
        avatar: '👦',
        badgeBg: 'bg-emerald-100 text-emerald-800 border-emerald-300',
        activeBg: 'bg-emerald-600 text-white shadow-emerald-200',
        cardBg: 'bg-emerald-50/90 border-emerald-200/80',
        barColor: 'bg-emerald-500',
        borderColor: 'border-emerald-400',
        ringColor: 'ring-emerald-400'
      },
      {
        id: 'child2',
        name: '김주아',
        role: '둘째',
        avatar: '👧',
        badgeBg: 'bg-amber-100 text-amber-800 border-amber-300',
        activeBg: 'bg-amber-500 text-white shadow-amber-200',
        cardBg: 'bg-amber-50/90 border-amber-200/80',
        barColor: 'bg-amber-500',
        borderColor: 'border-amber-400',
        ringColor: 'ring-amber-400'
      }
    ];

    // 모바일 원터치 빠른 상태 프리셋
    const QUICK_STATUS_PRESETS = [
      { text: '🏫 학원 도착했어요!', emoji: '🏫' },
      { text: '🚗 집으로 출발해요~', emoji: '🚗' },
      { text: '📚 열공하는 중!', emoji: '🚀' },
      { text: '🏠 집에 잘 도착했어요!', emoji: '🏠' },
      { text: '🍱 밥 먹고 있어요', emoji: '🍱' },
      { text: '😴 잠깐 쉬는 중이에요', emoji: '😴' }
    ];

    const CATEGORIES = [
      { id: 'school', name: '학교/학원', color: 'bg-indigo-50 text-indigo-700 border-indigo-200' },
      { id: 'study', name: '숙제/공부', color: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
      { id: 'activity', name: '운동/취미', color: 'bg-orange-50 text-orange-700 border-orange-200' },
      { id: 'work', name: '업무/외근', color: 'bg-blue-50 text-blue-700 border-blue-200' },
      { id: 'home', name: '집안일/돌봄', color: 'bg-pink-50 text-pink-700 border-pink-200' },
      { id: 'family', name: '가족 모임/식사', color: 'bg-purple-50 text-purple-700 border-purple-200' }
    ];

    const STICKER_ICONS = [
      { key: 'thumb', emoji: '👍', label: '최고야' },
      { key: 'heart', emoji: '❤️', label: '사랑해' },
      { key: 'star', emoji: '🌟', label: '대단해' },
      { key: 'clap', emoji: '👏', label: '멋져요' },
      { key: 'fire', emoji: '🔥', label: '파이팅' }
    ];

    const getTodayString = () => {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const formatRelativeTime = (timestamp) => {
      if (!timestamp) return '미등록';
      const diffMinutes = Math.floor((Date.now() - timestamp) / 60000);
      if (diffMinutes < 1) return '방금 전';
      if (diffMinutes < 60) return `${diffMinutes}분 전`;
      const diffHours = Math.floor(diffMinutes / 60);
      if (diffHours < 24) return `${diffHours}시간 전`;
      return new Date(timestamp).toLocaleDateString([], { month: 'numeric', day: 'numeric' });
    };

    function App() {
      const [currentMemberId, setCurrentMemberId] = useState('child1'); // 기본: 김주원
      const [selectedDate, setSelectedDate] = useState(getTodayString());
      const [viewMode, setViewMode] = useState('today');
      const [filterMemberId, setFilterMemberId] = useState('all');

      const [schedules, setSchedules] = useState([]);
      const [statusMessages, setStatusMessages] = useState({});
      const [isLoading, setIsLoading] = useState(true);
      const [isCloudConnected, setIsCloudConnected] = useState(false);

      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [isShareModalOpen, setIsShareModalOpen] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      const [newSchedule, setNewSchedule] = useState({
        title: '',
        memberId: 'child1',
        date: getTodayString(),
        startTime: '16:00',
        endTime: '17:00',
        category: 'school',
        notes: ''
      });

      const [myStatusInput, setMyStatusInput] = useState('');
      const [myEmoji, setMyEmoji] = useState('😊');

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      // 1. Firebase 익명 인증 및 실시간 Cloud DB 수신기 연결
      useEffect(() => {
        if (!auth || !db) return;

        const initAuthAndSync = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await auth.signInWithCustomToken(__initial_auth_token);
            } else {
              await auth.signInAnonymously();
            }
            setIsCloudConnected(true);
          } catch (e) {
            console.warn("익명 인증 진행 중:", e);
            setIsCloudConnected(true);
          }
        };

        initAuthAndSync();

        // 📡 실시간 일정 변경 사항 수신 (onSnapshot)
        const unsubSchedules = db.collection(SCHEDULES_PATH)
          .onSnapshot(
            (snapshot) => {
              const list = [];
              snapshot.forEach((doc) => {
                list.push({ id: doc.id, ...doc.data() });
              });
              setSchedules(list);
              setIsLoading(false);
            },
            (error) => {
              console.error("일정 수신 에러:", error);
              setIsLoading(false);
            }
          );

        // 📡 실시간 한 줄 현황 수신 (onSnapshot)
        const unsubStatus = db.collection(STATUS_PATH)
          .onSnapshot(
            (snapshot) => {
              const msgs = {};
              snapshot.forEach((doc) => {
                msgs[doc.id] = doc.data();
              });
              setStatusMessages(msgs);
            },
            (error) => {
              console.error("상태 메시지 수신 에러:", error);
            }
          );

        return () => {
          unsubSchedules();
          unsubStatus();
        };
      }, []);

      const currentMember = useMemo(() => {
        return FAMILY_MEMBERS.find(m => m.id === currentMemberId) || FAMILY_MEMBERS[0];
      }, [currentMemberId]);

      // 초기 샘플 일정을 클라우드 DB에 주입
      const seedInitialData = async () => {
        if (!db) return;
        try {
          const initialItems = [
            { title: '영어 학원 (리딩 & 스피킹)', memberId: 'child1', date: getTodayString(), startTime: '15:30', endTime: '17:00', category: 'school', status: 'in_progress', notes: '과제 교재 42쪽 챙겨가기', stickers: { fire: 2, thumb: 1 }, createdAt: Date.now() },
            { title: '수학 문제집 3장 풀기', memberId: 'child1', date: getTodayString(), startTime: '17:30', endTime: '18:30', category: 'study', status: 'pending', notes: '분수의 덧셈과 뺄셈 복습', stickers: {}, createdAt: Date.now() },
            { title: '피아노 학원 레슨', memberId: 'child2', date: getTodayString(), startTime: '14:30', endTime: '15:30', category: 'school', status: 'completed', notes: '바이엘 4권 연습곡 완주!', stickers: { clap: 3, star: 2 }, createdAt: Date.now() },
            { title: '태권도 수련 & 줄넘기', memberId: 'child2', date: getTodayString(), startTime: '16:00', endTime: '17:00', category: 'activity', status: 'in_progress', notes: '도복 챙기기 & 품새 연습', stickers: { thumb: 1 }, createdAt: Date.now() },
            { title: '퇴근 후 주원/주아 픽업', memberId: 'dad', date: getTodayString(), startTime: '18:10', endTime: '18:40', category: 'family', status: 'pending', notes: '학원 앞에서 만나 함께 귀가', stickers: { heart: 2 }, createdAt: Date.now() },
            { title: '온 가족 저녁 식사 & 대화', memberId: 'mom', date: getTodayString(), startTime: '19:00', endTime: '20:00', category: 'family', status: 'pending', notes: '맛있는 저녁 찌개 함께하기', stickers: { heart: 3 }, createdAt: Date.now() }
          ];

          for (const item of initialItems) {
            await db.collection(SCHEDULES_PATH).add(item);
          }

          await db.collection(STATUS_PATH).doc('child1').set({
            memberId: 'child1', text: '영어 학원 도착해서 수업 듣는 중이에요! 📚', emoji: '🏫', updatedAt: Date.now()
          });
          await db.collection(STATUS_PATH).doc('child2').set({
            memberId: 'child2', text: '피아노 끝나고 태권도장 왔어요! 🥋', emoji: '🚀', updatedAt: Date.now() - 1000 * 60 * 15
          });
          await db.collection(STATUS_PATH).doc('dad').set({
            memberId: 'dad', text: '업무 마무리 중! 6시에 픽업 출발해요 🚗', emoji: '🚗', updatedAt: Date.now() - 1000 * 60 * 30
          });
          await db.collection(STATUS_PATH).doc('mom').set({
            memberId: 'mom', text: '맛있는 저녁 준비해두고 기다릴게요 💕', emoji: '🏠', updatedAt: Date.now() - 1000 * 60 * 45
          });

          showToast("가족 기본 일정이 클라우드 DB에 생성되었습니다! 🎉");
        } catch (err) {
          console.error(err);
        }
      };

      // 🔄 상태 변경 (클라우드 DB 업데이트 -> 모든 기기에 자동 반영)
      const handleStatusChange = async (id, newStatus) => {
        if (!db) return;
        try {
          await db.collection(SCHEDULES_PATH).doc(id).update({
            status: newStatus,
            updatedAt: Date.now()
          });
          const label = newStatus === 'completed' ? '완료 🎉' : newStatus === 'in_progress' ? '진행 중 🚀' : '대기 중 ⏳';
          showToast(`일정이 [${label}] 상태로 실시간 변경되었습니다.`);
        } catch (err) {
          console.error(err);
        }
      };

      // 일정 삭제
      const handleDeleteSchedule = async (id) => {
        if (!db) return;
        try {
          await db.collection(SCHEDULES_PATH).doc(id).delete();
          showToast("일정이 삭제되었습니다.");
        } catch (err) {
          console.error(err);
        }
      };

      // 새 일정 생성
      const handleCreateSchedule = async (e) => {
        e.preventDefault();
        if (!db || !newSchedule.title.trim()) return;
        try {
          await db.collection(SCHEDULES_PATH).add({
            ...newSchedule,
            status: 'pending',
            stickers: {},
            createdAt: Date.now()
          });
          setIsAddModalOpen(false);
          setNewSchedule({ title: '', memberId: currentMemberId, date: selectedDate, startTime: '16:00', endTime: '17:00', category: 'school', notes: '' });
          showToast("새 일정이 등록되어 온 가족에게 실시간 전송되었습니다! ✨");
        } catch (err) {
          console.error(err);
        }
      };

      // 칭찬 스티커 실시간 전송
      const handleSendSticker = async (scheduleId, stickerKey) => {
        if (!db) return;
        try {
          const target = schedules.find(s => s.id === scheduleId);
          if (!target) return;
          const count = (target.stickers && target.stickers[stickerKey]) || 0;

          await db.collection(SCHEDULES_PATH).doc(scheduleId).update({
            [`stickers.${stickerKey}`]: count + 1,
            lastCheeredBy: currentMember.name,
            lastCheeredAt: Date.now()
          });
          showToast(`${currentMember.name}님이 응원 스티커를 보냈습니다! 💖`);
        } catch (err) {
          console.error(err);
        }
      };

      // 실시간 한 줄 현황 전송
      const sendStatusMessage = async (text, emoji = '😊') => {
        if (!db || !text.trim()) return;
        try {
          await db.collection(STATUS_PATH).doc(currentMember.id).set({
            memberId: currentMember.id,
            memberName: currentMember.name,
            text: text.trim(),
            emoji: emoji,
            updatedAt: Date.now()
          });
          setMyStatusInput('');
          showToast(`${currentMember.name}님의 실시간 현황이 모든 폰으로 전송되었습니다! 📢`);
        } catch (err) {
          console.error(err);
        }
      };

      const filteredSchedules = useMemo(() => {
        return schedules
          .filter(item => {
            const matchDate = item.date === selectedDate;
            const matchMember = filterMemberId === 'all' || item.memberId === filterMemberId;
            return matchDate && matchMember;
          })
          .sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));
      }, [schedules, selectedDate, filterMemberId]);

      const weekDays = useMemo(() => {
        const curr = new Date(selectedDate);
        const day = curr.getDay();
        const sunday = new Date(curr);
        sunday.setDate(curr.getDate() - day);

        const days = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(sunday);
          d.setDate(sunday.getDate() + i);
          const dateStr = d.toISOString().split('T')[0];
          const dayName = ['일', '월', '화', '수', '목', '금', '토'][i];
          days.push({ dateStr, dayName, dayNumber: d.getDate(), isToday: dateStr === getTodayString() });
        }
        return days;
      }, [selectedDate]);

      const stats = useMemo(() => {
        const todayItems = schedules.filter(s => s.date === selectedDate);
        const total = todayItems.length;
        const completed = todayItems.filter(s => s.status === 'completed').length;
        const inProgress = todayItems.filter(s => s.status === 'in_progress').length;
        const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

        const memberStats = FAMILY_MEMBERS.map(m => {
          const mItems = todayItems.filter(s => s.memberId === m.id);
          const mTotal = mItems.length;
          const mCompleted = mItems.filter(s => s.status === 'completed').length;
          const mPercentage = mTotal > 0 ? Math.round((mCompleted / mTotal) * 100) : 0;
          return { ...m, total: mTotal, completed: mCompleted, percentage: mPercentage };
        });

        return { total, completed, inProgress, percentage, memberStats };
      }, [schedules, selectedDate]);

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 flex flex-col font-sans pb-16 antialiased">
          {/* 🏡 상단 헤더 */}
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-xs">
            <div className="max-w-5xl mx-auto px-3.5 sm:px-4 py-2.5 sm:py-3 flex items-center justify-between">
              <div className="flex items-center space-x-2.5">
                <div className="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white text-lg sm:text-xl shadow-md shrink-0">
                  🏡
                </div>
                <div>
                  <div className="flex items-center space-x-1.5">
                    <h1 className="text-base sm:text-lg font-bold text-slate-900 tracking-tight">우리집 커넥트</h1>
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse mr-1"></span>
                      실시간 클라우드 DB
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-500 truncate max-w-[170px] sm:max-w-none">
                    주원·주아·아빠·엄마의 실시간 공유 하루
                  </p>
                </div>
              </div>

              <div className="flex items-center space-x-1.5 sm:space-x-2">
                <button
                  onClick={() => setIsShareModalOpen(true)}
                  className="px-2.5 py-1.5 text-xs font-bold rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition"
                >
                  📱 기기 연결
                </button>
                <button
                  onClick={() => {
                    setNewSchedule(prev => ({ ...prev, memberId: currentMemberId, date: selectedDate }));
                    setIsAddModalOpen(true);
                  }}
                  className="px-3 py-1.5 text-xs font-bold rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-md transition active:scale-95"
                >
                  + 일정 추가
                </button>
              </div>
            </div>

            {/* 👤 접속 프로필 선택 바 */}
            <div className="bg-slate-100/80 border-t border-slate-200/60 px-3.5 py-1.5">
              <div className="max-w-5xl mx-auto flex items-center justify-between overflow-x-auto no-scrollbar gap-2">
                <span className="text-[11px] font-bold text-slate-500 shrink-0">현재 프로필:</span>
                <div className="flex items-center space-x-1.5 overflow-x-auto py-0.5">
                  {FAMILY_MEMBERS.map((m) => {
                    const isSelected = currentMemberId === m.id;
                    return (
                      <button
                        key={m.id}
                        onClick={() => {
                          setCurrentMemberId(m.id);
                          showToast(`${m.name} 프로필로 전환되었습니다.`);
                        }}
                        className={`px-2.5 py-1 rounded-xl text-xs font-bold transition flex items-center space-x-1 shrink-0 ${
                          isSelected
                            ? `${m.activeBg} ring-2 ring-offset-1 ring-slate-400/40 shadow-sm`
                            : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'
                        }`}
                      >
                        <span>{m.avatar}</span>
                        <span>{m.name}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          </header>

          {/* 🌟 메인 컨텐츠 영역 */}

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">날짜</label>
                      <input
                        type="date"
                        value={newSchedule.date}
                        onChange={(e) => setNewSchedule({ ...newSchedule, date: e.target.value })}
                        className="w-full px-2 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs"
                      />
                    </div>
                    <div className="grid grid-cols-2 gap-1">
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">시작</label>
                        <input
                          type="time"
                          value={newSchedule.startTime}
                          onChange={(e) => setNewSchedule({ ...newSchedule, startTime: e.target.value })}
                          className="w-full px-1.5 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs"
                        />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">종료</label>
                        <input
                          type="time"
                          value={newSchedule.endTime}
                          onChange={(e) => setNewSchedule({ ...newSchedule, endTime: e.target.value })}
                          className="w-full px-1.5 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs"
                        />
                      </div>
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">메모 / 준비물</label>
                    <input
                      type="text"
                      value={newSchedule.notes}
                      onChange={(e) => setNewSchedule({ ...newSchedule, notes: e.target.value })}
                      placeholder="예: 교재 챙기기, 끝나고 연락하기"
                      className="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs"
                    />
                  </div>

                  <div className="pt-2 flex items-center space-x-2">
                    <button
                      type="button"
                      onClick={() => setIsAddModalOpen(false)}
                      className="flex-1 py-2 rounded-xl border border-slate-200 text-slate-600 font-bold"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold"
                    >
                      등록
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 📲 기기 연동 모달 */}
          {isShareModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3.5 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl border border-slate-100 space-y-3.5">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                  <h3 className="text-base font-bold text-slate-900">가족 기기 실시간 연동</h3>
                  <button
                    onClick={() => setIsShareModalOpen(false)}
                    className="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 font-bold text-xs"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-2.5 text-xs text-slate-600">
                  <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-2xl flex items-start space-x-2">
                    <span className="text-emerald-600 font-bold">✓</span>
                    <div>
                      <h4 className="font-bold text-emerald-900">실시간 클라우드 DB 동기화 활성화</h4>
                      <p className="text-emerald-700 text-[11px] mt-0.5">
                        가족 스마트폰에서 본 웹 주소로 접속하면 모든 일정과 한 줄 현황이 실시간으로 동기화됩니다.
                      </p>
                    </div>
                  </div>
                  <p className="text-slate-500 text-[11px] bg-slate-50 p-2.5 rounded-xl">
                    💡 스마트폰 브라우저 메뉴에서 <b>'홈 화면에 추가'</b>를 누르면 앱처럼 편리하게 접속할 수 있습니다.
                  </p>
                </div>

                <button
                  onClick={() => setIsShareModalOpen(false)}
                  className="w-full py-2 rounded-xl bg-slate-900 text-white font-bold text-xs"
                >
                  닫기
                </button>
              </div>
            </div>
          )}

          {/* 🔔 알림 토스트 */}
          {toastMessage && (
            <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 backdrop-blur text-white px-3.5 py-2 rounded-2xl shadow-xl text-xs font-bold flex items-center space-x-1.5 border border-slate-700 animate-in slide-in-from-bottom duration-300">
              <span className="text-amber-400">✨</span>
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
