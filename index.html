  <script type="text/babel">

    // --- Firebase 기본 설정 ---
    const DEFAULT_FIREBASE_CONFIG = {

    const FAMILY_MEMBERS = [

    const QUICK_STATUS_PRESETS = [
      { text: '🏫 학원 도착했어요!', emoji: '🏫' },
      { text: '🚗 집으로 출발해요~', emoji: '🚗' },
      { text: '📚 열공하는 중!', emoji: '🚀' },
      { text: '🏠 집에 잘 도착했어요!', emoji: '🏠' },
      { text: '🍱 밥 먹고 있어요', emoji: '🍱' },
      { text: '😴 잠깐 쉬는 중이에요', emoji: '😴' }
    ];

    const CATEGORIES = [
      { id: 'school', name: '학교/학원', color: 'bg-indigo-50 text-indigo-700 border-indigo-200' },
      { id: 'study', name: '숙제/공부', color: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
      { id: 'activity', name: '운동/취미', color: 'bg-orange-50 text-orange-700 border-orange-200' },
      { id: 'work', name: '업무/외근', color: 'bg-blue-50 text-blue-700 border-blue-200' },
      { id: 'home', name: '집안일/돌봄', color: 'bg-pink-50 text-pink-700 border-pink-200' },
      { id: 'family', name: '가족 모임/식사', color: 'bg-purple-50 text-purple-700 border-purple-200' }
    ];

    const STICKER_ICONS = [
      { key: 'thumb', emoji: '👍', label: '최고야' },
      { key: 'heart', emoji: '❤️', label: '사랑해' },
      { key: 'star', emoji: '🌟', label: '대단해' },
      { key: 'clap', emoji: '👏', label: '멋져요' },
      { key: 'fire', emoji: '🔥', label: '파이팅' }
    ];

    const getTodayString = () => {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const formatRelativeTime = (timestamp) => {
      if (!timestamp) return '미등록';
      const diffMinutes = Math.floor((Date.now() - timestamp) / 60000);
      if (diffMinutes < 1) return '방금 전';
      if (diffMinutes < 60) return `${diffMinutes}분 전`;
      const diffHours = Math.floor(diffMinutes / 60);
      if (diffHours < 24) return `${diffHours}시간 전`;
      return new Date(timestamp).toLocaleDateString([], { month: 'numeric', day: 'numeric' });
    };

    // 📅 구글 캘린더 내보내기 URL 생성 함수
    const createGoogleCalendarUrl = (item) => {
      const dateClean = (item.date || getTodayString()).replace(/-/g, ''); // YYYYMMDD
      const startClean = (item.startTime || '09:00').replace(':', '') + '00'; // HHMMSS
      const endClean = (item.endTime || '10:00').replace(':', '') + '00'; // HHMMSS

      const startIso = `${dateClean}T${startClean}`;
      const endIso = `${dateClean}T${endClean}`;

      const member = FAMILY_MEMBERS.find(m => m.id === item.memberId);
      const category = CATEGORIES.find(c => c.id === item.category);

      const title = `[우리집] ${item.title} (${member ? member.name : ''})`;
      const details = `📅 분류: ${category ? category.name : ''}\n👨‍👩‍👧‍👦 담당: ${member ? member.name : ''}\n💬 메모: ${item.notes || '없음'}\n\n* 우리집 커넥트에서 작성된 일정입니다.`;

      return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${startIso}/${endIso}&details=${encodeURIComponent(details)}`;
    };

    function App() {
      // --- 로그인 & 인증 상태 ---
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentMemberId, setCurrentMemberId] = useState('child1');
      const [selectedLoginMember, setSelectedLoginMember] = useState('child1');
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [rememberMe, setRememberMe] = useState(true);

      // --- 비밀번호 설정 모달 상태 ---
      const [isPinModalOpen, setIsPinModalOpen] = useState(false);
      const [pinFormOld, setPinFormOld] = useState('');
      const [pinFormNew, setPinFormNew] = useState('');
      const [pinFormConfirm, setPinFormConfirm] = useState('');
      const [pinModalError, setPinModalError] = useState('');
      const [memberPins, setMemberPins] = useState({});

      // --- 메인 앱 상태 ---
      const [selectedDate, setSelectedDate] = useState(getTodayString());
      const [currentMonth, setCurrentMonth] = useState(new Date());
      const [viewMode, setViewMode] = useState('today'); // 'today' | 'week' | 'month'
      const [filterMemberId, setFilterMemberId] = useState('all');

      // 클라우드 데이터
      const [schedules, setSchedules] = useState([]);
      const [statusMessages, setStatusMessages] = useState({});
      const [syncStatus, setSyncStatus] = useState('connecting'); // 'online' | 'offline' | 'connecting'

      // 모달 및 알림
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [isConfirmModalOpen, setIsConfirmModalOpen] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      // 새 일정 폼
      const [newSchedule, setNewSchedule] = useState({
        title: '',
        memberId: 'child1',
        date: getTodayString(),
        startTime: '16:00',
        endTime: '17:00',
        category: 'school',
        notes: ''
      });

      // 한 줄 현황
      const [myStatusInput, setMyStatusInput] = useState('');
      const [myEmoji, setMyEmoji] = useState('😊');

      // Firebase 인스턴스 참조
      const dbRef = useRef(null);
      const authRef = useRef(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      // 1. Firebase 초기화 및 실시간 구독
      useEffect(() => {
        const initFirebase = async () => {
          try {
            if (!firebase.apps.length) {
              firebase.initializeApp(DEFAULT_FIREBASE_CONFIG);
            }
            const auth = firebase.auth();
            const db = firebase.firestore();
            authRef.current = auth;
            dbRef.current = db;

            // 익명 로그인
            auth.onAuthStateChanged(async (user) => {
              if (!user) {
                try {
                  await auth.signInAnonymously();
                } catch (e) {
                  console.warn("익명 로그인 시도:", e);
                }
              }
            });

            // ⭐ [중복 등록 해결 핵심] Firestore onSnapshot 이 유일한 단일 공급원이 됨
            db.collection('schedules').onSnapshot(
              (snapshot) => {
                const list = [];
                snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
                setSchedules(list);
                setSyncStatus('online');
              },
              (err) => {
                console.warn("일정 구독 에러:", err);
                setSyncStatus('offline');
              }
            );

            // 실시간 상태 메시지 구독
            db.collection('status_messages').onSnapshot(
              (snapshot) => {
                const msgs = {};
                snapshot.forEach((doc) => { msgs[doc.id] = doc.data(); });
                setStatusMessages(msgs);
              },
              (err) => console.warn("현황 구독 에러:", err)
            );

            // 실시간 PIN 구독
            db.collection('family_pins').onSnapshot(
              (snapshot) => {
                const pins = {};
                snapshot.forEach((doc) => { pins[doc.id] = doc.data().pin; });
                setMemberPins(pins);
              },
              (err) => console.warn("PIN 구독 에러:", err)
            );

          } catch (error) {
            console.error("Firebase 초기화 에러:", error);
            setSyncStatus('offline');
          }
        };

        initFirebase();

        // 저장된 로그인 세션 확인
        const savedMember = localStorage.getItem('family_logged_in_member');
        if (savedMember) {
          setCurrentMemberId(savedMember);
          setSelectedLoginMember(savedMember);
          setIsLoggedIn(true);
        }
      }, []);

      const currentMember = useMemo(() => {
        return FAMILY_MEMBERS.find(m => m.id === currentMemberId) || FAMILY_MEMBERS[0];
      }, [currentMemberId]);

      // 로그인 처리
      const handleLoginSubmit = (e) => {
        e.preventDefault();
        const target = FAMILY_MEMBERS.find(m => m.id === selectedLoginMember);
        if (!target) return;

        const correctPin = memberPins[target.id] || target.defaultPin;
        if (pinInput === correctPin) {
          setCurrentMemberId(target.id);
          setIsLoggedIn(true);
          setLoginError('');
          setPinInput('');
          if (rememberMe) {
            localStorage.setItem('family_logged_in_member', target.id);
          }
          showToast(`반가워요, ${target.name}님! 👋`);
        } else {
          setLoginError('비밀번호가 올바르지 않습니다.');
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('family_logged_in_member');
        setIsLoggedIn(false);
        setPinInput('');
        setLoginError('');
      };

      // 비밀번호(PIN) 변경
      const handleSavePin = async (e) => {
        e.preventDefault();
        const target = FAMILY_MEMBERS.find(m => m.id === selectedLoginMember);
        if (!target) return;

        const currentPin = memberPins[target.id] || target.defaultPin;
        if (pinFormOld && pinFormOld !== currentPin) {
          setPinModalError('기존 비밀번호가 일치하지 않습니다.');
          return;
        }
        if (!/^\d{4}$/.test(pinFormNew)) {
          setPinModalError('새 비밀번호는 숫자 4자리여야 합니다.');
          return;
        }
        if (pinFormNew !== pinFormConfirm) {
          setPinModalError('새 비밀번호 확인이 일치하지 않습니다.');
          return;
        }

        try {
          if (dbRef.current) {
            await dbRef.current.collection('family_pins').doc(target.id).set({
              pin: pinFormNew,
              updatedAt: Date.now()
            });
          }
          setMemberPins(prev => ({ ...prev, [target.id]: pinFormNew }));
          setIsPinModalOpen(false);
          setPinFormOld('');
          setPinFormNew('');
          setPinFormConfirm('');
          setPinModalError('');
          showToast(`${target.name}님의 비밀번호가 변경되었습니다! 🔑`);
        } catch (err) {
          console.error(err);
          setPinModalError('비밀번호 저장 중 오류가 발생했습니다.');
        }
      };

      // 일정 상태 변경
      const handleStatusChange = async (scheduleId, newStatus) => {
        try {
          if (dbRef.current) {
            await dbRef.current.collection('schedules').doc(scheduleId).update({
              status: newStatus,
              updatedAt: Date.now()
            });
          } else {
            setSchedules(prev => prev.map(s => s.id === scheduleId ? { ...s, status: newStatus } : s));
          }
          const label = newStatus === 'completed' ? '완료 🎉' : newStatus === 'in_progress' ? '진행 중 🚀' : '대기 중 ⏳';
          showToast(`일정이 [${label}] 상태로 변경되었습니다.`);
        } catch (err) {
          console.error(err);
        }
      };

      // 본인 일정만 삭제 허용
      const handleDeleteSchedule = async (scheduleItem) => {
        if (scheduleItem.memberId !== currentMember.id) {
          showToast("⚠️ 본인이 등록한 일정만 삭제할 수 있습니다.");
          return;
        }

        if (!window.confirm(`'${scheduleItem.title}' 일정을 정말 삭제하시겠습니까?`)) {
          return;
        }

        try {
          if (dbRef.current) {
            await dbRef.current.collection('schedules').doc(scheduleItem.id).delete();
          } else {
            setSchedules(prev => prev.filter(s => s.id !== scheduleItem.id));
          }
          showToast("일정이 삭제되었습니다. 🗑️");
        } catch (err) {
          console.error(err);
          showToast("일정 삭제 중 오류가 발생했습니다.");
        }
      };

      // 1단계 일정 폼 제출 -> 확인 모달 띄우기
      const handleOpenConfirmModal = (e) => {
        e.preventDefault();
        if (!newSchedule.title.trim()) return;
        setIsConfirmModalOpen(true);
      };

      // ⭐ [중복 등록 버그 완벽 수정] 수동 setSchedules 를 제거하여 onSnapshot 과의 중복 수신 방지
      const handleFinalScheduleSubmit = async () => {
        if (isSubmitting) return;
        setIsSubmitting(true);

        try {
          const itemData = {
            ...newSchedule,
            status: 'pending',
            stickers: {},
            createdAt: Date.now()
          };

          if (dbRef.current) {
            // Firestore에만 저장하면 onSnapshot 이 알아서 1번만 추가함 (수동 state 업데이트 삭제)
            await dbRef.current.collection('schedules').add(itemData);
          } else {
            setSchedules(prev => [...prev, { id: String(Date.now()), ...itemData }]);
          }

          setIsConfirmModalOpen(false);
          setIsAddModalOpen(false);
          setNewSchedule({
            title: '',
            memberId: currentMemberId,
            date: selectedDate,
            startTime: '16:00',
            endTime: '17:00',
            category: 'school',
            notes: ''
          });
          showToast("새 일정이 안전하게 등록되었습니다! ✨");
        } catch (err) {
          console.error(err);
          showToast("일정 등록 중 오류가 발생했습니다.");
        } finally {
          setIsSubmitting(false);
        }
      };

      // 칭찬 스티커 전송
      const handleSendSticker = async (scheduleId, stickerKey) => {
        try {
          const target = schedules.find(s => s.id === scheduleId);
          if (!target) return;
          const count = (target.stickers && target.stickers[stickerKey]) || 0;
          const updatedStickers = { ...target.stickers, [stickerKey]: count + 1 };

          if (dbRef.current) {
            await dbRef.current.collection('schedules').doc(scheduleId).update({
              stickers: updatedStickers,
              lastCheeredBy: currentMember.name,
              lastCheeredAt: Date.now()
            });
          } else {
            setSchedules(prev => prev.map(s => s.id === scheduleId ? { ...s, stickers: updatedStickers, lastCheeredBy: currentMember.name } : s));
          }
          showToast(`${currentMember.name}님이 응원 스티커를 보냈습니다! 💖`);
        } catch (err) {
          console.error(err);
        }
      };

      // 한 줄 현황 전송
      const sendStatusMessage = async (text, emoji = '😊') => {
        if (!text.trim()) return;
        try {
          const msgObj = {
            memberId: currentMember.id,
            memberName: currentMember.name,
            text: text.trim(),
            emoji: emoji,
            updatedAt: Date.now()
          };

          if (dbRef.current) {
            await dbRef.current.collection('status_messages').doc(currentMember.id).set(msgObj);
          } else {
            setStatusMessages(prev => ({ ...prev, [currentMember.id]: msgObj }));
          }
          setMyStatusInput('');
          showToast(`${currentMember.name}님의 실시간 현황이 공유되었습니다! 📢`);
        } catch (err) {
          console.error(err);
        }
      };

      // 날짜별 일정 필터링
      const filteredSchedules = useMemo(() => {
        return schedules
          .filter((item) => {
            const matchDate = item.date === selectedDate;
            const matchMember = filterMemberId === 'all' || item.memberId === filterMemberId;
            return matchDate && matchMember;
          })
          .sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));
      }, [schedules, selectedDate, filterMemberId]);

      // 주간 7일 리스트
      const weekDays = useMemo(() => {
        const curr = new Date(selectedDate);
        const day = curr.getDay();
        const sunday = new Date(curr);
        sunday.setDate(curr.getDate() - day);

        const days = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(sunday);
          d.setDate(sunday.getDate() + i);
          const dateStr = d.toISOString().split('T')[0];
          const dayName = ['일', '월', '화', '수', '목', '금', '토'][i];
          days.push({ dateStr, dayName, dayNumber: d.getDate(), isToday: dateStr === getTodayString() });
        }
        return days;
      }, [selectedDate]);

      // 월간 달력 날짜 그리드 계산
      const monthCalendarDays = useMemo(() => {
        const year = currentMonth.getFullYear();
        const month = currentMonth.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);

        const days = [];
        const firstDayIndex = firstDay.getDay();
        const totalDays = lastDay.getDate();

        for (let i = 0; i < firstDayIndex; i++) {
          days.push({ empty: true, id: `empty-pre-${i}` });
        }

        for (let d = 1; d <= totalDays; d++) {
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const daySchedules = schedules.filter(s => s.date === dateStr);
          days.push({
            empty: false,
            dateStr,
            dayNumber: d,
            isToday: dateStr === getTodayString(),
            isSelected: dateStr === selectedDate,
            schedules: daySchedules
          });
        }
        return days;
      }, [currentMonth, schedules, selectedDate]);

      // 달성률 통계
      const stats = useMemo(() => {
        const todayItems = schedules.filter(s => s.date === selectedDate);
        const total = todayItems.length;
        const completed = todayItems.filter(s => s.status === 'completed').length;
        const inProgress = todayItems.filter(s => s.status === 'in_progress').length;
        const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

        const memberStats = FAMILY_MEMBERS.map(m => {

                              return (
                                <div key={sc.id} className="text-[9px] truncate px-1 rounded bg-slate-100 text-slate-700 font-medium">
                                  {mb?.avatar} {sc.title}
                                </div>
                              );
                            })}
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
            </section>

            {/* 📊 오늘 달성률 Dashboard */}
            <section className="bg-gradient-to-br from-indigo-950 via-slate-900 to-purple-950 text-white rounded-3xl p-4 sm:p-6 shadow-xl">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-white/10">
                <div className="flex items-center justify-between sm:justify-start space-x-2 w-full sm:w-auto">
                  <div className="flex items-center space-x-2">
                    <button
                      onClick={() => {
                        const d = new Date(selectedDate);
                        d.setDate(d.getDate() - 1);
                        setSelectedDate(d.toISOString().split('T')[0]);
                      }}
                      className="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 transition active:scale-90"
                    >
                      ◀
                    </button>
                    <span className="text-sm sm:text-base font-extrabold tracking-tight">
                      {selectedDate} ({new Date(selectedDate).toLocaleDateString('ko-KR', { weekday: 'short' })})
                    </span>
                    <button
                      onClick={() => {
                        const d = new Date(selectedDate);
                        d.setDate(d.getDate() + 1);
                        setSelectedDate(d.toISOString().split('T')[0]);
                      }}
                      className="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 transition active:scale-90"
                    >
                      ▶
                    </button>
                  </div>

                  <div className="flex items-center space-x-2">
                    <span className="text-xs font-black text-emerald-400">{stats.percentage}%</span>
                    <span className="text-[11px] text-slate-300">({stats.completed}/{stats.total})</span>
                  </div>
                </div>
              </div>

              <div className="mt-3">
                <div className="w-full bg-white/10 h-2.5 sm:h-3 rounded-full overflow-hidden p-0.5 border border-white/15">
                  <div
                    className="bg-gradient-to-r from-indigo-400 via-emerald-400 to-teal-300 h-full rounded-full transition-all duration-500"
                    style={{ width: `${stats.percentage}%` }}
                  ></div>
                </div>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-3 mt-3 pt-3 border-t border-white/10">
                {stats.memberStats.map((m) => (
                  <div key={m.id} className="bg-white/5 rounded-xl p-2 border border-white/10">
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-xs font-bold text-slate-200 flex items-center truncate">
                        <span className="mr-1">{m.avatar}</span> {m.name}
                      </span>
                      <span className="text-xs font-extrabold text-indigo-300">{m.percentage}%</span>
                    </div>
                    <div className="w-full bg-white/10 h-1.5 rounded-full overflow-hidden">
                      <div className={`${m.barColor} h-full rounded-full`} style={{ width: `${m.percentage}%` }}></div>
                    </div>
                    <div className="text-[10px] text-slate-400 mt-0.5 text-right">{m.completed}/{m.total} 완료</div>
                  </div>
                ))}
              </div>
            </section>

            {/* 📋 일정 목록 필터 & 실시간 카드 리스트 */}
            <section className="space-y-3">
              <div className="flex items-center space-x-1.5 overflow-x-auto no-scrollbar pb-0.5">
                <button
                  onClick={() => setFilterMemberId('all')}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition shrink-0 ${
                    filterMemberId === 'all'
                      ? 'bg-slate-900 text-white'
                      : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'
                  }`}
                >
                  👨‍👩‍👧‍👦 전체 ({schedules.filter(s => s.date === selectedDate).length})
                </button>
                {FAMILY_MEMBERS.map((m) => {
                  const count = schedules.filter(s => s.date === selectedDate && s.memberId === m.id).length;
                  return (
                    <button
                      key={m.id}
                      onClick={() => setFilterMemberId(m.id)}
                      className={`px-2.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1 shrink-0 ${
                        filterMemberId === m.id ? m.activeBg : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'
                      }`}
                    >
                      <span>{m.avatar}</span>
                      <span>{m.name}</span>
                      <span className="text-[10px] opacity-75">({count})</span>
                    </button>
                  );
                })}
              </div>

              {filteredSchedules.length === 0 ? (
                <div className="bg-white rounded-3xl p-8 text-center border border-dashed border-slate-300 space-y-2.5">
                  <div className="text-3xl">🎈</div>
                  <h3 className="text-sm font-bold text-slate-700">등록된 일정이 없습니다.</h3>
                  <p className="text-xs text-slate-400">새 일정을 등록하여 하루 일정을 공유해보세요!</p>
                  <button
                    onClick={() => {
                      setNewSchedule(prev => ({ ...prev, memberId: currentMemberId, date: selectedDate }));
                      setIsAddModalOpen(true);
                    }}
                    className="mt-1 px-4 py-2 text-xs font-bold bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 shadow-sm"
                  >
                    + 일정 등록하기
                  </button>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {filteredSchedules.map((item) => {
                    const member = FAMILY_MEMBERS.find(m => m.id === item.memberId) || FAMILY_MEMBERS[0];
                    const category = CATEGORIES.find(c => c.id === item.category) || CATEGORIES[0];
                    const isCompleted = item.status === 'completed';
                    const isInProgress = item.status === 'in_progress';
                    const isPending = item.status === 'pending' || !item.status;

                    // 본인(작성자) 일정인지 확인
                    const isOwner = item.memberId === currentMember.id;

                    return (
                      <div
                        key={item.id}
                        className={`bg-white rounded-2xl p-3.5 sm:p-4 border transition-all duration-200 shadow-xs flex flex-col justify-between ${
                          isCompleted ? 'border-slate-200 bg-slate-50/70 opacity-90' : isInProgress ? 'border-indigo-300 ring-2 ring-indigo-500/10' : 'border-slate-200'
                        }`}
                      >
                        <div>
                          <div className="flex items-center justify-between mb-1.5">
                            <div className="flex items-center space-x-1.5">
                              <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-xs font-bold border ${member.badgeBg}`}>
                                <span className="mr-1">{member.avatar}</span>
                                {member.name}
                              </span>
                              <span className={`inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-semibold border ${category.color}`}>
                                {category.name}
                              </span>
                            </div>
                            <div className="flex items-center text-xs font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-lg">
                              ⏰ {item.startTime} ~ {item.endTime}
                            </div>
                          </div>

                          <div className="my-1.5">
                            <h3 className={`text-sm sm:text-base font-bold transition ${isCompleted ? 'text-slate-400 line-through' : 'text-slate-900'}`}>
                              {item.title}
                            </h3>
                            {item.notes && (
                              <p className="text-xs text-slate-500 mt-1 bg-slate-50 p-1.5 rounded-lg border border-slate-100">
                                💬 {item.notes}
                              </p>
                            )}
                          </div>
                        </div>

                        <div className="mt-3 pt-2.5 border-t border-slate-100 space-y-2">
                          {/* 상태 토글 및 구글 캘린더 연동 버튼 바 */}
                          <div className="flex items-center justify-between gap-1">
                            <div className="flex items-center bg-slate-100 p-0.5 rounded-xl border border-slate-200 w-full sm:w-auto justify-between sm:justify-start">
                              <button
                                onClick={() => handleStatusChange(item.id, 'pending')}
                                className={`flex-1 sm:flex-initial px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1 ${
                                  isPending ? 'bg-white text-slate-800 shadow-xs' : 'text-slate-500'
                                }`}
                              >
                                <span>대기</span>
                              </button>
                              <button
                                onClick={() => handleStatusChange(item.id, 'in_progress')}
                                className={`flex-1 sm:flex-initial px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1 ${
                                  isInProgress ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-500'
                                }`}
                              >
                                <span>진행 중</span>
                              </button>
                              <button
                                onClick={() => handleStatusChange(item.id, 'completed')}
                                className={`flex-1 sm:flex-initial px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1 ${
                                  isCompleted ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-500'
                                }`}
                              >
                                <span>완료</span>
                              </button>
                            </div>

                            <div className="flex items-center space-x-1 shrink-0 ml-1">
                              {/* 📅 구글 캘린더 내보내기 버튼 */}
                              <a
                                href={createGoogleCalendarUrl(item)}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="px-2 py-1 rounded-lg bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-700 font-bold text-[11px] transition flex items-center space-x-1"
                                title="구글 캘린더에 일정 추가"
                              >
                                <span>📅</span>
                                <span className="hidden sm:inline">구글 캘린더</span>
                              </a>

                              {/* 본인 일정일 때만 삭제 버튼 표시 */}
                              {isOwner ? (
                                <button
                                  onClick={() => handleDeleteSchedule(item)}
                                  className="p-1 text-slate-400 hover:text-rose-600 rounded-lg transition"
                                  title="내 일정 삭제"
                                >
                                  🗑️
                                </button>
                              ) : (
                                <span className="text-[10px] text-slate-300 px-1 select-none" title="본인 일정만 삭제 가능">
                                  🔒
                                </span>
                              )}
                            </div>
                          </div>

                          {/* 칭찬 스티커 */}
                          <div className="flex items-center justify-between pt-0.5">
                            <div className="flex items-center space-x-1 overflow-x-auto py-0.5">
                              {STICKER_ICONS.map((st) => {
                                const count = item.stickers?.[st.key] || 0;
                                return (
                                  <button
                                    key={st.key}
                                    onClick={() => handleSendSticker(item.id, st.key)}
                                    className={`px-1.5 py-0.5 rounded-full text-xs transition border flex items-center space-x-0.5 active:scale-90 ${
                                      count > 0 ? 'bg-amber-50 border-amber-200 text-amber-900 font-bold' : 'bg-white border-slate-200 text-slate-500'
                                    }`}
                                  >
                                    <span>{st.emoji}</span>
                                    {count > 0 && <span className="text-[10px]">{count}</span>}
                                  </button>
                                );
                              })}
                            </div>
                            {item.lastCheeredBy && (
                              <span className="text-[10px] text-slate-400 italic truncate max-w-[100px]">
                                {item.lastCheeredBy} 응원
                              </span>
                            )}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </section>
          </main>

          {/* ➕ [1단계] 새 일정 입력 모달 */}
          {isAddModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3.5 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl border border-slate-100 space-y-3.5">
                <div className="flex items-center justify-between pb-2.5 border-b border-slate-100">
                  <h3 className="text-base font-bold text-slate-900">새 일정 등록</h3>
                  <button onClick={() => setIsAddModalOpen(false)} className="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 font-bold text-xs">✕</button>
                </div>

                <form onSubmit={handleOpenConfirmModal} className="space-y-3 text-xs sm:text-sm">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">담당 가족</label>
                    <div className="grid grid-cols-4 gap-1.5">
                      {FAMILY_MEMBERS.map((m) => (
                        <button
                          type="button"
                          key={m.id}
                          onClick={() => setNewSchedule({ ...newSchedule, memberId: m.id })}
                          className={`p-1.5 rounded-xl border text-center transition ${
                            newSchedule.memberId === m.id ? `${m.activeBg} font-bold ring-2 ring-indigo-400` : 'bg-white border-slate-200 text-slate-700'
                          }`}
                        >
                          <div className="text-lg">{m.avatar}</div>
                          <div className="text-[11px] truncate">{m.name}</div>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">일정 제목 *</label>
                    <input
                      type="text"
                      required
                      value={newSchedule.title}
                      onChange={(e) => setNewSchedule({ ...newSchedule, title: e.target.value })}
                      placeholder="예: 영어 학원, 피아노, 줄넘기"
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">카테고리</label>
                    <div className="grid grid-cols-3 gap-1">
                      {CATEGORIES.map((c) => (
                        <button
                          type="button"
                          key={c.id}
                          onClick={() => setNewSchedule({ ...newSchedule, category: c.id })}
                          className={`px-2 py-1.5 rounded-lg border text-xs font-semibold ${
                            newSchedule.category === c.id ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-600 border-slate-200'
                          }`}
                        >
                          {c.name}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">날짜</label>
                      <input
                        type="date"
                        value={newSchedule.date}
                        onChange={(e) => setNewSchedule({ ...newSchedule, date: e.target.value })}
                        className="w-full px-2 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs"
                      />
                    </div>
                    <div className="grid grid-cols-2 gap-1">
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">시작</label>
                        <input
                          type="time"
                          value={newSchedule.startTime}
                          onChange={(e) => setNewSchedule({ ...newSchedule, startTime: e.target.value })}
                          className="w-full px-1.5 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs"
                        />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">종료</label>
                        <input
                          type="time"
                          value={newSchedule.endTime}
                          onChange={(e) => setNewSchedule({ ...newSchedule, endTime: e.target.value })}
                          className="w-full px-1.5 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs"
                        />
                      </div>
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">메모 / 준비물</label>
                    <input
                      type="text"
                      value={newSchedule.notes}
                      onChange={(e) => setNewSchedule({ ...newSchedule, notes: e.target.value })}
                      placeholder="예: 교재 챙기기, 끝나고 연락하기"
                      className="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs"
                    />
                  </div>

                  <div className="pt-2 flex items-center space-x-2">
                    <button
                      type="button"
                      onClick={() => setIsAddModalOpen(false)}
                      className="flex-1 py-2 rounded-xl border border-slate-200 text-slate-600 font-bold"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold"
                    >
                      일정 확인 ➔
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 🔍 [2단계] 중복 등록 방지 최종 확인 모달 */}
          {isConfirmModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-xs">
              <div className="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl space-y-4 border border-slate-100">
                <div className="text-center space-y-1">
                  <span className="text-3xl">🗓️</span>
                  <h3 className="text-base font-extrabold text-slate-900">일정을 등록하시겠습니까?</h3>
                  <p className="text-xs text-slate-500">입력하신 일정 내용을 확인해 주세요.</p>
                </div>

                <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200 text-xs space-y-1.5">
                  <div className="flex justify-between">
                    <span className="text-slate-400 font-bold">담당 가족:</span>
                    <span className="font-extrabold text-slate-800">{FAMILY_MEMBERS.find(m => m.id === newSchedule.memberId)?.name}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400 font-bold">일정 제목:</span>
                    <span className="font-extrabold text-indigo-600">{newSchedule.title}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400 font-bold">날짜/시간:</span>
                    <span className="font-bold text-slate-700">{newSchedule.date} ({newSchedule.startTime} ~ {newSchedule.endTime})</span>
                  </div>
                </div>

                <div className="flex space-x-2 pt-1">
                  <button
                    type="button"
                    disabled={isSubmitting}
                    onClick={() => setIsConfirmModalOpen(false)}
                    className="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs hover:bg-slate-200"
                  >
                    수정하기
                  </button>
                  <button
                    type="button"
                    disabled={isSubmitting}
                    onClick={handleFinalScheduleSubmit}
                    className="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs hover:bg-indigo-700 shadow-md shadow-indigo-200 disabled:opacity-50"
                  >
                    {isSubmitting ? '등록 중...' : '최종 등록 완료'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 🔔 알림 토스트 */}
          {toastMessage && (
            <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 backdrop-blur text-white px-3.5 py-2 rounded-2xl shadow-xl text-xs font-bold flex items-center space-x-1.5 border border-slate-700 animate-in slide-in-from-bottom duration-300">
              <span>✨</span>
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
