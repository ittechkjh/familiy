    const QUICK_STATUS_PRESETS = [
      { text: '🏫 학원 도착했어요!', emoji: '🏫' },
      { text: '🚗 집으로 출발해요~', emoji: '🚗' },

    ];

    const CATEGORIES = [
      { id: 'school', name: '학교/학원', color: 'bg-indigo-50 text-indigo-700 border-indigo-200' },
      { id: 'study', name: '숙제/공부', color: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
      { id: 'activity', name: '운동/취미', color: 'bg-orange-50 text-orange-700 border-orange-200' },
      { id: 'work', name: '업무/외근', color: 'bg-blue-50 text-blue-700 border-blue-200' },
      { id: 'home', name: '집안일/돌봄', color: 'bg-pink-50 text-pink-700 border-pink-200' },
      { id: 'family', name: '가족 모임/식사', color: 'bg-purple-50 text-purple-700 border-purple-200' }
    ];

    const STICKER_ICONS = [
      { key: 'thumb', emoji: '👍', label: '최고야' },
      { key: 'heart', emoji: '❤️', label: '사랑해' },
      { key: 'star', emoji: '🌟', label: '대단해' },
      { key: 'clap', emoji: '👏', label: '멋져요' },
      { key: 'fire', emoji: '🔥', label: '파이팅' }
    ];

    function getTodayString() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatRelativeTime(timestamp) {
      if (!timestamp) return '미등록';
      const diffMinutes = Math.floor((Date.now() - timestamp) / 60000);
      if (diffMinutes < 1) return '방금 전';
      if (diffMinutes < 60) return `${diffMinutes}분 전`;
      const diffHours = Math.floor(diffMinutes / 60);
      if (diffHours < 24) return `${diffHours}시간 전`;
      return new Date(timestamp).toLocaleDateString([], { month: 'numeric', day: 'numeric' });
    }

    // --- 2. 애플리케이션 상태 객체 ---
    let state = {
      isLoggedIn: false,
      currentMemberId: localStorage.getItem('family_connect_login_member') || 'child1',
      selectedLoginMember: 'child1',
      pinInput: '',
      loginError: '',
      rememberMe: true,
      memberPins: { dad: '3333', mom: '4444', child1: '1111', child2: '2222' },
      isPinModalOpen: false,
      pinFormOld: '',
      pinFormNew: '',
      pinFormConfirm: '',
      pinModalError: '',
      selectedDate: getTodayString(),
      viewMode: 'today', // 'today' | 'week' | 'month'
      filterMemberId: 'all',
      calendarMonth: { year: new Date().getFullYear(), month: new Date().getMonth() + 1 },
      schedules: [],
      statusMessages: {},
      syncStatus: '연결 확인 중...',
      isConnected: false,
      dbErrorDetails: null,
      isDbModalOpen: false,
      firebaseConfigInput: '',
      isAddModalOpen: false,
      isConfirmModalOpen: false,
      isSubmitting: false,
      toastMessage: null,
      newSchedule: {
        title: '',
        memberId: 'child1',
        date: getTodayString(),
        startTime: '16:00',
        endTime: '17:00',
        category: 'school',
        notes: ''
      },
      myStatusInput: '',
      myEmoji: '😊'
    };

    let dbInstance = null;
    let appId = 'family-8fba4-v1';

    if (localStorage.getItem('family_connect_login_member')) {
      state.isLoggedIn = true;
    }

    function showToast(msg) {
      state.toastMessage = msg;
      render();
      setTimeout(() => {
        state.toastMessage = null;
        render();
      }, 3000);
    }

    function initFirebase() {
      let activeConfig = DEFAULT_FIREBASE_CONFIG;

      // URL 파라미터나 로컬스토리지 설정 반영
      if (window.location.hash && window.location.hash.includes('config=')) {
        try {
          const rawCfg = window.location.hash.split('config=')[1];
          const parsed = JSON.parse(decodeURIComponent(rawCfg));
          if (parsed && parsed.apiKey) {
            localStorage.setItem('family_connect_firebase_cfg', JSON.stringify(parsed));
            activeConfig = parsed;
          }
        } catch(e) {}
      } else {
        const savedCfg = localStorage.getItem('family_connect_firebase_cfg');
        if (savedCfg) {
          try {
            const parsed = JSON.parse(savedCfg);
            if (parsed && parsed.apiKey) activeConfig = parsed;
          } catch(e) {}
        }
      }

      try {
        if (firebase.apps.length) firebase.app().delete();
        firebase.initializeApp(activeConfig);
        const firestore = firebase.firestore();
        const auth = firebase.auth();
        dbInstance = firestore;

        // 1. Firestore 실시간 리스너 먼저 등록 (익명 로그인 실패 여부와 독립적으로 작동)
        firestore.collection('artifacts').doc(appId).collection('public').doc('data').collection('schedules')
          .onSnapshot(snapshot => {
            state.syncStatus = '실시간 동기화 완료';
            state.isConnected = true;
            state.dbErrorDetails = null;
            const list = [];
            snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            state.schedules = list;
            render();
          }, error => {
            console.error("Firestore Error:", error);
            state.syncStatus = '오프라인 로컬 모드';
            state.isConnected = false;
            state.dbErrorDetails = error.message || '데이터베이스 접근 권한 차단됨';
            render();
          });

        firestore.collection('artifacts').doc(appId).collection('public').doc('data').collection('status_messages')
          .onSnapshot(snapshot => {
            const msgs = {};
            snapshot.forEach(doc => msgs[doc.id] = doc.data());
            state.statusMessages = msgs;
            render();
          });

        firestore.collection('artifacts').doc(appId).collection('public').doc('data').collection('pins').doc('settings')
          .onSnapshot(docSnap => {
            if (docSnap.exists) {
              state.memberPins = { ...state.memberPins, ...docSnap.data() };
              render();
            }
          });

        // 2. 익명 로그인 시도
        auth.signInAnonymously().catch(authErr => {
          console.warn("익명 로그인 권한 필요:", authErr);
        });

      } catch(e) {
        state.syncStatus = '오프라인 로컬 모드';
        state.isConnected = false;
        state.dbErrorDetails = e.message;
        render();
      }
    }

    // --- 3. 이벤트 처리 함수 ---
    function handleLoginSubmit(e) {
      if (e) e.preventDefault();
      const targetMember = FAMILY_MEMBERS.find(m => m.id === state.selectedLoginMember);
      if (!targetMember) return;
      const validPin = state.memberPins[targetMember.id] || targetMember.pin;

      if (!state.pinInput || state.pinInput === validPin) {
        state.currentMemberId = state.selectedLoginMember;
        state.isLoggedIn = true;
        state.loginError = '';
        state.pinInput = '';
        if (state.rememberMe) {
          localStorage.setItem('family_connect_login_member', state.selectedLoginMember);
        }
        showToast(`${targetMember.name}님, 환영합니다! 오늘 일정을 확인하세요 🏡`);
      } else {
        state.loginError = '비밀번호가 올바르지 않습니다.';
        render();
      }
    }

    function handleLogout() {
      state.isLoggedIn = false;
      state.pinInput = '';
      state.loginError = '';
      localStorage.removeItem('family_connect_login_member');
      showToast('로그아웃 되었습니다.');
    }

    function handleSavePin(e) {
      if (e) e.preventDefault();
      const targetMember = FAMILY_MEMBERS.find(m => m.id === state.selectedLoginMember);
      const validPin = state.memberPins[targetMember.id] || targetMember.pin;

      if (state.pinFormOld && state.pinFormOld !== validPin) {
        state.pinModalError = '기존 비밀번호가 일치하지 않습니다.';
        render();
        return;
      }
      if (state.pinFormNew.length !== 4 || isNaN(state.pinFormNew)) {
        state.pinModalError = '새 비밀번호는 숫자 4자리여야 합니다.';
        render();
        return;
      }
      if (state.pinFormNew !== state.pinFormConfirm) {
        state.pinModalError = '새 비밀번호 확인이 일치하지 않습니다.';
        render();
        return;
      }

      const updatedPins = { ...state.memberPins, [targetMember.id]: state.pinFormNew };
      state.memberPins = updatedPins;
      state.isPinModalOpen = false;
      state.pinModalError = '';
      showToast('비밀번호가 성공적으로 변경되었습니다!');

      if (dbInstance && state.isConnected) {
        dbInstance.collection('artifacts').doc(appId).collection('public').doc('data').collection('pins').doc('settings').set(updatedPins, { merge: true });
      }
      render();
    }

    function handleExecuteCreateSchedule() {
      if (state.isSubmitting || !state.newSchedule.title.trim()) return;
      state.isSubmitting = true;

      const newItem = {
        ...state.newSchedule,
        status: 'pending',
        stickers: {},
        createdAt: Date.now()
      };

      if (dbInstance && state.isConnected) {
        dbInstance.collection('artifacts').doc(appId).collection('public').doc('data').collection('schedules').add(newItem)
          .then(() => {
            state.isConfirmModalOpen = false;
            state.isAddModalOpen = false;
            state.isSubmitting = false;
            state.newSchedule = { title: '', memberId: state.currentMemberId, date: state.selectedDate, startTime: '16:00', endTime: '17:00', category: 'school', notes: '' };
            showToast('일정이 등록되었습니다! ✨');
          }).catch(() => {
            state.isSubmitting = false;
            render();
          });
      } else {
        state.schedules.push({ ...newItem, id: String(Date.now()) });
        state.isConfirmModalOpen = false;
        state.isAddModalOpen = false;
        state.isSubmitting = false;
        state.newSchedule = { title: '', memberId: state.currentMemberId, date: state.selectedDate, startTime: '16:00', endTime: '17:00', category: 'school', notes: '' };
        showToast('일정이 로컬에 등록되었습니다 (오프라인 모드)');
      }
    }

    function handleStatusChange(id, newStatus) {
      if (dbInstance && state.isConnected) {
        dbInstance.collection('artifacts').doc(appId).collection('public').doc('data').collection('schedules').doc(id).update({ status: newStatus, updatedAt: Date.now() });
      } else {
        state.schedules = state.schedules.map(s => s.id === id ? { ...s, status: newStatus } : s);
        render();
      }
      const label = newStatus === 'completed' ? '완료 🎉' : newStatus === 'in_progress' ? '진행 중 🚀' : '대기 중 ⏳';
      showToast(`일정이 [${label}] 상태로 변경되었습니다.`);
    }

    function handleDeleteSchedule(id) {
      if (dbInstance && state.isConnected) {
        dbInstance.collection('artifacts').doc(appId).collection('public').doc('data').collection('schedules').doc(id).delete();
      } else {
        state.schedules = state.schedules.filter(s => s.id !== id);
        render();
      }
      showToast('일정이 삭제되었습니다.');
    }

    function handleSendSticker(scheduleId, stickerKey) {
      const target = state.schedules.find(s => s.id === scheduleId);
      if (!target) return;
      const count = (target.stickers && target.stickers[stickerKey]) || 0;
      const currentMember = FAMILY_MEMBERS.find(m => m.id === state.currentMemberId) || FAMILY_MEMBERS[0];

      if (dbInstance && state.isConnected) {
        dbInstance.collection('artifacts').doc(appId).collection('public').doc('data').collection('schedules').doc(scheduleId).update({
          [`stickers.${stickerKey}`]: count + 1,
          lastCheeredBy: currentMember.name,
          lastCheeredAt: Date.now()
        });
      } else {
        target.stickers = target.stickers || {};
        target.stickers[stickerKey] = count + 1;
        target.lastCheeredBy = currentMember.name;
        render();
      }
      showToast(`${currentMember.name}님이 응원 스티커를 보냈습니다! 💖`);
    }

    function sendStatusMessage(text, emoji = '😊') {
      if (!text.trim()) return;
      const currentMember = FAMILY_MEMBERS.find(m => m.id === state.currentMemberId) || FAMILY_MEMBERS[0];
      const payload = { memberId: currentMember.id, memberName: currentMember.name, text: text.trim(), emoji, updatedAt: Date.now() };

      if (dbInstance && state.isConnected) {
        dbInstance.collection('artifacts').doc(appId).collection('public').doc('data').collection('status_messages').doc(currentMember.id).set(payload);
      } else {
        state.statusMessages[currentMember.id] = payload;
        render();
      }
      state.myStatusInput = '';
      showToast(`${currentMember.name}님의 실시간 현황이 공유되었습니다! 📢`);
    }

    function handleCopySmartFamilyLink() {
      const savedCfg = localStorage.getItem('family_connect_firebase_cfg') || JSON.stringify(DEFAULT_FIREBASE_CONFIG);
      const smartUrl = `${window.location.origin}${window.location.pathname}#config=${encodeURIComponent(savedCfg)}`;
      const tempInput = document.createElement('textarea');
      tempInput.value = smartUrl;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);
      showToast('📱 가족 카톡 자동 연동 링크 복사 완료!');
    }

    function render() {
      const root = document.getElementById('root');
      const currentMember = FAMILY_MEMBERS.find(m => m.id === state.currentMemberId) || FAMILY_MEMBERS[0];
      const loginTarget = FAMILY_MEMBERS.find(m => m.id === state.selectedLoginMember) || FAMILY_MEMBERS[0];

      // 1. 로그인 전 화면
      if (!state.isLoggedIn) {
        const pinVal = state.memberPins[loginTarget.id] || loginTarget.pin;
        root.innerHTML = `
          <div class="min-h-screen bg-slate-900 text-slate-100 flex items-center justify-center p-4">
            <div class="bg-slate-800 rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl border border-slate-700 space-y-6">
              <div class="text-center space-y-2">
                <div class="w-14 h-14 rounded-3xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-2xl mx-auto shadow-lg">🏡</div>
                <h1 class="text-2xl font-black text-white">우리집 커넥트</h1>
                <p class="text-xs text-slate-400">온 가족 실시간 일정 & 달력 공유 시스템</p>
              </div>

              <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-300 text-center">접속하실 가족 프로필을 선택하세요</label>
                <div class="grid grid-cols-2 gap-2.5">
                  ${FAMILY_MEMBERS.map(m => {
                    const isSel = state.selectedLoginMember === m.id;
                    return `
                      <button type="button" onclick="state.selectedLoginMember='${m.id}'; state.pinInput=''; state.loginError=''; render();" class="p-3 rounded-2xl border text-left transition flex items-center space-x-3 ${isSel ? `${m.cardBg} ring-2 ${m.ringColor} text-slate-900 shadow-md` : 'bg-slate-700/60 border-slate-600 text-slate-200 hover:bg-slate-700'}">
                        <span class="text-2xl">${m.avatar}</span>
                        <div>
                          <div class="text-xs font-extrabold">${m.name}</div>
                          <div class="text-[10px] opacity-75">${m.role} (PIN: ${state.memberPins[m.id] || m.pin})</div>
                        </div>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>

              <form onsubmit="handleLoginSubmit(event)" class="space-y-4 pt-2 border-t border-slate-700/80">
                <div>
                  <div class="flex items-center justify-between mb-1">
                    <label class="text-xs font-bold text-slate-300">${loginTarget.avatar} ${loginTarget.name} 비밀번호 (PIN)</label>
                    <button type="button" onclick="state.pinInput='${pinVal}'; render();" class="text-[10px] font-bold text-indigo-400 hover:underline">⚡ 비밀번호 채우기 (${pinVal})</button>
                  </div>
                  <input type="password" maxlength="4" value="${state.pinInput}" oninput="state.pinInput=this.value;" placeholder="PIN 4자리 입력" class="w-full text-center tracking-widest text-lg px-4 py-3 bg-slate-900 border border-slate-700 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white font-mono" />
                  ${state.loginError ? `<p class="text-xs text-rose-400 font-bold mt-1.5 text-center">⚠️ ${state.loginError}</p>` : ''}
                </div>

                <div class="flex items-center justify-between text-xs text-slate-400 px-1">
                  <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" ${state.rememberMe ? 'checked' : ''} onchange="state.rememberMe=this.checked;" class="rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-indigo-500 w-4 h-4" />
                    <span>로그인 상태 유지</span>
                  </label>
                  <button type="button" onclick="state.pinFormOld=''; state.pinFormNew=''; state.pinFormConfirm=''; state.pinModalError=''; state.isPinModalOpen=true; render();" class="text-indigo-400 hover:text-indigo-300 font-bold underline text-[11px]">🔑 비밀번호 설정 / 변경</button>
                </div>

                <button type="submit" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-sm shadow-lg transition active:scale-98">${loginTarget.name}(으)로 접속하기 🚀</button>
              </form>

              ${state.isPinModalOpen ? `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-xs">
                  <div class="bg-slate-800 rounded-3xl max-w-sm w-full p-5 shadow-2xl border border-slate-700 space-y-4 text-slate-100">

                        <div class="mt-3 pt-2.5 border-t border-slate-100 space-y-2">
                          <div class="flex items-center justify-between gap-1">
                            <div class="flex items-center bg-slate-100 p-0.5 rounded-xl border border-slate-200">
                              <button onclick="handleStatusChange('${item.id}', 'pending')" class="px-2 py-1 rounded-lg text-xs font-bold ${isPending ? 'bg-white text-slate-800 shadow-xs' : 'text-slate-500'}">대기</button>
                              <button onclick="handleStatusChange('${item.id}', 'in_progress')" class="px-2 py-1 rounded-lg text-xs font-bold ${isInProgress ? 'bg-indigo-600 text-white' : 'text-slate-500'}">진행 중</button>
                              <button onclick="handleStatusChange('${item.id}', 'completed')" class="px-2 py-1 rounded-lg text-xs font-bold ${isCompleted ? 'bg-emerald-600 text-white' : 'text-slate-500'}">완료</button>
                            </div>
                            <button onclick="handleDeleteSchedule('${item.id}')" class="text-slate-400 hover:text-rose-600 p-1 text-xs">삭제</button>
                          </div>

                          <div class="flex items-center justify-between pt-0.5">
                            <div class="flex items-center space-x-1">
                              ${STICKER_ICONS.map(st => {
                                const cnt = item.stickers?.[st.key] || 0;
                                return `<button onclick="handleSendSticker('${item.id}', '${st.key}')" class="px-1.5 py-0.5 rounded-full text-xs border ${cnt > 0 ? 'bg-amber-50 border-amber-200 text-amber-900 font-bold' : 'bg-white text-slate-500'}">${st.emoji} ${cnt > 0 ? cnt : ''}</button>`;
                              }).join('')}
                            </div>
                            ${item.lastCheeredBy ? `<span class="text-[10px] text-slate-400 italic">${item.lastCheeredBy} 응원</span>` : ''}
                          </div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </section>
          </main>

          <!-- ➕ 1단계: 입력 모달 -->
          ${state.isAddModalOpen ? `
            <div class="fixed inset-0 z-50 flex items-center justify-center p-3.5 bg-slate-900/60 backdrop-blur-xs">
              <div class="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl space-y-3">
                <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                  <h3 class="text-base font-bold">새 일정 등록</h3>
                  <button onclick="state.isAddModalOpen=false; render();" class="w-7 h-7 rounded-full bg-slate-100 text-xs font-bold">✕</button>
                </div>
                <form onsubmit="event.preventDefault(); if(!state.newSchedule.title.trim()) return showToast('제목을 입력하세요!'); state.isConfirmModalOpen=true; render();" class="space-y-3 text-xs">
                  <div>
                    <label class="block font-bold mb-1">담당 가족</label>
                    <div class="grid grid-cols-4 gap-1.5">
                      ${FAMILY_MEMBERS.map(m => `
                        <button type="button" onclick="state.newSchedule.memberId='${m.id}'; render();" class="p-1.5 rounded-xl border text-center ${state.newSchedule.memberId === m.id ? m.activeBg : 'bg-white'}">
                          <div class="text-lg">${m.avatar}</div>
                          <div>${m.name}</div>
                        </button>
                      `).join('')}
                    </div>
                  </div>
                  <div>
                    <label class="block font-bold mb-1">일정 제목 *</label>
                    <input type="text" required value="${state.newSchedule.title}" oninput="state.newSchedule.title=this.value" placeholder="예: 영어 학원, 태권도 레슨" class="w-full px-3 py-2 bg-slate-50 border rounded-xl" />
                  </div>
                  <div>
                    <label class="block font-bold mb-1">날짜</label>
                    <input type="date" value="${state.newSchedule.date}" onchange="state.newSchedule.date=this.value" class="w-full px-3 py-2 bg-slate-50 border rounded-xl" />
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block font-bold mb-1">시작 시간</label>
                      <input type="time" value="${state.newSchedule.startTime}" onchange="state.newSchedule.startTime=this.value" class="w-full px-2 py-1.5 bg-slate-50 border rounded-xl" />
                    </div>
                    <div>
                      <label class="block font-bold mb-1">종료 시간</label>
                      <input type="time" value="${state.newSchedule.endTime}" onchange="state.newSchedule.endTime=this.value" class="w-full px-2 py-1.5 bg-slate-50 border rounded-xl" />
                    </div>
                  </div>
                  <div class="pt-2 flex items-center space-x-2">
                    <button type="button" onclick="state.isAddModalOpen=false; render();" class="flex-1 py-2 rounded-xl border font-bold">취소</button>
                    <button type="submit" class="flex-1 py-2 rounded-xl bg-indigo-600 text-white font-bold">다음 (확인)</button>
                  </div>
                </form>
              </div>
            </div>
          ` : ''}

          <!-- ➕ 2단계: 중복 방지 등록 확인 모달 -->
          ${state.isConfirmModalOpen ? `
            <div class="fixed inset-0 z-50 flex items-center justify-center p-3.5 bg-slate-900/80 backdrop-blur-xs">
              <div class="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl space-y-4 text-center">
                <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center text-xl font-bold mx-auto">📌</div>
                <div>
                  <h3 class="text-base font-bold text-slate-900">일정을 등록하시겠습니까?</h3>
                  <p class="text-xs text-slate-500 mt-1">온 가족에게 실시간으로 등록 및 수신됩니다.</p>
                </div>
                <div class="bg-slate-50 p-3 rounded-2xl border text-left text-xs space-y-1">
                  <div><b>담당:</b> ${FAMILY_MEMBERS.find(m => m.id === state.newSchedule.memberId)?.name}</div>
                  <div><b>제목:</b> ${state.newSchedule.title}</div>
                  <div><b>시간:</b> ${state.newSchedule.date} (${state.newSchedule.startTime} ~ ${state.newSchedule.endTime})</div>
                </div>
                <div class="flex items-center space-x-2 pt-1">
                  <button onclick="state.isConfirmModalOpen=false; render();" class="flex-1 py-2.5 rounded-xl border font-bold text-xs text-slate-600">수정하기</button>
                  <button onclick="handleExecuteCreateSchedule()" ${state.isSubmitting ? 'disabled' : ''} class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs shadow-md ${state.isSubmitting ? 'opacity-50 cursor-not-allowed' : ''}">
                    ${state.isSubmitting ? '등록 중...' : '확인 (등록 저장)'}
                  </button>
                </div>
              </div>
            </div>
          ` : ''}

          <!-- 📲 기기 연결 및 클라우드 DB 안내 모달 -->
          ${state.isDbModalOpen ? `
            <div class="fixed inset-0 z-50 flex items-center justify-center p-3.5 bg-slate-900/70 backdrop-blur-xs">
              <div class="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                  <h3 class="text-base font-extrabold text-slate-900 flex items-center space-x-1.5">☁️ 온 가족 실시간 DB 연결 안내</h3>
                  <button onclick="state.isDbModalOpen=false; render();" class="text-slate-400 hover:text-slate-600 font-bold text-sm">✕</button>
                </div>

                <div class="bg-amber-50 border border-amber-200 p-3.5 rounded-2xl space-y-2 text-xs text-amber-900">
                  <h4 class="font-extrabold flex items-center">⚡ Firebase 콘솔 클릭 2개면 🟢 동기화 완료!</h4>
                  <ol class="list-decimal list-inside space-y-1 text-[11px] text-amber-800 leading-relaxed">
                    <li><a href="https://console.firebase.google.com" target="_blank" class="underline font-bold text-indigo-600">console.firebase.google.com</a> 접속</li>
                    <li><b>[Authentication]</b> ➔ <b>[Sign-in method]</b> ➔ <b>[익명(Anonymous)]</b> 스위치 켜기</li>
                    <li><b>[Firestore Database]</b> ➔ <b>[규칙(Rules)]</b> ➔ <code class="bg-amber-100 px-1 py-0.5 rounded">allow read, write: if true;</code> 로 수정 후 <b>[게시]</b></li>
                  </ol>
                </div>

                <div class="bg-gradient-to-r from-indigo-50 to-purple-50 border border-indigo-200 p-3.5 rounded-2xl space-y-2">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-extrabold text-indigo-900">📱 가족 자동 연동 스마트 링크</span>
                    <span class="text-[10px] bg-indigo-600 text-white px-1.5 py-0.5 rounded font-bold">추천</span>
                  </div>
                  <p class="text-[11px] text-indigo-800 leading-snug">
                    아래 버튼을 눌러 링크를 복사해 가족 카톡에 공유하시면, 엄마와 아이들은 링크 터치 한 번으로 즉시 실시간 동기화됩니다!
                  </p>
                  <button onclick="handleCopySmartFamilyLink()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs rounded-xl shadow-md transition active:scale-95">📱 가족 카톡 자동 연동 링크 복사하기</button>
                </div>
              </div>
            </div>
          ` : ''}

          <!-- 🔔 토스트 알림 -->
          ${state.toastMessage ? `
            <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-3.5 py-2 rounded-2xl text-xs font-bold shadow-xl">✨ ${state.toastMessage}</div>
          ` : ''}
        </div>
      `;
    }

    // --- 4. 페이지 초기화 ---
    window.onload = function() {
      initFirebase();
      render();
    };
  </script>
</body>
</html>
