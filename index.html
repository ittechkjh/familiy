    function getTodayString(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatRelativeTime(timestamp) {
      if (!timestamp) return '미등록';
      const diffMinutes = Math.floor((Date.now() - timestamp) / 60000);
      if (diffMinutes < 1) return '방금 전';
      if (diffMinutes < 60) return `${diffMinutes}분 전`;
      const diffHours = Math.floor(diffMinutes / 60);
      if (diffHours < 24) return `${diffHours}시간 전`;
      return new Date(timestamp).toLocaleDateString([], { month: 'numeric', day: 'numeric' });
    }

    window.initFirebase = function() {
      const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-schedule-app';
      const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

      if (firebaseConfig && window.FirebaseSDK) {
        try {
          const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, collection, onSnapshot } = window.FirebaseSDK;
          const app = initializeApp(firebaseConfig);
          const auth = getAuth(app);
          const db = getFirestore(app);

          const authenticate = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          };

          authenticate().then(() => {
            state.useFirebase = true;
            window.dbInstance = db;

            const schedCol = collection(db, 'artifacts', appId, 'public', 'data', 'schedules');
            onSnapshot(schedCol, (snapshot) => {
              const list = [];
              snapshot.forEach(docSnap => list.push({ id: docSnap.id, ...docSnap.data() }));
              if (list.length > 0) {
                state.schedules = list;
              }
              renderApp();
            });

            const statusCol = collection(db, 'artifacts', appId, 'public', 'data', 'status_messages');
            onSnapshot(statusCol, (snapshot) => {
              const msgs = {};
              snapshot.forEach(docSnap => msgs[docSnap.id] = docSnap.data());
              if (Object.keys(msgs).length > 0) {
                state.statusMessages = msgs;
              }
              renderApp();
            });
          }).catch(() => {
            seedDefaultSchedules();
            renderApp();
          });
        } catch(e) {
          seedDefaultSchedules();
          renderApp();
        }
      } else {
        seedDefaultSchedules();
        renderApp();
      }
    };

        if (state.useFirebase && window.FirebaseSDK && window.dbInstance) {
          try {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-schedule-app';

            });
          } catch(e) {}
        } else {
          state.schedules = state.schedules.map(s => s.id === scheduleId ? { ...s, status: newStatus } : s);

        const label = newStatus === 'completed' ? '완료 🎉' : newStatus === 'in_progress' ? '진행 중 🚀' : '대기 중 ⏳';

        renderApp();

      async handleSendSticker(scheduleId, stickerKey) {
        const target = state.schedules.find(s => s.id === scheduleId);
        if (!target) return;
        const currentCount = (target.stickers && target.stickers[stickerKey]) || 0;
        const currentMember = FAMILY_MEMBERS.find(m => m.id === state.currentMemberId);

        if (state.useFirebase && window.FirebaseSDK && window.dbInstance) {
          try {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-schedule-app';
            const { updateDoc, doc } = window.FirebaseSDK;
            await updateDoc(doc(window.dbInstance, 'artifacts', appId, 'public', 'data', 'schedules', scheduleId), {
              [`stickers.${stickerKey}`]: currentCount + 1,
              lastCheeredBy: currentMember.name,
              lastCheeredAt: Date.now()
            });
          } catch(e) {}
        } else {
          state.schedules = state.schedules.map(s => {
            if (s.id === scheduleId) {
              const updatedStickers = { ...(s.stickers || {}), [stickerKey]: currentCount + 1 };

            }
            return s;
          });
        }
        showToast(`${currentMember.name}님이 응원 스티커를 보냈습니다! 💖`);
        renderApp();
      },
      async sendStatusMessage(text, emoji = '😊') {
        if (!text.trim()) return;
        const currentMember = FAMILY_MEMBERS.find(m => m.id === state.currentMemberId);

        if (state.useFirebase && window.FirebaseSDK && window.dbInstance) {
          try {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-schedule-app';

            await setDoc(doc(window.dbInstance, 'artifacts', appId, 'public', 'data', 'status_messages', currentMember.id), {

              memberName: currentMember.name,
              text: text.trim(),
              emoji: emoji,
              updatedAt: Date.now()

          } catch(e) {}

          state.statusMessages[currentMember.id] = {
            memberId: currentMember.id,
            text: text.trim(),
            emoji: emoji,
            updatedAt: Date.now()
          };

          ...state.newSchedule,
          status: 'pending',
          stickers: {},
          createdAt: Date.now()

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-schedule-app';

        } else {
          state.schedules = [{ ...item, id: 'demo-' + Date.now() }, ...state.schedules];
        }

        state.isAddModalOpen = false;
        state.newSchedule = {
          title: '',
          memberId: state.currentMemberId,
          date: state.selectedDate,
          startTime: '16:00',
          endTime: '17:00',
          category: 'school',

        state.newSchedule.memberId = state.currentMemberId;

        state.isAddModalOpen = true;
        renderApp();
      },
      closeAddModal() {
        state.isAddModalOpen = false;
        renderApp();

      openShareModal() {
        state.isShareModalOpen = true;
        renderApp();
      },
      closeShareModal() {
        state.isShareModalOpen = false;
        renderApp();

    };

    function renderApp() {
      const currentMember = FAMILY_MEMBERS.find(m => m.id === state.currentMemberId) || FAMILY_MEMBERS[0];
      
      // 통계 계산
      const todayItems = state.schedules.filter(s => s.date === state.selectedDate);
      const totalCount = todayItems.length;
      const completedCount = todayItems.filter(s => s.status === 'completed').length;
      const percentage = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

      const memberStats = FAMILY_MEMBERS.map(m => {
        const mItems = todayItems.filter(s => s.memberId === m.id);
        const mTotal = mItems.length;
        const mCompleted = mItems.filter(s => s.status === 'completed').length;
        const mPercentage = mTotal > 0 ? Math.round((mCompleted / mTotal) * 100) : 0;
        return { ...m, total: mTotal, completed: mCompleted, percentage: mPercentage };
      });

      // 주간 날짜
      const curr = new Date(state.selectedDate);
      const day = curr.getDay();
      const sunday = new Date(curr);
      sunday.setDate(curr.getDate() - day);

      const weekDays = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(sunday);
        d.setDate(sunday.getDate() + i);
        const dateStr = d.toISOString().split('T')[0];
        const dayName = ['일', '월', '화', '수', '목', '금', '토'][i];
        weekDays.push({ dateStr, dayName, dayNumber: d.getDate(), isToday: dateStr === getTodayString(0) });
      }

      // 일정 필터링
      const filteredSchedules = state.schedules
        .filter((item) => {
          const matchDate = item.date === state.selectedDate;
          const matchMember = state.filterMemberId === 'all' || item.memberId === state.filterMemberId;
          return matchDate && matchMember;
        })
        .sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));

            <div class="flex items-center space-x-2.5">

              </div>

                    ${state.useFirebase ? '실시간 DB' : '연동 중'}

                </div>
                <p class="text-[11px] text-slate-500 truncate max-w-[170px] sm:max-w-none">
                  주원·주아·아빠·엄마의 실시간 하루
                </p>
              </div>
            </div>

            <div class="flex items-center space-x-1.5 sm:space-x-2">
              <button
                onclick="actions.openShareModal()"
                class="p-2 sm:px-3 sm:py-1.5 text-xs font-bold rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition flex items-center space-x-1"
              >
                <i class="fa-solid fa-mobile-screen text-slate-600"></i>
                <span class="hidden sm:inline ml-1">기기 연동</span>
              </button>
              <button
                onclick="actions.openAddModal()"
                class="px-3 py-1.5 text-xs font-bold rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-md shadow-indigo-200 transition flex items-center space-x-1 active:scale-95"
              >
                <i class="fa-solid fa-plus mr-1"></i>
                <span>일정 추가</span>
              </button>
            </div>
          </div>

          <!-- 접속 프로필 선택 바 -->
          <div class="bg-slate-100/80 border-t border-slate-200/60 px-3.5 py-1.5">
            <div class="max-w-5xl mx-auto flex items-center justify-between overflow-x-auto no-scrollbar gap-2">
              <span class="text-[11px] font-bold text-slate-500 shrink-0 flex items-center">

                  <div class="grid grid-cols-2 gap-1">
                    <div>
                      <label class="block font-bold text-slate-700 mb-1">시작</label>
                      <input
                        type="time"
                        value="${state.newSchedule.startTime}"
                        oninput="state.newSchedule.startTime = this.value"
                        class="w-full px-1.5 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs"
                      />
                    </div>
                    <div>
                      <label class="block font-bold text-slate-700 mb-1">종료</label>
                      <input
                        type="time"
                        value="${state.newSchedule.endTime}"
                        oninput="state.newSchedule.endTime = this.value"
                        class="w-full px-1.5 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs"
                      />
                    </div>
                  </div>
                </div>

                <div>
                  <label class="block font-bold text-slate-700 mb-1">메모 / 준비물</label>
                  <input
                    type="text"
                    value="${state.newSchedule.notes}"
                    oninput="state.newSchedule.notes = this.value"
                    placeholder="예: 교재 챙기기, 끝나고 연락하기"
                    class="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs"
                  />
                </div>

                <div class="pt-2 flex items-center space-x-2">
                  <button
                    type="button"
                    onclick="actions.closeAddModal()"
                    class="flex-1 py-2 rounded-xl border border-slate-200 text-slate-600 font-bold"
                  >
                    취소
                  </button>
                  <button
                    type="submit"
                    class="flex-1 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold"
                  >
                    등록
                  </button>
                </div>
              </form>
            </div>
          </div>
        ` : ''}

        ${state.isShareModalOpen ? `
          <div class="fixed inset-0 z-50 flex items-center justify-center p-3.5 bg-slate-900/60 backdrop-blur-xs">
            <div class="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl border border-slate-100 space-y-3.5">
              <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                <h3 class="text-base font-bold text-slate-900">가족 기기 실시간 연동</h3>
                <button
                  onclick="actions.closeShareModal()"
                  class="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 font-bold text-xs"
                >
                  ✕
                </button>
              </div>

              <div class="space-y-2.5 text-xs text-slate-600">
                <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-2xl flex items-start space-x-2">
                  <i class="fa-solid fa-check text-emerald-600 text-sm mt-0.5"></i>
                  <div>
                    <h4 class="font-bold text-emerald-900">실시간 클라우드 동기화 완료</h4>
                    <p class="text-emerald-700 text-[11px] mt-0.5">
                      가족 스마트폰에서 접속하면 모든 일정과 한 줄 현황이 실시간으로 공유됩니다.
                    </p>
                  </div>
                </div>
                <p class="text-slate-500 text-[11px] bg-slate-50 p-2.5 rounded-xl">
                  💡 스마트폰 브라우저 메뉴에서 <b>'홈 화면에 추가'</b>를 누르면 일반 앱처럼 편하게 접속할 수 있습니다.
                </p>
              </div>

              <button
                onclick="actions.closeShareModal()"
                class="w-full py-2 rounded-xl bg-slate-900 text-white font-bold text-xs"
              >
                닫기
              </button>
            </div>
          </div>
        ` : ''}

        ${state.toastMessage ? `
          <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 backdrop-blur text-white px-3.5 py-2 rounded-2xl shadow-xl text-xs font-bold flex items-center space-x-1.5 border border-slate-700 animate-in slide-in-from-bottom duration-300">
            <i class="fa-solid fa-sparkles text-amber-400"></i>
            <span class="ml-1">${state.toastMessage}</span>
          </div>
        ` : ''}
      `;

      document.getElementById('app').innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', () => {
      seedDefaultSchedules();
      renderApp();
    });
  </script>
</body>
</html>
