  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- 1. 클라우드 DB 연동 키 설정 ---
    const DEFAULT_FIREBASE_CONFIG = {

    // --- 2. 가족 프로필 정의 ---

      }
    ];

    const QUICK_STATUS_PRESETS = [
      { text: '🏫 학원 도착했어요!', emoji: '🏫' },
      { text: '🚗 집으로 출발해요~', emoji: '🚗' },
      { text: '📚 열공하는 중!', emoji: '🚀' },
      { text: '🏠 집에 잘 도착했어요!', emoji: '🏠' },
      { text: '🍱 밥 먹고 있어요', emoji: '🍱' },
      { text: '😴 잠깐 쉬는 중이에요', emoji: '😴' }
    ];

    const CATEGORIES = [
      { id: 'school', name: '학교/학원', color: 'bg-indigo-50 text-indigo-700 border-indigo-200' },
      { id: 'study', name: '숙제/공부', color: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
      { id: 'activity', name: '운동/취미', color: 'bg-orange-50 text-orange-700 border-orange-200' },
      { id: 'work', name: '업무/외근', color: 'bg-blue-50 text-blue-700 border-blue-200' },
      { id: 'home', name: '집안일/돌봄', color: 'bg-pink-50 text-pink-700 border-pink-200' },
      { id: 'family', name: '가족 모임/식사', color: 'bg-purple-50 text-purple-700 border-purple-200' }
    ];

    const STICKER_ICONS = [
      { key: 'thumb', emoji: '👍', label: '최고야' },
      { key: 'heart', emoji: '❤️', label: '사랑해' },
      { key: 'star', emoji: '🌟', label: '대단해' },
      { key: 'clap', emoji: '👏', label: '멋져요' },
      { key: 'fire', emoji: '🔥', label: '파이팅' }
    ];

    const getTodayString = () => {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const formatRelativeTime = (timestamp) => {
      if (!timestamp) return '미등록';
      const diffMinutes = Math.floor((Date.now() - timestamp) / 60000);
      if (diffMinutes < 1) return '방금 전';
      if (diffMinutes < 60) return `${diffMinutes}분 전`;
      const diffHours = Math.floor(diffMinutes / 60);
      if (diffHours < 24) return `${diffHours}시간 전`;
      return new Date(timestamp).toLocaleDateString([], { month: 'numeric', day: 'numeric' });
    };

    function App() {
      // 🔒 로그인 관련 상태
      const [currentMemberId, setCurrentMemberId] = useState('child1');
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [selectedLoginMember, setSelectedLoginMember] = useState('child1');
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [rememberMe, setRememberMe] = useState(true);

      // 비밀번호(PIN) 실시간 상태
      const [memberPins, setMemberPins] = useState({
        dad: '3333',
        mom: '4444',
        child1: '1111',
        child2: '2222'
      });
      const [isPinModalOpen, setIsPinModalOpen] = useState(false);
      const [pinFormOld, setPinFormOld] = useState('');
      const [pinFormNew, setPinFormNew] = useState('');
      const [pinFormConfirm, setPinFormConfirm] = useState('');
      const [pinModalError, setPinModalError] = useState('');

      const [selectedDate, setSelectedDate] = useState(getTodayString());
      const [viewMode, setViewMode] = useState('today'); // 'today' | 'week' | 'month'
      const [filterMemberId, setFilterMemberId] = useState('all');

      // Firestore & 연결 상태
      const [dbInstance, setDbInstance] = useState(null);
      const [authInstance, setAuthInstance] = useState(null);
      const [appId, setAppId] = useState('familiy-connect-shared-v1');
      const [syncStatus, setSyncStatus] = useState('연결 중...');
      const [isConnected, setIsConnected] = useState(false);

      const [schedules, setSchedules] = useState([]);
      const [statusMessages, setStatusMessages] = useState({});
      const [isLoading, setIsLoading] = useState(true);

      // 모달 & 중복 등록 방지
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [isConfirmModalOpen, setIsConfirmModalOpen] = useState(false); // 등록 확인 모달
      const [isSubmitting, setIsSubmitting] = useState(false); // 중복 클릭 방지
      const [isShareModalOpen, setIsShareModalOpen] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      const [newSchedule, setNewSchedule] = useState({
        title: '',
        memberId: 'child1',
        date: getTodayString(),
        startTime: '16:00',
        endTime: '17:00',
        category: 'school',
        notes: ''
      });

      const [myStatusInput, setMyStatusInput] = useState('');
      const [myEmoji, setMyEmoji] = useState('😊');

      // 달력 관련 (월 이동)
      const [calendarMonth, setCalendarMonth] = useState(() => {
        const d = new Date();
        return { year: d.getFullYear(), month: d.getMonth() + 1 };
      });

      // 로그인 상태 복원
      useEffect(() => {
        const savedMember = localStorage.getItem('family_connect_login_member');
        if (savedMember) {
          setCurrentMemberId(savedMember);
          setSelectedLoginMember(savedMember);
          setIsLoggedIn(true);
        }
      }, []);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      // 🔑 Firebase 인증 후 실시간 Firestore 구독
      useEffect(() => {
        let activeConfig = DEFAULT_FIREBASE_CONFIG;
        if (typeof __firebase_config !== 'undefined') {
          try {
            const parsed = JSON.parse(__firebase_config);
            if (parsed && parsed.apiKey) activeConfig = parsed;
          } catch(e){}
        }

        try {
          if (!firebase.apps.length) {
            firebase.initializeApp(activeConfig);
          }
          const firestore = firebase.firestore();
          const auth = firebase.auth();
          setDbInstance(firestore);
          setAuthInstance(auth);

          const currentAppId = typeof __app_id !== 'undefined' ? __app_id : 'familiy-connect-shared-v1';
          setAppId(currentAppId);

          // 익명 로그인 실행 후 snapshot 구독
          const initAuthAndSubscribe = async () => {
            try {
              if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await auth.signInWithCustomToken(__initial_auth_token);
              } else {
                await auth.signInAnonymously();
              }
              setSyncStatus('실시간 동기화 완료');
              setIsConnected(true);

              // 1. 실시간 일정 구독
              const unsubSchedules = firestore
                .collection('artifacts')
                .doc(currentAppId)
                .collection('public')
                .doc('data')
                .collection('schedules')
                .onSnapshot((snapshot) => {
                  const list = [];
                  snapshot.forEach((doc) => {
                    list.push({ id: doc.id, ...doc.data() });
                  });
                  setSchedules(list);
                  setIsLoading(false);
                }, (err) => {
                  console.error("일정 실시간 수신 오류:", err);
                  setSyncStatus('오프라인 저장 모드');
                  setIsConnected(false);
                  setIsLoading(false);
                });

              // 2. 실시간 현황 구독
              const unsubStatus = firestore
                .collection('artifacts')
                .doc(currentAppId)
                .collection('public')
                .doc('data')
                .collection('status_messages')
                .onSnapshot((snapshot) => {
                  const msgs = {};
                  snapshot.forEach((doc) => {
                    msgs[doc.id] = doc.data();
                  });
                  setStatusMessages(msgs);
                }, (err) => {
                  console.error("현황 실시간 수신 오류:", err);
                });

              // 3. 실시간 PIN 비밀번호 구독
              const unsubPins = firestore
                .collection('artifacts')
                .doc(currentAppId)
                .collection('public')
                .doc('data')
                .collection('pins')
                .doc('settings')
                .onSnapshot((docSnap) => {
                  if (docSnap.exists) {
                    setMemberPins(prev => ({ ...prev, ...docSnap.data() }));
                  }
                }, (err) => {
                  console.error("PIN 수신 오류:", err);
                });

              return () => {
                unsubSchedules();
                unsubStatus();
                unsubPins();
              };
            } catch(authErr) {
              console.error("인증 처리 실패:", authErr);
              setSyncStatus('오프라인 로컬 모드');
              setIsConnected(false);
              setIsLoading(false);
            }
          };

          initAuthAndSubscribe();
        } catch(err) {
          console.error("Firebase 초기화 에러:", err);
          setIsLoading(false);
        }
      }, []);

      const currentMember = useMemo(() => {
        return FAMILY_MEMBERS.find(m => m.id === currentMemberId) || FAMILY_MEMBERS[0];
      }, [currentMemberId]);

      const handleLoginSubmit = (e) => {
        if (e) e.preventDefault();
        const targetMember = FAMILY_MEMBERS.find(m => m.id === selectedLoginMember);
        if (!targetMember) return;
        
        const validPin = memberPins[targetMember.id] || targetMember.pin;

        if (!pinInput || pinInput === validPin) {
          setCurrentMemberId(selectedLoginMember);
          setIsLoggedIn(true);
          setLoginError('');
          setPinInput('');
          if (rememberMe) {
            localStorage.setItem('family_connect_login_member', selectedLoginMember);
          }
          showToast(`${targetMember.name}님, 환영합니다! 오늘 일정을 확인하세요 🏡`);
        } else {
          setLoginError(`비밀번호가 올바르지 않습니다.`);
        }
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setPinInput('');
        setLoginError('');
        localStorage.removeItem('family_connect_login_member');
        showToast('로그아웃 되었습니다.');
      };

      const handleSavePin = async (e) => {
        e.preventDefault();
        const targetMember = FAMILY_MEMBERS.find(m => m.id === selectedLoginMember) || currentMember;
        const currentPin = memberPins[targetMember.id] || targetMember.pin;

        if (pinFormOld && pinFormOld !== currentPin) {
          setPinModalError('기존 비밀번호가 올바르지 않습니다.');
          return;
        }
        if (!pinFormNew || pinFormNew.length !== 4) {
          setPinModalError('새 비밀번호는 숫자 4자리여야 합니다.');
          return;
        }
        if (pinFormNew !== pinFormConfirm) {
          setPinModalError('새 비밀번호와 확인 번호가 일치하지 않습니다.');
          return;
        }

        const updatedPins = { ...memberPins, [targetMember.id]: pinFormNew };
        setMemberPins(updatedPins);

        if (dbInstance) {
          try {
            await dbInstance
              .collection('artifacts')
              .doc(appId)
              .collection('public')
              .doc('data')
              .collection('pins')
              .doc('settings')
              .set(updatedPins, { merge: true });
          } catch(err) {
            console.error(err);
          }
        }

        setIsPinModalOpen(false);
        setPinFormOld('');
        setPinFormNew('');
        setPinFormConfirm('');
        setPinModalError('');
        showToast(`${targetMember.name}님의 비밀번호가 [${pinFormNew}](으)로 변경되었습니다! 🔑`);
      };

      // 일정 생성 1단계: 확인 모달 열기 (중복 방지)
      const handleOpenConfirmModal = (e) => {
        e.preventDefault();
        if (!newSchedule.title.trim()) {
          showToast("일정 제목을 입력해주세요!");
          return;
        }
        setIsConfirmModalOpen(true);
      };

      // 일정 생성 2단계: 실제 DB 저장 (중복 클릭 완전히 차단)
      const handleExecuteCreateSchedule = async () => {
        if (isSubmitting || !newSchedule.title.trim()) return;
        setIsSubmitting(true);

        const newItem = {
          ...newSchedule,
          status: 'pending',
          stickers: {},
          createdAt: Date.now()
        };

        try {
          if (dbInstance) {
            await dbInstance.collection('artifacts').doc(appId).collection('public').doc('data').collection('schedules').add(newItem);
          } else {
            setSchedules(prev => [...prev, { ...newItem, id: String(Date.now()) }]);
          }

          setIsConfirmModalOpen(false);
          setIsAddModalOpen(false);
          setNewSchedule({
            title: '',
            memberId: currentMemberId,
            date: selectedDate,
            startTime: '16:00',
            endTime: '17:00',
            category: 'school',
            notes: ''
          });
          showToast("일정이 정상적으로 등록 및 연동되었습니다! ✨");
        } catch(e) {
          console.error(e);
          showToast("등록 실패. 다시 시도해 주세요.");
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleStatusChange = async (id, newStatus) => {
        if (dbInstance) {
          try {
            await dbInstance.collection('artifacts').doc(appId).collection('public').doc('data').collection('schedules').doc(id).update({
              status: newStatus,
              updatedAt: Date.now()
            });
          } catch(e) { console.error(e); }
        } else {
          setSchedules(prev => prev.map(s => s.id === id ? { ...s, status: newStatus } : s));
        }
        const label = newStatus === 'completed' ? '완료 🎉' : newStatus === 'in_progress' ? '진행 중 🚀' : '대기 중 ⏳';
        showToast(`일정이 [${label}] 상태로 변경되었습니다.`);
      };

      const handleDeleteSchedule = async (id) => {
        if (dbInstance) {
          try {
            await dbInstance.collection('artifacts').doc(appId).collection('public').doc('data').collection('schedules').doc(id).delete();
          } catch(e) { console.error(e); }
        } else {
          setSchedules(prev => prev.filter(s => s.id !== id));
        }
        showToast("일정이 삭제되었습니다.");
      };

      const handleSendSticker = async (scheduleId, stickerKey) => {
        const target = schedules.find(s => s.id === scheduleId);
        if (!target) return;
        const currentCount = (target.stickers && target.stickers[stickerKey]) || 0;

        if (dbInstance) {
          try {
            await dbInstance.collection('artifacts').doc(appId).collection('public').doc('data').collection('schedules').doc(scheduleId).update({
              [`stickers.${stickerKey}`]: currentCount + 1,
              lastCheeredBy: currentMember.name,
              lastCheeredAt: Date.now()
            });
          } catch(e) { console.error(e); }
        } else {
          setSchedules(prev => prev.map(s => s.id === scheduleId ? {
            ...s,
            stickers: { ...s.stickers, [stickerKey]: currentCount + 1 },
            lastCheeredBy: currentMember.name
          } : s));
        }
        showToast(`${currentMember.name}님이 응원 스티커를 보냈습니다! 💖`);
      };

      const sendStatusMessage = async (text, emoji = '😊') => {
        if (!text.trim()) return;
        const payload = {
          memberId: currentMember.id,
          memberName: currentMember.name,
          text: text.trim(),
          emoji: emoji,
          updatedAt: Date.now()
        };

        if (dbInstance) {
          try {
            await dbInstance.collection('artifacts').doc(appId).collection('public').doc('data').collection('status_messages').doc(currentMember.id).set(payload);
          } catch(e) { console.error(e); }
        } else {
          setStatusMessages(prev => ({ ...prev, [currentMember.id]: payload }));
        }
        setMyStatusInput('');
        showToast(`${currentMember.name}님의 실시간 현황이 공유되었습니다! 📢`);
      };

      // 월간 달력 날짜 계산
      const monthCalendarDays = useMemo(() => {
        const { year, month } = calendarMonth;
        const firstDay = new Date(year, month - 1, 1);
        const lastDay = new Date(year, month, 0);
        const firstDayWeekday = firstDay.getDay();
        const daysInMonth = lastDay.getDate();

        const days = [];
        for (let i = 0; i < firstDayWeekday; i++) {
          days.push({ day: null, dateStr: null });
        }
        for (let d = 1; d <= daysInMonth; d++) {
          const mStr = String(month).padStart(2, '0');
          const dStr = String(d).padStart(2, '0');
          const dateStr = `${year}-${mStr}-${dStr}`;
          days.push({ day: d, dateStr });
        }
        return days;
      }, [calendarMonth]);

      // 주간 7일 계산
      const weekDays = useMemo(() => {
        const curr = new Date(selectedDate);
        const day = curr.getDay();
        const sunday = new Date(curr);
        sunday.setDate(curr.getDate() - day);

        const days = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(sunday);
          d.setDate(sunday.getDate() + i);
          const dateStr = d.toISOString().split('T')[0];
          const dayName = ['일', '월', '화', '수', '목', '금', '토'][i];
          days.push({ dateStr, dayName, dayNumber: d.getDate() });
        }
        return days;
      }, [selectedDate]);

      const filteredSchedules = useMemo(() => {
        return schedules
          .filter(item => {
            const matchDate = item.date === selectedDate;
            const matchMember = filterMemberId === 'all' || item.memberId === filterMemberId;
            return matchDate && matchMember;
          })
          .sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));
      }, [schedules, selectedDate, filterMemberId]);

      const stats = useMemo(() => {
        const todayItems = schedules.filter(s => s.date === selectedDate);
        const total = todayItems.length;
        const completed = todayItems.filter(s => s.status === 'completed').length;
        const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

        const memberStats = FAMILY_MEMBERS.map(m => {
          const mItems = todayItems.filter(s => s.memberId === m.id);
          const mTotal = mItems.length;
          const mCompleted = mItems.filter(s => s.status === 'completed').length;
          const mPercentage = mTotal > 0 ? Math.round((mCompleted / mTotal) * 100) : 0;
          return { ...m, total: mTotal, completed: mCompleted, percentage: mPercentage };
        });

        return { total, completed, percentage, memberStats };

                      setSelectedDate(d.toISOString().split('T')[0]);
                    }}
                    className="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 transition"
                  >
                    ▶
                  </button>
                </div>

                <div className="flex items-center space-x-3">
                  <span className="text-xs text-indigo-200">선택일 전체 달성률</span>
                  <span className="text-xl font-black text-emerald-400">{stats.percentage}%</span>
                  <span className="text-xs text-slate-300">({stats.completed}/{stats.total})</span>
                </div>
              </div>

              <div className="mt-3">
                <div className="w-full bg-white/10 h-2.5 rounded-full overflow-hidden p-0.5">
                  <div
                    className="bg-gradient-to-r from-indigo-400 via-emerald-400 to-teal-300 h-full rounded-full transition-all duration-500"
                    style={{ width: `${stats.percentage}%` }}
                  ></div>
                </div>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-3 pt-3 border-t border-white/10">
                {stats.memberStats.map((m) => (
                  <div key={m.id} className="bg-white/5 rounded-xl p-2 border border-white/10">
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-xs font-bold text-slate-200">{m.avatar} {m.name}</span>
                      <span className="text-xs font-extrabold text-indigo-300">{m.percentage}%</span>
                    </div>
                    <div className="w-full bg-white/10 h-1.5 rounded-full overflow-hidden">
                      <div className={`${m.barColor} h-full rounded-full`} style={{ width: `${m.percentage}%` }}></div>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* 📋 일정 목록 및 상태 토글 */}
            <section className="space-y-3">
              <div className="flex items-center justify-between">
                <div className="flex items-center space-x-1.5 overflow-x-auto no-scrollbar pb-0.5">
                  <button
                    onClick={() => setFilterMemberId('all')}
                    className={`px-3 py-1.5 rounded-xl text-xs font-bold transition shrink-0 ${
                      filterMemberId === 'all' ? 'bg-slate-900 text-white' : 'bg-white text-slate-600 border border-slate-200'
                    }`}
                  >
                    👨‍👩‍👧‍👦 전체 ({schedules.filter(s => s.date === selectedDate).length})
                  </button>
                  {FAMILY_MEMBERS.map((m) => (
                    <button
                      key={m.id}
                      onClick={() => setFilterMemberId(m.id)}
                      className={`px-2.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1 shrink-0 ${
                        filterMemberId === m.id ? m.activeBg : 'bg-white text-slate-600 border border-slate-200'
                      }`}
                    >
                      <span>{m.avatar}</span>
                      <span>{m.name}</span>
                    </button>
                  ))}
                </div>
              </div>

              {isLoading ? (
                <div className="bg-white rounded-2xl p-8 text-center border border-slate-200 space-y-2">
                  <div className="w-6 h-6 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
                  <p className="text-xs text-slate-500">실시간 데이터 수신 중...</p>
                </div>
              ) : filteredSchedules.length === 0 ? (
                <div className="bg-white rounded-2xl p-8 text-center border border-dashed border-slate-300 space-y-2">
                  <div className="text-2xl">🎈</div>
                  <p className="text-xs text-slate-500 font-bold">선택하신 날짜에 등록된 일정이 없습니다.</p>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {filteredSchedules.map((item) => {
                    const member = FAMILY_MEMBERS.find(m => m.id === item.memberId) || FAMILY_MEMBERS[0];
                    const category = CATEGORIES.find(c => c.id === item.category) || CATEGORIES[0];
                    const isCompleted = item.status === 'completed';
                    const isInProgress = item.status === 'in_progress';
                    const isPending = item.status === 'pending' || !item.status;

                    return (
                      <div
                        key={item.id}
                        className={`bg-white rounded-2xl p-3.5 sm:p-4 border shadow-sm flex flex-col justify-between ${
                          isCompleted ? 'bg-slate-50/70 opacity-90' : isInProgress ? 'border-indigo-300 ring-2 ring-indigo-500/10' : 'border-slate-200'
                        }`}
                      >
                        <div>
                          <div className="flex items-center justify-between mb-1.5">
                            <div className="flex items-center space-x-1.5">
                              <span className={`px-2 py-0.5 rounded-full text-xs font-bold border ${member.badgeBg}`}>
                                {member.avatar} {member.name}
                              </span>
                              <span className={`px-2 py-0.5 rounded-md text-[10px] font-semibold border ${category.color}`}>
                                {category.name}
                              </span>
                            </div>
                            <span className="text-xs font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-lg">
                              ⏰ {item.startTime} ~ {item.endTime}
                            </span>
                          </div>

                          <h3 className={`text-sm sm:text-base font-bold my-1.5 ${isCompleted ? 'text-slate-400 line-through' : 'text-slate-900'}`}>
                            {item.title}
                          </h3>
                          {item.notes && (
                            <p className="text-xs text-slate-500 bg-slate-50 p-1.5 rounded-lg border border-slate-100">
                              💬 {item.notes}
                            </p>
                          )}
                        </div>

                        <div className="mt-3 pt-2.5 border-t border-slate-100 space-y-2">
                          <div className="flex items-center justify-between gap-1">
                            <div className="flex items-center bg-slate-100 p-0.5 rounded-xl border border-slate-200">
                              <button
                                onClick={() => handleStatusChange(item.id, 'pending')}
                                className={`px-2 py-1 rounded-lg text-xs font-bold ${isPending ? 'bg-white text-slate-800 shadow-xs' : 'text-slate-500'}`}
                              >
                                대기
                              </button>
                              <button
                                onClick={() => handleStatusChange(item.id, 'in_progress')}
                                className={`px-2 py-1 rounded-lg text-xs font-bold ${isInProgress ? 'bg-indigo-600 text-white' : 'text-slate-500'}`}
                              >
                                진행 중
                              </button>
                              <button
                                onClick={() => handleStatusChange(item.id, 'completed')}
                                className={`px-2 py-1 rounded-lg text-xs font-bold ${isCompleted ? 'bg-emerald-600 text-white' : 'text-slate-500'}`}
                              >
                                완료
                              </button>
                            </div>
                            <button
                              onClick={() => handleDeleteSchedule(item.id)}
                              className="text-slate-400 hover:text-rose-600 p-1 text-xs"
                            >
                              삭제
                            </button>
                          </div>

                          {/* 칭찬 스티커 */}
                          <div className="flex items-center justify-between pt-0.5">
                            <div className="flex items-center space-x-1">
                              {STICKER_ICONS.map((st) => {
                                const count = item.stickers?.[st.key] || 0;
                                return (
                                  <button
                                    key={st.key}
                                    onClick={() => handleSendSticker(item.id, st.key)}
                                    className={`px-1.5 py-0.5 rounded-full text-xs border ${count > 0 ? 'bg-amber-50 border-amber-200 text-amber-900 font-bold' : 'bg-white text-slate-500'}`}
                                  >
                                    {st.emoji} {count > 0 && count}
                                  </button>
                                );
                              })}
                            </div>
                            {item.lastCheeredBy && (
                              <span className="text-[10px] text-slate-400 italic">
                                {item.lastCheeredBy} 응원
                              </span>
                            )}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </section>
          </main>

          {/* ➕ 1단계: 새 일정 입력 모달 */}
          {isAddModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3.5 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl space-y-3">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                  <h3 className="text-base font-bold">새 일정 등록</h3>
                  <button onClick={() => setIsAddModalOpen(false)} className="w-7 h-7 rounded-full bg-slate-100 text-xs font-bold">✕</button>
                </div>
                <form onSubmit={handleOpenConfirmModal} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold mb-1">담당 가족</label>
                    <div className="grid grid-cols-4 gap-1.5">
                      {FAMILY_MEMBERS.map((m) => (
                        <button
                          type="button"
                          key={m.id}
                          onClick={() => setNewSchedule({ ...newSchedule, memberId: m.id })}
                          className={`p-1.5 rounded-xl border text-center ${newSchedule.memberId === m.id ? m.activeBg : 'bg-white'}`}
                        >
                          <div className="text-lg">{m.avatar}</div>
                          <div>{m.name}</div>
                        </button>
                      ))}
                    </div>
                  </div>
                  <div>
                    <label className="block font-bold mb-1">일정 제목 *</label>
                    <input
                      type="text"
                      required
                      value={newSchedule.title}
                      onChange={(e) => setNewSchedule({ ...newSchedule, title: e.target.value })}
                      placeholder="예: 영어 학원, 태권도 레슨"
                      className="w-full px-3 py-2 bg-slate-50 border rounded-xl"
                    />
                  </div>
                  <div>
                    <label className="block font-bold mb-1">날짜</label>
                    <input
                      type="date"
                      value={newSchedule.date}
                      onChange={(e) => setNewSchedule({ ...newSchedule, date: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-50 border rounded-xl"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold mb-1">시작 시간</label>
                      <input
                        type="time"
                        value={newSchedule.startTime}
                        onChange={(e) => setNewSchedule({ ...newSchedule, startTime: e.target.value })}
                        className="w-full px-2 py-1.5 bg-slate-50 border rounded-xl"
                      />
                    </div>
                    <div>
                      <label className="block font-bold mb-1">종료 시간</label>
                      <input
                        type="time"
                        value={newSchedule.endTime}
                        onChange={(e) => setNewSchedule({ ...newSchedule, endTime: e.target.value })}
                        className="w-full px-2 py-1.5 bg-slate-50 border rounded-xl"
                      />
                    </div>
                  </div>
                  <div className="pt-2 flex items-center space-x-2">
                    <button type="button" onClick={() => setIsAddModalOpen(false)} className="flex-1 py-2 rounded-xl border font-bold">취소</button>
                    <button type="submit" className="flex-1 py-2 rounded-xl bg-indigo-600 text-white font-bold">다음 (확인)</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 🛑 2단계: 등록 확인 및 중복 방지 모달 */}
          {isConfirmModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3.5 bg-slate-950/70 backdrop-blur-xs">
              <div className="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl space-y-4">
                <div className="text-center space-y-1">
                  <div className="w-12 h-12 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-2xl mx-auto">
                    ❓
                  </div>
                  <h3 className="text-base font-extrabold text-slate-900">일정을 등록하시겠습니까?</h3>
                  <p className="text-xs text-slate-500">아래 내용으로 온 가족에게 공유됩니다.</p>
                </div>

                <div className="bg-slate-50 rounded-2xl p-3 border border-slate-200 text-xs space-y-1.5">
                  <div className="flex justify-between">
                    <span className="text-slate-400 font-bold">담당자:</span>
                    <span className="font-extrabold text-slate-800">
                      {(FAMILY_MEMBERS.find(m => m.id === newSchedule.memberId) || FAMILY_MEMBERS[0]).name}
                    </span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400 font-bold">제목:</span>
                    <span className="font-extrabold text-indigo-600">{newSchedule.title}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400 font-bold">날짜:</span>
                    <span className="font-bold text-slate-700">{newSchedule.date}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400 font-bold">시간:</span>
                    <span className="font-bold text-slate-700">{newSchedule.startTime} ~ {newSchedule.endTime}</span>
                  </div>
                </div>

                <div className="flex items-center space-x-2 pt-1">
                  <button
                    type="button"
                    disabled={isSubmitting}
                    onClick={() => setIsConfirmModalOpen(false)}
                    className="flex-1 py-2.5 rounded-xl border border-slate-300 text-slate-600 font-bold text-xs"
                  >
                    돌아가기
                  </button>
                  <button
                    type="button"
                    disabled={isSubmitting}
                    onClick={handleExecuteCreateSchedule}
                    className="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-400 text-white font-extrabold text-xs shadow-md transition active:scale-95 flex items-center justify-center space-x-1"
                  >
                    {isSubmitting ? (
                      <span>등록 처리 중...</span>
                    ) : (
                      <span>확인 및 등록 🚀</span>
                    )}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 📲 기기 연결 안내 모달 */}
          {isShareModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3.5 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl space-y-3">
                <h3 className="text-base font-bold">📱 온 가족 스마트폰 연결</h3>
                <p className="text-xs text-slate-600 leading-relaxed">
                  스마트폰 브라우저 주소창에 <code>https://ittechkjh.github.io/familiy/</code> 주소를 입력하여 들어오시면 실시간으로 연결됩니다!
                </p>
                <button onClick={() => setIsShareModalOpen(false)} className="w-full py-2 rounded-xl bg-slate-900 text-white font-bold text-xs">
                  확인 완료
                </button>
              </div>
            </div>
          )}

          {/* 🔔 알림 토스트 */}
          {toastMessage && (
            <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-3.5 py-2 rounded-2xl text-xs font-bold shadow-xl">
              ✨ {toastMessage}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
