    const getTodayString = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const formatRelativeTime = (timestamp) => {
      if (!timestamp) return '미등록';
      const diffMinutes = Math.floor((Date.now() - timestamp) / 60000);
      if (diffMinutes < 1) return '방금 전';
      if (diffMinutes < 60) return `${diffMinutes}분 전`;
      const diffHours = Math.floor(diffMinutes / 60);
      if (diffHours < 24) return `${diffHours}시간 전`;
      return new Date(timestamp).toLocaleDateString([], { month: 'numeric', day: 'numeric' });
    };

    const createGoogleCalendarUrl = (item) => {
      const title = encodeURIComponent(`[우리집] ${item.title}`);
      const notes = encodeURIComponent(item.notes ? `메모: ${item.notes}` : '');
      const dateFormatted = item.date.replace(/-/g, '');
      const startFormatted = (item.startTime || '09:00').replace(/:/g, '') + '00';
      const endFormatted = (item.endTime || '10:00').replace(/:/g, '') + '00';
      const dates = `${dateFormatted}T${startFormatted}/${dateFormatted}T${endFormatted}`;
      return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dates}&details=${notes}`;

                    <button

                      onClick={() => handleOpenPraiseModal(st.id)}
                      className="px-3 py-2 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-xl transition"
                    >
                      + 칭찬하기
                    </button>
                  )}
                </div>
              </div>
            ))}
          </div>

          <div className="space-y-2 pt-2">
            <h3 className="text-xs font-bold text-amber-900">💬 주원이와 주아가 받은 칭찬 내역</h3>

            {praiseLogs.length === 0 ? (
              <div className="text-center py-6 bg-white/60 rounded-2xl border border-dashed border-amber-200 text-xs text-amber-800/60 font-bold">
                아직 등록된 칭찬 스티커가 없습니다. 상단의 '🎁 칭찬 스티커 선물하기'를 눌러 첫 스티커를 선물해 보세요!
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-60 overflow-y-auto no-scrollbar">
                {praiseLogs
                  .sort((a, b) => b.createdAt - a.createdAt)
                  .map((log) => (
                    <div key={log.id} className="bg-white p-3 rounded-2xl border border-amber-100 shadow-2xs flex items-start space-x-2.5">
                      <span className="text-2xl shrink-0">{log.stickerEmoji || '🌟'}</span>
                      <div className="min-w-0 flex-1">
                        <div className="flex items-center justify-between text-[11px]">
                          <span className="font-bold text-slate-800">
                            <span className="text-amber-600 font-extrabold">{log.fromMemberName}</span> ➔ <span className="text-indigo-600 font-extrabold">{log.toMemberName}</span>
                          </span>
                          <div className="flex items-center space-x-1">
                            <span className="text-[10px] text-slate-400">{formatRelativeTime(log.createdAt)}</span>
                            {isParent && (
                              <button
                                type="button"
                                onClick={() => handleDeletePraise(log.id)}
                                className="p-0.5 text-slate-300 hover:text-rose-500 font-bold transition text-xs"
                                title="삭제"
                              >
                                ✕
                              </button>
                            )}
                          </div>
                        </div>
                        <p className="text-xs text-slate-700 font-medium mt-0.5 truncate">{log.reason}</p>
                      </div>
                    </div>
                  ))}
              </div>
            )}
          </div>
        </section>
      );
    }

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentMemberId, setCurrentMemberId] = useState('child1');
      const [selectedLoginMember, setSelectedLoginMember] = useState('child1');
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [rememberMe, setRememberMe] = useState(true);

      const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
      const [isAddCategoryModalOpen, setIsAddCategoryModalOpen] = useState(false);
      const [newCatName, setNewCatName] = useState('');
      const [newCatColor, setNewCatColor] = useState(CATEGORY_COLOR_OPTIONS[0].class);

      const [isPinModalOpen, setIsPinModalOpen] = useState(false);
      const [pinFormOld, setPinFormOld] = useState('');
      const [pinFormNew, setPinFormNew] = useState('');
      const [pinFormConfirm, setPinFormConfirm] = useState('');
      const [pinModalError, setPinModalError] = useState('');
      const [memberPins, setMemberPins] = useState({});

      const [selectedDate, setSelectedDate] = useState(getTodayString());
      const [currentMonth, setCurrentMonth] = useState(new Date());
      const [mainTab, setMainTab] = useState('all');
      const [viewMode, setViewMode] = useState('today');
      const [filterMemberId, setFilterMemberId] = useState('all');

      const [schedules, setSchedules] = useState([]);
      const [todos, setTodos] = useState([]);
      const [praiseLogs, setPraiseLogs] = useState([]);
      const [statusMessages, setStatusMessages] = useState({});
      const [syncStatus, setSyncStatus] = useState('connecting');

      const [myStatusInput, setMyStatusInput] = useState('');

      const [statusPresets, setStatusPresets] = useState(() => {
        const saved = localStorage.getItem('family_status_presets');
        return saved ? JSON.parse(saved) : QUICK_STATUS_PRESETS.map((p, idx) => ({ id: `default_sp_${idx}`, ...p }));
      });

      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [editingSchedule, setEditingSchedule] = useState(null);

      const [isAddTodoModalOpen, setIsAddTodoModalOpen] = useState(false);
      const [editingTodo, setEditingTodo] = useState(null);
      const [isPraiseModalOpen, setIsPraiseModalOpen] = useState(false);
      const [isConfirmModalOpen, setIsConfirmModalOpen] = useState(false);
      const [isResetPraiseConfirmOpen, setIsResetPraiseConfirmOpen] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      const [autoAddToGCal, setAutoAddToGCal] = useState(true);

      const [todoPresets, setTodoPresets] = useState(() => {
        const saved = localStorage.getItem('family_todo_presets');
        return saved ? JSON.parse(saved) : DEFAULT_TODO_PRESETS.map((text, idx) => ({ id: `default_${idx}`, text }));
      });
      const [isPresetManageOpen, setIsPresetManageOpen] = useState(false);
      const [newPresetText, setNewPresetText] = useState('');

      const [newSchedule, setNewSchedule] = useState({
        title: '',
        memberId: 'child1',
        date: getTodayString(),
        startTime: '16:00',
        endTime: '17:00',
        category: 'school',
        notes: ''
      });

      const [todoForm, setTodoForm] = useState({ text: '', memberId: 'child1', category: 'study' });
      const [praiseForm, setPraiseForm] = useState({ toMemberId: 'child1', stickerKey: 'star', reason: '' });

      const dbRef = useRef(null);
      const authRef = useRef(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      useEffect(() => {
        localStorage.setItem('family_todo_presets', JSON.stringify(todoPresets));
      }, [todoPresets]);

      useEffect(() => {
        localStorage.setItem('family_status_presets', JSON.stringify(statusPresets));
      }, [statusPresets]);

      useEffect(() => {
        const initFirebase = async () => {
          try {
            if (!firebase.apps.length) {
              firebase.initializeApp(DEFAULT_FIREBASE_CONFIG);
            }
            const auth = firebase.auth();
            const db = firebase.firestore();
            authRef.current = auth;
            dbRef.current = db;

            auth.onAuthStateChanged(async (user) => {
              if (!user) {
                try { await auth.signInAnonymously(); } catch (e) { console.warn(e); }
              }
            });

            db.collection('schedules').onSnapshot((snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              setSchedules(list);
              setSyncStatus('online');
            }, () => setSyncStatus('offline'));

            db.collection('categories').onSnapshot((snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              if (list.length > 0) {
                setCategories([...DEFAULT_CATEGORIES, ...list.filter(c => !DEFAULT_CATEGORIES.some(dc => dc.id === c.id))]);
              } else {
                setCategories(DEFAULT_CATEGORIES);
              }
            });

            db.collection('status_presets').onSnapshot((snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              if (list.length > 0) {
                setStatusPresets(list);
              } else {
                setStatusPresets(QUICK_STATUS_PRESETS.map((p, idx) => ({ id: `default_sp_${idx}`, ...p })));
              }
            });

            db.collection('todo_presets').onSnapshot((snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              if (list.length > 0) {
                setTodoPresets(list);
              } else {
                setTodoPresets(DEFAULT_TODO_PRESETS.map((text, idx) => ({ id: `default_${idx}`, text })));
              }
            });

            db.collection('todos').onSnapshot((snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              setTodos(list);
            });

            db.collection('praise_stickers').onSnapshot((snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              setPraiseLogs(list);
            });

            db.collection('status_messages').onSnapshot((snapshot) => {
              const msgs = {};
              snapshot.forEach((doc) => { msgs[doc.id] = doc.data(); });
              setStatusMessages(msgs);
            }, (err) => console.warn("status messages snapshot error:", err));

            db.collection('family_pins').onSnapshot((snapshot) => {
              const pins = {};
              snapshot.forEach((doc) => { pins[doc.id] = doc.data().pin; });
              setMemberPins(pins);
            });

          } catch (error) {
            console.error(error);
            setSyncStatus('offline');
          }
        };

        initFirebase();

        const savedMember = localStorage.getItem('family_logged_in_member');
        if (savedMember) {
          setCurrentMemberId(savedMember);
          setSelectedLoginMember(savedMember);
          setIsLoggedIn(true);
        }
      }, []);

      const handleAddStatusPreset = async (text, emoji) => {
        if (!text.trim()) return;
        const newObj = { text: text.trim(), emoji: emoji || '💬', createdAt: Date.now() };
        try {
          if (dbRef.current) {
            await dbRef.current.collection('status_presets').add(newObj);
          } else {
            setStatusPresets(prev => [...prev, { id: 'sp_' + Date.now(), ...newObj }]);
          }
          showToast("새 빠른 상태 문구가 추가되었습니다! ✨");
        } catch (err) { console.error(err); }
      };

      const handleDeleteStatusPreset = async (presetItem) => {
        try {
          if (dbRef.current && presetItem.id && !presetItem.id.startsWith('default_sp_')) {
            await dbRef.current.collection('status_presets').doc(presetItem.id).delete();
          } else {
            setStatusPresets(prev => prev.filter(p => p.id !== presetItem.id));
          }
          showToast("빠른 상태 문구가 삭제되었습니다.");
        } catch (err) { console.error(err); }
      };

      const handleAddTodoPreset = async (text) => {
        if (!text.trim()) return;
        const newObj = { text: text.trim(), createdAt: Date.now() };
        try {
          if (dbRef.current) {
            await dbRef.current.collection('todo_presets').add(newObj);
          } else {
            setTodoPresets(prev => [...prev, { id: 'tp_' + Date.now(), text: text.trim() }]);
          }
          showToast("새 자주 쓰는 할 일 문구가 추가되었습니다! ✨");
        } catch (err) { console.error(err); }
      };

      const handleDeleteTodoPreset = async (presetItem) => {
        try {
          if (dbRef.current && presetItem.id && !presetItem.id.startsWith('default_')) {
            await dbRef.current.collection('todo_presets').doc(presetItem.id).delete();
          } else {
            setTodoPresets(prev => prev.filter(p => p.id !== presetItem.id));
          }
          showToast("자주 쓰는 문구가 삭제되었습니다.");
        } catch (err) { console.error(err); }
      };

      const handleAddCategory = async (e) => {
        e.preventDefault();
        if (!newCatName.trim()) return;

        if (categories.some(c => c.name === newCatName.trim())) {
          showToast("이미 등록된 카테고리 이름입니다.");
          return;
        }

        const newCat = {
          id: 'cat_' + Date.now(),
          name: newCatName.trim(),
          color: newCatColor,
          isCustom: true,
          createdAt: Date.now()
        };

        try {
          if (dbRef.current) {
            await dbRef.current.collection('categories').doc(newCat.id).set(newCat);
          } else {
            setCategories(prev => [...prev, newCat]);
          }
          setNewCatName('');
          setIsAddCategoryModalOpen(false);
          showToast("새 카테고리가 등록되었습니다! 🏷️");
        } catch (err) { console.error(err); }
      };

      const handleDeleteCategory = async (catItem) => {
        try {
          if (dbRef.current && catItem.id) {
            await dbRef.current.collection('categories').doc(catItem.id).delete();
          }
          setCategories(prev => prev.filter(c => c.id !== catItem.id));
          showToast(`'${catItem.name}' 카테고리가 삭제되었습니다.`);
        } catch (err) { console.error(err); }
      };

      const currentMember = useMemo(() => {
        return FAMILY_MEMBERS.find(m => m.id === currentMemberId) || FAMILY_MEMBERS[0];
      }, [currentMemberId]);

      const isParent = currentMember.isParent;

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        const targetMember = FAMILY_MEMBERS.find(m => m.id === selectedLoginMember);
        const correctPin = memberPins[selectedLoginMember] || targetMember.defaultPin;

        if (pinInput === correctPin) {
          setCurrentMemberId(selectedLoginMember);
          setIsLoggedIn(true);
          setLoginError('');
          setPinInput('');
          if (rememberMe) {
            localStorage.setItem('family_logged_in_member', selectedLoginMember);
          } else {
            localStorage.removeItem('family_logged_in_member');
          }
          showToast(`${targetMember.name} 프로필로 환영합니다! 🎉`);
        } else {
          setLoginError('비밀번호(PIN 4자리)가 올바르지 않습니다.');
        }
      };

      const handlePinChangeSubmit = async (e) => {
        e.preventDefault();
        const targetMember = FAMILY_MEMBERS.find(m => m.id === selectedLoginMember);
        const correctPin = memberPins[selectedLoginMember] || targetMember.defaultPin;

        if (pinFormOld !== correctPin) {
          setPinModalError('기존 비밀번호가 틀렸습니다.');
          return;
        }
        if (pinFormNew.length !== 4 || isNaN(pinFormNew)) {
          setPinModalError('새 비밀번호는 숫자 4자리여야 합니다.');
          return;
        }
        if (pinFormNew !== pinFormConfirm) {
          setPinModalError('새 비밀번호 확인이 일치하지 않습니다.');
          return;
        }

        try {
          if (dbRef.current) {
            await dbRef.current.collection('family_pins').doc(selectedLoginMember).set({
              pin: pinFormNew,
              updatedAt: Date.now()
            });
          }
          setMemberPins(prev => ({ ...prev, [selectedLoginMember]: pinFormNew }));
          setIsPinModalOpen(false);
          setPinFormOld('');
          setPinFormNew('');
          setPinFormConfirm('');
          setPinModalError('');
          showToast(`${targetMember.name}의 비밀번호가 성공적으로 변경되었습니다! 🔑`);
        } catch (err) {
          setPinModalError('비밀번호 변경 중 오류가 발생했습니다.');
        }
      };

      const handleOpenAddScheduleModal = () => {
        setEditingSchedule(null);
        setNewSchedule({
          title: '',
          memberId: currentMemberId === 'mom' ? 'mom' : currentMemberId === 'dad' ? 'dad' : currentMemberId,
          date: selectedDate,
          startTime: '16:00',
          endTime: '17:00',
          category: categories[0]?.id || 'school',
          notes: ''
        });
        setIsAddModalOpen(true);
      };

      const handleOpenEditScheduleModal = (scheduleItem) => {
        if (!canManageMemberSchedule(currentMember.id, scheduleItem.memberId)) {
          showToast("⚠️ 해당 가족의 일정을 수정할 권한이 없습니다.");
          return;
        }
        setEditingSchedule(scheduleItem);
        setNewSchedule({ ...scheduleItem });
        setIsAddModalOpen(true);
      };

      const handleSaveScheduleSubmit = (e) => {
        e.preventDefault();
        if (!newSchedule.title.trim()) return;

        if (!canManageMemberSchedule(currentMember.id, newSchedule.memberId)) {
          showToast("⚠️ 선택한 가족의 일정을 수정할 권한이 없습니다.");
          return;
        }

        setIsConfirmModalOpen(true);
      };

      const handleConfirmScheduleCreate = async () => {
        if (!newSchedule.title.trim()) return;
        setIsSubmitting(true);

        const itemData = {
          title: newSchedule.title.trim(),
          memberId: newSchedule.memberId,
          date: newSchedule.date,
          startTime: newSchedule.startTime,
          endTime: newSchedule.endTime,
          category: newSchedule.category,
          notes: newSchedule.notes.trim(),
          updatedAt: Date.now()
        };

        try {
          if (editingSchedule) {
            if (dbRef.current) {
              await dbRef.current.collection('schedules').doc(editingSchedule.id).update(itemData);
            } else {
              setSchedules(prev => prev.map(s => s.id === editingSchedule.id ? { ...s, ...itemData } : s));
            }
            showToast("일정이 수정되었습니다! ✏️");
          } else {
            const newItem = { ...itemData, status: 'pending', stickers: {}, createdAt: Date.now() };
            if (dbRef.current) {
              await dbRef.current.collection('schedules').add(newItem);
            } else {
              setSchedules(prev => [...prev, { id: 'sch_' + Date.now(), ...newItem }]);
            }

            if (isParent && autoAddToGCal) {
              const gcalUrl = createGoogleCalendarUrl(newItem);
              window.open(gcalUrl, '_blank');
            }
            showToast("새 일정이 등록되었습니다! ✨");
          }

          setIsConfirmModalOpen(false);
          setIsAddModalOpen(false);
          setEditingSchedule(null);
        } catch (err) {
          showToast("일정 저장 중 오류가 발생했습니다.");
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleStatusChange = async (scheduleId, newStatus) => {
        try {
          if (dbRef.current) {
            await dbRef.current.collection('schedules').doc(scheduleId).update({
              status: newStatus,
              updatedAt: Date.now()
            });
          } else {
            setSchedules(prev => prev.map(s => s.id === scheduleId ? { ...s, status: newStatus } : s));
          }
          showToast("일정 상태가 변경되었습니다.");
        } catch (err) { console.error(err); }
      };

      const handleDeleteSchedule = async (item) => {
        if (!canManageMemberSchedule(currentMember.id, item.memberId)) {
          showToast("⚠️ 이 일정을 삭제할 권한이 없습니다.");
          return;
        }
        try {
          if (dbRef.current) {
            await dbRef.current.collection('schedules').doc(item.id).delete();
          } else {
            setSchedules(prev => prev.filter(s => s.id !== item.id));
          }
          showToast("일정이 삭제되었습니다.");
        } catch (err) { console.error(err); }
      };

      const handleCreateTodo = async (e) => {
        e.preventDefault();
        if (!todoForm.text.trim()) return;

        const targetMemberId = isParent ? todoForm.memberId : currentMemberId;
        const itemData = {
          text: todoForm.text.trim(),
          memberId: targetMemberId,
          category: todoForm.category,
          completed: false,
          createdAt: Date.now()
        };

        try {
          if (editingTodo) {
            if (dbRef.current) {
              await dbRef.current.collection('todos').doc(editingTodo.id).update({
                text: todoForm.text.trim(),
                category: todoForm.category,
                memberId: targetMemberId,
                updatedAt: Date.now()
              });
            } else {
              setTodos(prev => prev.map(t => t.id === editingTodo.id ? { ...t, ...itemData } : t));
            }
            showToast("할 일이 수정되었습니다! ✏️");
          } else {
            if (dbRef.current) {
              await dbRef.current.collection('todos').add(itemData);
            } else {
              setTodos(prev => [...prev, { id: 'todo_' + Date.now(), ...itemData }]);
            }
            showToast("새 할 일이 등록되었습니다! ✨");
          }

          setIsAddTodoModalOpen(false);
          setEditingTodo(null);
          setTodoForm({ text: '', memberId: 'child1', category: 'study' });
        } catch (err) { console.error(err); }
      };

      const handleToggleTodo = async (todoItem) => {
        const nextState = !todoItem.completed;
        try {
          if (dbRef.current) {
            await dbRef.current.collection('todos').doc(todoItem.id).update({
              completed: nextState,
              completedAt: nextState ? Date.now() : null,
              completedBy: nextState ? currentMember.name : null
            });
          } else {
            setTodos(prev => prev.map(t => t.id === todoItem.id ? { ...t, completed: nextState } : t));
          }

          if (nextState) {
            showToast(`🎉 축하합니다! '${todoItem.text}' 완료!`);
          }
        } catch (err) { console.error(err); }
      };

      const handleDeleteTodo = async (todoItem) => {
        if (!isParent) {
          showToast("⚠️ 엄마, 아빠만 할 일을 삭제할 수 있습니다.");
          return;
        }
        try {
          if (dbRef.current) {
            await dbRef.current.collection('todos').doc(todoItem.id).delete();
          } else {
            setTodos(prev => prev.filter(s => s.id !== todoItem.id));
          }
          showToast("할 일이 삭제되었습니다.");
        } catch (err) { console.error(err); }
      };

      const handleCreatePraise = async (e) => {
        e.preventDefault();
        if (!isParent) {
          showToast("⚠️ 엄마, 아빠만 칭찬 스티커를 줄 수 있습니다.");
          return;
        }

        const targetMember = FAMILY_MEMBERS.find(m => m.id === praiseForm.toMemberId) || FAMILY_MEMBERS[2];
        const stickerObj = STICKER_ICONS.find(s => s.key === praiseForm.stickerKey) || STICKER_ICONS[0];

        const defaultReason = `${stickerObj.label}! 참 잘했어요! 🎉`;
        const finalReason = praiseForm.reason.trim() || defaultReason;

        const praiseData = {
          fromMemberId: currentMember.id,
          fromMemberName: currentMember.name,
          toMemberId: targetMember.id,
          toMemberName: targetMember.name,
          stickerKey: praiseForm.stickerKey,
          stickerEmoji: stickerObj.emoji,
          reason: finalReason,
          createdAt: Date.now()
        };

        try {
          if (dbRef.current) {
            await dbRef.current.collection('praise_stickers').add(praiseData);
          } else {
            setPraiseLogs(prev => [...prev, { id: 'praise_' + Date.now(), ...praiseData }]);
          }

          setIsPraiseModalOpen(false);
          setPraiseForm({ toMemberId: 'child1', stickerKey: 'star', reason: '' });
          showToast(`🌟 ${targetMember.name}에게 칭찬 스티커를 선물했습니다!`);
        } catch (err) { console.error(err); }
      };

      const handleDeletePraise = async (praiseId) => {
        if (!isParent) {
          showToast("⚠️ 엄마, 아빠만 칭찬 스티커를 삭제할 수 있습니다.");
          return;
        }
        try {
          if (dbRef.current) {
            await dbRef.current.collection('praise_stickers').doc(praiseId).delete();
          } else {
            setPraiseLogs(prev => prev.filter(p => p.id !== praiseId));
          }
          showToast("칭찬 스티커 기록이 삭제되었습니다.");
        } catch (err) { console.error(err); }
      };

      const handleResetAllPraise = async () => {
        if (!isParent) return;
        try {
          if (dbRef.current) {
            const snapshot = await dbRef.current.collection('praise_stickers').get();
            const batch = dbRef.current.batch();
            snapshot.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
          } else {
            setPraiseLogs([]);
          }
          setIsResetPraiseConfirmOpen(false);
          showToast("🧹 주원·주아의 모든 칭찬 스티커가 리셋되었습니다.");
        } catch (err) { console.error(err); }
      };

      const sendStatusMessage = async (text, emoji) => {
        if (!text.trim()) {
          showToast("⚠️ 공유할 한 줄 현황을 입력해주세요!");
          return;
        }
        const textVal = text.trim();
        const emojiVal = emoji || '😊';
        const msgObj = { text: textVal, emoji: emojiVal, updatedAt: Date.now() };

        setStatusMessages(prev => ({ ...prev, [currentMember.id]: msgObj }));
        setMyStatusInput('');

        try {
          if (dbRef.current) {
            await dbRef.current.collection('status_messages').doc(currentMember.id).set(msgObj);
          }
          showToast(`${currentMember.name}님의 현황이 공유되었습니다! 📢`);
        } catch (err) { console.error(err); }

        const todayItems = schedules.filter(s => s.date === selectedDate);
        const total = todayItems.length;
        const completed = todayItems.filter(s => s.status === 'completed').length;
        const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

        const memberStats = FAMILY_MEMBERS.map(m => {
          const mItems = todayItems.filter(s => s.memberId === m.id);
          const mTotal = mItems.length;
          const mCompleted = mItems.filter(s => s.status === 'completed').length;
          return {
            ...m,
            total: mTotal,
            completed: mCompleted,
            percentage: mTotal > 0 ? Math.round((mCompleted / mTotal) * 100) : 0
          };
        });

        return { total, completed, percentage, memberStats };

        for (let i = 0; i < 7; i++) {
          const next = new Date(curr.getTime());
          next.setDate(first + i);
          const dateStr = next.toISOString().split('T')[0];
          const dayName = ['일', '월', '화', '수', '목', '금', '토'][next.getDay()];
          days.push({ dateStr, dayName, dayNumber: next.getDate() });
        }
        return days;
      }, [selectedDate]);

      const monthCalendarDays = useMemo(() => {

        const totalDays = new Date(year, month + 1, 0).getDate();

        const days = [];
        for (let i = 0; i < firstDayIndex; i++) {
          days.push({ id: `empty_${i}`, empty: true });
        }
        for (let d = 1; d <= totalDays; d++) {
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const isSelected = dateStr === selectedDate;
          const isToday = dateStr === getTodayString();
          const daySchedules = schedules.filter(s => s.date === dateStr);
          days.push({ id: dateStr, dateStr, dayNumber: d, isSelected, isToday, schedules: daySchedules });

        return days;

                <div className="text-3xl">{editingSchedule ? '✏️' : '📝'}</div>
                <h3 className="text-base font-extrabold text-slate-900">
                  {editingSchedule ? '일정을 수정하시겠습니까?' : '일정을 공유하시겠습니까?'}
                </h3>
                <div className="bg-slate-50 p-3 rounded-2xl text-xs text-left space-y-1 text-slate-700 font-medium">
                  <div>📌 <b>제목:</b> {newSchedule.title}</div>
                  <div>👤 <b>담당:</b> {FAMILY_MEMBERS.find(m => m.id === newSchedule.memberId)?.name}</div>
                  <div>⏰ <b>시간:</b> {newSchedule.date} ({newSchedule.startTime} ~ {newSchedule.endTime})</div>
                </div>

                <div className="flex items-center space-x-2 pt-1">
                  <button
                    type="button"
                    disabled={isSubmitting}
                    onClick={() => setIsConfirmModalOpen(false)}
                    className="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-bold text-xs"
                  >
                    이전으로
                  </button>
                  <button
                    type="button"
                    disabled={isSubmitting}
                    onClick={handleConfirmScheduleCreate}
                    className="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-md"
                  >
                    {isSubmitting ? '처리 중...' : editingSchedule ? '최종 수정 확정' : '최종 등록 확정'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 카테고리 관리 모달 */}
          {isAddCategoryModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl border border-slate-100">
                <div className="flex items-center justify-between pb-2 border-b">
                  <h3 className="text-sm font-extrabold text-slate-900">🏷️ 일정 카테고리 관리</h3>
                  <button type="button" onClick={() => setIsAddCategoryModalOpen(false)} className="text-xs font-bold text-slate-400">✕</button>
                </div>

                <form onSubmit={handleAddCategory} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">새 카테고리 이름</label>
                    <input
                      type="text"
                      required
                      value={newCatName}
                      onChange={(e) => setNewCatName(e.target.value)}
                      placeholder="예: 병원, 약속, 여행"
                      className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl font-bold"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">태그 색상 선택</label>
                    <div className="grid grid-cols-3 gap-1.5">
                      {CATEGORY_COLOR_OPTIONS.map((c) => (
                        <button
                          type="button"
                          key={c.id}
                          onClick={() => setNewCatColor(c.class)}
                          className={`p-1.5 rounded-lg border text-[11px] font-bold ${c.class} ${
                            newCatColor === c.class ? 'ring-2 ring-indigo-500' : ''
                          }`}
                        >
                          {c.name}
                        </button>
                      ))}
                    </div>
                  </div>

                  <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl">
                    + 카테고리 추가
                  </button>
                </form>

                <div className="pt-2 border-t">
                  <span className="block text-xs font-bold text-slate-600 mb-2">현재 카테고리 목록 (삭제 가능)</span>
                  <div className="max-h-36 overflow-y-auto space-y-1.5 no-scrollbar">
                    {categories.map((cat) => (
                      <div key={cat.id} className="flex items-center justify-between p-2 rounded-xl bg-slate-50 border border-slate-200 text-xs">
                        <span className={`px-2 py-0.5 rounded border text-[11px] font-bold ${cat.color}`}>
                          {cat.name}
                        </span>
                        <button
                          type="button"
                          onClick={() => handleDeleteCategory(cat)}
                          className="text-xs text-rose-500 font-bold px-2 py-1 hover:bg-rose-50 rounded-lg transition"
                          title="삭제"
                        >
                          🗑️ 삭제
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {}
          {/* 할 일 등록/수정 모달 */}
          {isAddTodoModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-slate-100">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                  <h3 className="text-sm sm:text-base font-extrabold text-slate-900">
                    {editingTodo ? '✏️ 할 일 수정하기' : '✅ 새 할 일 등록하기'}
                  </h3>
                  <button type="button" onClick={() => setIsAddTodoModalOpen(false)} className="text-xs font-bold text-slate-400">✕</button>
                </div>

                <form onSubmit={handleCreateTodo} className="space-y-3.5">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">담당 가족 선택</label>
                    <div className="grid grid-cols-4 gap-1.5">
                      {FAMILY_MEMBERS.map((m) => (
                        <button
                          type="button"
                          key={m.id}
                          onClick={() => setTodoForm({ ...todoForm, memberId: m.id })}
                          className={`p-2 rounded-xl border text-center transition ${
                            todoForm.memberId === m.id
                              ? `${m.activeBg} font-bold ring-2 ring-indigo-400`
                              : 'bg-white border-slate-200 text-slate-700'
                          }`}
                        >
                          <div className="text-base">{m.avatar}</div>
                          <div className="text-[10px] truncate">{m.name}</div>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <label className="block text-xs font-bold text-slate-700">할 일 내용 *</label>
                      <button
                        type="button"
                        onClick={() => setIsPresetManageOpen(!isPresetManageOpen)}
                        className="text-[11px] font-bold text-indigo-600 hover:underline"
                      >
                        {isPresetManageOpen ? '닫기 ▲' : '⚙️ 문구 관리/추가 ▶'}
                      </button>
                    </div>

                    {/* 자주 쓰는 문구 관리 UI */}
                    {isPresetManageOpen && (
                      <div className="mb-2 p-2.5 bg-indigo-50/80 rounded-xl border border-indigo-200 space-y-2">
                        <div className="flex items-center space-x-1.5">
                          <input
                            type="text"
                            value={newPresetText}
                            onChange={(e) => setNewPresetText(e.target.value)}
                            placeholder="자주 쓰는 문구 입력 (예: 🎒 가방 미리 싸기)"
                            className="flex-1 px-2.5 py-1 text-xs bg-white border border-slate-200 rounded-lg"
                          />
                          <button
                            type="button"
                            onClick={() => {
                              if (newPresetText.trim()) {
                                handleAddTodoPreset(newPresetText);
                                setNewPresetText('');
                              }
                            }}
                            className="px-3 py-1 bg-indigo-600 text-white font-bold text-xs rounded-lg shrink-0"
                          >
                            + 추가
                          </button>
                        </div>
                        <div className="max-h-24 overflow-y-auto space-y-1 no-scrollbar">
                          {todoPresets.map((preset) => (
                            <div key={preset.id || preset.text} className="flex items-center justify-between text-[11px] bg-white p-1.5 rounded-lg border border-slate-200">
                              <span className="font-bold text-slate-800">{preset.text}</span>
                              <button
                                type="button"
                                onClick={() => handleDeleteTodoPreset(preset)}
                                className="text-rose-500 font-bold px-1.5 py-0.5 hover:bg-rose-50 rounded"
                                title="삭제"
                              >
                                ✕
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    <input
                      type="text"
                      required
                      value={todoForm.text}
                      onChange={(e) => setTodoForm({ ...todoForm, text: e.target.value })}
                      placeholder="예: 학교/학원 숙제 마치기, 양치질하기"
                      className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl font-bold"
                    />

                    {/* 추천 문구 칩 */}
                    <div className="flex items-center space-x-1 overflow-x-auto no-scrollbar pt-2">
                      {todoPresets.map((preset) => (
                        <button
                          key={preset.id || preset.text}
                          type="button"
                          onClick={() => setTodoForm({ ...todoForm, text: preset.text })}
                          className="px-2 py-1 rounded-lg bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 text-[11px] font-bold text-slate-600 transition shrink-0"
                        >
                          {preset.text}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="flex items-center space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsAddTodoModalOpen(false)}
                      className="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-bold text-xs"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md"
                    >
                      {editingTodo ? '수정 완료' : '등록 완료'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 칭찬 스티커 선물 모달 */}
          {isPraiseModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-slate-100">
                <div className="flex items-center justify-between pb-2 border-b border-amber-100">
                  <h3 className="text-base font-extrabold text-amber-900">🎁 칭찬 스티커 선물하기</h3>
                  <button type="button" onClick={() => setIsPraiseModalOpen(false)} className="text-xs font-bold text-slate-400">✕</button>
                </div>

                <form onSubmit={handleCreatePraise} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">칭찬받을 어린이 선택</label>
                    <div className="grid grid-cols-2 gap-2">
                      {KIDS_MEMBERS.map((kid) => (
                        <button
                          type="button"
                          key={kid.id}
                          onClick={() => setPraiseForm({ ...praiseForm, toMemberId: kid.id })}
                          className={`p-3 rounded-2xl border text-left transition flex items-center space-x-2.5 ${
                            praiseForm.toMemberId === kid.id
                              ? `${kid.cardBg} ring-2 ${kid.ringColor} font-bold`
                              : 'bg-white border-slate-200 text-slate-700'
                          }`}
                        >
                          <span className="text-2xl">{kid.avatar}</span>
                          <div>
                            <div className="text-xs font-extrabold">{kid.name}</div>
                            <div className="text-[10px] text-slate-500">{kid.role}</div>
                          </div>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">스티커 종류 선택</label>
                    <div className="grid grid-cols-5 gap-1.5">
                      {STICKER_ICONS.map((st) => (
                        <button
                          type="button"
                          key={st.key}
                          onClick={() => setPraiseForm({ ...praiseForm, stickerKey: st.key })}
                          className={`p-2 rounded-xl border text-center transition ${
                            praiseForm.stickerKey === st.key
                              ? 'bg-amber-100 border-amber-400 ring-2 ring-amber-300 font-bold scale-105'
                              : 'bg-white border-slate-200'
                          }`}
                        >
                          <div className="text-xl">{st.emoji}</div>
                          <div className="text-[9px] text-slate-600">{st.label}</div>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">칭찬 이유/메시지 (선택)</label>
                    <input
                      type="text"
                      value={praiseForm.reason}
                      onChange={(e) => setPraiseForm({ ...praiseForm, reason: e.target.value })}
                      placeholder="비워두면 기본 칭찬 문구가 적용됩니다"
                      className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl font-medium"
                    />

                    <div className="mt-2 space-y-1">
                      <span className="block text-[10px] font-bold text-slate-400">자주 쓰는 추천 칭찬 문구:</span>
                      <div className="flex items-center space-x-1 overflow-x-auto no-scrollbar py-1">
                        {PRESET_PRAISE_MESSAGES.map((msg, idx) => (
                          <button
                            key={idx}
                            type="button"
                            onClick={() => setPraiseForm({ ...praiseForm, reason: msg })}
                            className="px-2 py-1 bg-amber-50 hover:bg-amber-100 text-amber-900 text-[10px] font-bold rounded-lg shrink-0 border border-amber-200"
                          >
                            {msg}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="flex items-center space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsPraiseModalOpen(false)}
                      className="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-bold text-xs"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs shadow-md"
                    >
                      칭찬 스티커 선물하기 🎁
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 스티커 전체 리셋 확인 모달 */}
          {isResetPraiseConfirmOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-xs">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 text-center space-y-4 border border-slate-100 shadow-2xl">
                <div className="text-3xl">🧹</div>
                <h3 className="text-base font-extrabold text-slate-900">칭찬 스티커를 전부 리셋할까요?</h3>
                <p className="text-xs text-slate-500 leading-relaxed">
                  주원이와 주아가 받은 칭찬 스티커 기록이 초기화됩니다. 이 작업은 취소할 수 없습니다.
                </p>

                <div className="flex items-center space-x-2 pt-2">
                  <button
                    type="button"
                    onClick={() => setIsResetPraiseConfirmOpen(false)}
                    className="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-bold text-xs"
                  >
                    취소
                  </button>
                  <button
                    type="button"
                    onClick={handleResetAllPraise}
                    className="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-md"
                  >
                    리셋 실행
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 알림 토스트 */}
          {toastMessage && (
            <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 text-white px-4 py-2.5 rounded-2xl shadow-xl text-xs font-bold border border-slate-700 animate-in slide-in-from-bottom duration-300">
              {toastMessage}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
