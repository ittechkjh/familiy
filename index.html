<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리집 커넥트 - 실시간 가족 일정 공유</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase App & Firestore SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    /* 모바일 스크롤바 숨김 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 selection:bg-indigo-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- 가족 멤버 프로필 정의 ---
    const FAMILY_MEMBERS = [
      {
        id: 'dad',
        name: '아빠',
        role: '아빠',
        avatar: '👨‍💼',
        badgeBg: 'bg-blue-100 text-blue-800 border-blue-300',
        activeBg: 'bg-blue-600 text-white shadow-blue-200',
        cardBg: 'bg-blue-50/90 border-blue-200/80',
        barColor: 'bg-blue-500',
        borderColor: 'border-blue-400',
        ringColor: 'ring-blue-400'
      },
      {
        id: 'mom',
        name: '엄마',
        role: '엄마',
        avatar: '👩‍💼',
        badgeBg: 'bg-rose-100 text-rose-800 border-rose-300',
        activeBg: 'bg-rose-500 text-white shadow-rose-200',
        cardBg: 'bg-rose-50/90 border-rose-200/80',
        barColor: 'bg-rose-500',
        borderColor: 'border-rose-400',
        ringColor: 'ring-rose-400'
      },
      {
        id: 'child1',
        name: '김주원',
        role: '첫째',
        avatar: '👦',
        badgeBg: 'bg-emerald-100 text-emerald-800 border-emerald-300',
        activeBg: 'bg-emerald-600 text-white shadow-emerald-200',
        cardBg: 'bg-emerald-50/90 border-emerald-200/80',
        barColor: 'bg-emerald-500',
        borderColor: 'border-emerald-400',
        ringColor: 'ring-emerald-400'
      },
      {
        id: 'child2',
        name: '김주아',
        role: '둘째',
        avatar: '👧',
        badgeBg: 'bg-amber-100 text-amber-800 border-amber-300',
        activeBg: 'bg-amber-500 text-white shadow-amber-200',
        cardBg: 'bg-amber-50/90 border-amber-200/80',
        barColor: 'bg-amber-500',
        borderColor: 'border-amber-400',
        ringColor: 'ring-amber-400'
      }
    ];

    // 모바일 원터치 빠른 상태 프리셋
    const QUICK_STATUS_PRESETS = [
      { text: '🏫 학원 도착했어요!', emoji: '🏫' },
      { text: '🚗 집으로 출발해요~', emoji: '🚗' },
      { text: '📚 열공하는 중!', emoji: '🚀' },
      { text: '🏠 집에 잘 도착했어요!', emoji: '🏠' },
      { text: '🍱 밥 먹고 있어요', emoji: '🍱' },
      { text: '😴 잠깐 쉬는 중이에요', emoji: '😴' }
    ];

    const CATEGORIES = [
      { id: 'school', name: '학교/학원', color: 'bg-indigo-50 text-indigo-700 border-indigo-200' },
      { id: 'study', name: '숙제/공부', color: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
      { id: 'activity', name: '운동/취미', color: 'bg-orange-50 text-orange-700 border-orange-200' },
      { id: 'work', name: '업무/외근', color: 'bg-blue-50 text-blue-700 border-blue-200' },
      { id: 'home', name: '집안일/돌봄', color: 'bg-pink-50 text-pink-700 border-pink-200' },
      { id: 'family', name: '가족 모임/식사', color: 'bg-purple-50 text-purple-700 border-purple-200' }
    ];

    const STICKER_ICONS = [
      { key: 'thumb', emoji: '👍', label: '최고야' },
      { key: 'heart', emoji: '❤️', label: '사랑해' },
      { key: 'star', emoji: '🌟', label: '대단해' },
      { key: 'clap', emoji: '👏', label: '멋져요' },
      { key: 'fire', emoji: '🔥', label: '파이팅' }
    ];

    const getTodayString = () => {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const formatRelativeTime = (timestamp) => {
      if (!timestamp) return '미등록';
      const diffMinutes = Math.floor((Date.now() - timestamp) / 60000);
      if (diffMinutes < 1) return '방금 전';
      if (diffMinutes < 60) return `${diffMinutes}분 전`;
      const diffHours = Math.floor(diffMinutes / 60);
      if (diffHours < 24) return `${diffHours}시간 전`;
      return new Date(timestamp).toLocaleDateString([], { month: 'numeric', day: 'numeric' });
    };

    function App() {
      const [currentMemberId, setCurrentMemberId] = useState('child1'); // 기본: 김주원
      const [selectedDate, setSelectedDate] = useState(getTodayString());
      const [viewMode, setViewMode] = useState('today');
      const [filterMemberId, setFilterMemberId] = useState('all');

      // 로컬 스토리지 연동 (기본 즉시 동기화)
      const [schedules, setSchedules] = useState(() => {
        const saved = localStorage.getItem('family_schedules_v1');
        if (saved) return JSON.parse(saved);
        return [
          { id: '1', title: '영어 학원 (리딩 & 스피킹)', memberId: 'child1', date: getTodayString(), startTime: '15:30', endTime: '17:00', category: 'school', status: 'in_progress', notes: '교재 42쪽 챙기기', stickers: { fire: 2, thumb: 1 } },
          { id: '2', title: '수학 문제집 3장 풀기', memberId: 'child1', date: getTodayString(), startTime: '17:30', endTime: '18:30', category: 'study', status: 'pending', notes: '분수의 덧셈 복습', stickers: {} },
          { id: '3', title: '피아노 학원 레슨', memberId: 'child2', date: getTodayString(), startTime: '14:30', endTime: '15:30', category: 'school', status: 'completed', notes: '바이엘 4권 완주!', stickers: { clap: 3, star: 2 } },
          { id: '4', title: '태권도 수련 & 줄넘기', memberId: 'child2', date: getTodayString(), startTime: '16:00', endTime: '17:00', category: 'activity', status: 'in_progress', notes: '도복 챙기기', stickers: { thumb: 1 } },
          { id: '5', title: '퇴근 후 주원/주아 픽업', memberId: 'dad', date: getTodayString(), startTime: '18:10', endTime: '18:40', category: 'family', status: 'pending', notes: '학원 앞에서 만나기', stickers: { heart: 2 } },
          { id: '6', title: '온 가족 저녁 식사 & 대화', memberId: 'mom', date: getTodayString(), startTime: '19:00', endTime: '20:00', category: 'family', status: 'pending', notes: '맛있는 찌개 준비하기', stickers: { heart: 3 } }
        ];
      });

      const [statusMessages, setStatusMessages] = useState(() => {
        const saved = localStorage.getItem('family_status_msgs_v1');
        if (saved) return JSON.parse(saved);
        return {
          child1: { text: '영어 학원 수업 열심히 듣는 중이에요! 📚', emoji: '🏫', updatedAt: Date.now() },
          child2: { text: '피아노 잘 치고 태권도장 왔어요! 🥋', emoji: '🚀', updatedAt: Date.now() - 1000 * 60 * 15 },
          dad: { text: '업무 마무리 중! 6시에 픽업 출발해요 🚗', emoji: '🚗', updatedAt: Date.now() - 1000 * 60 * 30 },
          mom: { text: '맛있는 저녁 준비해두고 기다릴게요 💕', emoji: '🏠', updatedAt: Date.now() - 1000 * 60 * 45 }
        };
      });

      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [isShareModalOpen, setIsShareModalOpen] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      const [newSchedule, setNewSchedule] = useState({
        title: '',
        memberId: 'child1',
        date: getTodayString(),
        startTime: '16:00',
        endTime: '17:00',
        category: 'school',
        notes: ''
      });

      const [myStatusInput, setMyStatusInput] = useState('');
      const [myEmoji, setMyEmoji] = useState('😊');

      useEffect(() => {
        localStorage.setItem('family_schedules_v1', JSON.stringify(schedules));
      }, [schedules]);

      useEffect(() => {
        localStorage.setItem('family_status_msgs_v1', JSON.stringify(statusMessages));
      }, [statusMessages]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      const currentMember = useMemo(() => {
        return FAMILY_MEMBERS.find(m => m.id === currentMemberId) || FAMILY_MEMBERS[0];
      }, [currentMemberId]);

      const handleStatusChange = (id, newStatus) => {
        setSchedules(prev => prev.map(s => s.id === id ? { ...s, status: newStatus } : s));
        const label = newStatus === 'completed' ? '완료 🎉' : newStatus === 'in_progress' ? '진행 중 🚀' : '대기 중 ⏳';
        showToast(`일정이 [${label}] 상태로 변경되었습니다.`);
      };

      const handleDeleteSchedule = (id) => {
        setSchedules(prev => prev.filter(s => s.id !== id));
        showToast("일정이 삭제되었습니다.");
      };

      const handleCreateSchedule = (e) => {
        e.preventDefault();
        if (!newSchedule.title.trim()) return;
        const newItem = {
          ...newSchedule,
          id: String(Date.now()),
          status: 'pending',
          stickers: {},
          createdAt: Date.now()
        };
        setSchedules(prev => [...prev, newItem]);
        setIsAddModalOpen(false);
        setNewSchedule({ title: '', memberId: currentMemberId, date: selectedDate, startTime: '16:00', endTime: '17:00', category: 'school', notes: '' });
        showToast("새 일정이 등록되었습니다! ✨");
      };

      const handleSendSticker = (scheduleId, stickerKey) => {
        setSchedules(prev => prev.map(item => {
          if (item.id === scheduleId) {
            const count = (item.stickers && item.stickers[stickerKey]) || 0;
            return {
              ...item,
              stickers: { ...item.stickers, [stickerKey]: count + 1 },
              lastCheeredBy: currentMember.name
            };
          }
          return item;
        }));
        showToast(`${currentMember.name}님이 응원 스티커를 보냈습니다! 💖`);
      };

      const sendStatusMessage = (text, emoji = '😊') => {
        if (!text.trim()) return;
        setStatusMessages(prev => ({
          ...prev,
          [currentMember.id]: {
            text: text.trim(),
            emoji: emoji,
            updatedAt: Date.now()
          }
        }));
        setMyStatusInput('');
        showToast(`${currentMember.name}님의 실시간 현황이 공유되었습니다! 📢`);
      };

      const filteredSchedules = useMemo(() => {
        return schedules
          .filter(item => {
            const matchDate = item.date === selectedDate;
            const matchMember = filterMemberId === 'all' || item.memberId === filterMemberId;
            return matchDate && matchMember;
          })
          .sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));
      }, [schedules, selectedDate, filterMemberId]);

      const weekDays = useMemo(() => {
        const curr = new Date(selectedDate);
        const day = curr.getDay();
        const sunday = new Date(curr);
        sunday.setDate(curr.getDate() - day);

        const days = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(sunday);
          d.setDate(sunday.getDate() + i);
          const dateStr = d.toISOString().split('T')[0];
          const dayName = ['일', '월', '화', '수', '목', '금', '토'][i];
          days.push({ dateStr, dayName, dayNumber: d.getDate(), isToday: dateStr === getTodayString() });
        }
        return days;
      }, [selectedDate]);

      const stats = useMemo(() => {
        const todayItems = schedules.filter(s => s.date === selectedDate);
        const total = todayItems.length;
        const completed = todayItems.filter(s => s.status === 'completed').length;
        const inProgress = todayItems.filter(s => s.status === 'in_progress').length;
        const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

        const memberStats = FAMILY_MEMBERS.map(m => {
          const mItems = todayItems.filter(s => s.memberId === m.id);
          const mTotal = mItems.length;
          const mCompleted = mItems.filter(s => s.status === 'completed').length;
          const mPercentage = mTotal > 0 ? Math.round((mCompleted / mTotal) * 100) : 0;
          return { ...m, total: mTotal, completed: mCompleted, percentage: mPercentage };
        });

        return { total, completed, inProgress, percentage, memberStats };
      }, [schedules, selectedDate]);

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 flex flex-col font-sans pb-16 antialiased">
          {/* 🏡 상단 헤더 */}
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
            <div className="max-w-5xl mx-auto px-3.5 sm:px-4 py-2.5 sm:py-3 flex items-center justify-between">
              <div className="flex items-center space-x-2.5">
                <div className="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white text-lg sm:text-xl shadow-md shrink-0">
                  🏡
                </div>
                <div>
                  <div className="flex items-center space-x-1.5">
                    <h1 className="text-base sm:text-lg font-bold text-slate-900 tracking-tight">우리집 커넥트</h1>
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse mr-1"></span>
                      정상 작동 중
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-500">주원·주아·아빠·엄마의 오늘 일정</p>
                </div>
              </div>

              <div className="flex items-center space-x-1.5 sm:space-x-2">
                <button
                  onClick={() => setIsShareModalOpen(true)}
                  className="px-2.5 py-1.5 text-xs font-bold rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition"
                >
                  📱 기기 연결
                </button>
                <button
                  onClick={() => {
                    setNewSchedule(prev => ({ ...prev, memberId: currentMemberId, date: selectedDate }));
                    setIsAddModalOpen(true);
                  }}
                  className="px-3 py-1.5 text-xs font-bold rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-md transition active:scale-95"
                >
                  + 일정 추가
                </button>
              </div>
            </div>

            {/* 👤 현재 내 프로필 선택 */}
            <div className="bg-slate-100/80 border-t border-slate-200/60 px-3.5 py-1.5">
              <div className="max-w-5xl mx-auto flex items-center justify-between overflow-x-auto no-scrollbar gap-2">
                <span className="text-[11px] font-bold text-slate-500 shrink-0">현재 프로필:</span>
                <div className="flex items-center space-x-1.5 overflow-x-auto py-0.5">
                  {FAMILY_MEMBERS.map((m) => {
                    const isSelected = currentMemberId === m.id;
                    return (
                      <button
                        key={m.id}
                        onClick={() => {
                          setCurrentMemberId(m.id);
                          showToast(`${m.name} 프로필로 전환되었습니다.`);
                        }}
                        className={`px-2.5 py-1 rounded-xl text-xs font-bold transition flex items-center space-x-1 shrink-0 ${
                          isSelected
                            ? `${m.activeBg} ring-2 ring-offset-1 ring-slate-400/40 shadow-sm`
                            : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'
                        }`}
                      >
                        <span>{m.avatar}</span>
                        <span>{m.name}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          </header>

          {/* 🌟 메인 컨텐츠 영역 */}
          <main className="max-w-5xl mx-auto px-3.5 sm:px-4 py-4 sm:py-5 w-full space-y-4 sm:space-y-6 flex-1">
            
            {/* 📢 가족 실시간 현황 보드 */}
            <section className="bg-white rounded-2xl p-3.5 sm:p-5 border border-slate-200 shadow-sm">
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center space-x-2">
                  <span className="text-base">📢</span>
                  <h2 className="text-sm sm:text-base font-extrabold text-slate-900">가족 실시간 한 줄 현황</h2>
                </div>
                <span className="text-[11px] font-medium text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">
                  실시간 연동
                </span>
              </div>

              {/* 2×2 모바일 / 4열 PC 말풍선 그리드 */}
              <div className="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-2 sm:gap-3">
                {FAMILY_MEMBERS.map((m) => {
                  const msgData = statusMessages[m.id];
                  const isMe = currentMemberId === m.id;
                  return (
                    <div
                      key={m.id}
                      className={`p-2.5 sm:p-3 rounded-2xl border transition-all flex flex-col justify-between ${
                        isMe ? `${m.cardBg} ring-2 ${m.ringColor} shadow-xs` : 'bg-slate-50/70 border-slate-200'
                      }`}
                    >
                      <div className="flex items-center justify-between mb-1.5">
                        <div className="flex items-center space-x-1">
                          <span className="text-base">{m.avatar}</span>
                          <span className="text-xs font-bold text-slate-800">{m.name}</span>
                          {isMe && <span className="text-[9px] bg-slate-900 text-white px-1 py-0.2 rounded font-bold">나</span>}
                        </div>
                        <span className="text-[10px] text-slate-400">
                          {msgData?.updatedAt ? formatRelativeTime(msgData.updatedAt) : '미등록'}
                        </span>
                      </div>
                      <div className="bg-white rounded-xl p-2 border border-slate-200/60 min-h-[46px] flex items-center">
                        <span className="text-xs font-semibold text-slate-800 line-clamp-2">
                          {msgData?.text || '상태 메시지를 남겨주세요!'}
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* ⚡ 원터치 빠른 상태 칩 */}
              <div className="mt-3 pt-3 border-t border-slate-100">
                <div className="flex items-center justify-between mb-1.5">
                  <span className="text-[11px] font-bold text-slate-600">
                    ⚡ {currentMember.avatar} {currentMember.name}의 빠른 상태 전송:
                  </span>
                  <span className="text-[10px] text-slate-400">터치 시 즉시 변경</span>
                </div>
                <div className="flex items-center space-x-1.5 overflow-x-auto no-scrollbar py-1">
                  {QUICK_STATUS_PRESETS.map((preset, idx) => (
                    <button
                      key={idx}
                      onClick={() => sendStatusMessage(preset.text, preset.emoji)}
                      className="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-indigo-50 border border-slate-200 text-xs font-bold text-slate-700 transition active:scale-95 shrink-0"
                    >
                      {preset.text}
                    </button>
                  ))}
                </div>
              </div>

              {/* ✍️ 직접 텍스트 입력 */}
              <form onSubmit={(e) => { e.preventDefault(); sendStatusMessage(myStatusInput, myEmoji); }} className="mt-2 flex items-center space-x-1.5">
                <input
                  type="text"
                  value={myStatusInput}
                  onChange={(e) => setMyStatusInput(e.target.value)}
                  placeholder="직접 입력: 예) 10분 뒤에 도착해요~"
                  className="flex-1 text-xs sm:text-sm px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white"
                />
                <button
                  type="submit"
                  className="px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold shrink-0 transition"
                >
                  공유
                </button>
              </form>
            </section>

            {/* 📊 오늘 달성률 Dashboard */}
            <section className="bg-gradient-to-br from-indigo-950 via-slate-900 to-purple-950 text-white rounded-3xl p-4 sm:p-6 shadow-xl">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-white/10">
                <div className="flex items-center space-x-2">
                  <button
                    onClick={() => {
                      const d = new Date(selectedDate);
                      d.setDate(d.getDate() - 1);
                      setSelectedDate(d.toISOString().split('T')[0]);
                    }}
                    className="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 transition"
                  >
                    ◀
                  </button>
                  <span className="text-sm sm:text-base font-extrabold">
                    {selectedDate} ({new Date(selectedDate).toLocaleDateString('ko-KR', { weekday: 'short' })})
                  </span>
                  <button
                    onClick={() => {
                      const d = new Date(selectedDate);
                      d.setDate(d.getDate() + 1);
                      setSelectedDate(d.toISOString().split('T')[0]);
                    }}
                    className="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 transition"
                  >
                    ▶
                  </button>
                </div>

                <div className="flex items-center space-x-3">
                  <span className="text-xs text-indigo-200">가족 전체 달성률</span>
                  <span className="text-xl font-black text-emerald-400">{stats.percentage}%</span>
                  <span className="text-xs text-slate-300">({stats.completed}/{stats.total})</span>
                </div>
              </div>

              <div className="mt-3">
                <div className="w-full bg-white/10 h-2.5 rounded-full overflow-hidden p-0.5">
                  <div
                    className="bg-gradient-to-r from-indigo-400 via-emerald-400 to-teal-300 h-full rounded-full transition-all duration-500"
                    style={{ width: `${stats.percentage}%` }}
                  ></div>
                </div>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-3 pt-3 border-t border-white/10">
                {stats.memberStats.map((m) => (
                  <div key={m.id} className="bg-white/5 rounded-xl p-2 border border-white/10">
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-xs font-bold text-slate-200">{m.avatar} {m.name}</span>
                      <span className="text-xs font-extrabold text-indigo-300">{m.percentage}%</span>
                    </div>
                    <div className="w-full bg-white/10 h-1.5 rounded-full overflow-hidden">
                      <div className={`${m.barColor} h-full rounded-full`} style={{ width: `${m.percentage}%` }}></div>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* 📋 일정 목록 및 상태 토글 */}
            <section className="space-y-3">
              <div className="flex items-center space-x-1.5 overflow-x-auto no-scrollbar pb-0.5">
                <button
                  onClick={() => setFilterMemberId('all')}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition shrink-0 ${
                    filterMemberId === 'all' ? 'bg-slate-900 text-white' : 'bg-white text-slate-600 border border-slate-200'
                  }`}
                >
                  👨‍👩‍👧‍👦 전체 ({schedules.filter(s => s.date === selectedDate).length})
                </button>
                {FAMILY_MEMBERS.map((m) => (
                  <button
                    key={m.id}
                    onClick={() => setFilterMemberId(m.id)}
                    className={`px-2.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1 shrink-0 ${
                      filterMemberId === m.id ? m.activeBg : 'bg-white text-slate-600 border border-slate-200'
                    }`}
                  >
                    <span>{m.avatar}</span>
                    <span>{m.name}</span>
                  </button>
                ))}
              </div>

              {filteredSchedules.length === 0 ? (
                <div className="bg-white rounded-2xl p-8 text-center border border-dashed border-slate-300 space-y-2">
                  <div className="text-2xl">🎈</div>
                  <p className="text-xs text-slate-500 font-bold">등록된 일정이 없습니다.</p>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {filteredSchedules.map((item) => {
                    const member = FAMILY_MEMBERS.find(m => m.id === item.memberId) || FAMILY_MEMBERS[0];
                    const category = CATEGORIES.find(c => c.id === item.category) || CATEGORIES[0];
                    const isCompleted = item.status === 'completed';
                    const isInProgress = item.status === 'in_progress';
                    const isPending = item.status === 'pending' || !item.status;

                    return (
                      <div
                        key={item.id}
                        className={`bg-white rounded-2xl p-3.5 sm:p-4 border shadow-sm flex flex-col justify-between ${
                          isCompleted ? 'bg-slate-50/70 opacity-90' : isInProgress ? 'border-indigo-300 ring-2 ring-indigo-500/10' : 'border-slate-200'
                        }`}
                      >
                        <div>
                          <div className="flex items-center justify-between mb-1.5">
                            <div className="flex items-center space-x-1.5">
                              <span className={`px-2 py-0.5 rounded-full text-xs font-bold border ${member.badgeBg}`}>
                                {member.avatar} {member.name}
                              </span>
                              <span className={`px-2 py-0.5 rounded-md text-[10px] font-semibold border ${category.color}`}>
                                {category.name}
                              </span>
                            </div>
                            <span className="text-xs font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-lg">
                              ⏰ {item.startTime} ~ {item.endTime}
                            </span>
                          </div>

                          <h3 className={`text-sm sm:text-base font-bold my-1.5 ${isCompleted ? 'text-slate-400 line-through' : 'text-slate-900'}`}>
                            {item.title}
                          </h3>
                          {item.notes && (
                            <p className="text-xs text-slate-500 bg-slate-50 p-1.5 rounded-lg border border-slate-100">
                              💬 {item.notes}
                            </p>
                          )}
                        </div>

                        <div className="mt-3 pt-2.5 border-t border-slate-100 space-y-2">
                          <div className="flex items-center justify-between gap-1">
                            <div className="flex items-center bg-slate-100 p-0.5 rounded-xl border border-slate-200">
                              <button
                                onClick={() => handleStatusChange(item.id, 'pending')}
                                className={`px-2 py-1 rounded-lg text-xs font-bold ${isPending ? 'bg-white text-slate-800 shadow-xs' : 'text-slate-500'}`}
                              >
                                대기
                              </button>
                              <button
                                onClick={() => handleStatusChange(item.id, 'in_progress')}
                                className={`px-2 py-1 rounded-lg text-xs font-bold ${isInProgress ? 'bg-indigo-600 text-white' : 'text-slate-500'}`}
                              >
                                진행 중
                              </button>
                              <button
                                onClick={() => handleStatusChange(item.id, 'completed')}
                                className={`px-2 py-1 rounded-lg text-xs font-bold ${isCompleted ? 'bg-emerald-600 text-white' : 'text-slate-500'}`}
                              >
                                완료
                              </button>
                            </div>
                            <button
                              onClick={() => handleDeleteSchedule(item.id)}
                              className="text-slate-400 hover:text-rose-600 p-1 text-xs"
                            >
                              삭제
                            </button>
                          </div>

                          {/* 칭찬 스티커 */}
                          <div className="flex items-center justify-between pt-0.5">
                            <div className="flex items-center space-x-1">
                              {STICKER_ICONS.map((st) => {
                                const count = item.stickers?.[st.key] || 0;
                                return (
                                  <button
                                    key={st.key}
                                    onClick={() => handleSendSticker(item.id, st.key)}
                                    className={`px-1.5 py-0.5 rounded-full text-xs border ${count > 0 ? 'bg-amber-50 border-amber-200 text-amber-900 font-bold' : 'bg-white text-slate-500'}`}
                                  >
                                    {st.emoji} {count > 0 && count}
                                  </button>
                                );
                              })}
                            </div>
                            {item.lastCheeredBy && (
                              <span className="text-[10px] text-slate-400 italic">
                                {item.lastCheeredBy} 응원
                              </span>
                            )}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </section>
          </main>

          {/* ➕ 새 일정 모달 */}
          {isAddModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3.5 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl space-y-3">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                  <h3 className="text-base font-bold">새 일정 등록</h3>
                  <button onClick={() => setIsAddModalOpen(false)} className="w-7 h-7 rounded-full bg-slate-100 text-xs font-bold">✕</button>
                </div>
                <form onSubmit={handleCreateSchedule} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold mb-1">담당 가족</label>
                    <div className="grid grid-cols-4 gap-1.5">
                      {FAMILY_MEMBERS.map((m) => (
                        <button
                          type="button"
                          key={m.id}
                          onClick={() => setNewSchedule({ ...newSchedule, memberId: m.id })}
                          className={`p-1.5 rounded-xl border text-center ${newSchedule.memberId === m.id ? m.activeBg : 'bg-white'}`}
                        >
                          <div className="text-lg">{m.avatar}</div>
                          <div>{m.name}</div>
                        </button>
                      ))}
                    </div>
                  </div>
                  <div>
                    <label className="block font-bold mb-1">일정 제목 *</label>
                    <input
                      type="text"
                      required
                      value={newSchedule.title}
                      onChange={(e) => setNewSchedule({ ...newSchedule, title: e.target.value })}
                      placeholder="예: 영어 학원, 태권도 레슨"
                      className="w-full px-3 py-2 bg-slate-50 border rounded-xl"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold mb-1">시작 시간</label>
                      <input
                        type="time"
                        value={newSchedule.startTime}
                        onChange={(e) => setNewSchedule({ ...newSchedule, startTime: e.target.value })}
                        className="w-full px-2 py-1.5 bg-slate-50 border rounded-xl"
                      />
                    </div>
                    <div>
                      <label className="block font-bold mb-1">종료 시간</label>
                      <input
                        type="time"
                        value={newSchedule.endTime}
                        onChange={(e) => setNewSchedule({ ...newSchedule, endTime: e.target.value })}
                        className="w-full px-2 py-1.5 bg-slate-50 border rounded-xl"
                      />
                    </div>
                  </div>
                  <div className="pt-2 flex items-center space-x-2">
                    <button type="button" onClick={() => setIsAddModalOpen(false)} className="flex-1 py-2 rounded-xl border font-bold">취소</button>
                    <button type="submit" className="flex-1 py-2 rounded-xl bg-indigo-600 text-white font-bold">등록</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 📲 기기 연결 모달 */}
          {isShareModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3.5 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl space-y-3">
                <h3 className="text-base font-bold">가족 스마트폰 연동</h3>
                <p className="text-xs text-slate-600 leading-relaxed">
                  스마트폰 브라우저에서 이 페이지 주소(<code>{window.location.href}</code>)로 접속 후, <b>[홈 화면에 추가]</b>를 누르면 일반 앱처럼 홈 화면 아이콘으로 편하게 사용하실 수 있습니다.
                </p>
                <button onClick={() => setIsShareModalOpen(false)} className="w-full py-2 rounded-xl bg-slate-900 text-white font-bold text-xs">
                  닫기
                </button>
              </div>
            </div>
          )}

          {/* 🔔 알림 토스트 */}
          {toastMessage && (
            <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-3.5 py-2 rounded-2xl text-xs font-bold shadow-xl">
              ✨ {toastMessage}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
