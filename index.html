      { keywords: ['알펜시아'], lat: 37.6548, lng: 128.6720, label: '알펜시아 리조트' },
      { keywords: ['대관령양떼목장', '양떼목장'], lat: 37.6888, lng: 128.7513, label: '대관령양떼목장' },
      { keywords: ['안목해변', '강릉커피거리'], lat: 37.7719, lng: 128.9483, label: '강릉 안목해변' },
      { keywords: ['경포대', '경포해변', '경포호'], lat: 37.8055, lng: 128.9079, label: '강릉 경포해변' },
      { keywords: ['강릉중앙시장'], lat: 37.7540, lng: 128.8985, label: '강릉 중앙시장' },
      { keywords: ['아르떼뮤지엄 강릉'], lat: 37.7941, lng: 128.8943, label: '아르떼뮤지엄 강릉' },
      { keywords: ['속초해수욕장', '속초아이'], lat: 37.1942, lng: 128.6045, label: '속초해수욕장' },
      { keywords: ['속초관광수산시장', '속초중앙시장'], lat: 37.2046, lng: 128.5902, label: '속초관광수산시장' },
      { keywords: ['영금정'], lat: 37.2117, lng: 128.5989, label: '속초 영금정' },
      { keywords: ['설악산', '신흥사'], lat: 37.1742, lng: 128.4900, label: '설악산국립공원' },
      { keywords: ['신화월드', '제주신화월드'], lat: 33.3073, lng: 126.3175, label: '제주신화월드' },
      { keywords: ['성산일출봉'], lat: 33.4586, lng: 126.9427, label: '성산일출봉' },
      { keywords: ['협재해수욕장', '협재'], lat: 33.3941, lng: 126.2397, label: '협재해변' },
      { keywords: ['함덕해수욕장', '함덕'], lat: 33.5434, lng: 126.6692, label: '함덕해변' },
      { keywords: ['제주공항', '제주국제공항'], lat: 33.5066, lng: 126.4930, label: '제주국제공항' },
      { keywords: ['서울역'], lat: 37.5559, lng: 126.9723, label: '서울역' },
      { keywords: ['광화문'], lat: 37.5759, lng: 126.9768, label: '광화문' },
      { keywords: ['에버랜드'], lat: 37.2933, lng: 127.2025, label: '에버랜드' },
      { keywords: ['롯데월드'], lat: 37.5111, lng: 127.0982, label: '롯데월드' }
    ];

    // 주소 또는 장소 텍스트로 위도/경도를 찾는 함수 (오프라인/온라인 하이브리드 지오코딩)
    async function searchLocationCoordinates(query) {
      if (!query || typeof query !== 'string') return null;
      const clean = query.trim();
      if (!clean) return null;

      // 1. 사전 등록 랜드마크 우선 매칭 (초고속, 오프라인 즉시 보정)
      for (const item of KOREA_LANDMARKS) {
        if (item.keywords.some(k => clean.includes(k) || k.includes(clean))) {
          return { lat: item.lat, lng: item.lng, name: item.label, source: 'preset' };
        }
      }

      // 2. 오픈 지오코더(Nominatim) 비동기 호출 (CORS 허용)
      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=kr&limit=1&q=${encodeURIComponent(clean)}`;
        const resp = await fetch(url, { headers: { 'Accept-Language': 'ko,en' } });
        if (resp.ok) {
          const list = await resp.json();
          if (Array.isArray(list) && list.length > 0) {
            const first = list[0];
            return {
              lat: parseFloat(first.lat),
              lng: parseFloat(first.lon),
              name: first.display_name,
              source: 'api'
            };
          }
        }
      } catch (err) {
        console.warn('Geocoding API network check skipped:', err);
      }

      // 3. 지역명 기반 대표 좌표 폴백
      if (clean.includes('소금산') || clean.includes('원주') || clean.includes('지정면') || clean.includes('간현') || clean.includes('문막')) {
        return { lat: 37.3653, lng: 127.8288, name: '원주시 일대 (소금산)', source: 'region_fallback' };
      }
      if (clean.includes('성남') || clean.includes('중원') || clean.includes('분당')) {
        return { lat: 37.4326, lng: 127.1408, name: '성남시 일대', source: 'region_fallback' };
      }
      if (clean.includes('봉평')) {
        return { lat: 37.6033, lng: 128.3811, name: '평창 봉평면 일대', source: 'region_fallback' };
      }
      if (clean.includes('평창')) {
        return { lat: 37.3707, lng: 128.3902, name: '평창군 일대', source: 'region_fallback' };
      }
      if (clean.includes('강릉') || clean.includes('경포')) {
        return { lat: 37.7518, lng: 128.8760, name: '강릉 일대', source: 'region_fallback' };
      }
      if (clean.includes('속초')) {
        return { lat: 37.2046, lng: 128.5902, name: '속초 일대', source: 'region_fallback' };
      }
      if (clean.includes('제주') || clean.includes('서귀포')) {
        return { lat: 33.38, lng: 126.55, name: '제주도 일대', source: 'region_fallback' };
      }
      if (clean.includes('부산') || clean.includes('해운대')) {
        return { lat: 35.1795, lng: 129.0756, name: '부산 일대', source: 'region_fallback' };
      }

      return null;
    }

    // 거리 및 예상 소요 시간 계산 함수 (Haversine + 한국 실제 도로 주행 굴곡 계수 1.28배 반영)
    function calculateDistanceAndTime(lat1, lng1, lat2, lng2) {
      if (!lat1 || !lng1 || !lat2 || !lng2) return null;
      const nLat1 = parseFloat(lat1);
      const nLng1 = parseFloat(lng1);
      const nLat2 = parseFloat(lat2);
      const nLng2 = parseFloat(lng2);
      if (isNaN(nLat1) || isNaN(nLng1) || isNaN(nLat2) || isNaN(nLng2)) return null;

      const toRad = deg => (deg * Math.PI) / 180;
      const dLat = toRad(nLat2 - nLat1);
      const dLng = toRad(nLng2 - nLng1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(nLat1)) * Math.cos(toRad(nLat2)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      const straightKm = 6371 * c;

      // 한국 도로 특성 반영: 직선거리 대비 실제 도로 굴곡 계수 약 1.28배
      const roadKm = Math.round(straightKm * 1.28 * 10) / 10;

      // 주행 속도 모델링 (고속화도로 65km/h, 국도 45km/h, 시내 28km/h)
      let speedKmH = 28;
      if (roadKm > 50) {
        speedKmH = 65;
      } else if (roadKm >= 15) {
        speedKmH = 45;
      }

      const totalMinutes = Math.max(3, Math.round((roadKm / speedKmH) * 60));
      const hours = Math.floor(totalMinutes / 60);
      const mins = totalMinutes % 60;

      let timeStr = '';
      if (hours > 0) {
        timeStr = `${hours}시간 ${mins > 0 ? mins + '분' : ''}`.trim();
      } else {
        timeStr = `${mins}분`;
      }

      const distStr = roadKm >= 1 ? `${roadKm.toFixed(1)}km` : `${Math.round(roadKm * 1000)}m`;

      return {
        roadKm,
        totalMinutes,
        distStr,
        timeStr,
        summary: `${distStr} • 약 ${timeStr}`
      };
    }

    // ==================== 신규: 가족 여행 동선 지도 컴포넌트 (모던 타일 + 네이버 지도 연동) ====================
    function TravelMapView({ items = [], selectedDay = 'all', tripTitle = '가족 여행' }) {
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);

      // 지도에 표시할 유효한 좌표를 가진 일정 필터링 및 미세 보정
      const validPoints = useMemo(() => {
        return items.filter(item => {
          if (selectedDay !== 'all' && Number(item.day) !== Number(selectedDay)) return false;
          return typeof item.lat === 'number' && typeof item.lng === 'number' && !isNaN(item.lat) && !isNaN(item.lng);
        }).map(item => {
          const addr = (item.address || item.placeName || item.title || '');
          // 1. 소금산그랜드밸리 / 원주 권역 오인식(서울 37.56 또는 미등록) 자동 정밀 교정
          if ((addr.includes('소금산') || addr.includes('간현') || addr.includes('원주') || addr.includes('지정로')) &&
              (item.lat === 37.56 || item.lat === 37.5815 || Math.abs(item.lat - 37.3653) > 0.1)) {
            return { ...item, lat: 37.3653, lng: 127.8288 };
          }
          // 2. 미가연 / 봉평메밀 오인식 자동 교정
          if ((addr.includes('미가연') || addr.includes('봉평메밀')) && (item.lat === 37.5815 || item.lat === 37.56)) {
            return { ...item, lat: 37.60155, lng: 128.39344 };
          }
          return item;
        });
      }, [items, selectedDay]);

      // 전체 코스를 네이버/카카오 지도로 열기 위한 대표 검색어 및 출발-도착 길찾기 링크 생성
      const navigationUrls = useMemo(() => {
        if (validPoints.length === 0) {
          const q = encodeURIComponent(tripTitle);
          return {
            naver: `https://map.naver.com/v5/search/${q}`,
            kakao: `https://map.kakao.com/link/search/${q}`,
            isRoute: false
          };
        }
        if (validPoints.length === 1) {
          const pt = validPoints[0];
          const q = encodeURIComponent(pt.placeName || pt.address || pt.title);
          return {
            naver: `https://map.naver.com/v5/search/${q}`,
            kakao: `https://map.kakao.com/link/search/${q}`,
            isRoute: false
          };
        }

        // 2개 이상 코스: 출발지(1번째) -> 도착지(마지막 코스) 자동차 길찾기
        const start = validPoints[0];
        const end = validPoints[validPoints.length - 1];
        const sName = encodeURIComponent(start.placeName || start.title || '출발지');
        const eName = encodeURIComponent(end.placeName || end.title || '도착지');

        // WGS84(위경도) -> 네이버 지도 내부 Web Mercator(EPSG:3857 미터) 투영 좌표 변환 함수
        const toMercator = (lng, lat) => {
          const x = (lng * 20037508.34) / 180;
          let y = Math.log(Math.tan(((90 + lat) * Math.PI) / 360)) / (Math.PI / 180);
          y = (y * 20037508.34) / 180;
          return { x: x.toFixed(7), y: y.toFixed(7) };
        };

        // 네이버 지도 웹: 출발->도착 2개 세그먼트 (네이버 웹 길찾기 라우터 100% 정상 작동)
        const startM = toMercator(start.lng, start.lat);
        const endM = toMercator(end.lng, end.lat);
        const naverUrl = `https://map.naver.com/p/directions/${startM.x},${startM.y},${sName},,ADDRESS_POI/${endM.x},${endM.y},${eName},,ADDRESS_POI/-/car`;

        // 티맵(TMAP): 목적지 직행 안내 URL (모바일 티맵 앱 즉시 실행 tmap://route 스키마)
        const tmapUrl = `tmap://route?goalname=${eName}&goalx=${end.lng}&goaly=${end.lat}`;

        // 구간별(Legs: 1->2, 2->3 등) 릴레이 길찾기 링크 목록 및 거리/시간 계산
        const legs = [];
        let totalRoadKm = 0;
        let totalMinutes = 0;

        for (let i = 0; i < validPoints.length - 1; i++) {
          const fromPt = validPoints[i];
          const toPt = validPoints[i + 1];
          const fromTitle = fromPt.placeName || fromPt.title || `코스 ${i + 1}`;
          const toTitle = toPt.placeName || toPt.title || `코스 ${i + 2}`;
          const fn = encodeURIComponent(fromTitle);
          const tn = encodeURIComponent(toTitle);
          const legTmap = `tmap://route?goalname=${tn}&goalx=${toPt.lng}&goaly=${toPt.lat}`;
          const fromM = toMercator(fromPt.lng, fromPt.lat);
          const toM = toMercator(toPt.lng, toPt.lat);
          const legNaver = `https://map.naver.com/p/directions/${fromM.x},${fromM.y},${fn},,ADDRESS_POI/${toM.x},${toM.y},${tn},,ADDRESS_POI/-/car`;
          const distInfo = calculateDistanceAndTime(fromPt.lat, fromPt.lng, toPt.lat, toPt.lng);
          if (distInfo) {
            totalRoadKm += distInfo.roadKm;
            totalMinutes += distInfo.totalMinutes;
          }
          legs.push({
            index: i + 1,
            fromTitle,
            toTitle,
            distInfo,
            tmapUrl: legTmap,
            naverUrl: legNaver
          });
        }

        const totalHours = Math.floor(totalMinutes / 60);
        const totalMins = totalMinutes % 60;
        const totalTimeStr = totalHours > 0 ? `${totalHours}시간 ${totalMins > 0 ? totalMins + '분' : ''}`.trim() : `${totalMins}분`;
        const totalDistStr = totalRoadKm >= 1 ? `${totalRoadKm.toFixed(1)}km` : `${Math.round(totalRoadKm * 1000)}m`;

        return {
          naver: naverUrl,
          tmap: tmapUrl,
          legs,
          isRoute: true,
          waypointCount: Math.max(0, validPoints.length - 2),
          totalSpots: validPoints.length,
          totalDistStr: totalRoadKm > 0 ? totalDistStr : null,
          totalTimeStr: totalMinutes > 0 ? totalTimeStr : null,
          startTitle: start.placeName || start.title,
          endTitle: end.placeName || end.title
        };
      }, [validPoints, tripTitle]);

      useEffect(() => {
        if (!mapContainerRef.current) return;
        if (typeof L === 'undefined') return;

        // 초기 지도 생성 (없으면 신규, 있으면 레이어 정리)
        if (!mapInstanceRef.current) {
          const defaultCenter = validPoints.length > 0 ? [validPoints[0].lat, validPoints[0].lng] : [37.5, 127.5];
          const map = L.map(mapContainerRef.current, {
            zoomControl: true,
            scrollWheelZoom: true,
            minZoom: 6,
            maxZoom: 18,
            worldCopyJump: false
          }).setView(defaultCenter, 9);

          // OpenStreetMap 공식 타일 (API 키 불필요, 100% 무료 무제한 타일, noWrap으로 세계 복제 방지)
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            minZoom: 6,
            maxZoom: 18,
            noWrap: true,
            attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
          }).addTo(map);

          mapInstanceRef.current = map;
        }

        const map = mapInstanceRef.current;

        // 이전 마커/폴리라인 레이어 제거
        map.eachLayer((layer) => {
          if (layer instanceof L.Marker || layer instanceof L.Polyline) {
            map.removeLayer(layer);
          }
        });

        if (validPoints.length === 0) {
          map.setView([37.5, 127.5], 8); // 수도권/강원 중심 뷰
          return;
        }

        const latLngs = [];
        const markerGroup = [];
        const renderedCoords = [];

        validPoints.forEach((point, index) => {
          let lat = point.lat;
          let lng = point.lng;

          // 동일하거나 극히 가까운 좌표로 마커가 포개져 2번, 3번 등이 가려지는 현상 완전 방지 (방사형 미세 오프셋 분리)
          const duplicates = renderedCoords.filter(rc => Math.abs(rc.originLat - point.lat) < 0.0004 && Math.abs(rc.originLng - point.lng) < 0.0004);
          if (duplicates.length > 0) {
            const angle = (duplicates.length * (2 * Math.PI / 4)) + (Math.PI / 6);
            const radius = 0.0012 * Math.ceil(duplicates.length / 4); // 약 100m 시각적 오프셋
            lat = lat + (radius * Math.cos(angle));
            lng = lng + (radius * Math.sin(angle));
          }
          renderedCoords.push({ lat, lng, originLat: point.lat, originLng: point.lng });

          const latlng = [lat, lng];
          latLngs.push(latlng);

          const cat = TRAVEL_CATEGORIES.find(c => c.id === point.category) || TRAVEL_CATEGORIES[0];
          const badgeColor = cat.dotColor || '#059669';

          // 네이버 스타일 모던 핀 마커 HTML (그린/카테고리 포인트 + 핀 꼬리 + 그림자)
          const customHtml = `
            <div style="position: relative; cursor: pointer; transform: translate(-50%, -100%);">
              <div style="background-color: ${badgeColor}; min-width: 38px; height: 38px; border-radius: 20px; border: 3px solid #ffffff; box-shadow: 0 4px 14px rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; color: #ffffff; font-weight: 900; font-size: 13px; padding: 0 6px; gap: 2px;">
                <span>${cat.emoji}</span>
                <span style="font-family: -apple-system, sans-serif;">${index + 1}</span>
              </div>
              <div style="position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid ${badgeColor};"></div>
            </div>
          `;

          const customIcon = L.divIcon({
            html: customHtml,
            className: 'custom-trip-marker',
            iconSize: [0, 0],
            iconAnchor: [0, 0],
            popupAnchor: [0, -42]
          });

          const naviQuery = encodeURIComponent(point.placeName || point.address || point.title);
          const markerUrlMatch = `${point.linkUrl || ''} ${point.memo || ''}`.match(/(https?:\/\/[^\s\x22\x27<>]+)/i);
          const directPlaceUrl = point.linkUrl || (markerUrlMatch ? markerUrlMatch[0] : null);
          const naverDirectUrl = directPlaceUrl || (
            point.lat && point.lng
              ? `https://map.naver.com/p/search/${naviQuery}?c=${point.lng},${point.lat},15,0,0,0,dh`
              : `https://map.naver.com/p/search/${naviQuery}`
          );

          const popupContent = `
            <div style="min-width: 220px; padding: 4px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
              <div style="display: flex; items-center; justify-content: space-between; margin-bottom: 6px;">
                <span style="display: inline-flex; align-items: center; gap: 3px; font-weight: 800; font-size: 11px; background: #ecfdf5; color: #047857; padding: 2px 8px; border-radius: 6px;">
                  <span>${cat.emoji}</span> ${point.day || 1}일차 • ${index + 1}번째 코스
                </span>
                <span style="font-size: 11px; font-weight: 700; color: #64748b;">⏰ ${point.time || '시간 미지정'}</span>
              </div>
              <h4 style="margin: 0 0 6px 0; font-size: 15px; font-weight: 900; color: #0f172a; line-height: 1.3;">${point.title}</h4>
              <p style="margin: 0 0 4px 0; font-size: 12px; font-weight: 600; color: #334155;">📍 ${point.placeName || '장소명 없음'}</p>
              ${point.address ? `<p style="margin: 0 0 6px 0; font-size: 11px; color: #64748b;">(${point.address})</p>` : ''}
              ${point.cost ? `<p style="margin: 0 0 6px 0; font-size: 11px; font-weight: 700; color: #b45309;">💰 ${point.cost}</p>` : ''}
              ${point.memo ? `<div style="margin: 6px 0; padding: 6px 8px; background: #f8fafc; border-left: 3px solid #10b981; border-radius: 4px; font-size: 11px; color: #475569; line-height: 1.4;">💬 ${point.memo}</div>` : ''}
              <div style="margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
                <a href="${naverDirectUrl}" target="_blank" rel="noopener noreferrer" style="text-align: center; background: #03c75a; color: #ffffff; text-decoration: none; padding: 6px 8px; border-radius: 8px; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 2px 5px rgba(3,199,90,0.3);">
                  <span>🟢</span> 네이버 지도
                </a>

        const applyRouteBounds = () => {

        const t1 = setTimeout(applyRouteBounds, 120);
        const t2 = setTimeout(applyRouteBounds, 350);

        return () => {
          clearTimeout(t1);
          clearTimeout(t2);
        };

      }, [validPoints, selectedDay]);

    // ==================== 신규: 가족 여행 플래너 메인 섹션 ====================
    function TravelSection({
      trips = [],
      selectedTripId,
      setSelectedTripId,
      currentMember,
      isParent,
      handleSaveTrip,
      handleDeleteTrip,
      handleSaveTripItem,
      handleDeleteTripItem,
      handleToggleTripItemDone
    }) {
      const [viewMode, setViewMode] = useState('both'); // 'both', 'timetable', 'map'
      const [selectedDay, setSelectedDay] = useState('all'); // 'all', 1, 2, 3...
      const [isTripModalOpen, setIsTripModalOpen] = useState(false);
      const [editingTrip, setEditingTrip] = useState(null);
      const [isItemModalOpen, setIsItemModalOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [isTripPdfModalOpen, setIsTripPdfModalOpen] = useState(false);

      // 여행 생성/수정 폼 상태
      const [tripForm, setTripForm] = useState({
        title: '',
        destination: '',
        startDate: getTodayString(),
        endDate: shiftDateString(getTodayString(), 2),
        coverEmoji: '🌴',
        memo: ''
      });

      // 일정 항목 생성/수정 폼 상태
      const [itemForm, setItemForm] = useState({
        day: 1,
        time: '10:00',
        title: '',
        category: 'food',
        placeName: '',
        address: '',
        cost: '',
        memo: '',
        lat: '',
        lng: ''
      });

      // 현재 선택된 여행 객체
      const currentTrip = useMemo(() => {
        if (!selectedTripId && trips.length > 0) return trips[0];
        return trips.find(t => t.id === selectedTripId) || trips[0] || null;
      }, [trips, selectedTripId]);

      // 여행 기간에 따른 일차(Day) 배열 계산
      const tripDays = useMemo(() => {
        if (!currentTrip || !currentTrip.startDate || !currentTrip.endDate) return [1, 2, 3];
        const start = new Date(currentTrip.startDate.replace(/-/g, '/'));
        const end = new Date(currentTrip.endDate.replace(/-/g, '/'));
        const diffTime = Math.max(0, end.getTime() - start.getTime());
        const diffDays = Math.min(14, Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1);
        const days = [];
        for (let i = 1; i <= Math.max(1, diffDays); i++) {
          days.push(i);
        }
        return days;
      }, [currentTrip]);

      // 현재 일차 필터가 적용된 일정 목록
      const displayedItems = useMemo(() => {
        if (!currentTrip || !currentTrip.items) return [];
        let items = [...currentTrip.items];
        if (selectedDay !== 'all') {
          items = items.filter(i => Number(i.day) === Number(selectedDay));
        }
        return items.sort((a, b) => {
          if ((a.day || 1) !== (b.day || 1)) return (a.day || 1) - (b.day || 1);
          return (a.time || '').localeCompare(b.time || '');
        });
      }, [currentTrip, selectedDay]);

      // 새 여행 모달 열기 (엄마, 아빠 전용)
      const handleOpenNewTripModal = () => {
        if (!isParent) {
          showToast("⚠️ 엄마, 아빠만 새로운 여행을 등록할 수 있습니다.");
          return;
        }
        setEditingTrip(null);
        setTripForm({
          title: '🌴 우리 가족 힐링 여행',
          destination: '제주도 / 강원도 / 부산 등',
          startDate: getTodayString(),
          endDate: shiftDateString(getTodayString(), 2),
          coverEmoji: '🌴',
          memo: '가족 모두가 행복한 추억 만들기!'
        });
        setIsTripModalOpen(true);
      };

      // 여행 수정 모달 열기 (엄마, 아빠 전용)
      const handleOpenEditTripModal = (trip) => {
        if (!isParent) {
          showToast("⚠️ 엄마, 아빠만 여행 정보를 수정할 수 있습니다.");
          return;
        }
        setEditingTrip(trip);
        setTripForm({
          title: trip.title,
          destination: trip.destination || '',
          startDate: trip.startDate || getTodayString(),
          endDate: trip.endDate || getTodayString(),
          coverEmoji: trip.coverEmoji || '✈️',
          memo: trip.memo || ''
        });
        setIsTripModalOpen(true);
      };

      // 여행 저장 제출 (엄마, 아빠 전용)
      const onTripSubmit = (e) => {
        e.preventDefault();
        if (!isParent) {
          showToast("⚠️ 엄마, 아빠만 여행을 저장할 수 있습니다.");
          return;
        }
        if (!tripForm.title.trim()) return;
        const tripData = {
          ...(editingTrip || {}),
          ...tripForm,
          id: editingTrip?.id || ('trip_' + Date.now()),
          items: editingTrip?.items || []
        };
        handleSaveTrip(tripData);
        setIsTripModalOpen(false);
      };

      // 일정 항목 모달 열기 (엄마, 아빠 전용)
      const handleOpenAddItemModal = (targetDay = 1) => {
        if (!isParent) {
          showToast("⚠️ 엄마, 아빠만 여행 일정을 등록할 수 있습니다.");
          return;
        }
        setEditingItem(null);
        // 새 일정 등록 시 기본 좌표는 비워두어 입력한 장소명/주소로 정확히 자동 지오코딩되도록 처리
        setItemForm({
          day: selectedDay === 'all' ? (targetDay || 1) : Number(selectedDay),
          time: '12:00',
          title: '',
          category: 'food',
          placeName: '',
          address: '',
          cost: '',
          memo: '',
          linkUrl: '',
          lat: '',
          lng: ''
        });
        setIsItemModalOpen(true);
      };

      // 일정 항목 수정 모달 열기 (엄마, 아빠 전용)
      const handleOpenEditItemModal = (item) => {
        if (!isParent) {
          showToast("⚠️ 엄마, 아빠만 여행 일정을 수정할 수 있습니다.");
          return;
        }
        setEditingItem(item);
        // 메모에 URL이 포함되어 있는데 linkUrl이 없으면 자동 추출
        const memoUrlMatch = (item.memo || '').match(/(https?:\/\/[^\s\x22\x27<>]+)/i);
        setItemForm({
          day: item.day || 1,
          time: item.time || '10:00',
          title: item.title || '',
          category: item.category || 'food',
          placeName: item.placeName || '',
          address: item.address || '',
          cost: item.cost || '',
          memo: item.memo || '',
          linkUrl: item.linkUrl || (memoUrlMatch ? memoUrlMatch[0] : ''),
          lat: item.lat || '',
          lng: item.lng || ''
        });
        setIsItemModalOpen(true);
      };

      // 주소 또는 장소명으로 위치(위도/경도) 자동 찾기 헬퍼
      const [isSearchingLocation, setIsSearchingLocation] = useState(false);
      const handleAutoGeocode = async (customQuery) => {
        const query = customQuery || itemForm.address || itemForm.placeName || itemForm.title;
        if (!query || !query.trim()) {
          showToast("🔍 검색할 주소나 장소명을 먼저 입력해주세요!");
          return;
        }
        setIsSearchingLocation(true);
        try {
          const res = await searchLocationCoordinates(query);
          if (res && res.lat && res.lng) {
            setItemForm(prev => ({
              ...prev,
              lat: res.lat,
              lng: res.lng,
              address: prev.address || (res.name && res.source === 'preset' ? res.name : prev.address)
            }));
            showToast(`📍 '${res.name || query}' 위치 좌표를 찾았습니다!`);
            triggerHaptic(20);
          } else {
            showToast("네이버 지도 검색용 키워드로 등록되었습니다. (직접 위경도 입력도 가능)");
          }
        } catch (e) {
          console.error(e);
        } finally {
          setIsSearchingLocation(false);
        }
      };

      // 일정 항목 저장 제출 (엄마, 아빠 전용)
      const onItemSubmit = async (e) => {
        e.preventDefault();
        if (!isParent) {
          showToast("⚠️ 엄마, 아빠만 여행 일정을 등록할 수 있습니다.");
          return;
        }
        if (!itemForm.title.trim() || !currentTrip) return;

        let finalLat = itemForm.lat ? Number(itemForm.lat) : undefined;
        let finalLng = itemForm.lng ? Number(itemForm.lng) : undefined;

        // 좌표가 비어있거나, 이전 기본좌표(서울 기본 37.56 또는 평창휘닉스 기본 37.5815)인데 입력된 장소명이 다른 경우 최신 정밀 지오코딩
        const query = itemForm.address || itemForm.placeName || itemForm.title;
        const isPresetCollision = (finalLat === 37.56 && finalLng === 126.97) ||
          (!query.includes('휘닉스') && finalLat === 37.5815 && finalLng === 128.3245);
        if (!finalLat || !finalLng || isPresetCollision) {
          const found = await searchLocationCoordinates(query);
          if (found && found.lat && found.lng) {
            finalLat = found.lat;
            finalLng = found.lng;
          } else if (!finalLat || !finalLng) {
            // 주소 검색 실패 시에만 권역 기본 좌표 폴백 할당
            finalLat = currentTrip?.destination?.includes('제주') ? 33.38 : (currentTrip?.destination?.includes('평창') ? 37.5815 : 37.56);
            finalLng = currentTrip?.destination?.includes('제주') ? 126.55 : (currentTrip?.destination?.includes('평창') ? 128.3245 : 126.97);
          }
        }

        // 링크 URL이 비어있는데 메모에 URL이 포함되어 있는 경우 자동 추출하여 채움
        let finalLinkUrl = (itemForm.linkUrl || '').trim();

          const mMatch = `${itemForm.memo || ''} ${itemForm.address || ''}`.match(/(https?:\/\/[^\s\x22\x27<>]+)/i);
          if (mMatch) finalLinkUrl = mMatch[0];
        }

        const itemData = {
          ...(editingItem || {}),
          ...itemForm,
          day: Number(itemForm.day) || 1,
          linkUrl: finalLinkUrl,
          lat: finalLat,
          lng: finalLng
        };

                      type="button"
                      onClick={() => handleOpenEditTripModal(currentTrip)}
                      className="p-1 text-white/80 hover:text-white transition"
                      title="여행 기본정보 수정"
                    >
                      ✏️
                    </button>
                  )}
                  {!isParent && (
                    <span className="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-white/20 text-emerald-100 border border-white/25">
                      👀 보기 전용
                    </span>
                  )}
                </div>
                <p className="text-xs text-emerald-100 flex items-center space-x-2">
                  <span>📍 {currentTrip?.destination || '여행지 미정'}</span>
                  <span>•</span>
                  <span>📅 {currentTrip?.startDate} ~ {currentTrip?.endDate}</span>
                  {currentTrip && <span>({tripDays.length}일간의 여정)</span>}
                </p>
                {currentTrip?.memo && (
                  <p className="text-[11px] text-emerald-100/90 italic pt-0.5">"{currentTrip.memo}"</p>
                )}
              </div>

              {/* 여행 선택 셀렉트, PDF 다운로드 및 새 여행 추가 버튼 */}
              <div className="flex items-center space-x-2 self-start sm:self-auto flex-wrap gap-y-1.5">
                {trips.length > 0 && (
                  <div className="flex items-center space-x-1.5">
                    <span className="text-[11px] font-bold text-emerald-100 hidden sm:inline">여행 목록({trips.length}):</span>
                    <select
                      value={currentTrip?.id || ''}
                      onChange={(e) => {
                        setSelectedTripId(e.target.value);
                        triggerHaptic(15);
                      }}
                      className="px-3 py-2 bg-white/20 hover:bg-white/30 backdrop-blur-md rounded-xl text-xs font-bold text-white border border-white/20 focus:outline-none cursor-pointer"
                    >
                      {trips.map(t => (
                        <option key={t.id} value={t.id} className="text-slate-900 font-bold">
                          {t.coverEmoji || '✈️'} {t.title} ({t.items?.length || 0}개 일정)
                        </option>
                      ))}
                    </select>
                  </div>
                )}
                {/* 🔗 친구에게 일정 공유 링크 복사 버튼 (누구나 공유 가능) */}
                {currentTrip && (
                  <button
                    type="button"
                    onClick={() => {
                      const shareUrl = `${window.location.origin}${window.location.pathname.replace('index.html', '')}trip.html?trip=${currentTrip.id}`;
                      if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(shareUrl).then(() => {
                          showToast("🔗 친구 공유 링크가 복사되었습니다! 카톡이나 문자로 전송하세요.");
                          triggerHaptic(20);
                        }).catch(() => {
                          prompt("아래 친구 공유 링크를 복사하세요:", shareUrl);
                        });
                      } else {
                        prompt("아래 친구 공유 링크를 복사하세요:", shareUrl);
                      }
                    }}
                    className="px-3 py-2 rounded-xl bg-emerald-500/80 hover:bg-emerald-500 border border-white/30 text-white font-extrabold text-xs shadow-xs transition active:scale-95 flex items-center space-x-1"
                    title="로그인 없이 친구들이 여행 일정과 지도를 볼 수 있는 전용 웹페이지 링크를 복사합니다"
                  >
                    <span>🔗</span>
                    <span>친구에게 공유</span>
                  </button>
                )}
                {/* 📄 여행 일정 PDF 다운로드 버튼 (온 가족 누구나 다운로드 가능) */}
                <button
                  type="button"
                  onClick={() => {
                    setIsTripPdfModalOpen(true);
                    triggerHaptic(15);
                  }}
                  className="px-3 py-2 rounded-xl bg-white/20 hover:bg-white/30 backdrop-blur-md border border-white/30 text-white font-extrabold text-xs shadow-xs transition active:scale-95 flex items-center space-x-1"
                  title="현재 선택된 여행 일정을 PDF 보고서로 확인하고 저장합니다"
                >
                  <span>📄</span>
                  <span>여행 PDF 받기</span>
                </button>
                {/* 엄마, 아빠 전용: 새 여행 추가하기 버튼 */}
                {isParent && (
                  <button
                    type="button"
                    onClick={handleOpenNewTripModal}
                    className="px-3.5 py-2 rounded-xl bg-white text-emerald-800 font-extrabold text-xs shadow-md hover:bg-emerald-50 transition active:scale-95 flex items-center space-x-1"
                    title="기존 여행 일정을 그대로 두고 새로운 여행 일정을 추가합니다"
                  >
                    <span>✨</span>
                    <span>+ 새 여행 추가하기</span>
                  </button>
                )}
              </div>
            </div>

            {/* 등록된 여행이 2개 이상일 때 편리하게 클릭할 수 있는 여행 퀵 스위처 칩 바 */}
            {trips.length > 1 && (
              <div className="pt-2 border-t border-white/15 flex items-center space-x-1.5 overflow-x-auto no-scrollbar">
                <span className="text-[10px] font-extrabold text-emerald-200 shrink-0">저장된 여행 목록:</span>
                {trips.map(t => {
                  const isSelected = (currentTrip?.id === t.id);
                  return (
                    <button
                      key={t.id}
                      type="button"
                      onClick={() => {
                        setSelectedTripId(t.id);
                        triggerHaptic(10);
                      }}
                      className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition shrink-0 flex items-center space-x-1 ${
                        isSelected
                          ? 'bg-white text-emerald-900 shadow-xs'
                          : 'bg-white/15 text-white hover:bg-white/25'
                      }`}
                    >
                      <span>{t.coverEmoji || '✈️'}</span>
                      <span className="truncate max-w-[130px]">{t.title}</span>
                      <span className={`text-[10px] px-1 rounded-full ${isSelected ? 'bg-emerald-100 text-emerald-800' : 'bg-white/20 text-white'}`}>
                        {t.items?.length || 0}
                      </span>
                    </button>
                  );
                })}
              </div>
            )}
          </div>

          {/* 뷰 모드 및 일차(Day) 필터 바 */}
          <div className="bg-white rounded-2xl p-3 border border-slate-200 shadow-2xs space-y-2.5">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 pb-2">
              {/* 일차 탭 버튼 (전체 / 1일차 / 2일차 ...) */}
              <div className="flex items-center space-x-1 overflow-x-auto no-scrollbar py-0.5">
                <button
                  type="button"
                  onClick={() => setSelectedDay('all')}
                  className={`px-3 py-1.5 rounded-xl text-xs font-black transition shrink-0 ${
                    selectedDay === 'all' ? 'bg-emerald-600 text-white shadow-2xs' : 'text-slate-600 hover:bg-slate-100'
                  }`}
                >
                  전체 일정 ({currentTrip?.items?.length || 0})
                </button>
                {tripDays.map((d) => {
                  const count = (currentTrip?.items || []).filter(i => Number(i.day) === d).length;
                  return (
                    <button
                      key={d}
                      type="button"
                      onClick={() => setSelectedDay(d)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-black transition shrink-0 flex items-center space-x-1 ${
                        selectedDay === d ? 'bg-emerald-600 text-white shadow-2xs' : 'text-slate-600 hover:bg-slate-100'
                      }`}
                    >
                      <span>Day {d}</span>
                      <span className={`text-[10px] px-1 rounded-full ${selectedDay === d ? 'bg-white/30 text-white' : 'bg-slate-200 text-slate-700'}`}>
                        {count}
                      </span>
                    </button>
                  );
                })}
              </div>

              {/* 뷰 전환 모드 (타임테이블 / 지도 / 둘 다 보기) */}
              <div className="flex items-center space-x-1 bg-slate-100 p-0.5 rounded-xl shrink-0 self-start sm:self-auto">
                <button
                  type="button"
                  onClick={() => setViewMode('both')}
                  className={`px-2.5 py-1 rounded-lg text-xs font-bold transition ${
                    viewMode === 'both' ? 'bg-white text-emerald-700 shadow-2xs' : 'text-slate-500'
                  }`}
                >
                  📱 통합 뷰
                </button>
                <button
                  type="button"
                  onClick={() => setViewMode('timetable')}
                  className={`px-2.5 py-1 rounded-lg text-xs font-bold transition ${
                    viewMode === 'timetable' ? 'bg-white text-emerald-700 shadow-2xs' : 'text-slate-500'
                  }`}
                >
                  ⏱️ 타임테이블
                </button>
                <button
                  type="button"
                  onClick={() => setViewMode('map')}
                  className={`px-2.5 py-1 rounded-lg text-xs font-bold transition ${
                    viewMode === 'map' ? 'bg-white text-emerald-700 shadow-2xs' : 'text-slate-500'
                  }`}
                >
                  🗺️ 이동 동선 지도
                </button>
              </div>
            </div>

            {/* 일정 추가 바로가기 버튼 (엄마, 아빠 전용) */}
            <div className="flex items-center justify-between text-xs pt-0.5">
              <span className="text-slate-500 font-medium">
                {selectedDay === 'all' ? '전체 일정 타임라인' : `${selectedDay}일차 일정표 & 이동 경로`}
              </span>
              {isParent ? (
                <button
                  type="button"
                  onClick={() => handleOpenAddItemModal(selectedDay === 'all' ? 1 : Number(selectedDay))}
                  className="px-3 py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 font-extrabold text-xs transition active:scale-95 flex items-center space-x-1"
                >
                  <span>➕</span>
                  <span>{selectedDay === 'all' ? '일정 등록' : `${selectedDay}일차 일정 추가`}</span>
                </button>
              ) : (
                <span className="text-[11px] font-bold text-slate-400">
                  👀 자녀 보기 모드
                </span>
              )}
            </div>
          </div>

          {/* 지도 뷰 (viewMode === 'both' 또는 'map'일 때 표시) */}
          {(viewMode === 'both' || viewMode === 'map') && (
            <div className="space-y-1.5">
              <div className="flex items-center justify-between px-1 text-xs font-black text-slate-800">
                <span className="flex items-center space-x-1">
                  <span>🗺️</span>
                  <span>가족 이동 동선 지도 (순서별 코스 연결)</span>
                </span>
                <span className="text-[11px] text-slate-400 font-normal">마커를 터치하면 맛집/관광지 정보와 길찾기가 열립니다</span>
              </div>
              <TravelMapView
                items={currentTrip?.items || []}
                selectedDay={selectedDay}
                tripTitle={currentTrip?.title || currentTrip?.destination || '가족 여행'}
              />
            </div>
          )}

          {/* 타임테이블 뷰 (viewMode === 'both' 또는 'timetable'일 때 표시) */}
          {(viewMode === 'both' || viewMode === 'timetable') && (
            <div className="bg-white rounded-3xl p-4 sm:p-5 border border-slate-200 shadow-2xs space-y-3">
              <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                <span className="text-xs sm:text-sm font-extrabold text-slate-900 flex items-center space-x-1.5">
                  <span>⏱️</span>
                  <span>시간대별 타임테이블 ({displayedItems.length}곳)</span>
                </span>
                <span className="text-[11px] text-slate-400">카테고리: 🍽️맛집, 🏨숙박, 🎡놀거리, 🏞️볼거리, 🚗교통</span>
              </div>

              {displayedItems.length === 0 ? (
                <div className="text-center py-12 bg-slate-50 rounded-2xl border border-dashed border-slate-200 text-xs text-slate-400 space-y-2">
                  <div className="text-3xl">🌴</div>
                  <div className="font-bold text-slate-600">등록된 일정이 없습니다.</div>
                  <div className="text-[11px] text-slate-400">
                    {isParent
                      ? '위의 [+ 일정 추가] 버튼을 눌러 맛집, 호텔, 볼거리를 등록해보세요!'
                      : '아직 부모님이 등록한 일정이 없습니다.'}
                  </div>
                  {isParent && (
                    <button
                      type="button"
                      onClick={() => handleOpenAddItemModal(selectedDay === 'all' ? 1 : Number(selectedDay))}
                      className="mt-2 px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-sm transition"
                    >
                      + 첫 번째 일정 추가하기
                    </button>
                  )}
                </div>
              ) : (
                <div className="relative pl-6 sm:pl-8 space-y-3.5 before:absolute before:left-3 before:top-2 before:bottom-2 before:w-0.5 before:bg-emerald-200">
                  {displayedItems.map((item, idx) => {
                    const cat = TRAVEL_CATEGORIES.find(c => c.id === item.category) || TRAVEL_CATEGORIES[0];
                    const naviQuery = encodeURIComponent(item.placeName || item.address || item.title);

                    // 웹/네이버지도 링크 감지 (item.linkUrl 또는 memo, address 등에 포함된 http/https URL)
                    const fullTextForUrl = `${item.linkUrl || ''} ${item.memo || ''} ${item.address || ''}`;
                    const urlMatch = fullTextForUrl.match(/(https?:\/\/[^\s\x22\x27<>]+)/i);
                    const directUrl = item.linkUrl || (urlMatch ? urlMatch[0] : null);

                    const naverPlaceUrl = directUrl || (
                      item.lat && item.lng
                        ? `https://map.naver.com/p/search/${naviQuery}?c=${item.lng},${item.lat},15,0,0,0,dh`
                        : `https://map.naver.com/p/search/${naviQuery}`
                    );
                    const kakaoPlaceUrl = `https://map.kakao.com/link/search/${naviQuery}`;

                    let memoText = (item.memo || '').trim();
                    const memoUrlMatch = memoText.match(/(https?:\/\/[^\s\x22\x27<>]+)/i);
                    const memoExtractedUrl = memoUrlMatch ? memoUrlMatch[0] : null;
                    let memoCleanText = memoText;
                    if (memoExtractedUrl) {
                      memoCleanText = memoText.replace(memoExtractedUrl, '').replace(/^[\x22\x27\s]+|[\x22\x27\s]+$/g, '').trim();
                    }

                    const nextItem = (idx < displayedItems.length - 1) ? displayedItems[idx + 1] : null;
                    let nextLegNaver = null;
                    let nextLegKakao = null;
                    let nextLegDistInfo = null;
                    if (nextItem) {
                      const toMercator = (lng, lat) => {
                        const x = (lng * 20037508.34) / 180;
                        let y = Math.log(Math.tan(((90 + lat) * Math.PI) / 360)) / (Math.PI / 180);
                        y = (y * 20037508.34) / 180;
                        return { x: x.toFixed(7), y: y.toFixed(7) };
                      };
                      const fn = encodeURIComponent(item.placeName || item.title || '출발');
                      const tn = encodeURIComponent(nextItem.placeName || nextItem.title || '도착');
                      nextLegKakao = (item.lat && item.lng && nextItem.lat && nextItem.lng)
                        ? `https://map.kakao.com/link/from/${fn},${item.lat},${item.lng}/to/${tn},${nextItem.lat},${nextItem.lng}`
                        : `https://map.kakao.com/link/search/${tn}`;
                      const fromM = (item.lat && item.lng) ? toMercator(item.lng, item.lat) : null;
                      const toM = (nextItem.lat && nextItem.lng) ? toMercator(nextItem.lng, nextItem.lat) : null;
                      nextLegNaver = (fromM && toM)
                        ? `https://map.naver.com/p/directions/${fromM.x},${fromM.y},${fn},,ADDRESS_POI/${toM.x},${toM.y},${tn},,ADDRESS_POI/-/car`
                        : `https://map.naver.com/p/search/${tn}`;
                      nextLegDistInfo = calculateDistanceAndTime(item.lat, item.lng, nextItem.lat, nextItem.lng);
                    }

                    return (
                      <div key={item.id} className="relative group">
                        {/* 타임라인 왼쪽 동그라미 핀 */}
                        <div
                          style={{ backgroundColor: cat.dotColor || '#059669' }}
                          className="absolute -left-6 sm:-left-8 top-3 w-5 h-5 rounded-full border-2 border-white shadow-xs flex items-center justify-center text-[10px] text-white font-black"
                        >
                          {idx + 1}
                        </div>

                        {/* 타임테이블 카드 */}
                        <div className={`p-3.5 sm:p-4 rounded-2xl border transition-all space-y-2 ${
                          item.isDone ? 'bg-slate-50 border-slate-200 opacity-70' : 'bg-white border-slate-200 hover:border-emerald-300 shadow-2xs'
                        }`}>
                          <div className="flex items-start justify-between gap-2">
                            <div className="space-y-1">
                              <div className="flex items-center space-x-1.5 flex-wrap gap-y-1">
                                <span className={`text-[10px] px-2 py-0.5 rounded-md font-extrabold border ${cat.color}`}>
                                  {cat.emoji} {cat.label}
                                </span>
                                <span className="text-xs font-black text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-150">
                                  Day {item.day} • ⏰ {item.time || '시간 미지정'}
                                </span>
                                {item.cost && (
                                  <span className="text-[10px] font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-md border border-amber-200">
                                    💰 {item.cost}
                                  </span>
                                )}
                              </div>
                              <h3 className={`text-sm sm:text-base font-extrabold ${item.isDone ? 'line-through text-slate-400' : 'text-slate-900'} leading-snug`}>
                                {item.title}
                              </h3>
                            </div>

                            {/* 우측 조작 버튼들 */}
                            <div className="flex items-center space-x-1 shrink-0">
                              <button
                                type="button"
                                onClick={() => handleToggleTripItemDone(currentTrip.id, item.id)}
                                className={`px-2 py-1 rounded-lg text-xs font-bold transition flex items-center space-x-0.5 ${
                                  item.isDone ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                }`}
                                title="방문 완료 체크"
                              >
                                <span>{item.isDone ? '✅ 완료' : '미완료'}</span>
                              </button>
                              {isParent && (
                                <>
                                  <button
                                    type="button"
                                    onClick={() => handleOpenEditItemModal(item)}
                                    className="p-1 text-slate-400 hover:text-indigo-600 rounded-lg transition"
                                    title="수정"
                                  >
                                    ✏️
                                  </button>
                                  <button
                                    type="button"
                                    onClick={() => handleDeleteTripItem(currentTrip.id, item.id)}
                                    className="p-1 text-slate-400 hover:text-rose-600 rounded-lg transition"
                                    title="삭제"
                                  >
                                    🗑️
                                  </button>
                                </>
                              )}
                            </div>
                          </div>

                          {/* 장소 및 주소 (클릭 시 네이버 지도 바로 열기 + 주소 복사) */}
                          {(item.placeName || item.address) && (
                            <div className="flex items-center justify-between flex-wrap gap-2 bg-slate-50 hover:bg-emerald-50/50 p-2.5 rounded-xl border border-slate-200 transition">
                              <a
                                href={naverPlaceUrl}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="flex items-center space-x-1.5 flex-wrap flex-1 text-xs text-slate-700 hover:text-emerald-800 group/addr"
                                title="네이버 지도에서 상세 정보 열기"
                              >
                                <span className="font-extrabold text-slate-900 group-hover/addr:text-emerald-700">📍 {item.placeName || '장소명 없음'}</span>
                                {item.address && <span className="text-slate-500 text-[11px]">({item.address})</span>}
                                <span className="text-[10px] text-emerald-600 font-extrabold group-hover/addr:underline shrink-0 flex items-center space-x-0.5">
                                  <span>네이버지도</span>
                                  <span>↗</span>
                                </span>
                              </a>
                              <div className="flex items-center space-x-1 shrink-0">
                                {item.lat && item.lng && (
                                  <a
                                    href={`tmap://route?goalname=${encodeURIComponent(item.placeName || item.title || '목적지')}&goalx=${item.lng}&goaly=${item.lat}`}
                                    className="px-2 py-0.5 rounded-lg bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-700 font-bold text-[10px] transition active:scale-95 flex items-center space-x-0.5"
                                    title="티맵으로 이 장소 길안내 바로 시작"
                                  >
                                    <span>🔴 티맵</span>
                                  </a>
                                )}
                                {item.address && (
                                  <button
                                    type="button"
                                    onClick={(e) => {
                                      e.preventDefault();
                                      navigator.clipboard.writeText(item.address);
                                      showToast(`📋 '${item.placeName || item.address}' 주소가 복사되었습니다!`);
                                      triggerHaptic(20);
                                    }}
                                    className="px-2 py-0.5 rounded-lg bg-white hover:bg-slate-100 border border-slate-200 text-slate-600 font-bold text-[10px] transition active:scale-95 flex items-center space-x-0.5"
                                    title="주소 복사"
                                  >
                                    <span>📋 주소복사</span>
                                  </button>
                                )}
                              </div>
                            </div>
                          )}

                          {/* 메모 및 등록된 웹/지도 링크 */}
                          {(memoCleanText || memoExtractedUrl || directUrl) && (
                            <div className="space-y-1.5">

                        여행 일정과 시간대별 타임테이블, 맛집, 숙박, 볼거리 코스를 PDF로 저장하거나 인쇄하세요.
                      </p>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => setIsTripPdfModalOpen(false)}
                    className="p-1.5 rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition"
                  >
                    ✕
                  </button>
                </div>

                {/* 인쇄 및 PDF 다운로드용 여행 일정 리포트 본문 */}
                <div id="trip-printable-report" className="overflow-y-auto my-3 p-4 sm:p-6 bg-slate-50/70 rounded-2xl border border-slate-200 space-y-5 flex-1">
                  {/* 리포트 헤더 배너 */}
                  <div className="bg-gradient-to-r from-emerald-600 to-teal-700 rounded-2xl p-5 text-white space-y-2.5 shadow-sm">
                    <div className="flex items-center justify-between">
                      <span className="text-3xl">{currentTrip.coverEmoji || '✈️'}</span>
                      <span className="text-[11px] font-bold px-2.5 py-1 rounded-full bg-white/20 border border-white/25">
                        가족 여행 플래너 리포트
                      </span>
                    </div>
                    <h2 className="text-xl sm:text-2xl font-black tracking-tight">{currentTrip.title}</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs text-emerald-100 pt-1 border-t border-white/15">
                      <div><strong className="text-white">📍 여행지:</strong> {currentTrip.destination || '미정'}</div>
                      <div><strong className="text-white">📅 여행 기간:</strong> {currentTrip.startDate} ~ {currentTrip.endDate}</div>
                      <div><strong className="text-white">⏳ 총 일정:</strong> {tripDays.length}일간의 여정</div>
                    </div>
                    {currentTrip.memo && (
                      <div className="text-xs bg-white/15 p-2.5 rounded-xl text-emerald-50 italic">
                        "{currentTrip.memo}"
                      </div>
                    )}
                  </div>

                  {/* 일차별 타임테이블 표 / 목록 */}
                  <div className="space-y-4">
                    {tripDays.map((d) => {
                      const dayItems = (currentTrip.items || []).filter(i => Number(i.day) === d);
                      return (
                        <div key={d} className="bg-white rounded-2xl p-4 border border-slate-200 shadow-2xs space-y-3">
                          <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                            <span className="text-sm font-black text-emerald-800 flex items-center space-x-1.5">
                              <span>🚩</span>
                              <span>Day {d} 일정 ({dayItems.length}곳)</span>
                            </span>
                            <span className="text-xs text-slate-400">
                              {shiftDateString(currentTrip.startDate, d - 1)}
                            </span>
                          </div>

                          {dayItems.length === 0 ? (
                            <p className="text-xs text-slate-400 py-3 text-center">등록된 일정이 없습니다.</p>
                          ) : (
                            <div className="overflow-x-auto">
                              <table className="w-full text-xs text-left border-collapse">
                                <thead>
                                  <tr className="border-b border-slate-100 text-slate-400 text-[11px] bg-slate-50/50">
                                    <th className="py-2 px-2.5 font-bold">시간</th>
                                    <th className="py-2 px-2.5 font-bold">구분</th>
                                    <th className="py-2 px-2.5 font-bold">일정명 / 장소</th>
                                    <th className="py-2 px-2.5 font-bold">상세 주소 및 메모</th>
                                    <th className="py-2 px-2.5 font-bold text-right">예상 비용</th>
                                  </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                  {dayItems.map((item, idx) => {
                                    const cat = TRAVEL_CATEGORIES.find(c => c.id === item.category) || TRAVEL_CATEGORIES[0];
                                    return (
                                      <tr key={item.id} className="hover:bg-slate-50/80 transition">
                                        <td className="py-2.5 px-2.5 font-mono font-black text-slate-800 whitespace-nowrap">
                                          ⏰ {item.time || '미지정'}
                                        </td>
                                        <td className="py-2.5 px-2.5 whitespace-nowrap">
                                          <span className={`text-[10px] px-1.5 py-0.5 rounded-md font-bold border ${cat.color}`}>
                                            {cat.emoji} {cat.label}
                                          </span>
                                        </td>
                                        <td className="py-2.5 px-2.5 font-extrabold text-slate-900">
                                          <div>{item.title}</div>
                                          {item.placeName && (
                                            <div className="text-[11px] text-slate-500 font-normal">📍 {item.placeName}</div>
                                          )}
                                        </td>
                                        <td className="py-2.5 px-2.5 text-slate-600 text-[11px]">
                                          {item.address && <div>{item.address}</div>}
                                          {item.memo && <div className="text-emerald-700 italic">"{item.memo}"</div>}
                                        </td>
                                        <td className="py-2.5 px-2.5 text-right font-bold text-slate-700 whitespace-nowrap">
                                          {item.cost || '-'}
                                        </td>
                                      </tr>
                                    );
                                  })}
                                </tbody>
                              </table>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>

                  {/* 리포트 하단 푸터 안내 */}
                  <div className="pt-3 text-center text-[10px] text-slate-400 border-t border-slate-200">
                    생성일시: {new Date().toLocaleDateString()} {new Date().toLocaleTimeString()} • 행복이 가득한 우리 가족 플래너 🏡
                  </div>
                </div>

                {/* 모달 푸터 버튼 */}
                <div className="pt-3 border-t border-slate-100 flex items-center justify-between gap-2 shrink-0">
                  <button
                    type="button"
                    onClick={() => setIsTripPdfModalOpen(false)}
                    className="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-bold text-xs hover:bg-slate-50 transition"
                  >
                    닫기
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      triggerHaptic(20);
                      window.print();
                    }}
                    className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs shadow-md shadow-emerald-200 transition active:scale-95 flex items-center space-x-1.5"
                  >
                    <span>🖨️</span>
                    <span>여행 일정 인쇄 / PDF 다운로드</span>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function PraiseSection({
      isParent,
      currentMemberId,
      kidStickerStats,
      praiseLogs,
      praiseRewards = [],
      praiseRedeems = [],
      setIsResetPraiseConfirmOpen,
      handleOpenPraiseModal,
      handleRequestDeletePraise,
      handleOpenAddRewardModal,
      handleDeleteReward,
      handleRedeemReward,
      handleDeleteRedeemLog
    }) {
      const child1Stat = kidStickerStats.find(k => k.id === 'child1') || { available: 0, totalReceived: 0 };
      const child2Stat = kidStickerStats.find(k => k.id === 'child2') || { available: 0, totalReceived: 0 };

      return (
        <section className="bg-gradient-to-br from-amber-500/10 via-orange-500/5 to-yellow-500/10 rounded-3xl p-4 sm:p-6 border border-amber-200/80 shadow-sm space-y-5">
          {/* 상단 헤더 */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b border-amber-200/60 pb-3 gap-2">
            <div>
              <h2 className="text-base sm:text-lg font-black text-amber-900 flex items-center space-x-2">
                <span>🌟 주원·주아 칭찬 스티커 모음판</span>
                <span className="text-xs bg-amber-200/80 text-amber-900 px-2 py-0.5 rounded-full font-bold">
                  선물 교환 연동
                </span>
              </h2>
              <p className="text-xs text-amber-800/80 mt-0.5">멋진 행동으로 스티커를 모아 원하는 선물로 교환해보세요!</p>
            </div>

            <div className="flex items-center space-x-2 self-end sm:self-auto">
              {isParent && (
                <button
                  type="button"
                  onClick={() => setIsResetPraiseConfirmOpen(true)}
                  className="px-3 py-2 text-xs font-extrabold rounded-2xl bg-rose-100 hover:bg-rose-200 text-rose-700 border border-rose-200 transition shrink-0"
                  title="칭찬 스티커 전체 리셋"
                >
                  🧹 전체 리셋
                </button>
              )}

              {isParent ? (
                <button
                  type="button"
                  onClick={() => handleOpenPraiseModal('child1')}
                  className="px-3.5 py-2 text-xs font-extrabold rounded-2xl bg-amber-500 hover:bg-amber-600 text-white shadow-md shadow-amber-200 transition shrink-0"
                >
                  🎁 칭찬 스티커 선물하기
                </button>
              ) : (
                <div className="text-xs text-amber-900 bg-amber-100/80 px-3 py-1.5 rounded-xl font-bold border border-amber-200">
                  엄마, 아빠가 칭찬 스티커를 줄 수 있어요! 🎁
                </div>
              )}
            </div>
          </div>

          {/* 아이별 스티커 현황 카드 */}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {kidStickerStats.map((st) => (
              <div key={st.id} className="bg-white/95 backdrop-blur p-4 rounded-2xl border border-amber-200/80 shadow-xs flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <span className="text-3xl">{st.avatar}</span>
                  <div>
                    <div className="text-sm font-extrabold text-slate-900">{st.name} ({st.role})</div>
                    <div className="text-xs text-amber-800 font-medium mt-0.5">
                      남은 스티커 <span className="font-extrabold text-amber-600">{st.available ?? st.totalReceived}개</span>
                      <span className="text-[11px] text-slate-400 ml-1.5">(누적 {st.totalReceived}개)</span>
                    </div>
                  </div>
                </div>

                <div className="flex items-center space-x-2">
                  <div className="text-right">
                    <div className="bg-amber-100/90 text-amber-900 font-black text-xl px-3.5 py-1 rounded-2xl border border-amber-200 flex items-center space-x-1">
                      <span>🌟</span>
                      <span>{st.available ?? st.totalReceived}</span>
                    </div>
                  </div>
                  {isParent && (
                    <button
                      type="button"
                      onClick={() => handleOpenPraiseModal(st.id)}
                      className="px-2.5 py-2 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-xl transition"
                    >
                      + 칭찬
                    </button>
                  )}
                </div>
              </div>
            ))}
          </div>

          {/* 🎁 스티커 선물/보상 교환소 섹션 */}
          <div className="bg-white/80 backdrop-blur rounded-2xl p-3.5 sm:p-4 border border-amber-200/70 space-y-3">
            <div className="flex items-center justify-between border-b border-amber-100 pb-2">
              <div className="flex items-center space-x-2">
                <span className="text-lg">🎁</span>
                <div>
                  <h3 className="text-xs sm:text-sm font-black text-amber-950 flex items-center space-x-1.5">
                    <span>칭찬 스티커 선물 교환소</span>
                    <span className="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.2 rounded-md font-bold">
                      {praiseRewards.length}종류
                    </span>
                  </h3>
                  <p className="text-[11px] text-amber-700/80">모은 스티커로 원하는 선물을 교환해보세요!</p>
                </div>
              </div>
              {isParent && (
                <button
                  type="button"
                  onClick={handleOpenAddRewardModal}
                  className="text-[11px] font-bold text-amber-700 hover:text-amber-900 bg-amber-50 hover:bg-amber-100 px-2.5 py-1 rounded-xl border border-amber-200 transition"
                >
                  + 보상 추가
                </button>
              )}
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5">
              {praiseRewards.map((reward) => {
                const canChild1 = child1Stat.available >= reward.cost;
                const canChild2 = child2Stat.available >= reward.cost;
                const pct1 = Math.min(100, Math.round((child1Stat.available / reward.cost) * 100));
                const pct2 = Math.min(100, Math.round((child2Stat.available / reward.cost) * 100));

                const isChild1 = currentMemberId === 'child1';
                const isChild2 = currentMemberId === 'child2';
                const curCanRedeem = isChild1 ? canChild1 : isChild2 ? canChild2 : (canChild1 || canChild2);
                const curPct = isChild1 ? pct1 : isChild2 ? pct2 : Math.max(pct1, pct2);
                const curAvail = isChild1 ? child1Stat.available : isChild2 ? child2Stat.available : 0;

                return (
                  <div
                    key={reward.id}
                    className={`p-3 rounded-2xl border transition flex flex-col justify-between space-y-2 relative ${
                      curCanRedeem
                        ? 'bg-amber-50/60 border-amber-300 ring-1 ring-amber-300 shadow-xs'
                        : 'bg-white border-amber-100/90 shadow-2xs hover:shadow-xs'
                    }`}
                  >
                    {isParent && (
                      <button
                        type="button"
                        onClick={() => handleDeleteReward(reward.id)}
                        className="absolute top-2 right-2 text-slate-300 hover:text-rose-500 text-xs p-1"
                        title="보상 삭제"
                      >
                        ✕
                      </button>
                    )}
                    <div className="flex items-start space-x-2.5">
                      <span className="text-2xl shrink-0 p-1.5 bg-amber-50 rounded-xl">{reward.icon || '🎁'}</span>
                      <div className="min-w-0 pr-4 flex-1">
                        <div className="flex items-center space-x-1.5">
                          <div className="text-xs font-black text-slate-900 leading-snug truncate">{reward.title}</div>
                        </div>
                        <div className="flex items-center space-x-1.5 mt-0.5">
                          <span className="text-[11px] font-extrabold text-amber-600">🌟 {reward.cost}개 필요</span>
                          {curCanRedeem && (
                            <span className="text-[9px] bg-amber-500 text-white font-extrabold px-1.5 py-0.2 rounded-md shrink-0 animate-pulse">
                              교환 가능! 🎉
                            </span>
                          )}
                        </div>
                      </div>
                    </div>

                    {/* 스티커 목표 달성 게이지 바 */}
                    <div className="py-0.5 space-y-1">
                      {isChild1 || isChild2 ? (
                        <div>
                          <div className="flex justify-between text-[10px] font-bold">
                            <span className="text-slate-400">내 스티커 달성률</span>
                            <span className={curCanRedeem ? 'text-amber-600 font-black' : 'text-slate-500'}>
                              {curAvail} / {reward.cost}개 ({curPct}%)
                            </span>
                          </div>
                          <div className="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden mt-0.5">
                            <div
                              className={`h-full rounded-full transition-all duration-500 ${
                                curCanRedeem ? 'bg-gradient-to-r from-amber-400 to-yellow-400' : 'bg-slate-300'
                              }`}
                              style={{ width: `${curPct}%` }}
                            />
                          </div>
                        </div>
                      ) : (
                        <div className="space-y-1 text-[10px]">
                          <div className="flex items-center justify-between text-slate-500 font-bold">
                            <span>👦 주원: {child1Stat.available}/{reward.cost}개 ({pct1}%)</span>
                            <span>👧 주아: {child2Stat.available}/{reward.cost}개 ({pct2}%)</span>
                          </div>
                          <div className="grid grid-cols-2 gap-1.5">
                            <div className="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                              <div className={`h-full rounded-full ${canChild1 ? 'bg-emerald-400' : 'bg-slate-300'}`} style={{ width: `${pct1}%` }} />
                            </div>
                            <div className="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                              <div className={`h-full rounded-full ${canChild2 ? 'bg-amber-400' : 'bg-slate-300'}`} style={{ width: `${pct2}%` }} />
                            </div>
                          </div>
                        </div>
                      )}
                    </div>

                    <div className="pt-1">
                      {currentMemberId === 'child1' ? (
                        <button
                          type="button"
                          disabled={!canChild1}
                          onClick={() => handleRedeemReward('child1', reward)}
                          className={`w-full py-1.5 px-2 rounded-xl text-xs font-black transition ${
                            canChild1
                              ? 'bg-amber-500 hover:bg-amber-600 text-white shadow-xs active:scale-95'
                              : 'bg-slate-100 text-slate-400 cursor-not-allowed'
                          }`}
                        >
                          {canChild1 ? '🎁 내가 교환하기' : `스티커 ${reward.cost - child1Stat.available}개 부족`}
                        </button>
                      ) : currentMemberId === 'child2' ? (
                        <button
                          type="button"
                          disabled={!canChild2}
                          onClick={() => handleRedeemReward('child2', reward)}
                          className={`w-full py-1.5 px-2 rounded-xl text-xs font-black transition ${
                            canChild2
                              ? 'bg-amber-500 hover:bg-amber-600 text-white shadow-xs active:scale-95'
                              : 'bg-slate-100 text-slate-400 cursor-not-allowed'
                          }`}
                        >
                          {canChild2 ? '🎁 내가 교환하기' : `스티커 ${reward.cost - child2Stat.available}개 부족`}
                        </button>
                      ) : (
                        <div className="flex items-center space-x-1.5">
                          <button
                            type="button"
                            disabled={!canChild1}
                            onClick={() => handleRedeemReward('child1', reward)}
                            className={`flex-1 py-1 rounded-xl text-[11px] font-bold transition ${
                              canChild1
                                ? 'bg-emerald-500 hover:bg-emerald-600 text-white'
                                : 'bg-slate-100 text-slate-400 cursor-not-allowed'
                            }`}
                            title={`주원 교환 (보유 ${child1Stat.available}개)`}
                          >
                            주원 교환
                          </button>
                          <button
                            type="button"
                            disabled={!canChild2}
                            onClick={() => handleRedeemReward('child2', reward)}
                            className={`flex-1 py-1 rounded-xl text-[11px] font-bold transition ${
                              canChild2
                                ? 'bg-amber-500 hover:bg-amber-600 text-white'
                                : 'bg-slate-100 text-slate-400 cursor-not-allowed'
                            }`}
                            title={`주아 교환 (보유 ${child2Stat.available}개)`}
                          >
                            주아 교환
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>

            {/* 최근 교환 내역 */}
            {praiseRedeems.length > 0 && (
              <div className="mt-3 pt-2.5 border-t border-amber-100">
                <div className="text-[11px] font-extrabold text-amber-900 mb-1.5 flex items-center space-x-1">
                  <span>🎉 최근 선물 교환 기록</span>
                  <span className="text-[10px] text-slate-400 font-normal">({praiseRedeems.length}건)</span>
                </div>
                <div className="flex items-center space-x-2 overflow-x-auto no-scrollbar py-1">
                  {[...praiseRedeems]
                    .sort((a, b) => b.createdAt - a.createdAt)
                    .slice(0, 10)
                    .map((item) => (
                      <div
                        key={item.id}
                        className="shrink-0 bg-white px-2.5 py-1.5 rounded-xl border border-amber-200/70 shadow-2xs flex items-center space-x-2 text-xs"
                      >
                        <span>{item.rewardIcon || '🎁'}</span>
                        <div className="min-w-0">
                          <div className="font-black text-slate-800 text-[11px] truncate max-w-[120px]">
                            {item.memberName}: {item.rewardTitle}
                          </div>
                          <div className="text-[10px] text-amber-600 font-bold">
                            -🌟{item.cost}개 · {formatRelativeTime(item.createdAt)}
                          </div>
                        </div>
                        {isParent && (
                          <button
                            type="button"
                            onClick={() => handleDeleteRedeemLog(item.id)}
                            className="text-slate-300 hover:text-rose-500 font-bold p-0.5 ml-1"
                            title="교환 취소 및 스티커 환불"
                          >
                            ✕
                          </button>
                        )}
                      </div>
                    ))}
                </div>
              </div>
            )}
          </div>

          {/* 주원이와 주아가 받은 칭찬 내역 */}
          <div className="space-y-2 pt-1">
            <h3 className="text-xs font-bold text-amber-900">💬 주원이와 주아가 받은 칭찬 내역</h3>

            {praiseLogs.length === 0 ? (
              <div className="text-center py-6 bg-white/60 rounded-2xl border border-dashed border-amber-200 text-xs text-amber-800/60 font-bold">
                아직 등록된 칭찬 스티커가 없습니다. 상단의 '🎁 칭찬 스티커 선물하기'를 눌러 첫 스티커를 선물해 보세요!
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-60 overflow-y-auto no-scrollbar">
                {praiseLogs
                  .sort((a, b) => b.createdAt - a.createdAt)
                  .map((log) => (
                    <div key={log.id} className={`${Number(log.count) < 0 ? 'bg-rose-50/70 border-rose-200' : 'bg-white border-amber-100'} p-3 rounded-2xl border shadow-2xs flex items-start space-x-2.5`}>
                      <div className="relative shrink-0">
                        <span className="text-2xl">{log.stickerEmoji || '🌟'}</span>
                        {Number(log.count) !== 1 && (

                          </div>

                        <p className="text-xs text-slate-700 font-medium mt-0.5 truncate">{log.reason}</p>

                    </div>

            )}

        if (!isParent) return;

        const targetKid = KIDS_MEMBERS.find(k => k.id === kidId) || KIDS_MEMBERS[0];
        const logData = {
          fromMemberId: currentMember.id,
          fromMemberName: currentMember.name,

          finalMinutes: finalTotalMinutes,
          reason: reasonText || (deltaMinutes >= 0 ? `+${deltaMinutes}분 충전` : `${deltaMinutes}분 차감`),
          createdAt: Date.now()
        };

        try {
          if (dbRef.current) {
            await dbRef.current.collection('game_times').doc(targetKid.id).set({
              minutes: finalTotalMinutes,
              updatedAt: Date.now(),
              updatedBy: currentMember.name
            });
            await dbRef.current.collection('game_time_logs').add(logData);
          } else {
            setGameTimes(prev => ({ ...prev, [targetKid.id]: finalTotalMinutes }));
            setGameTimeLogs(prev => [...prev, { id: 'log_' + Date.now(), ...logData }]);
          }

          const sign = deltaMinutes > 0 ? `+${deltaMinutes}분 추가` : `${deltaMinutes}분 차감`;
          showToast(`🎮 ${targetKid.name}의 게임 시간이 ${sign}되었습니다! (잔여: ${finalTotalMinutes}분)`);
          triggerHaptic(deltaMinutes > 0 ? [30, 40, 30] : 40);
        } catch (err) {

        }
      };

        const currentVal = gameTimes[kidId] || 0;
        const inputMin = Math.abs(parseInt(gameTimeForm.minutes, 10) || 0);

        let delta = 0;
        let finalVal = currentVal;

        if (gameTimeForm.mode === 'add') {
          delta = inputMin;
          finalVal = currentVal + delta;
        } else if (gameTimeForm.mode === 'subtract') {
          delta = -inputMin;
          finalVal = Math.max(0, currentVal + delta);
        } else if (gameTimeForm.mode === 'set') {
          finalVal = inputMin;
          delta = finalVal - currentVal;
        }

        await applyGameTimeChange(kidId, delta, finalVal, gameTimeForm.reason.trim());
        setIsGameTimeModalOpen(false);

          setDeletingReadingLog(null);
          return;

        const logId = deletingReadingLog.id;
        const targetTitle = deletingReadingLog.bookTitle ? `《${deletingReadingLog.bookTitle}》` : '독서 기록';
        const childName = deletingReadingLog.childName;
        const childId = deletingReadingLog.childId;

        // 삭제 전후 레벨 변화 계산
        const kidLogs = readingLogs.filter(l => l.childId === childId);
        const prevTotalMins = kidLogs.reduce((acc, l) => acc + (Number(l.minutes) || 0), 0);
        const prevLevelInfo = getReadingLevelInfo(prevTotalMins);

        const remainingLogs = kidLogs.filter(l => l.id !== logId);
        const newTotalMins = remainingLogs.reduce((acc, l) => acc + (Number(l.minutes) || 0), 0);
        const newLevelInfo = getReadingLevelInfo(newTotalMins);

        const isLevelDown = newLevelInfo.level < prevLevelInfo.level;
        const demotedLevels = [];

          for (let lvl = prevLevelInfo.level; lvl > newLevelInfo.level; lvl--) {
            const lvlConfig = READING_LEVELS.find(l => l.level === lvl);
            if (lvlConfig && lvlConfig.rewardStickers > 0) {

          if (isLevelDown && totalDeductedStickers > 0) {
