<!DOCTYPE html>

<head>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts (Noto Sans KR) -->

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.FirebaseSDK = {
      initializeApp, getAuth, signInAnonymously, signInWithCustomToken,
      getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc, deleteDoc
    };
  </script>
</head>
<body class="bg-slate-50 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 가족 멤버 프로필 정의 (첫째: 김주원, 둘째: 김주아)
    const FAMILY_MEMBERS = [
      {
        id: 'dad',
        name: '아빠',
        role: '아빠',
        avatar: '👨‍💼',
        badgeBg: 'bg-blue-100 text-blue-800 border-blue-300',
        activeBg: 'bg-blue-600 text-white shadow-blue-200',
        cardBg: 'bg-gradient-to-br from-blue-50/90 to-indigo-50/50 border-blue-200/80',
        barColor: 'bg-blue-500',
        ringColor: 'ring-blue-400',
        textColor: 'text-blue-600'
      },
      {
        id: 'mom',
        name: '엄마',
        role: '엄마',
        avatar: '👩‍💼',
        badgeBg: 'bg-rose-100 text-rose-800 border-rose-300',
        activeBg: 'bg-rose-500 text-white shadow-rose-200',
        cardBg: 'bg-gradient-to-br from-rose-50/90 to-pink-50/50 border-rose-200/80',
        barColor: 'bg-rose-500',
        ringColor: 'ring-rose-400',
        textColor: 'text-rose-600'
      },
      {
        id: 'child1',
        name: '김주원',
        role: '첫째',
        avatar: '👦',
        badgeBg: 'bg-emerald-100 text-emerald-800 border-emerald-300',
        activeBg: 'bg-emerald-600 text-white shadow-emerald-200',
        cardBg: 'bg-gradient-to-br from-emerald-50/90 to-teal-50/50 border-emerald-200/80',
        barColor: 'bg-emerald-500',
        ringColor: 'ring-emerald-400',
        textColor: 'text-emerald-600'
      },
      {
        id: 'child2',
        name: '김주아',
        role: '둘째',
        avatar: '👧',
        badgeBg: 'bg-amber-100 text-amber-800 border-amber-300',
        activeBg: 'bg-amber-500 text-white shadow-amber-200',
        cardBg: 'bg-gradient-to-br from-amber-50/90 to-orange-50/50 border-amber-200/80',
        barColor: 'bg-amber-500',
        ringColor: 'ring-amber-400',
        textColor: 'text-amber-600'
      }
    ];

    // 모바일 원터치 빠른 상태 프리셋
    const QUICK_STATUS_PRESETS = [
      { text: '🏫 학원 도착했어요!', emoji: '🏫' },
      { text: '🚗 집으로 출발해요~', emoji: '🚗' },
      { text: '📚 열공하는 중!', emoji: '🚀' },
      { text: '🏠 집에 잘 도착했어요!', emoji: '🏠' },
      { text: '🍱 밥 먹고 있어요', emoji: '🍱' },
      { text: '😴 잠깐 쉬는 중이에요', emoji: '😴' }
    ];

    // 카테고리 태그
    const CATEGORIES = {
      school: { name: '학교/학원', color: 'bg-indigo-50 text-indigo-700 border-indigo-200' },
      study: { name: '숙제/공부', color: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
      activity: { name: '운동/취미', color: 'bg-orange-50 text-orange-700 border-orange-200' },
      work: { name: '업무/외근', color: 'bg-blue-50 text-blue-700 border-blue-200' },
      home: { name: '집안일/돌봄', color: 'bg-pink-50 text-pink-700 border-pink-200' },
      family: { name: '가족 모임/식사', color: 'bg-purple-50 text-purple-700 border-purple-200' }
    };

    // 칭찬 스티커
    const STICKER_ICONS = [
      { key: 'thumb', emoji: '👍', label: '최고야' },
      { key: 'heart', emoji: '❤️', label: '사랑해' },
      { key: 'star', emoji: '🌟', label: '대단해' },
      { key: 'clap', emoji: '👏', label: '멋져요' },
      { key: 'fire', emoji: '🔥', label: '파이팅' }
    ];

    const getTodayString = (offsetDays = 0) => {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const formatRelativeTime = (timestamp) => {
      if (!timestamp) return '미등록';
      const diffMinutes = Math.floor((Date.now() - timestamp) / 60000);
      if (diffMinutes < 1) return '방금 전';
      if (diffMinutes < 60) return `${diffMinutes}분 전`;
      const diffHours = Math.floor(diffMinutes / 60);
      if (diffHours < 24) return `${diffHours}시간 전`;
      return new Date(timestamp).toLocaleDateString([], { month: 'numeric', day: 'numeric' });
    };

    function App() {
      const [user, setUser] = useState(null);
      const [currentMemberId, setCurrentMemberId] = useState('child1'); // 기본: 김주원
      const [selectedDate, setSelectedDate] = useState(getTodayString(0));
      const [viewMode, setViewMode] = useState('today');
      const [filterMemberId, setFilterMemberId] = useState('all');
      
      const [schedules, setSchedules] = useState([]);
      const [statusMessages, setStatusMessages] = useState({});
      const [isLoading, setIsLoading] = useState(true);
      const [useFirebase, setUseFirebase] = useState(false);
      
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [isShareModalOpen, setIsShareModalOpen] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      const [newSchedule, setNewSchedule] = useState({
        title: '',
        memberId: 'child1',
        date: getTodayString(0),
        startTime: '16:00',
        endTime: '17:00',
        category: 'school',
        notes: ''
      });

      const [myStatusInput, setMyStatusInput] = useState('');
      const [myEmoji, setMyEmoji] = useState('😊');

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      // 클라우드 DB 및 인증 동기화
      useEffect(() => {
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-schedule-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

        if (firebaseConfig && window.FirebaseSDK) {
          try {
            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, collection, onSnapshot } = window.FirebaseSDK;
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            const authenticate = async () => {
              if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
              } else {
                await signInAnonymously(auth);
              }
            };

            authenticate().then(() => {
              setUser(auth.currentUser);
              setUseFirebase(true);
              setIsLoading(true);

              const schedCol = collection(db, 'artifacts', appId, 'public', 'data', 'schedules');
              onSnapshot(schedCol, (snapshot) => {
                const list = [];
                snapshot.forEach(docSnap => list.push({ id: docSnap.id, ...docSnap.data() }));
                setSchedules(list);
                setIsLoading(false);
              }, () => setIsLoading(false));

              const statusCol = collection(db, 'artifacts', appId, 'public', 'data', 'status_messages');
              onSnapshot(statusCol, (snapshot) => {
                const msgs = {};
                snapshot.forEach(docSnap => msgs[docSnap.id] = docSnap.data());
                setStatusMessages(msgs);
              });
            }).catch(() => {
              setIsLoading(false);
              seedDefaultLocalData();
            });
          } catch(e) {
            setIsLoading(false);
            seedDefaultLocalData();
          }
        } else {
          setIsLoading(false);
          seedDefaultLocalData();
        }
      }, []);

      const seedDefaultLocalData = () => {
        if (schedules.length > 0) return;
        const initialItems = [
          {
            id: 'demo-1',
            title: '영어 학원 (리딩 & 스피킹)',
            memberId: 'child1',
            date: getTodayString(0),
            startTime: '15:30',
            endTime: '17:00',
            category: 'school',
            status: 'in_progress',
            notes: '과제 교재 42쪽 챙겨가기',
            stickers: { fire: 2, thumb: 1 }
          },
          {
            id: 'demo-2',
            title: '수학 문제집 3장 풀기',
            memberId: 'child1',
            date: getTodayString(0),
            startTime: '17:30',
            endTime: '18:30',
            category: 'study',
            status: 'pending',
            notes: '분수의 덧셈과 뺄셈 복습',
            stickers: {}
          },
          {
            id: 'demo-3',
            title: '피아노 학원 레슨',
            memberId: 'child2',
            date: getTodayString(0),
            startTime: '14:30',
            endTime: '15:30',
            category: 'school',
            status: 'completed',
            notes: '바이엘 4권 연습곡 완주!',
            stickers: { clap: 3, star: 2 }
          },
          {
            id: 'demo-4',
            title: '태권도 수련 & 줄넘기',
            memberId: 'child2',
            date: getTodayString(0),
            startTime: '16:00',
            endTime: '17:00',
            category: 'activity',
            status: 'in_progress',
            notes: '도복 챙기기 & 품새 연습',
            stickers: { thumb: 1 }
          },
          {
            id: 'demo-5',
            title: '퇴근 후 주원/주아 픽업',
            memberId: 'dad',
            date: getTodayString(0),
            startTime: '18:10',
            endTime: '18:40',
            category: 'family',
            status: 'pending',
            notes: '학원 앞에서 만나 함께 귀가',
            stickers: { heart: 2 }
          },
          {
            id: 'demo-6',
            title: '온 가족 저녁 식사 & 대화',
            memberId: 'mom',
            date: getTodayString(0),
            startTime: '19:00',
            endTime: '20:00',
            category: 'family',
            status: 'pending',
            notes: '맛있는 저녁 찌개 함께하기',
            stickers: { heart: 3 }
          }
        ];

        setSchedules(initialItems);
        setStatusMessages({
          child1: { text: '영어 학원 도착해서 수업 듣는 중이에요! 📚', emoji: '🏫', updatedAt: Date.now() },
          child2: { text: '피아노 끝나고 태권도장 왔어요! 🥋', emoji: '🚀', updatedAt: Date.now() - 1000 * 60 * 15 },
          dad: { text: '업무 마무리 중! 6시에 픽업 출발해요 🚗', emoji: '🚗', updatedAt: Date.now() - 1000 * 60 * 30 },
          mom: { text: '맛있는 저녁 준비해두고 기다릴게요 💕', emoji: '🏠', updatedAt: Date.now() - 1000 * 60 * 45 }
        });
      };

      const currentMember = useMemo(() => {
        return FAMILY_MEMBERS.find(m => m.id === currentMemberId) || FAMILY_MEMBERS[0];
      }, [currentMemberId]);

      // 상태 변경
      const handleStatusChange = async (scheduleId, newStatus) => {
        if (useFirebase && window.FirebaseSDK) {
          try {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-schedule-app';
            const db = window.FirebaseSDK.getFirestore();
            await window.FirebaseSDK.updateDoc(window.FirebaseSDK.doc(db, 'artifacts', appId, 'public', 'data', 'schedules', scheduleId), {
              status: newStatus, updatedAt: Date.now()
            });
          } catch(e) {}
        } else {
          setSchedules(prev => prev.map(s => s.id === scheduleId ? { ...s, status: newStatus } : s));
        }
        const label = newStatus === 'completed' ? '완료 🎉' : newStatus === 'in_progress' ? '진행 중 🚀' : '대기 중 ⏳';
        showToast(`일정이 [${label}] 상태로 변경되었습니다.`);
      };

      // 일정 삭제
      const handleDeleteSchedule = async (scheduleId) => {
        if (useFirebase && window.FirebaseSDK) {
          try {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-schedule-app';
            const db = window.FirebaseSDK.getFirestore();
            await window.FirebaseSDK.deleteDoc(window.FirebaseSDK.doc(db, 'artifacts', appId, 'public', 'data', 'schedules', scheduleId));
          } catch(e) {}
        } else {
          setSchedules(prev => prev.filter(s => s.id !== scheduleId));
        }
        showToast("일정이 삭제되었습니다.");
      };

      // 새 일정 등록
      const handleCreateSchedule = async (e) => {
        e.preventDefault();
        if (!newSchedule.title.trim()) return;

        const item = {
          ...newSchedule,
          status: 'pending',
          stickers: {},
          createdAt: Date.now()
        };

        if (useFirebase && window.FirebaseSDK) {
          try {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-schedule-app';
            const db = window.FirebaseSDK.getFirestore();
            await window.FirebaseSDK.addDoc(window.FirebaseSDK.collection(db, 'artifacts', appId, 'public', 'data', 'schedules'), item);
          } catch(e) {}
        } else {
          setSchedules(prev => [{ ...item, id: 'demo-' + Date.now() }, ...prev]);
        }

        setIsAddModalOpen(false);
        setNewSchedule({
          title: '',
          memberId: currentMemberId,
          date: selectedDate,
          startTime: '16:00',
          endTime: '17:00',
          category: 'school',
          notes: ''
        });
        showToast("새 일정이 등록되어 온 가족에게 공유되었습니다! ✨");
      };

      // 스티커 전송
      const handleSendSticker = async (scheduleId, stickerKey) => {
        const target = schedules.find(s => s.id === scheduleId);
        if (!target) return;
        const currentCount = (target.stickers && target.stickers[stickerKey]) || 0;

        if (useFirebase && window.FirebaseSDK) {
          try {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-schedule-app';
            const db = window.FirebaseSDK.getFirestore();
            await window.FirebaseSDK.updateDoc(window.FirebaseSDK.doc(db, 'artifacts', appId, 'public', 'data', 'schedules', scheduleId), {
              [`stickers.${stickerKey}`]: currentCount + 1,
              lastCheeredBy: currentMember.name,
              lastCheeredAt: Date.now()
            });
          } catch(e) {}
        } else {
          setSchedules(prev => prev.map(s => {
            if (s.id === scheduleId) {
              const updatedStickers = { ...(s.stickers || {}), [stickerKey]: currentCount + 1 };
              return { ...s, stickers: updatedStickers, lastCheeredBy: currentMember.name };
            }
            return s;
          }));
        }
        showToast(`${currentMember.name}님이 응원 스티커를 보냈습니다! 💖`);
      };

      // 상태 메시지 전송
      const sendStatusMessage = async (text, emoji = '😊') => {
        if (!text.trim()) return;

        if (useFirebase && window.FirebaseSDK) {
          try {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-schedule-app';
            const db = window.FirebaseSDK.getFirestore();
            await window.FirebaseSDK.setDoc(window.FirebaseSDK.doc(db, 'artifacts', appId, 'public', 'data', 'status_messages', currentMember.id), {
              memberId: currentMember.id,
              memberName: currentMember.name,
              text: text.trim(),
              emoji: emoji,
              updatedAt: Date.now()
            });
          } catch(e) {}
        } else {
          setStatusMessages(prev => ({
            ...prev,
            [currentMember.id]: { memberId: currentMember.id, text: text.trim(), emoji: emoji, updatedAt: Date.now() }
          }));
        }
        setMyStatusInput('');
        showToast(`${currentMember.name}님의 실시간 현황이 공유되었습니다! 📢`);
      };

      // 날짜 필터링
      const filteredSchedules = useMemo(() => {
        return schedules
          .filter((item) => {
            const matchDate = item.date === selectedDate;
            const matchMember = filterMemberId === 'all' || item.memberId === filterMemberId;
            return matchDate && matchMember;
          })
          .sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));
      }, [schedules, selectedDate, filterMemberId]);

      // 주간 7일 날짜
      const weekDays = useMemo(() => {
        const curr = new Date(selectedDate);
        const day = curr.getDay();
        const sunday = new Date(curr);
        sunday.setDate(curr.getDate() - day);

        const days = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(sunday);
          d.setDate(sunday.getDate() + i);
          const dateStr = d.toISOString().split('T')[0];
          const dayName = ['일', '월', '화', '수', '목', '금', '토'][i];
          days.push({ dateStr, dayName, dayNumber: d.getDate(), isToday: dateStr === getTodayString(0) });
        }
        return days;
      }, [selectedDate]);

      // 오늘 통계
      const stats = useMemo(() => {
        const todayItems = schedules.filter(s => s.date === selectedDate);
        const total = todayItems.length;
        const completed = todayItems.filter(s => s.status === 'completed').length;
        const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

        const memberStats = FAMILY_MEMBERS.map(m => {
          const mItems = todayItems.filter(s => s.memberId === m.id);
          const mTotal = mItems.length;
          const mCompleted = mItems.filter(s => s.status === 'completed').length;
          const mPercentage = mTotal > 0 ? Math.round((mCompleted / mTotal) * 100) : 0;
          return { ...m, total: mTotal, completed: mCompleted, percentage: mPercentage };
        });

        return { total, completed, percentage, memberStats };
      }, [schedules, selectedDate]);

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 flex flex-col font-sans pb-16 antialiased">
          
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-xs">
            <div className="max-w-5xl mx-auto px-3.5 sm:px-4 py-2.5 sm:py-3 flex items-center justify-between">
              <div className="flex items-center space-x-2.5">
                <div className="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white text-lg sm:text-xl shadow-md shadow-indigo-100 shrink-0">
                  🏡
                </div>
                <div>
                  <div className="flex items-center space-x-1.5">
                    <h1 className="text-base sm:text-lg font-bold text-slate-900 tracking-tight">우리집 커넥트</h1>
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse mr-1"></span>
                      {useFirebase ? '실시간 DB' : '데모 동기화'}
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-500 truncate max-w-[170px] sm:max-w-none">
                    주원·주아·아빠·엄마의 실시간 하루
                  </p>
                </div>
              </div>

              <div className="flex items-center space-x-1.5 sm:space-x-2">
                <button
                  onClick={() => setIsShareModalOpen(true)}
                  className="p-2 sm:px-3 sm:py-1.5 text-xs font-bold rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition flex items-center space-x-1"
                >
                  <i className="fa-solid fa-mobile-screen text-slate-600"></i>
                  <span className="hidden sm:inline ml-1">기기 연동</span>
                </button>
                <button
                  onClick={() => {
                    setNewSchedule(prev => ({ ...prev, memberId: currentMemberId, date: selectedDate }));
                    setIsAddModalOpen(true);
                  }}
                  className="px-3 py-1.5 text-xs font-bold rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-md shadow-indigo-200 transition flex items-center space-x-1 active:scale-95"

                          className={`p-1.5 rounded-xl border text-center transition ${
                            newSchedule.memberId === m.id ? `${m.activeBg} font-bold ring-2 ring-indigo-400` : 'bg-white border-slate-200 text-slate-700'
                          }`}
                        >
                          <div className="text-lg">{m.avatar}</div>
                          <div className="text-[11px] truncate">{m.name}</div>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">일정 제목 *</label>
                    <input
                      type="text"
                      required
                      value={newSchedule.title}
                      onChange={(e) => setNewSchedule({ ...newSchedule, title: e.target.value })}
                      placeholder="예: 영어 학원, 피아노, 줄넘기"
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">카테고리</label>
                    <div className="grid grid-cols-3 gap-1">
                      {Object.keys(CATEGORIES).map((ck) => (
                        <button
                          type="button"
                          key={ck}
                          onClick={() => setNewSchedule({ ...newSchedule, category: ck })}
                          className={`px-2 py-1.5 rounded-lg border text-xs font-semibold ${
                            newSchedule.category === ck ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-600 border-slate-200'
                          }`}
                        >
                          {CATEGORIES[ck].name}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">날짜</label>
                      <input
                        type="date"
                        value={newSchedule.date}
                        onChange={(e) => setNewSchedule({ ...newSchedule, date: e.target.value })}
                        className="w-full px-2 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs"
                      />
                    </div>
                    <div className="grid grid-cols-2 gap-1">
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">시작</label>
                        <input
                          type="time"
                          value={newSchedule.startTime}
                          onChange={(e) => setNewSchedule({ ...newSchedule, startTime: e.target.value })}
                          className="w-full px-1.5 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs"
                        />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">종료</label>
                        <input
                          type="time"
                          value={newSchedule.endTime}
                          onChange={(e) => setNewSchedule({ ...newSchedule, endTime: e.target.value })}
                          className="w-full px-1.5 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs"
                        />
                      </div>
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">메모 / 준비물</label>
                    <input
                      type="text"
                      value={newSchedule.notes}
                      onChange={(e) => setNewSchedule({ ...newSchedule, notes: e.target.value })}
                      placeholder="예: 교재 챙기기, 끝나고 연락하기"
                      className="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs"
                    />
                  </div>

                  <div className="pt-2 flex items-center space-x-2">
                    <button
                      type="button"
                      onClick={() => setIsAddModalOpen(false)}
                      className="flex-1 py-2 rounded-xl border border-slate-200 text-slate-600 font-bold"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold"
                    >
                      등록
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isShareModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3.5 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl border border-slate-100 space-y-3.5">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                  <h3 className="text-base font-bold text-slate-900">가족 기기 실시간 연동</h3>
                  <button
                    onClick={() => setIsShareModalOpen(false)}
                    className="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 font-bold text-xs"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-2.5 text-xs text-slate-600">
                  <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-2xl flex items-start space-x-2">
                    <i className="fa-solid fa-check text-emerald-600 text-sm mt-0.5"></i>
                    <div>
                      <h4 className="font-bold text-emerald-900">실시간 클라우드 동기화 완료</h4>
                      <p className="text-emerald-700 text-[11px] mt-0.5">
                        가족 스마트폰에서 접속하면 모든 일정과 한 줄 현황이 실시간으로 공유됩니다.
                      </p>
                    </div>
                  </div>
                  <p className="text-slate-500 text-[11px] bg-slate-50 p-2.5 rounded-xl">
                    💡 스마트폰 브라우저 메뉴에서 <b>'홈 화면에 추가'</b>를 누르면 일반 앱처럼 편하게 접속할 수 있습니다.
                  </p>
                </div>

                <button
                  onClick={() => setIsShareModalOpen(false)}
                  className="w-full py-2 rounded-xl bg-slate-900 text-white font-bold text-xs"
                >
                  닫기
                </button>
              </div>
            </div>
          )}

          {toastMessage && (
            <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 backdrop-blur text-white px-3.5 py-2 rounded-2xl shadow-xl text-xs font-bold flex items-center space-x-1.5 border border-slate-700 animate-in slide-in-from-bottom duration-300">
              <i className="fa-solid fa-sparkles text-amber-400"></i>
              <span className="ml-1">{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
