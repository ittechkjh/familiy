    const calculateDDay = (dateStr, isAnnual = false) => {
      if (!dateStr) return { text: '', diffDays: 0, isToday: false };
      const parts = dateStr.split('-').map(Number);
      if (parts.length !== 3) return { text: '', diffDays: 0, isToday: false };
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      let target = new Date(parts[0], parts[1] - 1, parts[2]);

      if (isAnnual) {
        target.setFullYear(now.getFullYear());
        if (target < today) {
          target.setFullYear(now.getFullYear() + 1);
        }
      }

      const diffTime = target.getTime() - today.getTime();
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays === 0) return { text: 'D-Day 오늘! 🎉', diffDays: 0, isToday: true };
      if (diffDays > 0) return { text: `D-${diffDays}`, diffDays, isToday: false };
      return { text: `D+${Math.abs(diffDays)}`, diffDays, isToday: false };
    };

    const getTodayString = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const triggerHaptic = (pattern = 20) => {

    };

    const formatRelativeTime = (timestamp) => {
      if (!timestamp) return '미등록';
      const diffMinutes = Math.floor((Date.now() - timestamp) / 60000);
      if (diffMinutes < 1) return '방금 전';
      if (diffMinutes < 60) return `${diffMinutes}분 전`;
      const diffHours = Math.floor(diffMinutes / 60);
      if (diffHours < 24) return `${diffHours}시간 전`;
      return new Date(timestamp).toLocaleDateString([], { month: 'numeric', day: 'numeric' });
    };

    const formatMinutesToHours = (totalMinutes) => {
      const mins = Number(totalMinutes) || 0;
      if (mins <= 0) return '0분';
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      if (h === 0) return `${m}분`;
      if (m === 0) return `${h}시간`;
      return `${h}시간 ${m}분`;
    };

    const isScheduleOnDate = (item, dateStr) => {
      if (!item || !item.date || !dateStr) return false;
      const start = item.date;
      const end = (item.endDate && item.endDate >= item.date) ? item.endDate : item.date;
      return dateStr >= start && dateStr <= end;
    };

    const createGoogleCalendarUrl = (item) => {
      const title = encodeURIComponent(`[우리집] ${item.title}`);
      const notes = encodeURIComponent(item.notes ? `메모: ${item.notes}` : '');
      const startDateFormatted = item.date.replace(/-/g, '');
      const endDateFormatted = (item.endDate && item.endDate >= item.date ? item.endDate : item.date).replace(/-/g, '');
      const startFormatted = (item.startTime || '09:00').replace(/:/g, '') + '00';
      const endFormatted = (item.endTime || '10:00').replace(/:/g, '') + '00';
      const dates = `${startDateFormatted}T${startFormatted}/${endDateFormatted}T${endFormatted}`;
      return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dates}&details=${notes}`;
    };

    // 신규: 주원·주아 독서 시간 기록, 1주일 단위 분석, 누적 명예의 전당 & 레벨 컴포넌트
    function ReadingSection({ isParent, currentMember, readingLogs, handleOpenReadingModal, handleRequestDeleteReadingLog, handleRequestResetReading }) {
      const [selectedWeekOffset, setSelectedWeekOffset] = useState(0);
      const [isLevelGuideOpen, setIsLevelGuideOpen] = useState(false);
      const [isBookshelfOpen, setIsBookshelfOpen] = useState(false);
      const [bookshelfFilter, setBookshelfFilter] = useState('all');
      const [readingKidFilter, setReadingKidFilter] = useState('all');
      const [readingSearchQuery, setReadingSearchQuery] = useState('');
      const [isRecommendedBooksOpen, setIsRecommendedBooksOpen] = useState(false);
      const [recommendedGradeFilter, setRecommendedGradeFilter] = useState('all'); // 'all', 'low', 'mid', 'high', 'month'
      const [recommendedSearchQuery, setRecommendedSearchQuery] = useState('');

      // 기준 주의 월요일 ~ 일요일 7일 계산
      const weekDays = useMemo(() => {
        const now = new Date();
        now.setDate(now.getDate() + (selectedWeekOffset * 7));
        const day = now.getDay();
        const diffToMon = day === 0 ? -6 : 1 - day;
        const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMon);
        const days = [];
        for (let i = 0; i < 7; i++) {
          const cur = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i);
          const dateStr = `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, '0')}-${String(cur.getDate()).padStart(2, '0')}`;
          const dayName = ['월', '화', '수', '목', '금', '토', '일'][i];
          days.push({ dateStr, dayName, dayNum: cur.getDate(), isToday: dateStr === getTodayString() });
        }
        return days;
      }, [selectedWeekOffset]);

      const weekDatesSet = useMemo(() => new Set(weekDays.map(w => w.dateStr)), [weekDays]);

      // 주원·주아 통계 계산 (누적 시간, 레벨, 스트릭, 완독 권수 등)
      const kidStats = useMemo(() => {
        return KIDS_MEMBERS.map(kid => {
          const kidLogs = readingLogs.filter(l => l.childId === kid.id);
          const totalMinutes = kidLogs.reduce((acc, l) => acc + (Number(l.minutes) || 0), 0);
          const levelInfo = getReadingLevelInfo(totalMinutes);

          const weekLogs = kidLogs.filter(l => weekDatesSet.has(l.date));
          const weekMinutes = weekLogs.reduce((acc, l) => acc + (Number(l.minutes) || 0), 0);

          // 일별 독서 시간 맵
          const dailyMap = {};
          weekDays.forEach(w => { dailyMap[w.dateStr] = 0; });
          weekLogs.forEach(l => {
            if (dailyMap[l.date] !== undefined) {
              dailyMap[l.date] += Number(l.minutes) || 0;
            }
          });

          // 주간 최고 기록 계산 (월요일 기준 주차별 집계 중 최대치)
          const weekAggMap = {};
          kidLogs.forEach(l => {
            if (!l.date) return;
            const parts = l.date.split('-').map(Number);
            const d = new Date(parts[0], parts[1] - 1, parts[2]);
            const day = d.getDay();
            const diff = day === 0 ? -6 : 1 - day;
            const mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
            const weekKey = `${mon.getFullYear()}-${String(mon.getMonth() + 1).padStart(2, '0')}-${String(mon.getDate()).padStart(2, '0')}`;
            weekAggMap[weekKey] = (weekAggMap[weekKey] || 0) + (Number(l.minutes) || 0);
          });
          const weekTotals = Object.values(weekAggMap);
          const bestWeekMinutes = weekTotals.length > 0 ? Math.max(...weekTotals) : weekMinutes;
          const bestWeekFormatted = formatMinutesToHours(bestWeekMinutes);

          // 최근 읽은 책 로그 (최대 5건)
          const recentLogs = [...kidLogs].sort((a, b) => b.createdAt - a.createdAt).slice(0, 5);

          // 1. 연속 독서 스트릭 (Streak, N일 연속 독서 달성) 계산
          const validDates = new Set(kidLogs.filter(l => (Number(l.minutes) || 0) > 0).map(l => l.date));
          const now = new Date();
          const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
          const todayStr = fmt(now);
          const readToday = validDates.has(todayStr);

          let streak = 0;
          let checkD = new Date(now.getFullYear(), now.getMonth(), now.getDate());

          if (readToday) {
            streak = 1;
            checkD.setDate(checkD.getDate() - 1);
            while (validDates.has(fmt(checkD))) {
              streak++;
              checkD.setDate(checkD.getDate() - 1);
            }
          } else {
            // 오늘 아직 안 읽었으면 어제부터 거슬러 올라감
            checkD.setDate(checkD.getDate() - 1);
            if (validDates.has(fmt(checkD))) {
              streak = 1;
              checkD.setDate(checkD.getDate() - 1);
              while (validDates.has(fmt(checkD))) {
                streak++;
                checkD.setDate(checkD.getDate() - 1);
              }
            }
          }

          // 2. 완독한 책 목록
          const completedLogs = kidLogs.filter(l => l.isCompleted && l.bookTitle);

          return {
            ...kid,
            totalMinutes,
            totalFormatted: formatMinutesToHours(totalMinutes),
            levelInfo,
            weekLogs,
            weekMinutes,
            weekFormatted: formatMinutesToHours(weekMinutes),
            bestWeekMinutes,
            bestWeekFormatted,
            dailyMap,
            recentLogs,
            streak,
            readToday,
            completedLogs,
            completedCount: completedLogs.length
          };
        });
      }, [readingLogs, weekDatesSet, weekDays]);

      const child1 = kidStats.find(k => k.id === 'child1') || kidStats[0];
      const child2 = kidStats.find(k => k.id === 'child2') || kidStats[1];

      // 주간 독서왕 (Weekly Winner)
      const weeklyWinnerId = (child1.weekMinutes > child2.weekMinutes && child1.weekMinutes > 0)
        ? 'child1'
        : (child2.weekMinutes > child1.weekMinutes && child2.weekMinutes > 0)
        ? 'child2'
        : (child1.weekMinutes === child2.weekMinutes && child1.weekMinutes > 0)
        ? 'tie'
        : null;

      // 누적 명예의 전당 1위 (All-time Winner)
      const allTimeWinnerId = (child1.totalMinutes > child2.totalMinutes && child1.totalMinutes > 0)
        ? 'child1'
        : (child2.totalMinutes > child1.totalMinutes && child2.totalMinutes > 0)
        ? 'child2'
        : (child1.totalMinutes === child2.totalMinutes && child1.totalMinutes > 0)
        ? 'tie'
        : null;

      const totalFamilyWeekMinutes = (child1.weekMinutes || 0) + (child2.weekMinutes || 0);

      // 필터 및 검색이 적용된 독서 로그 목록
      const filteredReadingLogs = useMemo(() => {
        let list = [...readingLogs].sort((a, b) => b.createdAt - a.createdAt);
        if (readingKidFilter !== 'all') {
          list = list.filter(l => l.childId === readingKidFilter);
        }
        if (readingSearchQuery.trim()) {
          const q = readingSearchQuery.trim().toLowerCase();
          list = list.filter(l =>
            (l.bookTitle && l.bookTitle.toLowerCase().includes(q)) ||
            (l.notes && l.notes.toLowerCase().includes(q)) ||
            (l.childName && l.childName.toLowerCase().includes(q))
          );
        }
        return list;
      }, [readingLogs, readingKidFilter, readingSearchQuery]);

      return (
        <section className="bg-gradient-to-br from-amber-950 via-stone-900 to-amber-950 text-white rounded-3xl p-4 sm:p-6 shadow-xl border border-amber-500/20 space-y-5">
          {/* 헤더 */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 pb-3 border-b border-white/10">
            <div>
              <div className="flex items-center space-x-2">
                <span className="text-xl sm:text-2xl">📖</span>
                <h2 className="text-base sm:text-lg font-black tracking-tight text-white flex items-center space-x-2">
                  <span>주원·주아 독서 기록 & 명예의 전당</span>
                  <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-500/30 text-amber-200 border border-amber-400/30">
                    주간 분석 & 레벨 시스템
                  </span>
                </h2>
              </div>
              <p className="text-xs text-amber-200/80 mt-1">
                매일 책 읽는 시간을 1주일 단위로 기록하고, 누적 독서 시간으로 레벨업에 도전해요! 📚✨
              </p>
            </div>

            <div className="flex items-center space-x-1.5 self-start sm:self-auto shrink-0 flex-wrap gap-y-1">
              <button
                type="button"
                onClick={() => setIsLevelGuideOpen(true)}
                className="px-3 py-1.5 text-xs font-bold rounded-xl bg-white/10 hover:bg-white/20 text-amber-200 border border-white/15 transition active:scale-95"
              >
                🏅 레벨 등급표
              </button>
              <button
                type="button"
                onClick={() => setIsRecommendedBooksOpen(true)}
                className="px-3 py-1.5 text-xs font-bold rounded-xl bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-200 border border-indigo-400/40 transition active:scale-95 flex items-center space-x-1"
                title="초등학생 학년별 추천도서 100선 및 이달의 추천 보기"
              >
                <span>🌟</span>
                <span>추천도서 100선</span>
              </button>
              <button
                type="button"
                onClick={() => setIsBookshelfOpen(true)}
                className="px-3 py-1.5 text-xs font-bold rounded-xl bg-amber-400/20 hover:bg-amber-400/30 text-amber-200 border border-amber-400/40 transition active:scale-95 flex items-center space-x-1"
                title="완독한 책 서재 보기"
              >
                <span>📚</span>
                <span>완독 서재 ({readingLogs.filter(l => l.isCompleted && l.bookTitle).length}권)</span>
              </button>
              {isParent && (
                <button
                  type="button"
                  onClick={handleRequestResetReading}
                  className="px-3 py-1.5 text-xs font-extrabold rounded-xl bg-rose-500/20 hover:bg-rose-500/30 text-rose-200 border border-rose-400/30 transition active:scale-95 flex items-center space-x-1"
                  title="독서 기록 전체 리셋"
                >
                  <span>🧹</span>
                  <span>독서 기록 리셋</span>
                </button>
              )}
              {isParent && (
                <button
                  type="button"
                  onClick={() => handleOpenReadingModal('child1')}
                  className="px-3.5 py-1.5 text-xs font-extrabold rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white shadow-lg shadow-amber-500/20 transition active:scale-95"
                >
                  + 📖 독서 시간 기록
                </button>
              )}
            </div>
          </div>

          {/* 1. 누적 명예의 전당 & 레벨 카드 (주원 & 주아) */}
          <div className="space-y-2.5">
            <div className="flex items-center justify-between">
              <span className="text-xs font-black text-amber-300 flex items-center space-x-1">
                <span>🏆</span>
                <span>누적 독서 명예의 전당 & 레벨 달성 현황</span>
              </span>
              <span className="text-[10px] text-slate-300">누적 독서 시간에 따라 자동 레벨업!</span>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4">
              {kidStats.map((kid) => {
                const isWeeklyKing = weeklyWinnerId === kid.id || (weeklyWinnerId === 'tie' && kid.weekMinutes > 0);
                const isAllTimeKing = allTimeWinnerId === kid.id || (allTimeWinnerId === 'tie' && kid.totalMinutes > 0);

                return (
                  <div
                    key={kid.id}
                    className="bg-white/10 backdrop-blur-md rounded-2xl p-4 sm:p-5 border border-white/15 space-y-3 relative overflow-hidden flex flex-col justify-between"
                  >
                    {/* 상단 뱃지 및 프로필 */}
                    <div className="flex items-start justify-between">
                      <div className="flex items-center space-x-2.5">
                        <span className="text-3xl sm:text-4xl">{kid.avatar}</span>
                        <div>
                          <div className="flex items-center space-x-1.5">
                            <span className="text-sm sm:text-base font-black text-white">{kid.name}</span>
                            <span className="text-[10px] px-1.5 py-0.2 rounded-md bg-white/20 text-slate-200 font-bold">
                              {kid.role}
                            </span>
                          </div>
                          <div className="flex items-center space-x-1.5 mt-0.5">
                            <span className="text-xs font-extrabold text-amber-300 bg-amber-500/20 px-2 py-0.5 rounded-lg border border-amber-400/30 flex items-center space-x-1">
                              <span>{kid.levelInfo.icon}</span>
                              <span>Lv.{kid.levelInfo.level} {kid.levelInfo.title}</span>
                            </span>
                          </div>
                        </div>
                      </div>

                      {/* 트로피 / 왕관 & 연속 독서 스트릭 뱃지 */}
                      <div className="flex flex-col items-end space-y-1">
                        {kid.streak > 0 ? (
                          <span className={`text-[10px] font-black px-2 py-0.5 rounded-full shadow-xs flex items-center space-x-0.5 ${kid.readToday ? 'bg-orange-500 text-white animate-pulse' : 'bg-orange-400/30 text-orange-200 border border-orange-400/40'}`}>
                            <span>🔥</span>
                            <span>{kid.streak}일 연속 독서 {kid.readToday ? '달성!' : '유지 중'}</span>
                          </span>
                        ) : (
                          <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-white/10 text-slate-300 flex items-center space-x-0.5">
                            <span>🌱</span>
                            <span>오늘 독서 도전!</span>
                          </span>
                        )}
                        {kid.completedCount > 0 && (
                          <span className="text-[10px] font-extrabold bg-amber-400/20 text-amber-300 border border-amber-400/30 px-2 py-0.5 rounded-full flex items-center space-x-0.5">
                            <span>📚</span>
                            <span>완독 {kid.completedCount}권</span>
                          </span>
                        )}
                        {isWeeklyKing && (
                          <span className="text-[10px] font-black bg-amber-400 text-amber-950 px-2 py-0.5 rounded-full shadow-xs flex items-center space-x-0.5">
                            <span>👑</span>
                            <span>이번 주 독서왕!</span>
                          </span>
                        )}
                        {isAllTimeKing && (
                          <span className="text-[10px] font-black bg-gradient-to-r from-yellow-300 to-amber-400 text-amber-950 px-2 py-0.5 rounded-full shadow-xs flex items-center space-x-0.5">
                            <span>🏆</span>
                            <span>누적 명예의전당 1위</span>
                          </span>
                        )}
                      </div>
                    </div>

                    {/* 독서 시간 요약 (3분할: 총 누적 독서, 주간 최고 기록, 이번 주 독서) */}
                    <div className="grid grid-cols-3 gap-1.5 sm:gap-2 bg-black/25 p-2 sm:p-2.5 rounded-xl border border-white/10 text-center">
                      <div>
                        <div className="text-[9px] sm:text-[10px] text-slate-300 font-bold flex items-center justify-center space-x-0.5">
                          <span>📚</span>
                          <span>총 누적 독서</span>
                        </div>
                        <div className="text-xs sm:text-sm font-black text-amber-300 mt-0.5 truncate">
                          {kid.totalFormatted}
                        </div>
                        <div className="text-[9px] text-slate-400">({kid.totalMinutes}분)</div>
                      </div>
                      <div className="border-l border-white/10">
                        <div className="text-[9px] sm:text-[10px] text-slate-300 font-bold flex items-center justify-center space-x-0.5">
                          <span>🏅</span>
                          <span>주간 최고 기록</span>
                        </div>
                        <div className="text-xs sm:text-sm font-black text-yellow-300 mt-0.5 truncate">
                          {kid.bestWeekFormatted}
                        </div>
                        <div className="text-[9px] text-slate-400">({kid.bestWeekMinutes}분)</div>
                      </div>
                      <div className="border-l border-white/10">
                        <div className="text-[9px] sm:text-[10px] text-slate-300 font-bold flex items-center justify-center space-x-0.5">
                          <span>📅</span>
                          <span>이번 주 독서</span>
                        </div>
                        <div className="text-xs sm:text-sm font-black text-emerald-300 mt-0.5 truncate">
                          {kid.weekFormatted}
                        </div>
                        <div className="text-[9px] text-slate-400">({kid.weekMinutes}분)</div>
                      </div>
                    </div>

                    {/* 레벨 게이지 바 */}
                    <div className="space-y-1">
                      <div className="flex items-center justify-between text-[11px]">
                        <span className="font-bold text-slate-300">
                          다음 레벨 ({kid.levelInfo.next ? `Lv.${kid.levelInfo.next.level} ${kid.levelInfo.next.title}` : '최고 등급 달성!'})
                        </span>
                        <span className="font-black text-amber-300">{kid.levelInfo.progress}%</span>
                      </div>
                      <div className="w-full bg-white/15 h-2.5 rounded-full overflow-hidden p-0.5 border border-white/20">
                        <div
                          className="bg-gradient-to-r from-amber-400 via-orange-400 to-yellow-300 h-full rounded-full transition-all duration-500 shadow-xs"
                          style={{ width: `${kid.levelInfo.progress}%` }}
                        ></div>
                      </div>
                      <div className="text-[10px] text-slate-400 flex items-center justify-between">
                        <span>"{kid.levelInfo.desc}"</span>
                        {kid.levelInfo.next && (
                          <span className="text-amber-200 font-bold">
                            앞으로 {kid.levelInfo.remainingForNext}분 남음 {kid.levelInfo.next.rewardStickers > 0 ? `(달성 시 🌟 +${kid.levelInfo.next.rewardStickers}개)` : ''}
                          </span>
                        )}
                      </div>
                    </div>

                    {/* 빠른 기록 버튼 (엄마·아빠 전용) */}
                    {isParent && (
                      <button
                        type="button"
                        onClick={() => handleOpenReadingModal(kid.id)}
                        className="w-full py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white font-bold text-xs transition active:scale-95 border border-white/15 flex items-center justify-center space-x-1"
                      >
                        <span>+ {kid.name} 독서 시간 기록하기</span>
                      </button>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {/* 2. 1주일 단위 독서 분석 & 일별 그래프 */}
          <div className="bg-black/30 backdrop-blur rounded-2xl p-4 sm:p-5 border border-white/10 space-y-4">
            {/* 주간 네비게이션 */}
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2.5 border-b border-white/10">
              <div className="flex items-center space-x-2">
                <button
                  type="button"
                  onClick={() => setSelectedWeekOffset(prev => prev - 1)}
                  className="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-bold transition active:scale-90"
                  title="이전 주간"
                >
                  ◀ 이전 주
                </button>
                <span className="text-xs sm:text-sm font-extrabold text-white">
                  📅 {weekDays[0].dateStr.slice(5)} ({weekDays[0].dayName}) ~ {weekDays[6].dateStr.slice(5)} ({weekDays[6].dayName}) 주간
                </span>
                <button
                  type="button"
                  onClick={() => setSelectedWeekOffset(prev => prev + 1)}
                  className="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-bold transition active:scale-90"
                  title="다음 주간"
                >
                  다음 주 ▶
                </button>
                {selectedWeekOffset !== 0 && (
                  <button
                    type="button"
                    onClick={() => setSelectedWeekOffset(0)}
                    className="px-2 py-1 bg-amber-500/20 hover:bg-amber-500/40 text-amber-300 text-[10px] font-bold rounded-lg border border-amber-400/30 transition"
                  >
                    이번 주로 ↩
                  </button>
                )}
              </div>

              <div className="text-xs text-slate-300 font-bold flex items-center space-x-1">
                <span>가족 주간 독서 합계:</span>
                <span className="text-amber-300 font-black text-sm">{formatMinutesToHours(totalFamilyWeekMinutes)}</span>
                <span className="text-[10px] text-slate-400">({totalFamilyWeekMinutes}분)</span>
              </div>
            </div>

            {/* 일별 독서 시간 막대 그래프 (7일간) */}
            <div className="space-y-2">
              <div className="flex items-center justify-between text-[11px] text-slate-300 font-bold">
                <span>📊 일별 독서 시간 비교</span>
                <div className="flex items-center space-x-3 text-[10px]">
                  <span className="flex items-center space-x-1">
                    <span className="w-2.5 h-2.5 rounded-xs bg-indigo-400 inline-block"></span>
                    <span>주원</span>
                  </span>
                  <span className="flex items-center space-x-1">
                    <span className="w-2.5 h-2.5 rounded-xs bg-rose-400 inline-block"></span>
                    <span>주아</span>
                  </span>
                </div>
              </div>

              <div className="grid grid-cols-7 gap-1.5 sm:gap-2 pt-2">
                {weekDays.map((day) => {
                  const m1 = child1.dailyMap[day.dateStr] || 0;
                  const m2 = child2.dailyMap[day.dateStr] || 0;
                  const maxMinutes = Math.max(60, m1, m2);
                  const h1 = Math.min(100, Math.round((m1 / maxMinutes) * 100));
                  const h2 = Math.min(100, Math.round((m2 / maxMinutes) * 100));
                  const dayTotal = m1 + m2;

                  return (
                    <div
                      key={day.dateStr}
                      className={`rounded-xl p-2 flex flex-col items-center justify-between transition ${
                        day.isToday ? 'bg-amber-500/20 border border-amber-400/50' : 'bg-white/5 border border-white/10'
                      }`}
                    >
                      <span className="text-[10px] font-bold text-slate-300">{day.dayName}</span>
                      <span className={`text-[11px] font-black ${day.isToday ? 'text-amber-300' : 'text-slate-400'}`}>
                        {day.dayNum}
                      </span>

                      {/* 막대 바 컨테이너 */}
                      <div className="w-full h-24 sm:h-28 flex items-end justify-center space-x-1 py-1">
                        {/* 주원 바 */}
                        <div className="w-2.5 sm:w-3.5 bg-white/10 rounded-t-sm h-full flex items-end">
                          <div
                            className="w-full bg-gradient-to-t from-indigo-600 to-indigo-400 rounded-t-sm transition-all duration-300"
                            style={{ height: `${Math.max(h1 > 0 ? 8 : 0, h1)}%` }}
                            title={`주원: ${m1}분`}
                          ></div>
                        </div>

                        {/* 주아 바 */}
                        <div className="w-2.5 sm:w-3.5 bg-white/10 rounded-t-sm h-full flex items-end">
                          <div
                            className="w-full bg-gradient-to-t from-rose-600 to-rose-400 rounded-t-sm transition-all duration-300"
                            style={{ height: `${Math.max(h2 > 0 ? 8 : 0, h2)}%` }}
                            title={`주아: ${m2}분`}
                          ></div>
                        </div>
                      </div>

                      <span className="text-[10px] font-bold text-slate-300">
                        {dayTotal > 0 ? `${dayTotal}분` : '-'}
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>

                                title="구글 캘린더에 일정 추가"
                              >
                                <span>📅</span>
                                <span className="hidden sm:inline">구글 캘린더</span>
                              </a>
                            )}

                            {canManage ? (
                              <React.Fragment>
                                <button
                                  type="button"
                                  onClick={() => handleOpenEditScheduleModal(item)}
                                  className="p-1 text-slate-500 hover:text-indigo-600 rounded-lg transition"
                                  title="일정 수정"
                                >
                                  ✏️
                                </button>
                                <button
                                  type="button"
                                  onClick={() => handleDeleteSchedule(item)}
                                  className="p-1 text-slate-400 hover:text-rose-600 rounded-lg transition"
                                  title="일정 삭제"
                                >
                                  🗑️
                                </button>
                              </React.Fragment>
                            ) : (
                              <span className="text-[10px] text-slate-300 px-1 select-none" title="권한 없음">🔒</span>
                            )}
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </section>
        </div>
      );
    }

    function TodoListSection({ isParent, todos, handleToggleTodo, handleOpenAddTodoModal, handleOpenEditTodoModal, handleDeleteTodo }) {
      const [todoFilterMemberId, setTodoFilterMemberId] = useState('all');

      const displayedMembers = useMemo(() => {
        if (todoFilterMemberId === 'all') return FAMILY_MEMBERS;
        return FAMILY_MEMBERS.filter(m => m.id === todoFilterMemberId);
      }, [todoFilterMemberId]);

      return (
        <section className="bg-white rounded-2xl p-3.5 sm:p-5 border border-slate-200 shadow-sm space-y-4">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-100 pb-3 gap-2">
            <div>
              <h2 className="text-sm sm:text-base font-extrabold text-slate-900 flex items-center space-x-2">
                <span>✅ 가족 사용자별 할 일 체크리스트</span>
                <span className="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">
                  {isParent ? '엄마·아빠 권한 (수정/삭제)' : '주원·주아 권한 (체크)'}
                </span>
              </h2>
              <p className="text-[11px] text-slate-500 mt-0.5">
                {isParent 
                  ? '엄마, 아빠는 아이들의 할 일을 등록, 수정, 삭제하실 수 있습니다.' 
                  : '주원이와 주아는 내 할 일을 다 하면 체크를 눌러 완료해 보세요!'}
              </p>
            </div>

            {isParent && (
              <button
                type="button"
                onClick={() => handleOpenAddTodoModal(todoFilterMemberId !== 'all' ? todoFilterMemberId : 'child1')}
                className="px-3 py-1.5 text-xs font-bold rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm transition shrink-0 self-end sm:self-auto active:scale-95"
              >
                + 할 일 등록
              </button>
            )}
          </div>

          {/* 구성원 필터 탭바 */}
          <div className="flex items-center space-x-1.5 overflow-x-auto no-scrollbar py-0.5">
            <button
              type="button"
              onClick={() => setTodoFilterMemberId('all')}
              className={`px-3 py-1.5 rounded-xl text-xs font-bold transition shrink-0 ${
                todoFilterMemberId === 'all'
                  ? 'bg-slate-900 text-white shadow-xs'
                  : 'bg-slate-100 hover:bg-slate-200 text-slate-600'
              }`}
            >
              전체 보기 ({todos.length})
            </button>
            {FAMILY_MEMBERS.map((m) => {
              const count = todos.filter(t => t.memberId === m.id).length;
              const isSelected = todoFilterMemberId === m.id;
              return (
                <button
                  key={m.id}
                  type="button"
                  onClick={() => setTodoFilterMemberId(m.id)}
                  className={`px-2.5 py-1.5 rounded-xl text-xs font-bold transition shrink-0 flex items-center space-x-1 ${
                    isSelected
                      ? `${m.activeBg} shadow-xs font-black`
                      : 'bg-slate-100 hover:bg-slate-200 text-slate-700'
                  }`}
                >
                  <span>{m.avatar}</span>
                  <span>{m.name}</span>
                  <span className={`text-[10px] px-1.5 py-0.2 rounded-full ${isSelected ? 'bg-white/30 text-white' : 'bg-slate-200 text-slate-600'}`}>
                    {count}
                  </span>
                </button>
              );
            })}
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {displayedMembers.map((member) => {
              const memberTodos = todos.filter(t => t.memberId === member.id);
              const completedCount = memberTodos.filter(t => t.completed).length;
              const totalCount = memberTodos.length;
              const pct = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;
              const isAllDone = totalCount > 0 && completedCount === totalCount;

              return (
                <div
                  key={member.id}
                  className={`p-4 rounded-2xl border transition ${member.cardBg} space-y-3 shadow-2xs`}
                >
                  <div className="flex items-center justify-between border-b pb-2.5 border-slate-200/80">
                    <div className="flex items-center space-x-2">
                      <span className="text-2xl">{member.avatar}</span>
                      <div>
                        <h3 className="font-extrabold text-sm text-slate-900">{member.name}의 할 일</h3>
                        <p className="text-[10px] text-slate-500">{member.role}</p>
                      </div>
                    </div>

                    <div className="flex items-center space-x-1.5">
                      <span className={`text-xs font-black px-2.5 py-1 rounded-full border shadow-2xs ${
                        isAllDone
                          ? 'bg-emerald-500 text-white border-emerald-400'
                          : 'bg-white text-slate-700 border-slate-200'
                      }`}>
                        {completedCount} / {totalCount} 완료 ({pct}%)
                      </span>

                      {isParent && (
                        <button
                          type="button"
                          onClick={() => handleOpenAddTodoModal(member.id)}
                          className="px-2 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold rounded-lg transition"
                          title={`${member.name} 할 일 추가`}
                        >
                          + 추가
                        </button>
                      )}
                    </div>
                  </div>

                  {/* 할 일 진행률 프로그레스 바 */}
                  {totalCount > 0 && (
                    <div className="space-y-1">
                      <div className="w-full bg-slate-200/80 h-2 rounded-full overflow-hidden">
                        <div
                          className={`h-full rounded-full transition-all duration-500 ${
                            isAllDone
                              ? 'bg-emerald-500'
                              : pct >= 50
                              ? 'bg-indigo-500'
                              : 'bg-amber-500'
                          }`}
                          style={{ width: `${pct}%` }}
                        ></div>
                      </div>

                      {/* 100% 올클리어 축하 배너 */}
                      {isAllDone && (
                        <div className="bg-emerald-100/90 border border-emerald-300 text-emerald-900 text-xs font-black py-1 px-2.5 rounded-xl flex items-center justify-center space-x-1 animate-pulse">
                          <span>🎉</span>
                          <span>오늘 할 일 모두 완료! 참 잘했어요!</span>
                          <span>⭐</span>
                        </div>
                      )}
                    </div>
                  )}

                  {memberTodos.length === 0 ? (
                    <div className="text-center py-4 bg-white/80 rounded-xl border border-dashed border-slate-200">
                      <p className="text-xs font-medium text-slate-400">등록된 할 일이 없습니다.</p>
                    </div>
                  ) : (
                    <div className="space-y-2">
                      {memberTodos.map((todo) => (
                        <div
                          key={todo.id}
                          className={`p-2.5 rounded-xl border transition flex items-center justify-between ${
                            todo.completed
                              ? 'bg-emerald-50/80 border-emerald-200 text-slate-400'
                              : 'bg-white border-slate-200 hover:border-emerald-300'
                          }`}
                        >
                          <div className="flex items-center space-x-2.5 min-w-0 flex-1">
                            <button
                              type="button"
                              onClick={() => handleToggleTodo(todo)}
                              className={`w-7 h-7 sm:w-6 sm:h-6 rounded-lg border-2 flex items-center justify-center font-bold text-xs sm:text-xs transition shrink-0 ${
                                todo.completed
                                  ? 'bg-emerald-500 border-emerald-500 text-white'
                                  : 'border-slate-300 bg-white hover:border-emerald-400'
                              }`}
                            >
                              {todo.completed && '✓'}
                            </button>

                            <p className={`text-xs sm:text-sm font-bold truncate ${todo.completed ? 'line-through text-slate-400' : 'text-slate-800'}`}>
                              {todo.text}
                            </p>
                          </div>

                          {isParent && (
                            <div className="flex items-center space-x-1 shrink-0 ml-2">
                              <button
                                type="button"
                                onClick={() => handleOpenEditTodoModal(todo)}
                                className="p-1 text-slate-400 hover:text-indigo-600 rounded text-xs transition"
                                title="수정"
                              >
                                ✏️
                              </button>
                              <button
                                type="button"
                                onClick={() => handleDeleteTodo(todo)}
                                className="p-1 text-slate-300 hover:text-rose-500 text-xs transition"
                                title="삭제"
                              >
                                ✕
                              </button>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </section>
      );
    }

    // 신규: 우리 가족 소통 & 소원 보드 (위시리스트, 편지/하고싶은말, 하루 감정)
    function FamilyBoardSection({
      currentMember,
      currentMemberId,
      isParent,
      wishlist = [],
      familyLetters = [],
      dailyMoods = [],
      handleSaveWishItem,
      handleToggleWishFulfilled,
      handleDeleteWishItem,
      handleSaveFamilyLetter,
      handleSaveLetterReply,
      handleDeleteFamilyLetter,
      handleSaveDailyMood,
      handleDeleteDailyMood
    }) {
      const [boardTab, setBoardTab] = useState('wish'); // 'wish', 'letter', 'mood'

      // 위시리스트 폼 상태
      const [wishForm, setWishForm] = useState({
        childId: currentMemberId === 'child2' ? 'child2' : 'child1',
        title: '',
        price: '',
        reason: '',
        link: ''
      });

      // 하고 싶은 말 폼 상태 (부모 로그인 시 기본값을 아이에게로)
      const [letterForm, setLetterForm] = useState({
        toRole: isParent ? 'child1' : 'parents', // 'parents', 'mom', 'dad', 'child1', 'child2', 'kids'
        content: '',
        isSecret: false // 작성자와 수신자만 볼 수 있는 비밀글
      });

      // 답글 입력 상태
      const [replyInputMap, setReplyInputMap] = useState({});

      // 하루 감정 폼 상태
      const todayStr = getTodayString();
      const myTodayMood = dailyMoods.find(m => m.memberId === currentMemberId && m.date === todayStr);
      const [selectedMoodKey, setSelectedMoodKey] = useState(myTodayMood?.moodKey || 'happy');
      const [moodNotes, setMoodNotes] = useState(myTodayMood?.notes || '');

      // 위시리스트 필터 (전체 / 주원 / 주아)
      const [wishFilter, setWishFilter] = useState('all');
      const filteredWishlist = wishlist.filter(w => {
        if (wishFilter === 'all') return true;
        return w.childId === wishFilter;
      });

      // 하루 감정 구성원 필터 (전체 / 아빠 / 엄마 / 주원 / 주아)
      const [moodMemberFilter, setMoodMemberFilter] = useState('all');

      // 신규: 편지 읽음 시간 상태 및 미확인 편지/답글 수 계산
      const [lastReadLetterTime, setLastReadLetterTime] = useState(() => {
        try {
          return parseInt(localStorage.getItem('family_last_read_letters_' + currentMemberId) || '0', 10);
        } catch (e) {
          return 0;
        }
      });

      // 편지 탭 진입 시 읽음 처리
      const handleOpenLetterTab = () => {
        setBoardTab('letter');
        const now = Date.now();
        setLastReadLetterTime(now);
        try {
          localStorage.setItem('family_last_read_letters_' + currentMemberId, String(now));
        } catch (e) {}
      };

      // 내가 볼 수 있는 편지 중 새로운 편지/답글 수
      const unreadLetterCount = useMemo(() => {
        let count = 0;
        familyLetters.forEach(l => {
          const isAuthor = currentMemberId === l.fromMemberId;
          const canView = isAuthor ||
            (l.toRole === 'mom' && (currentMemberId === 'mom' || (!l.isSecret && isParent))) ||
            (l.toRole === 'dad' && (currentMemberId === 'dad' || (!l.isSecret && isParent))) ||
            (l.toRole === 'parents' && (!l.isSecret || isParent)) ||
            (l.toRole === 'child1' && (currentMemberId === 'child1' || (!l.isSecret && isParent))) ||
            (l.toRole === 'child2' && (currentMemberId === 'child2' || (!l.isSecret && isParent))) ||
            (l.toRole === 'kids' && (currentMemberId === 'child1' || currentMemberId === 'child2' || isParent));

          if (!canView) return;

          // 작성자가 내가 아니고, 마지막 읽은 시각보다 이후에 생성된 편지
          if (!isAuthor && (l.createdAt || 0) > lastReadLetterTime) {
            count++;
          }
          // 내가 쓴 편지나 내가 수신한 편지에 달린 새 답글
          if (l.replies && l.replies.length > 0) {
            l.replies.forEach(r => {
              if (r.authorId !== currentMemberId && (r.createdAt || 0) > lastReadLetterTime) {
                count++;
              }
            });
          }
        });
        return count;
      }, [familyLetters, currentMemberId, isParent, lastReadLetterTime]);

      const onWishSubmit = (e) => {
        e.preventDefault();
        if (!wishForm.title.trim()) return;
        handleSaveWishItem(wishForm);
        setWishForm({
          childId: currentMemberId === 'child2' ? 'child2' : 'child1',
          title: '',
          price: '',
          reason: '',
          link: ''
        });
      };

      const onLetterSubmit = (e) => {
        e.preventDefault();
        if (!letterForm.content.trim()) return;
        handleSaveFamilyLetter(letterForm);
        setLetterForm({ toRole: isParent ? 'child1' : 'parents', content: '', isSecret: false });
      };

      const onMoodSubmit = (e) => {
        e.preventDefault();
        handleSaveDailyMood({ moodKey: selectedMoodKey, notes: moodNotes });
      };

      // 오늘 4명 감정 체크 인원수
      const todayMoodCheckCount = FAMILY_MEMBERS.filter(m => dailyMoods.some(d => d.memberId === m.id && d.date === todayStr)).length;

      return (
        <section className="bg-gradient-to-br from-indigo-50/70 via-pink-50/40 to-amber-50/70 rounded-3xl p-4 sm:p-6 border border-indigo-100 shadow-sm space-y-4">
          {/* 신규: 오늘 우리 가족 감정 출석부 위젯 (모든 탭 상단 항상 노출) */}
          <div className="bg-white/90 backdrop-blur-xs rounded-2xl p-3 sm:p-4 border border-indigo-150 shadow-2xs space-y-2">
            <div className="flex items-center justify-between">
              <div className="flex items-center space-x-1.5">
                <span className="text-base">☀️</span>
                <span className="text-xs sm:text-sm font-black text-slate-900">오늘 우리 가족 감정 출석부</span>
                <span className={`text-[10px] font-black px-2 py-0.5 rounded-full ${todayMoodCheckCount === 4 ? 'bg-emerald-100 text-emerald-700' : 'bg-indigo-100 text-indigo-700'}`}>
                  {todayMoodCheckCount === 4 ? '🎉 4명 모두 출석 완료!' : `${todayMoodCheckCount} / 4명 완료`}
                </span>
              </div>
              <button
                type="button"
                onClick={() => setBoardTab('mood')}
                className="text-[11px] font-extrabold text-indigo-600 hover:text-indigo-800 flex items-center space-x-0.5"
              >
                <span>내 감정 기록하기</span>
                <span>➔</span>
              </button>
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
              {FAMILY_MEMBERS.map((m) => {
                const mood = dailyMoods.find(d => d.memberId === m.id && d.date === todayStr);
                const moodOpt = mood ? MOOD_OPTIONS.find(o => o.key === mood.moodKey) : null;
                const isMe = m.id === currentMemberId;
                return (
                  <div
                    key={m.id}
                    onClick={() => {
                      if (isMe && !mood) setBoardTab('mood');
                    }}
                    className={`p-2.5 rounded-xl border transition flex items-center space-x-2 ${
                      mood
                        ? 'bg-gradient-to-br from-indigo-50/80 to-white border-indigo-200 shadow-2xs'
                        : isMe
                        ? 'bg-amber-50/80 border-amber-300 border-dashed cursor-pointer hover:bg-amber-100/60 animate-pulse'
                        : 'bg-slate-50/60 border-slate-200/70 opacity-60'
                    }`}
                    title={!mood && isMe ? '클릭하여 오늘의 감정을 기록해보세요!' : ''}
                  >
                    <span className="text-xl shrink-0">{m.avatar}</span>
                    <div className="min-w-0 flex-1">
                      <div className="flex items-center space-x-1">
                        <span className="text-[11px] font-extrabold text-slate-800 truncate">{m.name}</span>
                        {isMe && <span className="text-[9px] bg-slate-200 text-slate-600 px-1 py-0.2 rounded font-black">나</span>}
                      </div>
                      {moodOpt ? (
                        <div className="text-xs font-black text-indigo-700 flex items-center space-x-1 mt-0.5">
                          <span>{moodOpt.emoji}</span>
                          <span className="truncate text-[11px]">{moodOpt.label}</span>
                        </div>
                      ) : (
                        <div className="text-[10px] text-amber-700 font-bold mt-0.5 flex items-center space-x-0.5">
                          <span>⏳</span>
                          <span>{isMe ? '내 감정 쓰기' : '미작성'}</span>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* 상단 탭 헤더 */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b border-indigo-100/80 pb-3 gap-3">
            <div>
              <h2 className="text-base sm:text-lg font-black text-slate-900 flex items-center space-x-2">
                <span>🎈 우리 가족 소통 & 소원 보드</span>
                <span className="text-xs bg-indigo-100 text-indigo-700 font-bold px-2 py-0.5 rounded-full">
                  따뜻한 대화
                </span>
              </h2>
              <p className="text-xs text-slate-600 mt-0.5">
                가지고 싶은 물건을 조르고, 엄마·아빠에게 속마음을 전하고, 오늘 나의 기분을 기록해요!
              </p>
            </div>

            {/* 3개 서브탭 버튼 */}
            <div className="flex items-center space-x-1.5 bg-white/90 p-1 rounded-2xl border border-indigo-150 shadow-2xs self-start sm:self-auto">
              <button
                type="button"
                onClick={() => setBoardTab('wish')}
                className={`px-3 py-1.5 rounded-xl text-xs font-extrabold transition flex items-center space-x-1 ${
                  boardTab === 'wish' ? 'bg-amber-500 text-white shadow-xs' : 'text-slate-600 hover:bg-slate-50'
                }`}
              >
                <span>🎁</span>
                <span>갖고 싶은 물건</span>
                {wishlist.filter(w => !w.isFulfilled).length > 0 && (
                  <span className={`text-[10px] px-1.5 py-0.2 rounded-full font-black ${
                    boardTab === 'wish' ? 'bg-white text-amber-600' : 'bg-amber-100 text-amber-700'
                  }`}>
                    {wishlist.filter(w => !w.isFulfilled).length}
                  </span>
                )}
              </button>

              <button
                type="button"
                onClick={handleOpenLetterTab}
                className={`px-3 py-1.5 rounded-xl text-xs font-extrabold transition flex items-center space-x-1 relative ${
                  boardTab === 'letter' ? 'bg-pink-500 text-white shadow-xs' : 'text-slate-600 hover:bg-slate-50'
                }`}
              >
                <span>💌</span>
                <span>마음의 편지 & 비밀 이야기</span>
                {unreadLetterCount > 0 ? (
                  <span className="text-[10px] px-1.5 py-0.2 rounded-full font-black bg-rose-500 text-white animate-bounce">
                    N {unreadLetterCount}
                  </span>
                ) : familyLetters.length > 0 && (
                  <span className={`text-[10px] px-1.5 py-0.2 rounded-full font-black ${
                    boardTab === 'letter' ? 'bg-white text-pink-600' : 'bg-pink-100 text-pink-700'
                  }`}>
                    {familyLetters.length}
                  </span>
                )}
              </button>

              <button
                type="button"
                onClick={() => setBoardTab('mood')}
                className={`px-3 py-1.5 rounded-xl text-xs font-extrabold transition flex items-center space-x-1 ${
                  boardTab === 'mood' ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-600 hover:bg-slate-50'
                }`}
              >
                <span>😊</span>
                <span>하루 감정</span>
              </button>
            </div>
          </div>

          {/* ======================= 1. 갖고 싶은 물건 위시리스트 ======================= */}
          {boardTab === 'wish' && (
            <div className="space-y-4">
              {/* 등록 카드 */}
              <div className="bg-white rounded-2xl p-4 sm:p-5 border border-amber-200/80 shadow-2xs space-y-3">
                <div className="flex items-center justify-between border-b border-slate-100 pb-2">

                      // 주아에게 보낸 편지: 비밀 편지면 주아와 작성자 부모만, 일반 편지면 부모님도 열람 가능
                      canViewLetter = currentMemberId === 'child2' || (!letter.isSecret && isParent);
                      restrictedMsg = "🔒 주아에게만 보낸 비밀 이야기입니다. (주아와 작성자만 읽을 수 있어요)";
                    } else if (letter.toRole === 'kids') {
                      // 아이들 모두에게 보낸 편지: 주원, 주아, 부모님 모두 열람 가능
                      canViewLetter = true;
                    } else {
                      // toRole === 'parents' (엄마 & 아빠)
                      canViewLetter = !letter.isSecret || isParent;
                      restrictedMsg = "🔒 엄마, 아빠에게 보낸 비밀 편지입니다.";
                    }

                    // 답글 권한:
                    // 1) 아이에게 보낸 편지인 경우: 해당 아이 또는 부모님이 답글 작성 가능
                    // 2) 부모에게 보낸 편지인 경우: 해당 부모님 작성 가능
                    const canReply = canViewLetter && (
                      (letter.toRole === 'child1' && (currentMemberId === 'child1' || isParent)) ||
                      (letter.toRole === 'child2' && (currentMemberId === 'child2' || isParent)) ||
                      (letter.toRole === 'kids' && (currentMemberId === 'child1' || currentMemberId === 'child2' || isParent)) ||
                      (letter.toRole === 'mom' && (currentMemberId === 'mom' || letter.fromMemberId === currentMemberId)) ||
                      (letter.toRole === 'dad' && (currentMemberId === 'dad' || letter.fromMemberId === currentMemberId)) ||
                      (letter.toRole === 'parents' && isParent)
                    );

                    // 수신자 라벨 렌더링 함수
                    const renderRecipientLabel = () => {
                      switch (letter.toRole) {
                        case 'mom':
                          return (
                            <span className="text-rose-600 font-black">
                              {letter.fromMemberId === 'dad' ? '👩 여보(엄마)에게' : '👩 엄마에게만'}
                            </span>
                          );
                        case 'dad':
                          return (
                            <span className="text-blue-600 font-black">
                              {letter.fromMemberId === 'mom' ? '👨 여보(아빠)에게' : '👨 아빠에게만'}
                            </span>
                          );
                        case 'child1':
                          return <span className="text-indigo-600 font-black">👦 주원이에게</span>;
                        case 'child2':
                          return <span className="text-purple-600 font-black">👧 주아에게</span>;
                        case 'kids':
                          return <span className="text-amber-600 font-black">👦👧 아이들 모두에게</span>;
                        default:
                          return <span className="text-pink-600 font-black">👨‍👩‍👦 엄마 & 아빠에게</span>;
                      }
                    };

                    const fromMember = FAMILY_MEMBERS.find(m => m.id === letter.fromMemberId) || { name: letter.fromMemberName, avatar: '👦' };

                    return (
                      <div
                        key={letter.id}
                        className="bg-white rounded-2xl p-4 sm:p-5 border border-pink-150 shadow-2xs space-y-3"
                      >
                        <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                          <div className="flex items-center space-x-2">
                            <span className="text-xl">{fromMember.avatar}</span>
                            <div>
                              <div className="flex items-center space-x-1.5 text-xs font-black">
                                <span className="text-slate-900">{letter.fromMemberName}</span>
                                <span className="text-slate-400 font-normal">➔</span>
                                {renderRecipientLabel()}
                                {(letter.isSecret || letter.toRole === 'mom' || letter.toRole === 'dad' || letter.toRole === 'child1' || letter.toRole === 'child2') && (
                                  <span className="text-[10px] bg-pink-100 text-pink-700 px-1.5 py-0.2 rounded font-bold">
                                    🔒 전용/비밀
                                  </span>
                                )}
                                {!isAuthor && (letter.createdAt || 0) > lastReadLetterTime && (
                                  <span className="text-[9px] bg-rose-500 text-white font-black px-1.5 py-0.2 rounded-full animate-pulse shadow-xs">
                                    🔴 NEW
                                  </span>
                                )}
                              </div>
                              <span className="text-[10px] text-slate-400">{formatRelativeTime(letter.createdAt)}</span>
                            </div>
                          </div>

                          {(isParent || currentMemberId === letter.fromMemberId) && (
                            <button
                              type="button"
                              onClick={() => handleDeleteFamilyLetter(letter.id)}
                              className="text-slate-300 hover:text-rose-500 font-bold p-1 text-xs transition"
                              title="삭제"
                            >
                              ✕
                            </button>
                          )}
                        </div>

                        {canViewLetter ? (
                          <p className="text-xs sm:text-sm text-slate-800 font-medium whitespace-pre-wrap leading-relaxed bg-pink-50/30 p-3 rounded-2xl border border-pink-100/60">
                            {letter.content}
                          </p>
                        ) : (
                          <div className="p-3 bg-slate-50 rounded-2xl border border-slate-200 text-xs text-slate-500 font-medium italic flex items-center space-x-1.5">
                            <span>🤫</span>
                            <span>{restrictedMsg}</span>
                          </div>
                        )}

                        {/* 따뜻한 답글 목록 */}
                        {letter.replies && letter.replies.length > 0 && canViewLetter && (
                          <div className="mt-2 space-y-1.5 pl-3 border-l-2 border-pink-300">
                            {letter.replies.map((rep, idx) => {
                              const repAuthor = FAMILY_MEMBERS.find(m => m.id === rep.authorId) || { avatar: '💬' };
                              return (
                                <div key={idx} className="bg-amber-50/70 p-2.5 rounded-xl border border-amber-200/60 text-xs space-y-0.5">
                                  <div className="flex items-center justify-between text-[11px] font-bold">
                                    <span className="text-amber-900 flex items-center space-x-1">
                                      <span>{repAuthor.avatar}</span>
                                      <span>{rep.authorName}의 답글:</span>
                                    </span>
                                    <span className="text-[10px] text-slate-400">{formatRelativeTime(rep.createdAt)}</span>
                                  </div>
                                  <p className="text-slate-700 font-medium whitespace-pre-wrap">{rep.content}</p>
                                </div>
                              );
                            })}
                          </div>
                        )}

                        {/* 답글 달기 입력창 */}
                        {canReply && (
                          <div className="pt-2 flex items-center space-x-2">
                            <input
                              type="text"
                              value={replyInputMap[letter.id] || ''}
                              onChange={(e) => setReplyInputMap({ ...replyInputMap, [letter.id]: e.target.value })}
                              placeholder={`${currentMember.name}의 사랑이 담긴 답글 남기기...`}
                              className="flex-1 px-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-xl font-medium focus:ring-2 focus:ring-pink-400"
                              onKeyDown={(e) => {
                                if (e.key === 'Enter' && !e.shiftKey) {
                                  e.preventDefault();
                                  const val = replyInputMap[letter.id];
                                  if (val && val.trim()) {
                                    handleSaveLetterReply(letter.id, val.trim());
                                    setReplyInputMap({ ...replyInputMap, [letter.id]: '' });
                                  }
                                }
                              }}
                            />
                            <button
                              type="button"
                              onClick={() => {
                                const val = replyInputMap[letter.id];
                                if (val && val.trim()) {
                                  handleSaveLetterReply(letter.id, val.trim());
                                  setReplyInputMap({ ...replyInputMap, [letter.id]: '' });
                                }
                              }}
                              className="px-3 py-1.5 rounded-xl bg-pink-500 hover:bg-pink-600 text-white font-bold text-xs shrink-0 shadow-2xs"
                            >
                              답글 💬
                            </button>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {/* ======================= 3. 하루 감정 일기 ======================= */}
          {boardTab === 'mood' && (
            <div className="space-y-4">
              {/* 오늘 내 기분 등록/수정 카드 */}
              <div className="bg-white rounded-2xl p-4 sm:p-5 border border-indigo-200/80 shadow-2xs space-y-3">
                <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                  <div className="flex items-center space-x-2">
                    <span className="text-xl">{currentMember.avatar}</span>
                    <span className="text-xs sm:text-sm font-extrabold text-indigo-950">
                      오늘 ({todayStr}) {currentMember.name}의 기분은 어떤가요?
                    </span>
                  </div>
                  {myTodayMood && (
                    <span className="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">
                      오늘 등록 완료 ✓
                    </span>
                  )}
                </div>

                <form onSubmit={onMoodSubmit} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-700 font-bold mb-1.5">감정 아이콘 선택</label>
                    <div className="grid grid-cols-4 sm:grid-cols-8 gap-2">
                      {MOOD_OPTIONS.map((mood) => (
                        <button
                          type="button"
                          key={mood.key}
                          onClick={() => setSelectedMoodKey(mood.key)}
                          className={`p-2.5 rounded-2xl border text-center transition flex flex-col items-center justify-center space-y-1 ${
                            selectedMoodKey === mood.key
                              ? `${mood.bg} ring-2 ring-indigo-400 font-black shadow-xs scale-105`
                              : 'bg-slate-50 border-slate-200 hover:bg-slate-100 text-slate-700 font-bold'
                          }`}
                        >
                          <span className="text-2xl">{mood.emoji}</span>
                          <span className="text-[11px] tracking-tight">{mood.label}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-700 font-bold mb-1">오늘 있었던 일이나 한 줄 감정 메모</label>
                    <input
                      type="text"
                      value={moodNotes}
                      onChange={(e) => setMoodNotes(e.target.value)}
                      placeholder="예: 학교에서 친구랑 술래잡기해서 너무 신났어요! / 숙제가 많아서 조금 힘들었어요."
                      className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-medium focus:ring-2 focus:ring-indigo-400"
                    />
                  </div>

                  <div className="flex justify-end pt-1">
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xs shadow-md shadow-indigo-200 transition active:scale-95 flex items-center space-x-1.5"
                    >
                      <span>😊</span>
                      <span>오늘 감정 저장하기</span>
                    </button>
                  </div>
                </form>
              </div>

              {/* 가족 구성원별 오늘 감정 현황 요약 */}
              <div className="bg-indigo-50/50 p-3.5 rounded-2xl border border-indigo-150 space-y-2">
                <span className="text-xs font-black text-indigo-900 flex items-center space-x-1.5">
                  <span>🌈</span>
                  <span>오늘 우리 가족 하루 감정 모아보기 ({todayStr})</span>
                </span>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  {FAMILY_MEMBERS.map((m) => {
                    const mood = dailyMoods.find(d => d.memberId === m.id && d.date === todayStr);
                    const moodOpt = mood ? MOOD_OPTIONS.find(o => o.key === mood.moodKey) : null;
                    return (
                      <div
                        key={m.id}
                        className={`p-2.5 rounded-xl border flex items-center space-x-2 bg-white ${
                          mood ? 'border-indigo-200 shadow-2xs' : 'border-slate-200/60 opacity-60'
                        }`}
                      >
                        <span className="text-xl shrink-0">{m.avatar}</span>
                        <div className="min-w-0 flex-1">
                          <div className="text-[11px] font-extrabold text-slate-800 truncate">{m.name}</div>
                          {moodOpt ? (
                            <div className="text-xs font-black text-indigo-600 flex items-center space-x-1 mt-0.5">
                              <span>{moodOpt.emoji}</span>
                              <span className="truncate">{moodOpt.label}</span>
                            </div>
                          ) : (
                            <div className="text-[10px] text-slate-400 mt-0.5">아직 기록 전</div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* 날짜별 감정 일기 타임라인 (구성원 필터 및 일자별 그룹핑) */}
              <div className="space-y-3 pt-1">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                  <div className="flex items-center space-x-1.5 text-xs font-black text-slate-800">
                    <span>📖</span>
                    <span>일자별 감정 일기 기록 ({dailyMoods.length}건)</span>
                  </div>

                  {/* 구성원 필터 버튼 바 */}
                  <div className="flex items-center space-x-1 bg-white p-1 rounded-xl border border-slate-200 text-xs overflow-x-auto no-scrollbar">
                    <button
                      type="button"
                      onClick={() => setMoodMemberFilter('all')}
                      className={`px-2.5 py-1 rounded-lg font-bold transition shrink-0 ${
                        moodMemberFilter === 'all' ? 'bg-indigo-600 text-white shadow-2xs' : 'text-slate-600 hover:bg-slate-50'
                      }`}
                    >
                      가족 전체
                    </button>
                    {FAMILY_MEMBERS.map(m => (
                      <button
                        type="button"
                        key={m.id}
                        onClick={() => setMoodMemberFilter(m.id)}
                        className={`px-2 py-1 rounded-lg font-bold transition flex items-center space-x-1 shrink-0 ${
                          moodMemberFilter === m.id ? `${m.activeBg} shadow-2xs` : 'text-slate-600 hover:bg-slate-50'
                        }`}
                      >
                        <span>{m.avatar}</span>
                        <span>{m.name}</span>
                      </button>
                    ))}
                  </div>
                </div>

                {(() => {
                  const filteredMoods = dailyMoods.filter(m => {
                    if (moodMemberFilter === 'all') return true;
                    return m.memberId === moodMemberFilter;
                  });

                  if (filteredMoods.length === 0) {
                    return (
                      <div className="text-center py-8 bg-white/70 rounded-2xl border border-dashed border-indigo-300/60 text-xs text-slate-400 font-bold space-y-1">
                        <div className="text-2xl">😊</div>
                        <div>조건에 맞는 감정 일기가 없습니다.</div>
                        <div className="text-[11px] text-slate-400 font-normal">오늘 나의 기분을 남겨 가족과 감정을 나눠보세요!</div>
                      </div>
                    );
                  }

                  // 날짜별 그룹핑 (내림차순 정렬)
                  const dates = Array.from(new Set(filteredMoods.map(m => m.date))).sort((a, b) => b.localeCompare(a));

                  return (
                    <div className="space-y-3.5 max-h-[460px] overflow-y-auto no-scrollbar pr-0.5">
                      {dates.map((dateStr) => {
                        const dayMoods = filteredMoods.filter(m => m.date === dateStr);
                        const isToday = dateStr === todayStr;

                        return (
                          <div key={dateStr} className="bg-white rounded-2xl p-3.5 sm:p-4 border border-indigo-150/80 shadow-2xs space-y-2.5">
                            {/* 날짜 헤더 */}
                            <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                              <span className="text-xs font-black text-slate-900 flex items-center space-x-1.5">
                                <span>📅</span>
                                <span>{dateStr}</span>
                                {isToday && (
                                  <span className="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.2 rounded-full font-extrabold border border-amber-200">
                                    오늘
                                  </span>
                                )}
                              </span>
                              <span className="text-[11px] text-slate-400 font-medium">
                                {dayMoods.length}명의 가족이 기록함
                              </span>
                            </div>

                            {/* 해당 날짜의 가족 감정 카드들 */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                              {dayMoods.map((log) => {
                                const moodOpt = MOOD_OPTIONS.find(o => o.key === log.moodKey) || MOOD_OPTIONS[0];
                                const member = FAMILY_MEMBERS.find(m => m.id === log.memberId) || { name: log.memberName, avatar: '👤' };

                                return (
                                  <div
                                    key={log.id}
                                    className={`p-3 rounded-2xl border transition-all flex items-start space-x-2.5 ${
                                      log.memberId === currentMemberId
                                        ? 'bg-indigo-50/40 border-indigo-200'
                                        : 'bg-slate-50/60 border-slate-200/80'
                                    }`}
                                  >
                                    <div className="text-2xl shrink-0 p-1.5 bg-white rounded-xl shadow-2xs">
                                      {moodOpt.emoji}
                                    </div>
                                    <div className="min-w-0 flex-1">
                                      <div className="flex items-center justify-between text-[11px]">
                                        <span className="font-extrabold text-slate-800 flex items-center space-x-1">
                                          <span>{member.avatar}</span>
                                          <span>{log.memberName || member.name}</span>
                                          <span className={`text-[10px] px-1.5 py-0.2 rounded font-bold border ${moodOpt.bg}`}>
                                            {moodOpt.label}
                                          </span>
                                        </span>
                                        <div className="flex items-center space-x-1 text-[10px] text-slate-400">
                                          <span>{formatRelativeTime(log.updatedAt || log.createdAt)}</span>
                                          {(isParent || currentMemberId === log.memberId) && (
                                            <button
                                              type="button"
                                              onClick={() => handleDeleteDailyMood(log)}
                                              className="text-slate-300 hover:text-rose-500 font-bold text-xs p-0.5 transition"
                                              title="삭제"
                                            >
                                              ✕
                                            </button>
                                          )}
                                        </div>
                                      </div>
                                      {log.notes ? (
                                        <p className="mt-1.5 text-xs text-slate-700 font-medium whitespace-pre-wrap bg-white p-2 rounded-xl border border-slate-100">
                                          "{log.notes}"
                                        </p>
                                      ) : (
                                        <p className="mt-1 text-[11px] text-slate-400 italic">남긴 메모가 없습니다.</p>
                                      )}
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  );
                })()}
              </div>
            </div>
          )}
        </section>
      );
    }

    // ==================== 주소/장소명 좌표 자동 변환 (지오코딩 헬퍼) ====================
    // 한국 주요 거점 및 대표 랜드마크 즉시 매핑 딕셔너리
