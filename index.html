        const newItem = { ...itemData, id: itemId };
        const existingItems = currentTrip.items || [];
        const isEdit = existingItems.some(i => i.id === itemId);
        const updatedItems = isEdit
          ? existingItems.map(i => i.id === itemId ? newItem : i)
          : [...existingItems, newItem];

        // 시간순 정렬
        updatedItems.sort((a, b) => {
          if ((a.day || 1) !== (b.day || 1)) return (a.day || 1) - (b.day || 1);
          return (a.time || '').localeCompare(b.time || '');
        });

        const updatedTrip = { ...currentTrip, items: updatedItems, updatedAt: Date.now() };

        try {

      const weekDays = useMemo(() => {

        const days = [];
        for (let i = 0; i < 7; i++) {
          const next = new Date(curr.getFullYear(), curr.getMonth(), first + i);
          const dateStr = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}-${String(next.getDate()).padStart(2, '0')}`;
          const dayName = ['일', '월', '화', '수', '목', '금', '토'][next.getDay()];
          days.push({ dateStr, dayName, dayNumber: next.getDate() });
        }
        return days;

                        <span>독서 활동 및 완독 도서 상세 기록</span>
                      </span>
                      <span className="text-[10px] text-amber-800 font-bold">
                        {periodLabel} 기준 총 {filteredReadingLogs.length}건
                      </span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {KIDS_MEMBERS.map(kid => {
                        const kidLogs = filteredReadingLogs.filter(l => l.childId === kid.id);
                        const totalMins = kidLogs.reduce((acc, l) => acc + (Number(l.minutes) || 0), 0);
                        const completedBooks = kidLogs.filter(l => l.isCompleted && l.bookTitle);
                        // 누적 전체 시간 기준 레벨
                        const allKidLogs = readingLogs.filter(l => l.childId === kid.id);
                        const allMins = allKidLogs.reduce((acc, l) => acc + (Number(l.minutes) || 0), 0);
                        const lvlInfo = getReadingLevelInfo(allMins);

                        return (
                          <div key={kid.id} className="p-2.5 rounded-xl bg-white border border-amber-200 space-y-1">
                            <div className="flex items-center justify-between font-extrabold">
                              <span className="text-slate-800 flex items-center space-x-1">
                                <span>{kid.avatar}</span>
                                <span>{kid.name}</span>
                              </span>
                              <span className="text-amber-700 font-black">Lv.{lvlInfo.level} {lvlInfo.title}</span>
                            </div>
                            <div className="text-[11px] text-slate-600 flex items-center justify-between">
                              <span>해당 기간 독서: <strong>{formatMinutesToHours(totalMins)}</strong></span>
                              <span>완독: <strong className="text-emerald-600">{completedBooks.length}권</strong></span>
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    {/* 전체 독서 활동 및 책 이름 상세 기록 리스트 */}
                    {filteredReadingLogs.length === 0 ? (
                      <div className="text-center py-3 bg-white/70 rounded-xl text-[11px] text-slate-400">
                        해당 기간에 기록된 독서 활동이 없습니다.
                      </div>
                    ) : (
                      <div className="space-y-1.5 pt-1">
                        <div className="text-[10px] font-black text-amber-900">📚 독서 기록 및 읽은 책 상세 내역 ({filteredReadingLogs.length}건):</div>
                        <div className="space-y-1.5 max-h-60 overflow-y-auto no-scrollbar pr-0.5">
                          {[...filteredReadingLogs].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).map((log, idx) => {
                            const kid = KIDS_MEMBERS.find(k => k.id === log.childId) || { name: log.childName || '어린이', avatar: '👶' };
                            return (
                              <div key={log.id || idx} className="p-2 rounded-xl bg-white border border-amber-200/90 flex flex-col space-y-1 text-[11px]">
                                <div className="flex items-center justify-between">
                                  <div className="flex items-center space-x-1.5 font-bold">
                                    <span>{kid.avatar}</span>
                                    <span className="text-slate-800">{kid.name}</span>
                                    <span className="text-amber-800 font-extrabold">
                                      {log.bookTitle ? `《${log.bookTitle}》` : '자유 독서'}
                                    </span>
                                    {log.isCompleted && (
                                      <span className="text-[9px] bg-emerald-100 text-emerald-800 px-1.5 py-0.2 rounded-full font-black border border-emerald-200">
                                        ✨ 완독
                                      </span>
                                    )}
                                  </div>
                                  <div className="flex items-center space-x-1.5 text-[10px] text-slate-400 font-medium">
                                    <span className="text-amber-700 font-bold">⏱️ {log.minutes}분</span>
                                    <span>•</span>
                                    <span>{log.date}</span>
                                  </div>
                                </div>
                                {log.notes && (
                                  <p className="text-slate-600 text-[10px] bg-amber-50/50 p-1.5 rounded-lg border border-amber-100 italic leading-snug">
                                    💬 "{log.notes}"
                                  </p>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>

                  {/* 2. 🌟 칭찬 스티커 & 🎮 게임 시간 현황 */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <div className="p-3 rounded-2xl border border-amber-200 bg-white space-y-1.5">
                      <span className="font-black text-amber-900 text-xs flex items-center space-x-1">
                        <span>🌟</span>
                        <span>칭찬 스티커 보유 현황</span>
                      </span>
                      <div className="space-y-1">
                        {kidStickerStats.map(k => (
                          <div key={k.id} className="flex items-center justify-between p-1.5 rounded-lg bg-amber-50/60 text-[11px]">
                            <span className="font-bold text-slate-800">{k.name}</span>
                            <span className="font-black text-amber-700">보유: {k.available}개 (누적 {k.total}개)</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="p-3 rounded-2xl border border-violet-200 bg-white space-y-1.5">
                      <span className="font-black text-violet-900 text-xs flex items-center space-x-1">
                        <span>🎮</span>
                        <span>남은 게임 시간 현황</span>
                      </span>
                      <div className="space-y-1">
                        {KIDS_MEMBERS.map(kid => (
                          <div key={kid.id} className="flex items-center justify-between p-1.5 rounded-lg bg-violet-50/60 text-[11px]">
                            <span className="font-bold text-slate-800">{kid.name}</span>
                            <span className="font-black text-violet-700">{formatMinutesToHours(gameTimes[kid.id] || 0)}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* 3. 😊 온 가족 하루 감정 일기 전체 기록 */}
                  <div className="p-3.5 rounded-2xl border border-indigo-200 bg-white space-y-2.5">
                    <div className="flex items-center justify-between border-b border-indigo-100 pb-1.5">
                      <span className="font-black text-indigo-950 text-xs flex items-center space-x-1">
                        <span>😊</span>
                        <span>온 가족 하루 감정 일기 기록</span>
                      </span>
                      <span className="text-[10px] text-indigo-700 font-bold">
                        {periodLabel} 기준 총 {filteredDailyMoods.length}건
                      </span>
                    </div>

                    {/* 오늘자 출석부 미니 요약 */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-1.5">
                      {FAMILY_MEMBERS.map(m => {
                        const mood = dailyMoods.find(d => d.memberId === m.id && d.date === getTodayString());
                        const moodOpt = mood ? MOOD_OPTIONS.find(o => o.key === mood.moodKey) : null;
                        return (
                          <div key={m.id} className="p-1.5 rounded-xl bg-indigo-50/50 border border-indigo-100 flex items-center space-x-1.5">
                            <span className="text-base">{m.avatar}</span>
                            <div className="min-w-0 flex-1 text-[11px]">
                              <div className="font-bold text-slate-800 truncate">{m.name}</div>
                              <div className="text-[10px] text-indigo-700 font-extrabold truncate">
                                {moodOpt ? `${moodOpt.emoji} ${moodOpt.label}` : '오늘 미작성'}
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    {/* 감정 일기 전체 상세 목록 */}
                    {filteredDailyMoods.length === 0 ? (
                      <div className="text-center py-4 bg-slate-50 rounded-xl text-[11px] text-slate-400">
                        해당 기간에 기록된 감정 일기가 없습니다.
                      </div>
                    ) : (
                      <div className="space-y-1.5 pt-1">
                        <div className="text-[10px] font-black text-slate-500">📝 해당 기간 감정 일기 상세 내역 ({filteredDailyMoods.length}건):</div>
                        <div className="space-y-1.5 max-h-56 overflow-y-auto no-scrollbar pr-0.5">
                          {[...filteredDailyMoods].sort((a, b) => (b.date || '').localeCompare(a.date || '')).map((log) => {
                            const moodOpt = MOOD_OPTIONS.find(o => o.key === log.moodKey) || MOOD_OPTIONS[0];
                            const member = FAMILY_MEMBERS.find(m => m.id === log.memberId) || { name: log.memberName, avatar: '👤' };
                            return (
                              <div key={log.id} className="p-2 rounded-xl bg-slate-50/80 border border-slate-200/80 flex items-start space-x-2 text-[11px]">
                                <span className="text-lg shrink-0">{moodOpt.emoji}</span>
                                <div className="flex-1 min-w-0 space-y-0.5">
                                  <div className="flex items-center justify-between">
                                    <span className="font-extrabold text-slate-800 flex items-center space-x-1">
                                      <span>{member.avatar}</span>
                                      <span>{log.memberName || member.name}</span>
                                      <span className={`text-[10px] px-1.5 py-0.2 rounded font-bold border ${moodOpt.bg}`}>
                                        {moodOpt.label}
                                      </span>
                                    </span>
                                    <span className="text-[10px] text-slate-400 font-semibold">{log.date}</span>
                                  </div>
                                  {log.notes ? (
                                    <p className="text-slate-700 font-medium whitespace-pre-wrap bg-white p-1.5 rounded-lg border border-slate-100">
                                      "{log.notes}"
                                    </p>
                                  ) : (
                                    <p className="text-[10px] text-slate-400 italic">메모 없음</p>
                                  )}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>

                  {/* 4. 💌 마음의 편지 & 가족 소통 대화록 전체 기록 */}
                  <div className="p-3.5 rounded-2xl border border-pink-200 bg-pink-50/30 space-y-2.5">
                    <div className="flex items-center justify-between border-b border-pink-100 pb-1.5">
                      <span className="font-black text-pink-900 text-xs flex items-center space-x-1">
                        <span>💌</span>
                        <span>마음의 편지 & 가족 소통 대화록</span>
                      </span>
                      <span className="text-[10px] text-pink-700 font-bold">
                        {periodLabel} 기준 총 {filteredFamilyLetters.length}통
                      </span>
                    </div>

                    {filteredFamilyLetters.length === 0 ? (
                      <div className="text-center py-4 bg-white/80 rounded-xl text-[11px] text-slate-400">
                        해당 기간에 기록된 가족 편지가 없습니다.
                      </div>
                    ) : (
                      <div className="space-y-2 max-h-72 overflow-y-auto no-scrollbar pr-0.5">
                        {[...filteredFamilyLetters].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).map((letter) => {
                          const isAuthor = currentMemberId === letter.fromMemberId;
                          let canViewLetter = false;

                          if (isAuthor) {
                            canViewLetter = true;
                          } else if (letter.toRole === 'mom') {
                            canViewLetter = currentMemberId === 'mom' || (!letter.isSecret && isParent);
                          } else if (letter.toRole === 'dad') {
                            canViewLetter = currentMemberId === 'dad' || (!letter.isSecret && isParent);
                          } else if (letter.toRole === 'child1') {
                            canViewLetter = currentMemberId === 'child1' || (!letter.isSecret && isParent);
                          } else if (letter.toRole === 'child2') {
                            canViewLetter = currentMemberId === 'child2' || (!letter.isSecret && isParent);
                          } else if (letter.toRole === 'kids') {
                            canViewLetter = true;
                          } else {
                            canViewLetter = !letter.isSecret || isParent;
                          }

                          const fromMember = FAMILY_MEMBERS.find(m => m.id === letter.fromMemberId) || { name: letter.fromMemberName, avatar: '👦' };

                          const recipientText = (() => {
                            switch (letter.toRole) {
                              case 'mom': return letter.fromMemberId === 'dad' ? '👩 여보(엄마)에게' : '👩 엄마에게';
                              case 'dad': return letter.fromMemberId === 'mom' ? '👨 여보(아빠)에게' : '👨 아빠에게';
                              case 'child1': return '👦 주원이에게';
                              case 'child2': return '👧 주아에게';
                              case 'kids': return '👦👧 아이들 모두에게';
                              default: return '👨‍👩‍👦 엄마 & 아빠에게';
                            }
                          })();

                          return (
                            <div key={letter.id} className="p-2.5 rounded-xl bg-white border border-pink-150 space-y-1.5 text-[11px]">
                              <div className="flex items-center justify-between border-b border-slate-100 pb-1">
                                <div className="flex items-center space-x-1.5 font-black">
                                  <span>{fromMember.avatar}</span>
                                  <span className="text-slate-900">{letter.fromMemberName}</span>
                                  <span className="text-slate-400 font-normal">➔</span>
                                  <span className="text-pink-600">{recipientText}</span>
                                  {letter.isSecret && (
                                    <span className="text-[9px] bg-pink-100 text-pink-700 px-1 py-0.2 rounded font-bold">
                                      🔒 비밀 편지
                                    </span>
                                  )}
                                </div>
                                <span className="text-[10px] text-slate-400">
                                  {letter.createdAt ? new Date(letter.createdAt).toLocaleDateString([], { year: 'numeric', month: 'numeric', day: 'numeric' }) : ''}
                                </span>
                              </div>

                              {canViewLetter ? (
                                <p className="text-slate-800 font-medium whitespace-pre-wrap bg-pink-50/40 p-2 rounded-lg border border-pink-100/60 leading-relaxed">
                                  {letter.content}
                                </p>
                              ) : (
                                <p className="text-slate-400 italic bg-slate-50 p-2 rounded-lg border border-slate-100">
                                  🔒 비밀 편지입니다. (작성자와 수신자만 열람 가능)
                                </p>
                              )}

                              {/* 답글 목록 */}
                              {canViewLetter && letter.replies && letter.replies.length > 0 && (
                                <div className="pl-2.5 border-l-2 border-pink-300 space-y-1 pt-0.5">
                                  {letter.replies.map((rep, idx) => {
                                    const repAuthor = FAMILY_MEMBERS.find(m => m.id === rep.authorId) || { avatar: '💬' };
                                    return (
                                      <div key={idx} className="bg-amber-50/70 p-1.5 rounded-lg border border-amber-200/60 space-y-0.5">
                                        <div className="flex items-center justify-between text-[10px] font-bold text-amber-900">
                                          <span className="flex items-center space-x-1">
                                            <span>{repAuthor.avatar}</span>
                                            <span>{rep.authorName}의 답글:</span>
                                          </span>
                                          <span className="text-slate-400 text-[9px]">
                                            {rep.createdAt ? new Date(rep.createdAt).toLocaleDateString([], { month: 'numeric', day: 'numeric' }) : ''}
                                          </span>
                                        </div>
                                        <p className="text-slate-700 font-medium whitespace-pre-wrap">{rep.content}</p>
                                      </div>
                                    );
                                  })}
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>
                  );
                })()}

                {/* 모달 푸터 액션 버튼 */}
                <div className="pt-3 border-t border-slate-200 flex items-center space-x-2">
                  <button
                    type="button"
                    onClick={() => setIsPdfReportOpen(false)}
                    className="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-bold text-xs hover:bg-slate-50 transition"
                  >
                    닫기
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      triggerHaptic(20);
                      window.print();
                    }}
                    className="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xs shadow-md shadow-indigo-200 transition active:scale-95 flex items-center justify-center space-x-1.5"
                  >
                    <span>🖨️</span>
                    <span>인쇄 / PDF로 저장하기</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 모바일 전용 하단 고정 네비게이션 바 */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 px-1.5 py-1 pb-[max(0.5rem,env(safe-area-inset-bottom,0.5rem))] flex items-center justify-around md:hidden shadow-lg shadow-slate-900/10">
            <button
              type="button"
              onClick={() => { setMainTab('all'); triggerHaptic(10); }}
              className={`flex flex-col items-center justify-center py-1 px-1.5 rounded-2xl transition flex-1 ${
                mainTab === 'all' ? 'text-indigo-600 font-black' : 'text-slate-400 font-semibold'
              }`}
            >
              <span className={`text-xl transition-transform ${mainTab === 'all' ? 'scale-110' : ''}`}>🏠</span>
              <span className="text-[10px] tracking-tight mt-0.5">전체</span>
            </button>
            <button
              type="button"
              onClick={() => { setMainTab('schedule'); triggerHaptic(10); }}
              className={`flex flex-col items-center justify-center py-1 px-1.5 rounded-2xl transition flex-1 ${
                mainTab === 'schedule' ? 'text-indigo-600 font-black' : 'text-slate-400 font-semibold'
              }`}
            >
              <span className={`text-xl transition-transform ${mainTab === 'schedule' ? 'scale-110' : ''}`}>📅</span>
              <span className="text-[10px] tracking-tight mt-0.5">일정</span>
            </button>
            <button
              type="button"
              onClick={() => { setMainTab('todo'); triggerHaptic(10); }}
              className={`flex flex-col items-center justify-center py-1 px-1.5 rounded-2xl transition flex-1 ${
                mainTab === 'todo' ? 'text-emerald-600 font-black' : 'text-slate-400 font-semibold'
              }`}
            >
              <span className={`text-xl transition-transform ${mainTab === 'todo' ? 'scale-110' : ''}`}>✅</span>
              <span className="text-[10px] tracking-tight mt-0.5">할 일</span>
            </button>
            <button
              type="button"
              onClick={() => { setMainTab('reading'); triggerHaptic(10); }}
              className={`flex flex-col items-center justify-center py-1 px-1.5 rounded-2xl transition flex-1 ${
                mainTab === 'reading' ? 'text-amber-800 font-black' : 'text-slate-400 font-semibold'
              }`}
            >
              <span className={`text-xl transition-transform ${mainTab === 'reading' ? 'scale-110' : ''}`}>📖</span>
              <span className="text-[10px] tracking-tight mt-0.5">독서</span>
            </button>
            <button
              type="button"
              onClick={() => { setMainTab('game'); triggerHaptic(10); }}
              className={`flex flex-col items-center justify-center py-1 px-1.5 rounded-2xl transition flex-1 ${
                mainTab === 'game' ? 'text-violet-600 font-black' : 'text-slate-400 font-semibold'
              }`}
            >
              <span className={`text-xl transition-transform ${mainTab === 'game' ? 'scale-110' : ''}`}>🎮</span>
              <span className="text-[10px] tracking-tight mt-0.5">게임</span>
            </button>
            <button
              type="button"
              onClick={() => { setMainTab('praise'); triggerHaptic(10); }}
              className={`flex flex-col items-center justify-center py-1 px-1.5 rounded-2xl transition flex-1 ${
                mainTab === 'praise' ? 'text-amber-600 font-black' : 'text-slate-400 font-semibold'
              }`}
            >
              <span className={`text-xl transition-transform ${mainTab === 'praise' ? 'scale-110' : ''}`}>🌟</span>
              <span className="text-[10px] tracking-tight mt-0.5">칭찬</span>
            </button>
            <button
              type="button"
              onClick={() => { setMainTab('board'); triggerHaptic(10); }}
              className={`flex flex-col items-center justify-center py-1 px-1.5 rounded-2xl transition flex-1 relative ${
                mainTab === 'board' ? 'text-pink-600 font-black' : 'text-slate-400 font-semibold'
              }`}
            >
              <span className={`text-xl transition-transform ${mainTab === 'board' ? 'scale-110' : ''}`}>🎈</span>
              <span className="text-[10px] tracking-tight mt-0.5">소통</span>
              {appUnreadLetterCount > 0 ? (
                <span className="absolute top-1 right-2 px-1 py-0.2 rounded-full bg-rose-500 text-white text-[9px] font-black animate-bounce shadow-xs">
                  {appUnreadLetterCount}
                </span>
              ) : wishlist.filter(w => !w.isFulfilled).length > 0 && (
                <span className="absolute top-1 right-2 w-2 h-2 rounded-full bg-pink-500 animate-ping" />
              )}
            </button>
            <button
              type="button"
              onClick={() => { setMainTab('trip'); triggerHaptic(10); }}
              className={`flex flex-col items-center justify-center py-1 px-1.5 rounded-2xl transition flex-1 ${
                mainTab === 'trip' ? 'text-emerald-600 font-black' : 'text-slate-400 font-semibold'
              }`}
            >
              <span className={`text-xl transition-transform ${mainTab === 'trip' ? 'scale-110' : ''}`}>✈️</span>
              <span className="text-[10px] tracking-tight mt-0.5">여행</span>
            </button>
          </nav>

          {/* 알림 토스트 */}
          {toastMessage && (
            <div className="fixed bottom-[max(4.5rem,calc(4.5rem+env(safe-area-inset-bottom,0px)))] md:bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 text-white px-4 py-2.5 rounded-2xl shadow-xl text-xs font-bold border border-slate-700 max-w-[90vw] text-center animate-in slide-in-from-bottom duration-300">
              {toastMessage}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
