    const getTodayString = () => {

    };

    const formatRelativeTime = (timestamp) => {
      if (!timestamp) return '미등록';
      const diffMinutes = Math.floor((Date.now() - timestamp) / 60000);
      if (diffMinutes < 1) return '방금 전';
      if (diffMinutes < 60) return `${diffMinutes}분 전`;
      const diffHours = Math.floor(diffMinutes / 60);
      if (diffHours < 24) return `${diffHours}시간 전`;
      return new Date(timestamp).toLocaleDateString([], { month: 'numeric', day: 'numeric' });
    };

    const createGoogleCalendarUrl = (item) => {
      const title = encodeURIComponent(`[우리집] ${item.title}`);
      const notes = encodeURIComponent(item.notes ? `메모: ${item.notes}` : '');
      const dateFormatted = item.date.replace(/-/g, '');
      const startFormatted = (item.startTime || '09:00').replace(/:/g, '') + '00';
      const endFormatted = (item.endTime || '10:00').replace(/:/g, '') + '00';
      const dates = `${dateFormatted}T${startFormatted}/${dateFormatted}T${endFormatted}`;
      return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dates}&details=${notes}`;

                  <div>

                    <div className="text-xs text-amber-800 font-medium">받은 칭찬 스티커 총 {st.totalReceived}개</div>
                  </div>
                </div>

                <div className="flex items-center space-x-2">
                  <div className="bg-amber-100/90 text-amber-900 font-black text-xl px-4 py-2 rounded-2xl border border-amber-200">
                    🌟 {st.totalReceived}
                  </div>
                  {isParent && (
                    <button
                      type="button"
                      onClick={() => handleOpenPraiseModal(st.id)}
                      className="px-3 py-2 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-xl transition"
                    >
                      + 칭찬하기
                    </button>
                  )}
                </div>
              </div>
            ))}
          </div>

          <div className="space-y-2 pt-2">
            <h3 className="text-xs font-bold text-amber-900">💬 주원이와 주아가 받은 칭찬 내역</h3>

            {praiseLogs.length === 0 ? (
              <div className="text-center py-6 bg-white/60 rounded-2xl border border-dashed border-amber-200 text-xs text-amber-800/60 font-bold">
                아직 등록된 칭찬 스티커가 없습니다. 상단의 '🎁 칭찬 스티커 선물하기'를 눌러 첫 스티커를 선물해 보세요!
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-60 overflow-y-auto no-scrollbar">
                {praiseLogs
                  .sort((a, b) => b.createdAt - a.createdAt)
                  .map((log) => (
                    <div key={log.id} className="bg-white p-3 rounded-2xl border border-amber-100 shadow-2xs flex items-start space-x-2.5">
                      <span className="text-2xl shrink-0">{log.stickerEmoji || '🌟'}</span>
                      <div className="min-w-0 flex-1">
                        <div className="flex items-center justify-between text-[11px]">
                          <span className="font-bold text-slate-800">
                            <span className="text-amber-600 font-extrabold">{log.fromMemberName}</span> ➔ <span className="text-indigo-600 font-extrabold">{log.toMemberName}</span>
                          </span>
                          <div className="flex items-center space-x-1">
                            <span className="text-[10px] text-slate-400">{formatRelativeTime(log.createdAt)}</span>
                            {isParent && (
                              <button
                                type="button"
                                onClick={() => handleDeletePraise(log.id)}
                                className="p-0.5 text-slate-300 hover:text-rose-500 font-bold transition text-xs"
                                title="삭제"
                              >
                                ✕
                              </button>
                            )}
                          </div>
                        </div>
                        <p className="text-xs text-slate-700 font-medium mt-0.5 truncate">{log.reason}</p>
                      </div>
                    </div>
                  ))}
              </div>
            )}
          </div>
        </section>
      );
    }

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentMemberId, setCurrentMemberId] = useState('child1');
      const [selectedLoginMember, setSelectedLoginMember] = useState('child1');
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [rememberMe, setRememberMe] = useState(true);

      const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
      const [isAddCategoryModalOpen, setIsAddCategoryModalOpen] = useState(false);
      const [newCatName, setNewCatName] = useState('');
      const [newCatColor, setNewCatColor] = useState(CATEGORY_COLOR_OPTIONS[0].class);

      const [isPinModalOpen, setIsPinModalOpen] = useState(false);
      const [pinFormOld, setPinFormOld] = useState('');
      const [pinFormNew, setPinFormNew] = useState('');
      const [pinFormConfirm, setPinFormConfirm] = useState('');
      const [pinModalError, setPinModalError] = useState('');
      const [memberPins, setMemberPins] = useState({});

      const [selectedDate, setSelectedDate] = useState(getTodayString());
      const [currentMonth, setCurrentMonth] = useState(new Date());
      const [mainTab, setMainTab] = useState('all');
      const [viewMode, setViewMode] = useState('today');
      const [filterMemberId, setFilterMemberId] = useState('all');

      const [schedules, setSchedules] = useState([]);
      const [todos, setTodos] = useState([]);
      const [praiseLogs, setPraiseLogs] = useState([]);
      const [statusMessages, setStatusMessages] = useState({});
      const [syncStatus, setSyncStatus] = useState('connecting');

      const [myStatusInput, setMyStatusInput] = useState('');
      const [myEmoji, setMyEmoji] = useState('😊');

      const [statusPresets, setStatusPresets] = useState(() => {
        const saved = localStorage.getItem('family_status_presets');
        return saved ? JSON.parse(saved) : QUICK_STATUS_PRESETS.map((p, idx) => ({ id: `default_sp_${idx}`, ...p }));
      });

      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [isAddTodoModalOpen, setIsAddTodoModalOpen] = useState(false);
      const [editingTodo, setEditingTodo] = useState(null);
      const [isPraiseModalOpen, setIsPraiseModalOpen] = useState(false);
      const [isConfirmModalOpen, setIsConfirmModalOpen] = useState(false);
      const [isResetPraiseConfirmOpen, setIsResetPraiseConfirmOpen] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      const [autoAddToGCal, setAutoAddToGCal] = useState(true);

      const [todoPresets, setTodoPresets] = useState(() => {
        const saved = localStorage.getItem('family_todo_presets');
        return saved ? JSON.parse(saved) : DEFAULT_TODO_PRESETS.map((text, idx) => ({ id: `default_${idx}`, text }));
      });
      const [isPresetManageOpen, setIsPresetManageOpen] = useState(false);
      const [newPresetText, setNewPresetText] = useState('');

      const [newSchedule, setNewSchedule] = useState({
        title: '',
        memberId: 'child1',
        date: getTodayString(),
        startTime: '16:00',
        endTime: '17:00',
        category: 'school',
        notes: ''
      });

      const [todoForm, setTodoForm] = useState({ text: '', memberId: 'child1', category: 'study' });
      const [praiseForm, setPraiseForm] = useState({ toMemberId: 'child1', stickerKey: 'star', reason: '' });

      const dbRef = useRef(null);
      const authRef = useRef(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      useEffect(() => {
        localStorage.setItem('family_todo_presets', JSON.stringify(todoPresets));
      }, [todoPresets]);

      useEffect(() => {
        localStorage.setItem('family_status_presets', JSON.stringify(statusPresets));
      }, [statusPresets]);

      useEffect(() => {
        const initFirebase = async () => {
          try {
            if (!firebase.apps.length) {
              firebase.initializeApp(DEFAULT_FIREBASE_CONFIG);
            }
            const auth = firebase.auth();
            const db = firebase.firestore();
            authRef.current = auth;
            dbRef.current = db;

            auth.onAuthStateChanged(async (user) => {
              if (!user) {
                try { await auth.signInAnonymously(); } catch (e) { console.warn(e); }
              }
            });

            db.collection('schedules').onSnapshot((snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              setSchedules(list);
              setSyncStatus('online');
            }, () => setSyncStatus('offline'));

            db.collection('categories').onSnapshot((snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              if (list.length > 0) {
                setCategories([...DEFAULT_CATEGORIES, ...list]);
              } else {
                setCategories(DEFAULT_CATEGORIES);
              }
            });

            db.collection('status_presets').onSnapshot((snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              if (list.length > 0) {
                setStatusPresets(list);
              } else {
                setStatusPresets(QUICK_STATUS_PRESETS.map((p, idx) => ({ id: `default_sp_${idx}`, ...p })));
              }
            });

            db.collection('todo_presets').onSnapshot((snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              if (list.length > 0) {
                setTodoPresets(list);
              } else {
                setTodoPresets(DEFAULT_TODO_PRESETS.map((text, idx) => ({ id: `default_${idx}`, text })));
              }
            });

            db.collection('todos').onSnapshot((snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              setTodos(list);
            });

            db.collection('praise_stickers').onSnapshot((snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              setPraiseLogs(list);
            });

            db.collection('status_messages').onSnapshot((snapshot) => {
              const msgs = {};
              snapshot.forEach((doc) => { msgs[doc.id] = doc.data(); });
              setStatusMessages(msgs);
            }, (err) => console.warn("status messages snapshot error:", err));

            db.collection('family_pins').onSnapshot((snapshot) => {
              const pins = {};
              snapshot.forEach((doc) => { pins[doc.id] = doc.data().pin; });
              setMemberPins(pins);
            });

          } catch (error) {
            console.error(error);
            setSyncStatus('offline');
          }
        };

        initFirebase();

        const savedMember = localStorage.getItem('family_logged_in_member');
        if (savedMember) {
          setCurrentMemberId(savedMember);
          setSelectedLoginMember(savedMember);
          setIsLoggedIn(true);
        }
      }, []);

      const handleAddStatusPreset = async (text, emoji) => {
        if (!text.trim()) return;
        const newObj = { text: text.trim(), emoji: emoji || '💬', createdAt: Date.now() };
        try {
          if (dbRef.current) {
            await dbRef.current.collection('status_presets').add(newObj);
          } else {
            setStatusPresets(prev => [...prev, { id: 'sp_' + Date.now(), ...newObj }]);
          }
          showToast("새 빠른 상태 문구가 추가되었습니다! ✨");
        } catch (err) { console.error(err); }
      };

      const handleDeleteStatusPreset = async (presetItem) => {
        try {
          if (dbRef.current && presetItem.id && !presetItem.id.startsWith('default_sp_')) {
            await dbRef.current.collection('status_presets').doc(presetItem.id).delete();
          }
          setStatusPresets(prev => prev.filter(p => (p.id ? p.id !== presetItem.id : p.text !== presetItem.text)));
          showToast("빠른 상태 문구가 삭제되었습니다. 🗑️");
        } catch (err) { console.error(err); }
      };

      const currentMember = useMemo(() => {
        return FAMILY_MEMBERS.find(m => m.id === currentMemberId) || FAMILY_MEMBERS[0];
      }, [currentMemberId]);

      const isParent = currentMember.isParent;

      const allowedScheduleMembers = useMemo(() => {
        return isParent ? FAMILY_MEMBERS : [currentMember];
      }, [isParent, currentMember]);

      // 비밀번호 설정/변경 처리
      const handleSavePin = async (e) => {
        e.preventDefault();
        const target = FAMILY_MEMBERS.find(m => m.id === selectedLoginMember);
        const currentPin = memberPins[target.id] || target.defaultPin;

        if (pinFormOld !== currentPin) {
          setPinModalError('현재 비밀번호가 일치하지 않습니다.');
          return;
        }
        if (pinFormNew.length !== 4 || !/^\d+$/.test(pinFormNew)) {
          setPinModalError('새 비밀번호는 숫자 4자리로 입력해주세요.');
          return;
        }
        if (pinFormNew !== pinFormConfirm) {
          setPinModalError('새 비밀번호 확인이 일치하지 않습니다.');
          return;
        }

        try {
          if (dbRef.current) {
            await dbRef.current.collection('family_pins').doc(target.id).set({ pin: pinFormNew, updatedAt: Date.now() });
          } else {
            setMemberPins(prev => ({ ...prev, [target.id]: pinFormNew }));
          }
          setIsPinModalOpen(false);
          setPinFormOld(''); setPinFormNew(''); setPinFormConfirm(''); setPinModalError('');
          showToast(`${target.name} 비밀번호 변경 완료! 🔑`);
        } catch (err) {
          console.error(err);
          setPinModalError('비밀번호 변경 중 오류가 발생했습니다.');
        }
      };

      // 카테고리 추가
      const handleAddCategory = async (e) => {
        e.preventDefault();
        if (!newCatName.trim()) return;
        const newCatObj = { name: newCatName.trim(), color: newCatColor, createdAt: Date.now() };
        try {
          if (dbRef.current) {
            await dbRef.current.collection('categories').add(newCatObj);
          } else {
            setCategories(prev => [...prev, { id: 'cat_' + Date.now(), ...newCatObj }]);
          }
          setNewCatName('');
          setIsAddCategoryModalOpen(false);
          showToast(`새 카테고리 '${newCatObj.name}' 추가 완료! ✨`);
        } catch (err) { console.error(err); }
      };

      // 카테고리 전체 (기본 포함) 삭제 지원
      const handleDeleteCategory = async (catItem) => {
        try {
          if (dbRef.current && catItem.id && !catItem.id.startsWith('default_')) {
            await dbRef.current.collection('categories').doc(catItem.id).delete();
          }
          setCategories(prev => prev.filter(c => c.id !== catItem.id));
          showToast(`카테고리 '${catItem.name}' 삭제 완료! 🗑️`);
        } catch (err) { console.error(err); }
      };

      // 자주 사용하는 할 일 문구 추가
      const handleAddTodoPreset = async (e) => {
        e.preventDefault();
        if (!newPresetText.trim()) return;
        const newPresetObj = { text: newPresetText.trim(), createdAt: Date.now() };
        try {
          if (dbRef.current) {
            await dbRef.current.collection('todo_presets').add(newPresetObj);
          } else {
            setTodoPresets(prev => [...prev, { id: 'p_' + Date.now(), ...newPresetObj }]);
          }
          setNewPresetText('');
          showToast("자주 쓰는 문구가 추가되었습니다! ✨");
        } catch (err) { console.error(err); }
      };

      // 자주 사용하는 할 일 문구 삭제
      const handleDeleteTodoPreset = async (presetItem) => {
        try {
          if (dbRef.current && presetItem.id && !presetItem.id.startsWith('default_')) {
            await dbRef.current.collection('todo_presets').doc(presetItem.id).delete();
          }
          setTodoPresets(prev => prev.filter(p => (p.id ? p.id !== presetItem.id : p.text !== presetItem.text)));
          showToast("자주 쓰는 문구가 삭제되었습니다. 🗑️");
        } catch (err) { console.error(err); }
      };

      // 로그인 처리
      const handleLoginSubmit = (e) => {
        e.preventDefault();
        const target = FAMILY_MEMBERS.find(m => m.id === selectedLoginMember);
        if (!target) return;

        const correctPin = memberPins[target.id] || target.defaultPin;
        if (pinInput === correctPin) {
          setCurrentMemberId(target.id);
          setIsLoggedIn(true);
          setLoginError('');
          setPinInput('');
          if (rememberMe) {
            localStorage.setItem('family_logged_in_member', target.id);
          }
          showToast(`반가워요, ${target.name}님! 👋`);
        } else {
          setLoginError('비밀번호가 올바르지 않습니다.');
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('family_logged_in_member');
        setIsLoggedIn(false);
        setPinInput('');
        setLoginError('');
      };

      // 일정 조작
      const handleStatusChange = async (scheduleId, newStatus) => {
        try {
          if (dbRef.current) {
            await dbRef.current.collection('schedules').doc(scheduleId).update({
              status: newStatus, updatedAt: Date.now()
            });
          }
        } catch (err) { console.error(err); }
      };

      const handleDeleteSchedule = async (scheduleItem) => {
        if (!isParent && scheduleItem.memberId !== currentMember.id) { 
          showToast("⚠️ 본인 일정만 삭제 가능합니다."); 
          return; 
        }
        try {
          if (dbRef.current) await dbRef.current.collection('schedules').doc(scheduleItem.id).delete();
          showToast("일정이 삭제되었습니다.");
        } catch (err) { console.error(err); }
      };

      const handleFinalScheduleSubmit = async () => {
        if (isSubmitting) return;
        setIsSubmitting(true);
        try {
          const itemData = { ...newSchedule, title: newSchedule.title.trim(), status: 'pending', stickers: {}, createdAt: Date.now() };
          if (dbRef.current) await dbRef.current.collection('schedules').add(itemData);
          
          if (isParent && autoAddToGCal) {
            window.open(createGoogleCalendarUrl(itemData), '_blank');
          }
          
          setIsConfirmModalOpen(false);
          setIsAddModalOpen(false);
          showToast(isParent && autoAddToGCal ? "일정 등록 완료! 구글 캘린더 창이 열렸습니다. 📅" : "새 일정이 등록되었습니다!");
        } catch (err) { console.error(err); } finally { setIsSubmitting(false); }
      };

      // 할 일 조작
      const handleOpenAddTodoModal = (targetMemberId = null) => {
        setEditingTodo(null);
        setTodoForm({ text: '', memberId: targetMemberId || currentMemberId, category: 'study' });
        setIsAddTodoModalOpen(true);
      };

      const handleOpenEditTodoModal = (todo) => {
        if (!isParent) { showToast("⚠️ 엄마, 아빠만 수정 가능합니다."); return; }
        setEditingTodo(todo);
        setTodoForm({ text: todo.text, memberId: todo.memberId, category: todo.category || 'study' });
        setIsAddTodoModalOpen(true);
      };

      const handleSaveTodo = async (e) => {
        e.preventDefault();
        if (!todoForm.text.trim()) return;
        try {
          if (editingTodo) {
            if (dbRef.current) await dbRef.current.collection('todos').doc(editingTodo.id).update({ text: todoForm.text.trim(), memberId: todoForm.memberId, category: todoForm.category, updatedAt: Date.now() });
            showToast("할 일이 수정되었습니다!");
          } else {
            const itemData = { text: todoForm.text.trim(), memberId: todoForm.memberId, category: todoForm.category, completed: false, createdAt: Date.now() };
            if (dbRef.current) await dbRef.current.collection('todos').add(itemData);
            showToast("새 할 일이 추가되었습니다!");
          }
          setIsAddTodoModalOpen(false);
        } catch (err) { console.error(err); }
      };

      const handleToggleTodo = async (todoItem) => {
        const nextState = !todoItem.completed;
        try {
          if (dbRef.current) await dbRef.current.collection('todos').doc(todoItem.id).update({ completed: nextState, completedAt: nextState ? Date.now() : null, completedBy: nextState ? currentMember.name : null });
          if (nextState) showToast(`👏 ${todoItem.text} 완료! 참 잘했어요!`);
        } catch (err) { console.error(err); }
      };

      const handleDeleteTodo = async (todoItem) => {
        if (!isParent) { showToast("⚠️ 엄마, 아빠만 삭제 가능합니다."); return; }
        try {
          if (dbRef.current) await dbRef.current.collection('todos').doc(todoItem.id).delete();
          showToast("할 일이 삭제되었습니다.");
        } catch (err) { console.error(err); }
      };

      // 칭찬 스티커 조작
      const handleOpenPraiseModal = (targetMemberId = 'child1') => {
        if (!isParent) { showToast("⚠️ 엄마, 아빠만 스티커를 줄 수 있습니다!"); return; }
        setPraiseForm({ toMemberId: (targetMemberId === 'child1' || targetMemberId === 'child2') ? targetMemberId : 'child1', stickerKey: 'star', reason: '' });
        setIsPraiseModalOpen(true);
      };

      const handleSendPraiseSticker = async (e) => {
        e.preventDefault();
        if (!isParent) return;
        const toMember = FAMILY_MEMBERS.find(m => m.id === praiseForm.toMemberId);
        const stickerObj = STICKER_ICONS.find(s => s.key === praiseForm.stickerKey) || STICKER_ICONS[0];
        const finalReason = praiseForm.reason.trim() || `${stickerObj.label}! 참 잘했어요! 🎉`;

        try {
          const praiseData = {
            fromMemberId: currentMember.id, fromMemberName: currentMember.name, fromMemberAvatar: currentMember.avatar,
            toMemberId: praiseForm.toMemberId, toMemberName: toMember ? toMember.name : '',
            stickerKey: praiseForm.stickerKey, stickerEmoji: stickerObj.emoji, stickerLabel: stickerObj.label,
            reason: finalReason, createdAt: Date.now()
          };
          if (dbRef.current) await dbRef.current.collection('praise_stickers').add(praiseData);
          setIsPraiseModalOpen(false);
          showToast(`🎁 ${toMember ? toMember.name : '아이'}에게 스티커를 선물했습니다!`);
        } catch (err) { console.error(err); }
      };

      const handleDeletePraise = async (praiseId) => {
        if (!isParent) return;
        try {
          if (dbRef.current) await dbRef.current.collection('praise_stickers').doc(praiseId).delete();
          showToast("칭찬 내역이 삭제되었습니다.");
        } catch (err) { console.error(err); }
      };

      const handleResetAllPraises = async () => {
        if (!isParent) return;
        try {
          if (dbRef.current) {
            const snapshot = await dbRef.current.collection('praise_stickers').get();
            const batch = dbRef.current.batch();
            snapshot.forEach((doc) => batch.delete(doc.ref));
            await batch.commit();
          }
          setIsResetPraiseConfirmOpen(false);
          showToast("칭찬 스티커 기록이 리셋되었습니다.");
        } catch (err) { console.error(err); }
      };

      const sendStatusMessage = async (text, emoji = '😊') => {
        if (!text || !text.trim()) {
          showToast("⚠️ 공유할 한 줄 현황을 입력해주세요!");
          return;
        }

        const cleanText = text.replace(/^[^\w가-힣a-zA-Z0-9~!?.\s]+/, '').trim() || text.trim();
        const msgObj = { 
          memberId: currentMember.id, 
          memberName: currentMember.name, 
          text: cleanText, 
          emoji: emoji || '💬', 
          updatedAt: Date.now() 
        };

        // 1. 화면 즉시 반영 (오프라인 / 로컬 브라우저 / 네트워크 지연 시에도 즉시 UI 반영)
        setStatusMessages(prev => ({ ...prev, [currentMember.id]: msgObj }));
        setMyStatusInput('');

        // 2. Firebase 클라우드 실시간 동기화
        try {
          if (dbRef.current) {
            await dbRef.current.collection('status_messages').doc(currentMember.id).set(msgObj);
          }
          showToast(`${currentMember.name}님의 현황이 실시간 공유되었습니다! 📢`);
        } catch (err) {
          console.error("Status update error:", err);
          showToast(`${currentMember.name}님의 현황이 반영되었습니다! 📢`);
        }
      };

      // 계산된 데이터
      const kidStickerStats = useMemo(() => {
        return KIDS_MEMBERS.map(m => {
          const receivedPraises = praiseLogs.filter(p => p.toMemberId === m.id);
          return { ...m, totalReceived: receivedPraises.length, recentLogs: receivedPraises.sort((a, b) => b.createdAt - a.createdAt) };
        });
      }, [praiseLogs]);

      const filteredSchedules = useMemo(() => {
        return schedules
          .filter(s => s.date === selectedDate && (filterMemberId === 'all' || s.memberId === filterMemberId))
          .sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));
      }, [schedules, selectedDate, filterMemberId]);

      const weekDays = useMemo(() => {
        const curr = new Date(selectedDate);
        const day = curr.getDay();
        const sunday = new Date(curr);
        sunday.setDate(curr.getDate() - day);
        const days = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(sunday); d.setDate(sunday.getDate() + i);
          const dateStr = d.toISOString().split('T')[0];
          days.push({ dateStr, dayName: ['일', '월', '화', '수', '목', '금', '토'][i], dayNumber: d.getDate(), isToday: dateStr === getTodayString() });
        }
        return days;
      }, [selectedDate]);

      const monthCalendarDays = useMemo(() => {
        const year = currentMonth.getFullYear(); const month = currentMonth.getMonth();
        const firstDay = new Date(year, month, 1); const lastDay = new Date(year, month + 1, 0);
        const days = [];
        for (let i = 0; i < firstDay.getDay(); i++) days.push({ empty: true, id: `e-${i}` });
        for (let d = 1; d <= lastDay.getDate(); d++) {
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          days.push({ empty: false, dateStr, dayNumber: d, isToday: dateStr === getTodayString(), isSelected: dateStr === selectedDate, schedules: schedules.filter(s => s.date === dateStr) });
        }
        return days;
      }, [currentMonth, schedules, selectedDate]);

      const stats = useMemo(() => {
        const todayItems = schedules.filter(s => s.date === selectedDate);
        const total = todayItems.length;
        const completed = todayItems.filter(s => s.status === 'completed').length;
        const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;
        const memberStats = FAMILY_MEMBERS.map(m => {
          const mItems = todayItems.filter(s => s.memberId === m.id);
          const mTotal = mItems.length;
          const mCompleted = mItems.filter(s => s.status === 'completed').length;
          return { ...m, total: mTotal, completed: mCompleted, percentage: mTotal > 0 ? Math.round((mCompleted / mTotal) * 100) : 0 };
        });
        return { total, completed, percentage, memberStats };
      }, [schedules, selectedDate]);

      if (!isLoggedIn) {
        return (

                    </div>

                      {STICKER_ICONS.map((st) => (

                  </div>
                  <div className="pt-2 flex space-x-2">

                  <button type="button" onClick={() => { setIsAddTodoModalOpen(false); setIsPresetManageOpen(false); }} className="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 font-bold text-xs">✕</button>

                <form onSubmit={handleSaveTodo} className="space-y-3 text-xs sm:text-sm">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">담당 가족 선택</label>
                    <div className="grid grid-cols-4 gap-1.5">
                      {FAMILY_MEMBERS.map((m) => (
                        <button type="button" key={m.id} onClick={() => setTodoForm({ ...todoForm, memberId: m.id })} className={`p-1.5 rounded-xl border text-center transition ${todoForm.memberId === m.id ? `${m.activeBg} font-bold ring-2 ring-emerald-400` : 'bg-white border-slate-200'}`}>

                        <button type="button" key={m.id} onClick={() => setNewSchedule({ ...newSchedule, memberId: m.id })} className={`p-1.5 rounded-xl border text-center transition ${newSchedule.memberId === m.id ? `${m.activeBg} font-bold ring-2 ring-indigo-400` : 'bg-white border-slate-200'}`}>
                          <div className="text-lg">{m.avatar}</div>
                          <div className="text-[11px] truncate">{m.name}</div>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <label className="font-bold text-slate-700">카테고리</label>
                      <button
                        type="button"
                        onClick={() => setIsAddCategoryModalOpen(true)}
                        className="text-[11px] font-bold text-indigo-600 hover:underline"
                      >
                        + 새 카테고리 추가
                      </button>
                    </div>
                    <div className="grid grid-cols-3 gap-1">
                      {categories.map((c) => (
                        <button type="button" key={c.id} onClick={() => setNewSchedule({ ...newSchedule, category: c.id })} className={`px-2 py-1.5 rounded-lg border text-xs font-semibold ${newSchedule.category === c.id ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-600 border-slate-200'}`}>
                          {c.name}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">날짜</label>
                      <input type="date" value={newSchedule.date} onChange={(e) => setNewSchedule({ ...newSchedule, date: e.target.value })} className="w-full px-2 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs" />
                    </div>
                    <div className="grid grid-cols-2 gap-1">
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">시작</label>
                        <input type="time" value={newSchedule.startTime} onChange={(e) => setNewSchedule({ ...newSchedule, startTime: e.target.value })} className="w-full px-1.5 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs" />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">종료</label>
                        <input type="time" value={newSchedule.endTime} onChange={(e) => setNewSchedule({ ...newSchedule, endTime: e.target.value })} className="w-full px-1.5 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs" />
                      </div>
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">일정 제목 *</label>
                    <input type="text" required value={newSchedule.title} onChange={(e) => setNewSchedule({ ...newSchedule, title: e.target.value })} placeholder="예: 영어 학원, 피아노 연습" className="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold" />
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">메모 / 준비물</label>
                    <input type="text" value={newSchedule.notes} onChange={(e) => setNewSchedule({ ...newSchedule, notes: e.target.value })} placeholder="예: 교재 챙기기, 끝나고 연락하기" className="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs" />
                  </div>

                  {isParent && (
                    <div className="pt-1">
                      <label className="flex items-center space-x-1.5 text-xs text-slate-600 cursor-pointer">
                        <input type="checkbox" checked={autoAddToGCal} onChange={(e) => setAutoAddToGCal(e.target.checked)} className="rounded text-indigo-600" />
                        <span>📅 일정 등록 시 구글 캘린더에 자동 연결하기</span>
                      </label>
                    </div>
                  )}

                  <div className="pt-2 flex space-x-2">
                    <button type="button" onClick={() => setIsAddModalOpen(false)} className="flex-1 py-2 rounded-xl border border-slate-200 text-slate-600 font-bold">취소</button>
                    <button type="submit" className="flex-1 py-2 rounded-xl bg-indigo-600 text-white font-bold">일정 확인 ➔</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 🏷️ 새 카테고리 등록 및 전체 삭제 관리 모달 */}
          {isAddCategoryModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3.5 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-3xl max-w-xs w-full p-5 shadow-2xl space-y-3 text-xs sm:text-sm">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                  <h3 className="font-bold text-slate-900">🏷️ 카테고리 추가 / 관리</h3>
                  <button type="button" onClick={() => setIsAddCategoryModalOpen(false)} className="text-slate-400 font-bold">✕</button>
                </div>
                <form onSubmit={handleAddCategory} className="space-y-3">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">카테고리 이름 *</label>
                    <input
                      type="text"
                      required
                      value={newCatName}
                      onChange={(e) => setNewCatName(e.target.value)}
                      placeholder="예: 병원/약국, 독서실"
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">태그 색상 선택</label>
                    <div className="grid grid-cols-3 gap-1.5">
                      {CATEGORY_COLOR_OPTIONS.map((opt) => (
                        <button
                          type="button"
                          key={opt.id}
                          onClick={() => setNewCatColor(opt.class)}
                          className={`p-1.5 rounded-lg border text-center text-[11px] font-bold ${
                            newCatColor === opt.class ? 'ring-2 ring-indigo-500 font-black' : ''
                          } ${opt.class}`}
                        >
                          {opt.name}
                        </button>
                      ))}
                    </div>
                  </div>
                  <button type="submit" className="w-full py-2 rounded-xl bg-indigo-600 text-white font-bold">
                    + 카테고리 저장
                  </button>
                </form>

                {/* 카테고리 삭제 리스트 (모든 카테고리 삭제 지원) */}
                <div className="pt-2 border-t border-slate-100 space-y-1.5">
                  <div className="flex items-center justify-between">
                    <label className="block font-bold text-slate-700 text-xs">현재 등록된 카테고리 목록</label>
                    <span className="text-[10px] text-slate-400">총 {categories.length}개</span>
                  </div>
                  <div className="max-h-36 overflow-y-auto no-scrollbar space-y-1.5">
                    {categories.map((cat) => (
                      <div key={cat.id} className="flex items-center justify-between p-2 rounded-xl bg-slate-50 border border-slate-200 hover:bg-slate-100 transition">
                        <span className={`px-2.5 py-0.5 rounded-md text-xs font-bold border ${cat.color || 'bg-slate-100 text-slate-700'}`}>
                          {cat.name}
                        </span>
                        <button
                          type="button"
                          onClick={() => handleDeleteCategory(cat)}
                          className="px-2 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-bold rounded-lg text-xs transition flex items-center space-x-1"
                          title="카테고리 삭제"
                        >
                          <span>🗑️</span>
                          <span>삭제</span>
                        </button>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="pt-1">
                  <button type="button" onClick={() => setIsAddCategoryModalOpen(false)} className="w-full py-2 rounded-xl border border-slate-200 text-slate-600 font-bold">
                    닫기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 🔍 최종 일정 확인 모달 */}
          {isConfirmModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-xs">
              <div className="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl space-y-4 text-center">
                <span className="text-3xl">🗓️</span>
                <h3 className="text-base font-extrabold text-slate-900">일정을 등록하시겠습니까?</h3>
                <div className="flex space-x-2 pt-1">
                  <button type="button" disabled={isSubmitting} onClick={() => setIsConfirmModalOpen(false)} className="flex-1 py-2.5 rounded-xl bg-slate-100 font-bold text-xs">수정하기</button>
                  <button type="button" disabled={isSubmitting} onClick={handleFinalScheduleSubmit} className="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs">{isSubmitting ? '등록 중...' : '최종 등록 완료'}</button>
                </div>
              </div>
            </div>
          )}

          {/* 🧹 리셋 확인 모달 */}
          {isResetPraiseConfirmOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-xs">
              <div className="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl space-y-4 text-center">
                <div className="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center text-2xl mx-auto font-bold">🧹</div>
                <h3 className="text-base font-extrabold text-slate-900">칭찬 스티커 내역 초기화</h3>
                <p className="text-xs text-slate-500">모든 칭찬 스티커 기록을 초기화하시겠습니까?</p>
                <div className="flex space-x-2 pt-2">
                  <button type="button" onClick={() => setIsResetPraiseConfirmOpen(false)} className="flex-1 py-2.5 rounded-xl bg-slate-100 font-bold text-xs">취소</button>
                  <button type="button" onClick={handleResetAllPraises} className="flex-1 py-2.5 rounded-xl bg-rose-600 text-white font-bold text-xs">전체 리셋하기</button>
                </div>
              </div>
            </div>
          )}

          {/* 🔔 토스트 알림 */}
          {toastMessage && (
            <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-3.5 py-2 rounded-2xl shadow-xl text-xs font-bold border border-slate-700">
              ✨ {toastMessage}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
