    const calculateDDay = (dateStr, isAnnual = false) => {
      if (!dateStr) return { text: '', diffDays: 0, isToday: false };
      const parts = dateStr.split('-').map(Number);
      if (parts.length !== 3) return { text: '', diffDays: 0, isToday: false };
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      let target = new Date(parts[0], parts[1] - 1, parts[2]);

      if (isAnnual) {
        target.setFullYear(now.getFullYear());
        if (target < today) {
          target.setFullYear(now.getFullYear() + 1);
        }
      }

      const diffTime = target.getTime() - today.getTime();
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays === 0) return { text: 'D-Day 오늘! 🎉', diffDays: 0, isToday: true };
      if (diffDays > 0) return { text: `D-${diffDays}`, diffDays, isToday: false };
      return { text: `D+${Math.abs(diffDays)}`, diffDays, isToday: false };
    };

    };

    const shiftDateString = (dateStr, offsetDays) => {
      if (!dateStr) return getTodayString();
      const parts = dateStr.split('-').map(Number);
      if (parts.length !== 3) return dateStr;
      const d = new Date(parts[0], parts[1] - 1, parts[2] + offsetDays);

      if (diffMinutes < 1) return '방금 전';
      if (diffMinutes < 60) return `${diffMinutes}분 전`;
      const diffHours = Math.floor(diffMinutes / 60);
      if (diffHours < 24) return `${diffHours}시간 전`;
      return new Date(timestamp).toLocaleDateString([], { month: 'numeric', day: 'numeric' });
    };

      if (mins <= 0) return '0분';
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      if (h === 0) return `${m}분`;
      if (m === 0) return `${h}시간`;
      return `${h}시간 ${m}분`;
    };

      const endDateFormatted = (item.endDate && item.endDate >= item.date ? item.endDate : item.date).replace(/-/g, '');
      const startFormatted = (item.startTime || '09:00').replace(/:/g, '') + '00';
      const endFormatted = (item.endTime || '10:00').replace(/:/g, '') + '00';
      const dates = `${startDateFormatted}T${startFormatted}/${endDateFormatted}T${endFormatted}`;
      return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dates}&details=${notes}`;
    };

    // 신규: 주원·주아 독서 시간 기록, 1주일 단위 분석, 누적 명예의 전당 & 레벨 컴포넌트
    function ReadingSection({ isParent, currentMember, readingLogs, handleOpenReadingModal, handleRequestDeleteReadingLog }) {
      const [selectedWeekOffset, setSelectedWeekOffset] = useState(0);
      const [isLevelGuideOpen, setIsLevelGuideOpen] = useState(false);
      const [readingKidFilter, setReadingKidFilter] = useState('all');
      const [readingSearchQuery, setReadingSearchQuery] = useState('');

      // 기준 주의 월요일 ~ 일요일 7일 계산
      const weekDays = useMemo(() => {
        const now = new Date();
        now.setDate(now.getDate() + (selectedWeekOffset * 7));
        const day = now.getDay();
        const diffToMon = day === 0 ? -6 : 1 - day;
        const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMon);
        const days = [];
        for (let i = 0; i < 7; i++) {
          const cur = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i);
          const dateStr = `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, '0')}-${String(cur.getDate()).padStart(2, '0')}`;
          const dayName = ['월', '화', '수', '목', '금', '토', '일'][i];
          days.push({ dateStr, dayName, dayNum: cur.getDate(), isToday: dateStr === getTodayString() });
        }
        return days;
      }, [selectedWeekOffset]);

      const weekDatesSet = useMemo(() => new Set(weekDays.map(w => w.dateStr)), [weekDays]);

      // 주원·주아 통계 계산
      const kidStats = useMemo(() => {
        return KIDS_MEMBERS.map(kid => {
          const kidLogs = readingLogs.filter(l => l.childId === kid.id);
          const totalMinutes = kidLogs.reduce((acc, l) => acc + (Number(l.minutes) || 0), 0);
          const levelInfo = getReadingLevelInfo(totalMinutes);

          const weekLogs = kidLogs.filter(l => weekDatesSet.has(l.date));
          const weekMinutes = weekLogs.reduce((acc, l) => acc + (Number(l.minutes) || 0), 0);

          // 일별 독서 시간 맵
          const dailyMap = {};
          weekDays.forEach(w => { dailyMap[w.dateStr] = 0; });
          weekLogs.forEach(l => {
            if (dailyMap[l.date] !== undefined) {
              dailyMap[l.date] += Number(l.minutes) || 0;
            }
          });

          // 주간 최고 기록 계산 (월요일 기준 주차별 집계 중 최대치)
          const weekAggMap = {};
          kidLogs.forEach(l => {
            if (!l.date) return;
            const parts = l.date.split('-').map(Number);
            const d = new Date(parts[0], parts[1] - 1, parts[2]);
            const day = d.getDay();
            const diff = day === 0 ? -6 : 1 - day;
            const mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
            const weekKey = `${mon.getFullYear()}-${String(mon.getMonth() + 1).padStart(2, '0')}-${String(mon.getDate()).padStart(2, '0')}`;
            weekAggMap[weekKey] = (weekAggMap[weekKey] || 0) + (Number(l.minutes) || 0);
          });
          const weekTotals = Object.values(weekAggMap);
          const bestWeekMinutes = weekTotals.length > 0 ? Math.max(...weekTotals) : weekMinutes;
          const bestWeekFormatted = formatMinutesToHours(bestWeekMinutes);

          // 최근 읽은 책 로그 (최대 5건)
          const recentLogs = [...kidLogs].sort((a, b) => b.createdAt - a.createdAt).slice(0, 5);

          return {
            ...kid,
            totalMinutes,
            totalFormatted: formatMinutesToHours(totalMinutes),
            levelInfo,
            weekLogs,
            weekMinutes,
            weekFormatted: formatMinutesToHours(weekMinutes),
            bestWeekMinutes,
            bestWeekFormatted,
            dailyMap,
            recentLogs
          };
        });
      }, [readingLogs, weekDatesSet, weekDays]);

      const child1 = kidStats.find(k => k.id === 'child1') || kidStats[0];
      const child2 = kidStats.find(k => k.id === 'child2') || kidStats[1];

      // 주간 독서왕 (Weekly Winner)
      const weeklyWinnerId = (child1.weekMinutes > child2.weekMinutes && child1.weekMinutes > 0)
        ? 'child1'
        : (child2.weekMinutes > child1.weekMinutes && child2.weekMinutes > 0)
        ? 'child2'
        : (child1.weekMinutes === child2.weekMinutes && child1.weekMinutes > 0)
        ? 'tie'
        : null;

      // 누적 명예의 전당 1위 (All-time Winner)
      const allTimeWinnerId = (child1.totalMinutes > child2.totalMinutes && child1.totalMinutes > 0)
        ? 'child1'
        : (child2.totalMinutes > child1.totalMinutes && child2.totalMinutes > 0)
        ? 'child2'
        : (child1.totalMinutes === child2.totalMinutes && child1.totalMinutes > 0)
        ? 'tie'
        : null;

      const totalFamilyWeekMinutes = (child1.weekMinutes || 0) + (child2.weekMinutes || 0);

      // 필터 및 검색이 적용된 독서 로그 목록
      const filteredReadingLogs = useMemo(() => {
        let list = [...readingLogs].sort((a, b) => b.createdAt - a.createdAt);
        if (readingKidFilter !== 'all') {
          list = list.filter(l => l.childId === readingKidFilter);
        }
        if (readingSearchQuery.trim()) {
          const q = readingSearchQuery.trim().toLowerCase();
          list = list.filter(l =>
            (l.bookTitle && l.bookTitle.toLowerCase().includes(q)) ||
            (l.notes && l.notes.toLowerCase().includes(q)) ||
            (l.childName && l.childName.toLowerCase().includes(q))
          );
        }
        return list;
      }, [readingLogs, readingKidFilter, readingSearchQuery]);

      return (
        <section className="bg-gradient-to-br from-amber-950 via-stone-900 to-amber-950 text-white rounded-3xl p-4 sm:p-6 shadow-xl border border-amber-500/20 space-y-5">
          {/* 헤더 */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 pb-3 border-b border-white/10">
            <div>
              <div className="flex items-center space-x-2">
                <span className="text-xl sm:text-2xl">📖</span>
                <h2 className="text-base sm:text-lg font-black tracking-tight text-white flex items-center space-x-2">
                  <span>주원·주아 독서 기록 & 명예의 전당</span>
                  <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-500/30 text-amber-200 border border-amber-400/30">
                    주간 분석 & 레벨 시스템
                  </span>
                </h2>
              </div>
              <p className="text-xs text-amber-200/80 mt-1">
                매일 책 읽는 시간을 1주일 단위로 기록하고, 누적 독서 시간으로 레벨업에 도전해요! 📚✨
              </p>
            </div>

            <div className="flex items-center space-x-1.5 self-start sm:self-auto shrink-0">
              <button
                type="button"
                onClick={() => setIsLevelGuideOpen(true)}
                className="px-3 py-1.5 text-xs font-bold rounded-xl bg-white/10 hover:bg-white/20 text-amber-200 border border-white/15 transition active:scale-95"
              >
                🏅 레벨 등급표
              </button>
              {isParent && (
                <button
                  type="button"
                  onClick={() => handleOpenReadingModal('child1')}
                  className="px-3.5 py-1.5 text-xs font-extrabold rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white shadow-lg shadow-amber-500/20 transition active:scale-95"
                >
                  + 📖 독서 시간 기록
                </button>
              )}
            </div>
          </div>

          {/* 1. 누적 명예의 전당 & 레벨 카드 (주원 & 주아) */}
          <div className="space-y-2.5">
            <div className="flex items-center justify-between">
              <span className="text-xs font-black text-amber-300 flex items-center space-x-1">
                <span>🏆</span>
                <span>누적 독서 명예의 전당 & 레벨 달성 현황</span>
              </span>
              <span className="text-[10px] text-slate-300">누적 독서 시간에 따라 자동 레벨업!</span>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4">
              {kidStats.map((kid) => {
                const isWeeklyKing = weeklyWinnerId === kid.id || (weeklyWinnerId === 'tie' && kid.weekMinutes > 0);
                const isAllTimeKing = allTimeWinnerId === kid.id || (allTimeWinnerId === 'tie' && kid.totalMinutes > 0);

                return (
                  <div
                    key={kid.id}
                    className="bg-white/10 backdrop-blur-md rounded-2xl p-4 sm:p-5 border border-white/15 space-y-3 relative overflow-hidden flex flex-col justify-between"
                  >
                    {/* 상단 뱃지 및 프로필 */}
                    <div className="flex items-start justify-between">
                      <div className="flex items-center space-x-2.5">
                        <span className="text-3xl sm:text-4xl">{kid.avatar}</span>
                        <div>
                          <div className="flex items-center space-x-1.5">
                            <span className="text-sm sm:text-base font-black text-white">{kid.name}</span>
                            <span className="text-[10px] px-1.5 py-0.2 rounded-md bg-white/20 text-slate-200 font-bold">
                              {kid.role}
                            </span>
                          </div>
                          <div className="flex items-center space-x-1.5 mt-0.5">
                            <span className="text-xs font-extrabold text-amber-300 bg-amber-500/20 px-2 py-0.5 rounded-lg border border-amber-400/30 flex items-center space-x-1">
                              <span>{kid.levelInfo.icon}</span>
                              <span>Lv.{kid.levelInfo.level} {kid.levelInfo.title}</span>
                            </span>
                          </div>
                        </div>
                      </div>

                      {/* 트로피 / 왕관 뱃지 */}
                      <div className="flex flex-col items-end space-y-1">
                        {isWeeklyKing && (

                  <button

                  type="button"

                  className="mt-1 px-4 py-2 text-xs font-bold bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 shadow-sm"
                >
                  + 일정 등록하기
                </button>
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {filteredSchedules.map((item) => {
                  const member = FAMILY_MEMBERS.find(m => m.id === item.memberId) || FAMILY_MEMBERS[0];
                  const category = categories.find(c => c.id === item.category) || categories[0];
                  const isCompleted = item.status === 'completed';
                  const isInProgress = item.status === 'in_progress';
                  const isPending = item.status === 'pending' || !item.status;
                  const canManage = canManageMemberSchedule(currentMember.id, item.memberId);

                  return (
                    <div
                      key={item.id}
                      className={`bg-white rounded-2xl p-3.5 sm:p-4 border transition flex flex-col justify-between ${
                        isCompleted ? 'border-slate-200 bg-slate-50/70 opacity-90' : isInProgress ? 'border-indigo-300 ring-2 ring-indigo-500/10' : 'border-slate-200'

                                  ? `${item.date.slice(5)} ~ ${item.endDate.slice(5)} (기간)`
                                  : `${item.date.slice(5)} (${new Date(item.date.replace(/-/g, '/')).toLocaleDateString('ko-KR', { weekday: 'short' })})`}
                              </span>
                            )}
                            <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-xs font-bold border ${member.badgeBg}`}>
                              <span className="mr-1">{member.avatar}</span>

                          <div className="flex items-center text-xs font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-lg shrink-0">

                        </div>

                        <div className="my-1.5">
                          <h3 className={`text-sm sm:text-base font-bold transition ${isCompleted ? 'text-slate-400 line-through' : 'text-slate-900'}`}>

                      <div className="mt-3 pt-2.5 border-t border-slate-100 space-y-2">

                            <button
                              type="button"
                              onClick={() => handleStatusChange(item.id, 'pending')}
                              className={`flex-1 sm:flex-initial px-2.5 py-1 rounded-lg text-xs font-bold transition ${

                              onClick={() => handleStatusChange(item.id, 'in_progress')}

                            <button
                              type="button"
                              onClick={() => handleStatusChange(item.id, 'completed')}

                                isCompleted ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-500'

                            >

    }

    function TodoListSection({ isParent, todos, handleToggleTodo, handleOpenAddTodoModal, handleOpenEditTodoModal, handleDeleteTodo }) {
      const [todoFilterMemberId, setTodoFilterMemberId] = useState('all');

      const displayedMembers = useMemo(() => {
        if (todoFilterMemberId === 'all') return FAMILY_MEMBERS;
        return FAMILY_MEMBERS.filter(m => m.id === todoFilterMemberId);
      }, [todoFilterMemberId]);

      return (
        <section className="bg-white rounded-2xl p-3.5 sm:p-5 border border-slate-200 shadow-sm space-y-4">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-100 pb-3 gap-2">
            <div>
              <h2 className="text-sm sm:text-base font-extrabold text-slate-900 flex items-center space-x-2">
                <span>✅ 가족 사용자별 할 일 체크리스트</span>
                <span className="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">
                  {isParent ? '엄마·아빠 권한 (수정/삭제)' : '주원·주아 권한 (체크)'}
                </span>
              </h2>
              <p className="text-[11px] text-slate-500 mt-0.5">
                {isParent 
                  ? '엄마, 아빠는 아이들의 할 일을 등록, 수정, 삭제하실 수 있습니다.' 
                  : '주원이와 주아는 내 할 일을 다 하면 체크를 눌러 완료해 보세요!'}
              </p>
            </div>

            {isParent && (
              <button
                type="button"
                onClick={() => handleOpenAddTodoModal(todoFilterMemberId !== 'all' ? todoFilterMemberId : 'child1')}
                className="px-3 py-1.5 text-xs font-bold rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm transition shrink-0 self-end sm:self-auto active:scale-95"
              >
                + 할 일 등록
              </button>
            )}
          </div>

          {/* 구성원 필터 탭바 */}
          <div className="flex items-center space-x-1.5 overflow-x-auto no-scrollbar py-0.5">
            <button
              type="button"
              onClick={() => setTodoFilterMemberId('all')}
              className={`px-3 py-1.5 rounded-xl text-xs font-bold transition shrink-0 ${
                todoFilterMemberId === 'all'
                  ? 'bg-slate-900 text-white shadow-xs'
                  : 'bg-slate-100 hover:bg-slate-200 text-slate-600'
              }`}
            >
              전체 보기 ({todos.length})
            </button>
            {FAMILY_MEMBERS.map((m) => {
              const count = todos.filter(t => t.memberId === m.id).length;
              const isSelected = todoFilterMemberId === m.id;
              return (
                <button
                  key={m.id}
                  type="button"
                  onClick={() => setTodoFilterMemberId(m.id)}
                  className={`px-2.5 py-1.5 rounded-xl text-xs font-bold transition shrink-0 flex items-center space-x-1 ${
                    isSelected
                      ? `${m.activeBg} shadow-xs font-black`
                      : 'bg-slate-100 hover:bg-slate-200 text-slate-700'
                  }`}
                >
                  <span>{m.avatar}</span>
                  <span>{m.name}</span>
                  <span className={`text-[10px] px-1.5 py-0.2 rounded-full ${isSelected ? 'bg-white/30 text-white' : 'bg-slate-200 text-slate-600'}`}>
                    {count}
                  </span>
                </button>
              );
            })}
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {displayedMembers.map((member) => {
              const memberTodos = todos.filter(t => t.memberId === member.id);
              const completedCount = memberTodos.filter(t => t.completed).length;
              const totalCount = memberTodos.length;
              const pct = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;
              const isAllDone = totalCount > 0 && completedCount === totalCount;

              return (
                <div
                  key={member.id}
                  className={`p-4 rounded-2xl border transition ${member.cardBg} space-y-3 shadow-2xs`}
                >
                  <div className="flex items-center justify-between border-b pb-2.5 border-slate-200/80">
                    <div className="flex items-center space-x-2">
                      <span className="text-2xl">{member.avatar}</span>
                      <div>
                        <h3 className="font-extrabold text-sm text-slate-900">{member.name}의 할 일</h3>
                        <p className="text-[10px] text-slate-500">{member.role}</p>
                      </div>
                    </div>

                    <div className="flex items-center space-x-1.5">
                      <span className={`text-xs font-black px-2.5 py-1 rounded-full border shadow-2xs ${
                        isAllDone
                          ? 'bg-emerald-500 text-white border-emerald-400'
                          : 'bg-white text-slate-700 border-slate-200'
                      }`}>
                        {completedCount} / {totalCount} 완료 ({pct}%)
                      </span>

                      {isParent && (
                        <button
                          type="button"
                          onClick={() => handleOpenAddTodoModal(member.id)}
                          className="px-2 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold rounded-lg transition"
                          title={`${member.name} 할 일 추가`}
                        >
                          + 추가
                        </button>
                      )}
                    </div>
                  </div>

                  {/* 할 일 진행률 프로그레스 바 */}
                  {totalCount > 0 && (
                    <div className="space-y-1">
                      <div className="w-full bg-slate-200/80 h-2 rounded-full overflow-hidden">
                        <div
                          className={`h-full rounded-full transition-all duration-500 ${
                            isAllDone
                              ? 'bg-emerald-500'
                              : pct >= 50
                              ? 'bg-indigo-500'
                              : 'bg-amber-500'
                          }`}
                          style={{ width: `${pct}%` }}
                        ></div>
                      </div>

                      {/* 100% 올클리어 축하 배너 */}
                      {isAllDone && (

                          <span>오늘 할 일 모두 완료! 참 잘했어요!</span>
                          <span>⭐</span>

                          <div className="flex items-center space-x-2.5 min-w-0 flex-1">
                            <button
                              type="button"
                              onClick={() => handleToggleTodo(todo)}
                              className={`w-7 h-7 sm:w-6 sm:h-6 rounded-lg border-2 flex items-center justify-center font-bold text-xs sm:text-xs transition shrink-0 ${
                                todo.completed
                                  ? 'bg-emerald-500 border-emerald-500 text-white'
                                  : 'border-slate-300 bg-white hover:border-emerald-400'
                              }`}

                              {todo.completed && '✓'}
                            </button>

                            <p className={`text-xs sm:text-sm font-bold truncate ${todo.completed ? 'line-through text-slate-400' : 'text-slate-800'}`}>
                              {todo.text}

                          </div>

                          {isParent && (
                            <div className="flex items-center space-x-1 shrink-0 ml-2">
                              <button
                                type="button"
                                onClick={() => handleOpenEditTodoModal(todo)}
                                className="p-1 text-slate-400 hover:text-indigo-600 rounded text-xs transition"

                              <button
                                type="button"
                                onClick={() => handleDeleteTodo(todo)}
                                className="p-1 text-slate-300 hover:text-rose-500 text-xs transition"
                                title="삭제"
                              >
                                ✕
                              </button>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </section>
      );
    }

    // 신규: 우리 가족 소통 & 소원 보드 (위시리스트, 편지/하고싶은말, 하루 감정)

      currentMember,
      currentMemberId,
      isParent,
      wishlist = [],
      familyLetters = [],
      dailyMoods = [],
      handleSaveWishItem,
      handleToggleWishFulfilled,
      handleDeleteWishItem,

      const [wishForm, setWishForm] = useState({
        childId: currentMemberId === 'child2' ? 'child2' : 'child1',
        title: '',
        price: '',
        reason: '',
        link: ''
      });

      // 하고 싶은 말 폼 상태
      const [letterForm, setLetterForm] = useState({
        toRole: 'parents', // 'mom', 'dad', 'parents'
        content: '',
        isSecret: false // 부모님과 작성자만 볼 수 있는 비밀글

      const [replyInputMap, setReplyInputMap] = useState({});

      // 하루 감정 폼 상태
      const todayStr = getTodayString();
      const myTodayMood = dailyMoods.find(m => m.memberId === currentMemberId && m.date === todayStr);
      const [selectedMoodKey, setSelectedMoodKey] = useState(myTodayMood?.moodKey || 'happy');
      const [moodNotes, setMoodNotes] = useState(myTodayMood?.notes || '');

      const [wishFilter, setWishFilter] = useState('all');
      const filteredWishlist = wishlist.filter(w => {
        if (wishFilter === 'all') return true;
        return w.childId === wishFilter;
      });

      // 하루 감정 구성원 필터 (전체 / 아빠 / 엄마 / 주원 / 주아)
      const [moodMemberFilter, setMoodMemberFilter] = useState('all');

      const onWishSubmit = (e) => {
        e.preventDefault();
        if (!wishForm.title.trim()) return;
        handleSaveWishItem(wishForm);
        setWishForm({
          childId: currentMemberId === 'child2' ? 'child2' : 'child1',
          title: '',
          price: '',
          reason: '',
          link: ''
        });
      };

      const onLetterSubmit = (e) => {
        e.preventDefault();
        if (!letterForm.content.trim()) return;
        handleSaveFamilyLetter(letterForm);
        setLetterForm({ toRole: 'parents', content: '', isSecret: false });
      };

      const onMoodSubmit = (e) => {
        e.preventDefault();
        handleSaveDailyMood({ moodKey: selectedMoodKey, notes: moodNotes });
      };

        <section className="bg-gradient-to-br from-indigo-50/70 via-pink-50/40 to-amber-50/70 rounded-3xl p-4 sm:p-6 border border-indigo-100 shadow-sm space-y-5">

            <div>
              <h2 className="text-base sm:text-lg font-black text-slate-900 flex items-center space-x-2">
                <span>🎈 우리 가족 소통 & 소원 보드</span>
                <span className="text-xs bg-indigo-100 text-indigo-700 font-bold px-2 py-0.5 rounded-full">
                  따뜻한 대화
                </span>
              </h2>
              <p className="text-xs text-slate-600 mt-0.5">
                가지고 싶은 물건을 조르고, 엄마·아빠에게 속마음을 전하고, 오늘 나의 기분을 기록해요!
              </p>
            </div>

            {/* 3개 서브탭 버튼 */}
            <div className="flex items-center space-x-1.5 bg-white/90 p-1 rounded-2xl border border-indigo-150 shadow-2xs self-start sm:self-auto">
              <button
                type="button"
                onClick={() => setBoardTab('wish')}
                className={`px-3 py-1.5 rounded-xl text-xs font-extrabold transition flex items-center space-x-1 ${
                  boardTab === 'wish' ? 'bg-amber-500 text-white shadow-xs' : 'text-slate-600 hover:bg-slate-50'
                }`}
              >
                <span>🎁</span>
                <span>갖고 싶은 물건</span>
                {wishlist.filter(w => !w.isFulfilled).length > 0 && (

                    boardTab === 'wish' ? 'bg-white text-amber-600' : 'bg-amber-100 text-amber-700'

                    {wishlist.filter(w => !w.isFulfilled).length}
                  </span>
                )}
              </button>

              <button
                type="button"
                onClick={() => setBoardTab('letter')}
                className={`px-3 py-1.5 rounded-xl text-xs font-extrabold transition flex items-center space-x-1 ${
                  boardTab === 'letter' ? 'bg-pink-500 text-white shadow-xs' : 'text-slate-600 hover:bg-slate-50'
                }`}
              >
                <span>💌</span>
                <span>엄마·아빠에게</span>
                {familyLetters.length > 0 && (
                  <span className={`text-[10px] px-1.5 py-0.2 rounded-full font-black ${
                    boardTab === 'letter' ? 'bg-white text-pink-600' : 'bg-pink-100 text-pink-700'

                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl font-medium focus:ring-2 focus:ring-amber-400"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <div>
                      <label className="block text-slate-700 font-bold mb-1">예상 가격 / 용돈 (선택)</label>
                      <input
                        type="text"
                        value={wishForm.price}
                        onChange={(e) => setWishForm({ ...wishForm, price: e.target.value })}

                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl font-medium focus:ring-2 focus:ring-amber-400"

                    </div>
                    <div>

                        value={wishForm.link}
                        onChange={(e) => setWishForm({ ...wishForm, link: e.target.value })}

                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-700 font-bold mb-1">갖고 싶은 이유나 다짐 (선택)</label>

                      rows={2}
                      value={wishForm.reason}
                      onChange={(e) => setWishForm({ ...wishForm, reason: e.target.value })}
                      placeholder="예: 이번 학기 수학 90점 맞으면 꼭 사주세요! 매일 30분씩 스스로 책 읽을게요~"
                      className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl font-medium focus:ring-2 focus:ring-amber-400"
                    />
                  </div>

                  <div className="flex justify-end pt-1">
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-xs shadow-md shadow-amber-200 transition active:scale-95 flex items-center space-x-1.5"
                    >
                      <span>🎁</span>
                      <span>소원 목록에 추가하기</span>
                    </button>
                  </div>
                </form>
              </div>

              {/* 필터 및 목록 헤더 */}
              <div className="flex items-center justify-between pt-1">
                <div className="flex items-center space-x-1 bg-white p-1 rounded-xl border border-slate-200 text-xs">
                  <button
                    type="button"
                    onClick={() => setWishFilter('all')}
                    className={`px-2.5 py-1 rounded-lg font-bold transition ${
                      wishFilter === 'all' ? 'bg-amber-500 text-white' : 'text-slate-600 hover:bg-slate-50'
                    }`}
                  >
                    전체 보기 ({wishlist.length})
                  </button>
                  <button
                    type="button"
                    onClick={() => setWishFilter('child1')}
                    className={`px-2.5 py-1 rounded-lg font-bold transition flex items-center space-x-1 ${
                      wishFilter === 'child1' ? 'bg-indigo-600 text-white' : 'text-slate-600 hover:bg-slate-50'
                    }`}
                  >
                    <span>👦 주원</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => setWishFilter('child2')}
                    className={`px-2.5 py-1 rounded-lg font-bold transition flex items-center space-x-1 ${
                      wishFilter === 'child2' ? 'bg-rose-500 text-white' : 'text-slate-600 hover:bg-slate-50'

                    <span>👧 주아</span>

                </span>

              {/* 위시리스트 그리드 */}
              {filteredWishlist.length === 0 ? (

                  <div className="text-2xl">🎁</div>
                  <div>등록된 소원/물건이 없습니다.</div>
                  <div className="text-[11px] text-slate-400 font-normal">위 양식을 통해 갖고 싶은 물건을 등록해 보세요!</div>

              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {filteredWishlist.map((item) => {
                    const kid = FAMILY_MEMBERS.find(m => m.id === item.childId) || FAMILY_MEMBERS[2];
                    return (
                      <div
                        key={item.id}
                        className={`p-4 rounded-2xl border transition-all flex flex-col justify-between shadow-2xs ${
                          item.isFulfilled
                            ? 'bg-slate-50/80 border-slate-200 text-slate-400'
                            : item.childId === 'child1'
                            ? 'bg-white border-indigo-200/80 hover:border-indigo-400'
                            : 'bg-white border-rose-200/80 hover:border-rose-400'
                        }`}
                      >
                        <div>
                          <div className="flex items-center justify-between mb-2">
                            <span className="flex items-center space-x-1.5 text-xs font-black">
                              <span>{kid.avatar}</span>
                              <span className={item.childId === 'child1' ? 'text-indigo-600' : 'text-rose-600'}>
                                {item.childName || kid.name}의 소원
                              </span>
                              {item.isFulfilled && (
                                <span className="bg-emerald-100 text-emerald-800 text-[10px] px-2 py-0.5 rounded-full font-bold">
                                  🎉 선물 완료!
                                </span>
                              )}
                            </span>
                            <div className="flex items-center space-x-1.5 text-[10px] text-slate-400">
                              <span>{formatRelativeTime(item.createdAt)}</span>
                              {(isParent || currentMemberId === item.childId) && (
                                <button
                                  type="button"
                                  onClick={() => handleDeleteWishItem(item.id)}
                                  className="text-slate-300 hover:text-rose-500 font-bold p-0.5 text-xs transition"
                                  title="삭제"
                                >
                                  ✕
                                </button>
                              )}
                            </div>
                          </div>

                          <h3 className={`text-sm font-extrabold ${item.isFulfilled ? 'line-through text-slate-400' : 'text-slate-900'} leading-snug`}>
                            🎁 {item.title}

                                rel="noreferrer"
                                className="inline-flex items-center space-x-1 text-[11px] font-bold text-indigo-600 hover:text-indigo-800 underline"
                              >
                                <span>🔗 물건 상세 링크 보기</span>
                              </a>
                            </div>
                          )}
                        </div>

                        {/* 부모 전용 선물 완료 토글 버튼 */}
                        <div className="pt-3 mt-3 border-t border-slate-100 flex items-center justify-between">

                          {isParent ? (

                              type="button"
                              onClick={() => handleToggleWishFulfilled(item)}
                              className={`px-3 py-1 rounded-xl text-xs font-bold transition flex items-center space-x-1 ${

                                  ? 'bg-slate-200 text-slate-600 hover:bg-slate-300'

                              }`}
                            >
                              <span>{item.isFulfilled ? '↩️ 선물 취소' : '💝 선물 완료 체크'}</span>

                          ) : (
                            item.isFulfilled && (
                              <span className="text-xs font-bold text-emerald-600">감사합니다! 💖</span>
                            )
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {/* ======================= 2. 엄마·아빠한테 하고 싶은 말 ======================= */}
          {boardTab === 'letter' && (
            <div className="space-y-4">

                      <span>💌</span>
                      <span>사랑의 편지 보내기</span>

                  <div className="text-[11px] text-slate-400 font-normal">엄마, 아빠에게 첫 번째 마음의 편지를 띄워보세요!</div>

                      restrictedMsg = "🔒 엄마에게만 보낸 편지입니다. (엄마와 작성자만 읽을 수 있어요)";
                    } else if (letter.toRole === 'dad') {
                      canViewLetter = currentMemberId === 'dad';
                      restrictedMsg = "🔒 아빠에게만 보낸 편지입니다. (아빠와 작성자만 읽을 수 있어요)";

                        return (

                                      )}
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          </div>

      handleOpenAddRewardModal,

    }) {

              {isParent && (
                <button

                  onClick={() => setIsResetPraiseConfirmOpen(true)}
                  className="px-3 py-2 text-xs font-extrabold rounded-2xl bg-rose-100 hover:bg-rose-200 text-rose-700 border border-rose-200 transition shrink-0"

                <button
                  type="button"
                  onClick={() => handleOpenPraiseModal('child1')}
                  className="px-3.5 py-2 text-xs font-extrabold rounded-2xl bg-amber-500 hover:bg-amber-600 text-white shadow-md shadow-amber-200 transition shrink-0"

                  🎁 칭찬 스티커 선물하기
                </button>
              ) : (
                <div className="text-xs text-amber-900 bg-amber-100/80 px-3 py-1.5 rounded-xl font-bold border border-amber-200">

                  <span className="text-3xl">{st.avatar}</span>
                  <div>
                    <div className="text-sm font-extrabold text-slate-900">{st.name} ({st.role})</div>

      });

          try {
            if (!firebase.apps.length) {
              firebase.initializeApp(DEFAULT_FIREBASE_CONFIG);
            }
            const auth = firebase.auth();
            const db = firebase.firestore();
            authRef.current = auth;
            dbRef.current = db;

            auth.onAuthStateChanged(async (user) => {
              if (!user) {
                try { await auth.signInAnonymously(); } catch (e) { console.warn(e); }
              }
            });

            db.collection('schedules').onSnapshot((snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              setSchedules(list);
              setSyncStatus('online');
            }, () => setSyncStatus('offline'));

            db.collection('categories').onSnapshot((snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              if (list.length > 0) {
                setCategories([...DEFAULT_CATEGORIES, ...list.filter(c => !DEFAULT_CATEGORIES.some(dc => dc.id === c.id))]);
              } else {
                setCategories(DEFAULT_CATEGORIES);
              }
            });

            db.collection('status_presets').onSnapshot((snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              if (list.length > 0) {
                setStatusPresets(list);
              } else {
                setStatusPresets(QUICK_STATUS_PRESETS.map((p, idx) => ({ id: `default_sp_${idx}`, ...p })));
              }
            });

            db.collection('todo_presets').onSnapshot((snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              if (list.length > 0) {
                setTodoPresets(list);
              } else {
                setTodoPresets(DEFAULT_TODO_PRESETS.map((text, idx) => ({ id: `default_${idx}`, text })));
              }
            });

            db.collection('todos').onSnapshot((snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              setTodos(list);
            });

            db.collection('praise_stickers').onSnapshot((snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              setPraiseLogs(list);
            });

            db.collection('status_messages').onSnapshot((snapshot) => {
              const msgs = {};
              snapshot.forEach((doc) => { msgs[doc.id] = doc.data(); });
              setStatusMessages(msgs);
            }, (err) => console.warn("status messages snapshot error:", err));

            db.collection('family_pins').onSnapshot((snapshot) => {
              const pins = {};
              snapshot.forEach((doc) => { pins[doc.id] = doc.data().pin; });
              setMemberPins(pins);
            });

            // 신규: 게임 시간 동기화
            db.collection('game_times').onSnapshot((snapshot) => {
              const times = { child1: 30, child2: 30 };
              snapshot.forEach((doc) => {
                if (doc.data().minutes !== undefined) {
                  times[doc.id] = doc.data().minutes;
                }
              });
              setGameTimes(times);
            });

            db.collection('game_time_logs').onSnapshot((snapshot) => {
              const logs = [];

      const applyGameTimeChange = async (kidId, deltaMinutes, finalTotalMinutes, reasonText) => {
        if (!isParent) return;

        const targetKid = KIDS_MEMBERS.find(k => k.id === kidId) || KIDS_MEMBERS[0];
        const logData = {
          fromMemberId: currentMember.id,
          fromMemberName: currentMember.name,

          finalMinutes: finalTotalMinutes,
          reason: reasonText || (deltaMinutes >= 0 ? `+${deltaMinutes}분 충전` : `${deltaMinutes}분 차감`),
          createdAt: Date.now()
        };

        try {
          if (dbRef.current) {
            await dbRef.current.collection('game_times').doc(targetKid.id).set({
              minutes: finalTotalMinutes,
              updatedAt: Date.now(),
              updatedBy: currentMember.name
            });
            await dbRef.current.collection('game_time_logs').add(logData);
          } else {
            setGameTimes(prev => ({ ...prev, [targetKid.id]: finalTotalMinutes }));
            setGameTimeLogs(prev => [...prev, { id: 'log_' + Date.now(), ...logData }]);
          }

          const sign = deltaMinutes > 0 ? `+${deltaMinutes}분 추가` : `${deltaMinutes}분 차감`;
          showToast(`🎮 ${targetKid.name}의 게임 시간이 ${sign}되었습니다! (잔여: ${finalTotalMinutes}분)`);
          triggerHaptic(deltaMinutes > 0 ? [30, 40, 30] : 40);
        } catch (err) {
          console.error(err);
          showToast("게임 시간 저장 중 오류가 발생했습니다.");
        }
      };

        e.preventDefault();
        if (!isParent) return;

        const kidId = gameTimeForm.childId;
        const currentVal = gameTimes[kidId] || 0;
        const inputMin = Math.abs(parseInt(gameTimeForm.minutes, 10) || 0);

        let delta = 0;
        let finalVal = currentVal;

        if (gameTimeForm.mode === 'add') {
          delta = inputMin;
          finalVal = currentVal + delta;
        } else if (gameTimeForm.mode === 'subtract') {
          delta = -inputMin;
          finalVal = Math.max(0, currentVal + delta);
        } else if (gameTimeForm.mode === 'set') {
          finalVal = inputMin;
          delta = finalVal - currentVal;
        }

        await applyGameTimeChange(kidId, delta, finalVal, gameTimeForm.reason.trim());
        setIsGameTimeModalOpen(false);
      };

      // 신규: 갖고 싶은 물건 위시리스트 핸들러
      const handleSaveWishItem = async (form) => {
        const kid = FAMILY_MEMBERS.find(m => m.id === form.childId) || FAMILY_MEMBERS[2];
        const itemData = {
          childId: form.childId,
          childName: kid.name,
          title: form.title.trim(),
          price: (form.price || '').trim(),
          reason: (form.reason || '').trim(),
          link: (form.link || '').trim(),
          isFulfilled: false,
          fulfilledBy: '',
          fulfilledAt: null,
          createdAt: Date.now(),
          createdBy: currentMember.name
        };
        try {
          if (dbRef.current) {
            await dbRef.current.collection('wishlist').add(itemData);
          } else {
            setWishlist(prev => [{ id: 'wish_' + Date.now(), ...itemData }, ...prev]);
          }
          showToast(`🎁 ${kid.name}의 소원("${itemData.title}")이 등록되었습니다! ✨`);
          triggerHaptic([30, 50, 30]);
        } catch (err) {
          console.error(err);
          showToast("소원 등록 중 오류가 발생했습니다.");
        }
      };

      const handleToggleWishFulfilled = async (item) => {
        if (!isParent) {
          showToast("⚠️ 엄마, 아빠만 선물 완료 상태를 변경할 수 있습니다.");
          return;
        }
        const newFulfilled = !item.isFulfilled;
        const updateData = {
          isFulfilled: newFulfilled,
          fulfilledBy: newFulfilled ? currentMember.name : '',
          fulfilledAt: newFulfilled ? Date.now() : null
        };
        try {
          if (dbRef.current) {
            await dbRef.current.collection('wishlist').doc(item.id).update(updateData);
          } else {
            setWishlist(prev => prev.map(w => w.id === item.id ? { ...w, ...updateData } : w));
          }
          showToast(newFulfilled ? `💝 '${item.title}' 선물이 완료 처리되었습니다!` : `↩️ '${item.title}' 선물 완료가 취소되었습니다.`);
          triggerHaptic(30);
        } catch (err) {
          console.error(err);
          showToast("선물 상태 변경 중 오류가 발생했습니다.");
        }
      };

      const handleDeleteWishItem = (itemId) => {

          }
        });
      };

      const weekDays = useMemo(() => {
        const parts = selectedDate.split('-').map(Number);
        const curr = parts.length === 3 ? new Date(parts[0], parts[1] - 1, parts[2]) : new Date();
        const first = curr.getDate() - curr.getDay();
        const days = [];
        for (let i = 0; i < 7; i++) {
          const next = new Date(curr.getFullYear(), curr.getMonth(), first + i);
          const dateStr = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}-${String(next.getDate()).padStart(2, '0')}`;
          const dayName = ['일', '월', '화', '수', '목', '금', '토'][next.getDay()];
          days.push({ dateStr, dayName, dayNumber: next.getDate() });
        }
        return days;
      }, [selectedDate]);

      const weekDatesSet = useMemo(() => {
        return new Set(weekDays.map(w => w.dateStr));
      }, [weekDays]);

      const currentDisplaySchedules = useMemo(() => {
        if (viewMode === 'week') {
          return schedules.filter(s => weekDays.some(w => isScheduleOnDate(s, w.dateStr)));
        }
        return schedules.filter(s => isScheduleOnDate(s, selectedDate));
      }, [schedules, selectedDate, viewMode, weekDays]);

      const filteredSchedules = useMemo(() => {
        return currentDisplaySchedules
          .filter(s => filterMemberId === 'all' || s.memberId === filterMemberId)
          .sort((a, b) => {
            if (a.date !== b.date) return (a.date || '').localeCompare(b.date || '');
            return (a.startTime || '').localeCompare(b.startTime || '');
          });
      }, [currentDisplaySchedules, filterMemberId]);

      const stats = useMemo(() => {
        const targetItems = currentDisplaySchedules;
        const total = targetItems.length;
        const completed = targetItems.filter(s => s.status === 'completed').length;
        const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

        const memberStats = FAMILY_MEMBERS.map(m => {
          const mItems = targetItems.filter(s => s.memberId === m.id);
          const mTotal = mItems.length;
          const mCompleted = mItems.filter(s => s.status === 'completed').length;
          return {
            ...m,
            total: mTotal,
            completed: mCompleted,
            percentage: mTotal > 0 ? Math.round((mCompleted / mTotal) * 100) : 0
          };
        });

        return { total, completed, percentage, memberStats };
      }, [currentDisplaySchedules]);

      const monthCalendarDays = useMemo(() => {
        const year = currentMonth.getFullYear();
        const month = currentMonth.getMonth();
        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();

        const days = [];
        for (let i = 0; i < firstDayIndex; i++) {
          days.push({ id: `empty_${i}`, empty: true });
        }
        for (let d = 1; d <= totalDays; d++) {
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const isSelected = dateStr === selectedDate;
          const isToday = dateStr === getTodayString();
          const daySchedules = schedules.filter(s => isScheduleOnDate(s, dateStr));
          days.push({ id: dateStr, dateStr, dayNumber: d, isSelected, isToday, schedules: daySchedules });
        }
        return days;
      }, [currentMonth, selectedDate, schedules]);

      const kidStickerStats = useMemo(() => {
        return KIDS_MEMBERS.map(kid => {
          const receivedLogs = praiseLogs.filter(p => p.toMemberId === kid.id);
          const totalReceived = Math.max(0, receivedLogs.reduce((sum, p) => sum + ((p.count !== undefined && !isNaN(Number(p.count))) ? Number(p.count) : 1), 0));
          const redeemedCount = praiseRedeems
            .filter(r => r.memberId === kid.id)
            .reduce((sum, r) => sum + (Number(r.cost) || 0), 0);
          const available = Math.max(0, totalReceived - redeemedCount);
          return {
            ...kid,
            totalReceived,
            redeemedCount,
            available,
            logs: receivedLogs
          };
        });
      }, [praiseLogs, praiseRedeems]);

      if (!isLoggedIn) {

            />

            {/* 비밀번호 변경 모달 */}

                    <div className="flex space-x-2 pt-2">
                      <button

                  🏡

                  <div className="flex items-center space-x-1.5">

            >
              <span className={`text-xl transition-transform ${mainTab === 'praise' ? 'scale-110' : ''}`}>🌟</span>
              <span className="text-[10px] tracking-tight mt-0.5">칭찬</span>
            </button>
            <button
              type="button"
              onClick={() => { setMainTab('board'); triggerHaptic(10); }}
              className={`flex flex-col items-center justify-center py-1 px-1.5 rounded-2xl transition flex-1 relative ${
                mainTab === 'board' ? 'text-pink-600 font-black' : 'text-slate-400 font-semibold'
              }`}
            >
              <span className={`text-xl transition-transform ${mainTab === 'board' ? 'scale-110' : ''}`}>🎈</span>
              <span className="text-[10px] tracking-tight mt-0.5">소통</span>
              {wishlist.filter(w => !w.isFulfilled).length > 0 && (
                <span className="absolute top-1 right-2 w-2 h-2 rounded-full bg-pink-500 animate-ping" />
              )}
            </button>
          </nav>

          {/* 알림 토스트 */}
          {toastMessage && (
            <div className="fixed bottom-[max(4.5rem,calc(4.5rem+env(safe-area-inset-bottom,0px)))] md:bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 text-white px-4 py-2.5 rounded-2xl shadow-xl text-xs font-bold border border-slate-700 max-w-[90vw] text-center animate-in slide-in-from-bottom duration-300">
              {toastMessage}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
