<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리집 커넥트 - 가족 일정 & 실시간 현황 공유</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts (Noto Sans KR) -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    @keyframes pulse-soft {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.03); opacity: 0.9; }
    }
    .animate-pulse-soft {
      animation: pulse-soft 2s infinite ease-in-out;
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.FirebaseSDK = {
      initializeApp, getAuth, signInAnonymously, signInWithCustomToken,
      getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc, deleteDoc
    };
  </script>
</head>
<body class="bg-slate-50 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const MEMBERS = [
      { id: 'dad', name: '아빠', role: '아버지', avatar: '👨‍💼', color: 'blue', bgLight: 'bg-blue-50', text: 'text-blue-600', border: 'border-blue-200', ring: 'ring-blue-400', badgeBg: 'bg-blue-500' },
      { id: 'mom', name: '엄마', role: '어머니', avatar: '👩‍⚕️', color: 'rose', bgLight: 'bg-rose-50', text: 'text-rose-600', border: 'border-rose-200', ring: 'ring-rose-400', badgeBg: 'bg-rose-500' },
      { id: 'kid1', name: '김주원', role: '첫째 (초6)', avatar: '👧', color: 'emerald', bgLight: 'bg-emerald-50', text: 'text-emerald-600', border: 'border-emerald-200', ring: 'ring-emerald-400', badgeBg: 'bg-emerald-500' },
      { id: 'kid2', name: '김주아', role: '둘째 (초3)', avatar: '👦', color: 'amber', bgLight: 'bg-amber-50', text: 'text-amber-600', border: 'border-amber-200', ring: 'ring-amber-400', badgeBg: 'bg-amber-500' }
    ];

    const CATEGORIES = {
      school: { label: '학원/학교', icon: 'fa-graduation-cap', color: 'bg-purple-100 text-purple-700' },
      work: { label: '업무/회사', icon: 'fa-briefcase', color: 'bg-blue-100 text-blue-700' },
      family: { label: '가족일정', icon: 'fa-house-chimney-user', color: 'bg-rose-100 text-rose-700' },
      routine: { label: '매일루틴', icon: 'fa-rotate', color: 'bg-emerald-100 text-emerald-700' },
      health: { label: '운동/건강', icon: 'fa-heart-pulse', color: 'bg-amber-100 text-amber-700' },
      other: { label: '기타', icon: 'fa-bookmark', color: 'bg-slate-100 text-slate-700' }
    };

    const STATUS_MAP = {
      TODO: { label: '대기 중', icon: 'fa-clock', bg: 'bg-slate-100 text-slate-600 border-slate-200', badge: 'bg-slate-400' },
      IN_PROGRESS: { label: '진행 중', icon: 'fa-person-running', bg: 'bg-amber-100 text-amber-800 border-amber-300 animate-pulse-soft', badge: 'bg-amber-500' },
      DONE: { label: '완료!', icon: 'fa-circle-check', bg: 'bg-emerald-100 text-emerald-800 border-emerald-300', badge: 'bg-emerald-500' }
    };

    const STICKERS = ['👍 짱이에요!', '❤️ 최고야!', '⭐ 빛나요!', '🎉 완벽해!', '👏 응원해요!'];

    const getTodayString = (offsetDays = 0) => {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return d.toISOString().split('T')[0];
    };

    const INITIAL_SCHEDULES = [
      {
        id: 'sch-1',
        title: '수학 학원 라이딩 및 수업',
        memberId: 'kid1',
        date: getTodayString(0),
        startTime: '15:30',
        endTime: '17:00',
        category: 'school',
        location: '명문수학학원 3층',
        status: 'IN_PROGRESS',
        note: '숙제 교재 꼭 챙겨가기',
        subtasks: [
          { id: 'sub-1', title: '개념원리 45p 오답노트', completed: true },
          { id: 'sub-2', title: '단원평가 준비', completed: false }
        ],
        praises: ['❤️ 최고야! (엄마)']
      },
      {
        id: 'sch-2',
        title: '피아노 학원 레슨',
        memberId: 'kid2',
        date: getTodayString(0),
        startTime: '14:00',
        endTime: '15:00',
        category: 'school',
        location: '체르니 음악학원',
        status: 'DONE',
        note: '체르니 30번 연습',
        subtasks: [
          { id: 'sub-3', title: '양손 연습 3회', completed: true }
        ],
        praises: ['🎉 완벽해! (아빠)', '👍 짱이에요! (엄마)']
      },
      {
        id: 'sch-3',
        title: '주간 전략 회의 & 프로젝트 발표',
        memberId: 'dad',
        date: getTodayString(0),
        startTime: '10:00',
        endTime: '11:30',
        category: 'work',
        location: '회사 대회의실',
        status: 'DONE',
        note: '발표자료 최종 점검',
        subtasks: [],
        praises: ['👏 응원해요! (엄마)']
      },
      {
        id: 'sch-4',
        title: '저녁 장보기 (밀키트 & 과일)',
        memberId: 'mom',
        date: getTodayString(0),
        startTime: '17:30',
        endTime: '18:30',
        category: 'family',
        location: '이마트',
        status: 'TODO',
        note: '우유, 사과, 계란 꼭 구매하기',
        subtasks: [
          { id: 'sub-4', title: '우유 & 계란 구매', completed: false },
          { id: 'sub-5', title: '주원이가 좋아하는 딸기 사기', completed: false }
        ],
        praises: []
      },
      {
        id: 'sch-5',
        title: '온 가족 저녁 식사 및 도란도란 대화',
        memberId: 'dad',
        date: getTodayString(0),
        startTime: '19:00',
        endTime: '20:30',
        category: 'family',
        location: '우리집 식탁',
        status: 'TODO',
        note: '오늘 하루 즐거웠던 일 이야기하기',
        subtasks: [],
        praises: []
      },
      {
        id: 'sch-6',
        title: '영어 단어 30개 암기',
        memberId: 'kid1',
        date: getTodayString(0),
        startTime: '20:30',
        endTime: '21:00',
        category: 'routine',
        location: '주원이 방',
        status: 'TODO',
        note: 'Day 12 라이팅 테스트',
        subtasks: [],
        praises: []
      }
    ];

    const INITIAL_BULLETINS = [
      { id: 'b-1', memberId: 'kid1', message: '수학 학원 도착했어요! 수업 열공하고 갈게요 ✏️', time: '15:28', date: getTodayString(0) },
      { id: 'b-2', memberId: 'mom', message: '장보기 거의 끝남! 오늘 저녁은 오삼불고기야 🥘', time: '18:10', date: getTodayString(0) },
      { id: 'b-3', memberId: 'dad', message: '퇴근 버스 탔습니다. 18:50 집 도착 예정! 🚌', time: '18:15', date: getTodayString(0) }
    ];

    function App() {
      // Current logged-in active profile persona
      const [currentMember, setCurrentMember] = useState(MEMBERS[0]);
      // State for schedules & status updates
      const [schedules, setSchedules] = useState(INITIAL_SCHEDULES);
      const [bulletins, setBulletins] = useState(INITIAL_BULLETINS);
      
      // Filter & View states
      const [selectedDate, setSelectedDate] = useState(getTodayString(0));
      const [filterMemberId, setFilterMemberId] = useState('all');
      const [activeTab, setActiveTab] = useState('today'); // 'today', 'calendar', 'status', 'praise'
      const [searchQuery, setSearchQuery] = useState('');

      // UI Control States
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [editingSchedule, setEditingSchedule] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);
      const [newBulletinText, setNewBulletinText] = useState('');
      const [isSyncing, setIsSyncing] = useState(false);
      const [useFirebase, setUseFirebase] = useState(false);

      // Toast alert helper
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      useEffect(() => {
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-schedule-app-default';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        
        if (firebaseConfig && window.FirebaseSDK) {
          try {
            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, collection, onSnapshot } = window.FirebaseSDK;
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            const authenticate = async () => {
              if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
              } else {
                await signInAnonymously(auth);
              }
            };

            authenticate().then(() => {
              setUseFirebase(true);
              setIsSyncing(true);

              // Realtime listener for schedules
              const schedCol = collection(db, 'artifacts', appId, 'public', 'data', 'schedules');
              const unsubSched = onSnapshot(schedCol, (snapshot) => {
                if (!snapshot.empty) {
                  const fetched = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                  setSchedules(fetched);
                }
                setIsSyncing(false);
              }, (err) => console.log('Firestore error:', err));

              // Realtime listener for bulletins
              const bullCol = collection(db, 'artifacts', appId, 'public', 'data', 'bulletins');
              const unsubBull = onSnapshot(bullCol, (snapshot) => {
                if (!snapshot.empty) {
                  const fetchedBull = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                  setBulletins(fetchedBull.sort((a,b) => b.time.localeCompare(a.time)));
                }
              });

              return () => {
                unsubSched();
                unsubBull();
              };
            }).catch(e => {
              console.log("Firebase auth fallback to local state:", e);
            });
          } catch (err) {
            console.log("Firebase init standard fallback:", err);
          }
        }
      }, []);

      const handleAddOrUpdateSchedule = async (scheduleData) => {
        let updatedList = [];
        if (editingSchedule) {
          updatedList = schedules.map(s => s.id === editingSchedule.id ? { ...s, ...scheduleData } : s);
          showToast('일정이 수정되었습니다! ✨');
        } else {
          const newSched = {
            id: 'sch-' + Date.now(),
            praises: [],
            subtasks: [],
            ...scheduleData
          };
          updatedList = [newSched, ...schedules];
          showToast('새로운 일정이 등록되었습니다! 📅');
        }
        
        setSchedules(updatedList);
        setIsAddModalOpen(false);
        setEditingSchedule(null);

        // Firestore sync if enabled
        if (useFirebase && window.FirebaseSDK) {
          try {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-schedule-app-default';
            const db = window.FirebaseSDK.getFirestore();
            const targetId = editingSchedule ? editingSchedule.id : 'sch-' + Date.now();
            const docRef = window.FirebaseSDK.doc(db, 'artifacts', appId, 'public', 'data', 'schedules', targetId);
            await window.FirebaseSDK.setDoc(docRef, editingSchedule ? { ...editingSchedule, ...scheduleData } : updatedList[0]);
          } catch (e) {
            console.error("Firestore sync save error", e);
          }
        }
      };

      const handleStatusChange = async (scheduleId, newStatus) => {
        const updated = schedules.map(s => {
          if (s.id === scheduleId) {
            return { ...s, status: newStatus };
          }
          return s;
        });
        setSchedules(updated);
        const target = schedules.find(s => s.id === scheduleId);
        showToast(`'${target?.title}' 상태가 [${STATUS_MAP[newStatus].label}](으)로 변경되었습니다!`);

        if (useFirebase && window.FirebaseSDK) {
          try {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'family-schedule-app-default';
            const db = window.FirebaseSDK.getFirestore();
            const docRef = window.FirebaseSDK.doc(db, 'artifacts', appId, 'public', 'data', 'schedules', scheduleId);
            await window.FirebaseSDK.updateDoc(docRef, { status: newStatus });
          } catch (e) { console.error(e); }
        }
      };

      const handleToggleSubtask = (scheduleId, subtaskId) => {
        setSchedules(prev => prev.map(s => {
          if (s.id === scheduleId) {
            const updatedSubs = s.subtasks.map(st => st.id === subtaskId ? { ...st, completed: !st.completed } : st);
            return { ...s, subtasks: updatedSubs };
          }
          return s;
        }));
      };

      const handleAddPraise = (scheduleId, stickerText) => {
        const praiseString = `${stickerText} (${currentMember.name})`;
        setSchedules(prev => prev.map(s => {
          if (s.id === scheduleId) {
            const existing = s.praises || [];
            if (existing.includes(praiseString)) return s;
            return { ...s, praises: [...existing, praiseString] };
          }
          return s;
        }));
        showToast(`${currentMember.name}님이 칭찬 스티커를 보냈습니다! 🎉`);
      };

      const handleDeleteSchedule = (id) => {
        setSchedules(prev => prev.filter(s => s.id !== id));
        showToast('일정이 삭제되었습니다.');
      };

      const handleAddBulletin = (e) => {
        e.preventDefault();
        if (!newBulletinText.trim()) return;
        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        const newB = {
          id: 'b-' + Date.now(),
          memberId: currentMember.id,
          message: newBulletinText.trim(),
          time: timeStr,
          date: getTodayString(0)
        };
        setBulletins([newB, ...bulletins]);
        setNewBulletinText('');
        showToast('가족 실시간 현황에 메시지가 등록되었습니다! 💬');
      };

      const filteredSchedules = useMemo(() => {
        return schedules.filter(s => {
          const matchDate = activeTab === 'calendar' ? true : s.date === selectedDate;
          const matchMember = filterMemberId === 'all' ? true : s.memberId === filterMemberId;
          const matchQuery = !searchQuery ? true : (
            s.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (s.location && s.location.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (s.note && s.note.toLowerCase().includes(searchQuery.toLowerCase()))
          );
          return matchDate && matchMember && matchQuery;
        }).sort((a, b) => (a.startTime || '00:00').localeCompare(b.startTime || '00:00'));
      }, [schedules, selectedDate, filterMemberId, searchQuery, activeTab]);

      // Calculate family completion rates
      const stats = useMemo(() => {
        const todayItems = schedules.filter(s => s.date === selectedDate);
        const total = todayItems.length;
        const done = todayItems.filter(s => s.status === 'DONE').length;
        const rate = total > 0 ? Math.round((done / total) * 100) : 0;

        const memberStats = MEMBERS.map(m => {
          const mItems = todayItems.filter(s => s.memberId === m.id);
          const mDone = mItems.filter(s => s.status === 'DONE').length;
          const mRate = mItems.length > 0 ? Math.round((mDone / mItems.length) * 100) : 0;
          return { ...m, total: mItems.length, done: mDone, rate: mRate };
        });

        return { total, done, rate, memberStats };
      }, [schedules, selectedDate]);

      return (
        <div className="max-w-5xl mx-auto px-3 sm:px-6 py-4 sm:py-8 mb-20">
          
          {}
          <header className="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200/80 mb-6">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              
              {/* App Brand Title */}
              <div className="flex items-center space-x-3">
                <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white text-2xl shadow-md shadow-indigo-200">
                  <i className="fa-solid fa-house-heart"></i>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight">우리집 커넥트</h1>
                    <span className="text-xs bg-indigo-50 text-indigo-600 px-2.5 py-0.5 rounded-full font-semibold border border-indigo-100 flex items-center gap-1">
                      <span className={`w-2 h-2 rounded-full ${useFirebase ? 'bg-emerald-500 animate-ping' : 'bg-amber-400'}`}></span>
                      {useFirebase ? '실시간 동기화 중' : '로컬 데모 모드'}
                    </span>
                  </div>
                  <p className="text-xs sm:text-sm text-slate-500 mt-0.5">
                    {new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' })}
                  </p>
                </div>
              </div>

              {/* Persona Profile Selector */}
              <div className="bg-slate-50 p-2 rounded-xl border border-slate-200/70">
                <div className="text-[11px] font-bold text-slate-400 mb-1 px-1 uppercase tracking-wider flex items-center justify-between">
                  <span>현재 사용자 선택</span>
                  <span className="text-indigo-600 font-semibold">{currentMember.name} ({currentMember.role})</span>
                </div>
                <div className="flex items-center gap-1.5 sm:gap-2">
                  {MEMBERS.map(m => {
                    const isSelected = currentMember.id === m.id;
                    return (
                      <button
                        key={m.id}
                        onClick={() => setCurrentMember(m)}
                        className={`flex items-center space-x-1.5 px-2.5 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                          isSelected 
                            ? `${m.bgLight} ${m.text} ${m.border} border shadow-sm ring-2 ${m.ring}` 
                            : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'
                        }`}
                      >
                        <span className="text-sm">{m.avatar}</span>
                        <span>{m.name}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

            </div>
          </header>

          {}
          <section className="bg-gradient-to-r from-indigo-950 via-slate-900 to-indigo-900 rounded-2xl p-5 sm:p-6 text-white shadow-xl mb-6 relative overflow-hidden">
            <div className="absolute right-0 top-0 translate-x-8 -translate-y-8 w-48 h-48 bg-indigo-500/10 rounded-full blur-2xl"></div>
            
            <div className="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
              
              {/* Left Summary Info */}
              <div className="space-y-2">
                <div className="flex items-center gap-2 text-indigo-300 text-xs font-semibold tracking-wide uppercase">
                  <i className="fa-solid fa-chart-line"></i>
                  <span>오늘의 우리집 달성률 현황</span>
                </div>
                <h2 className="text-2xl sm:text-3xl font-black tracking-tight">
                  {stats.rate === 100 ? '🎉 완벽해요! 모든 일정을 마쳤습니다!' : stats.rate >= 50 ? '🚀 훌륭해요! 절반 이상 달성했네요!' : '💪 오늘 하루도 파이팅이에요!'}
                </h2>
                <p className="text-xs sm:text-sm text-slate-300">
                  총 {stats.total}개 일정 중 <span className="text-emerald-400 font-bold">{stats.done}개 완료</span> ({stats.rate}%)
                </p>

                {/* Progress Bar */}
                <div className="w-full bg-slate-800 rounded-full h-3 overflow-hidden mt-3 p-0.5 border border-slate-700">
                  <div 
                    className="bg-gradient-to-r from-emerald-400 to-teal-300 h-full rounded-full transition-all duration-700 ease-out"
                    style={{ width: `${stats.rate}%` }}
                  ></div>
                </div>
              </div>

              {/* Individual Member Cards */}

                  <select 
                    value={formData.memberId}
                    onChange={(e) => setFormData({ ...formData, memberId: e.target.value })}
                    className="w-full px-3 py-2 bg-slate-50 rounded-xl border border-slate-200 text-xs font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-400"
                  >
                    {MEMBERS.map(m => (
                      <option key={m.id} value={m.id}>{m.avatar} {m.name} ({m.role})</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">카테고리</label>
                  <select 
                    value={formData.category}
                    onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                    className="w-full px-3 py-2 bg-slate-50 rounded-xl border border-slate-200 text-xs font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-400"
                  >
                    {Object.keys(CATEGORIES).map(ck => (
                      <option key={ck} value={ck}>{CATEGORIES[ck].label}</option>
                    ))}
                  </select>
                </div>
              </div>

              {/* Date & Times */}
              <div className="grid grid-cols-3 gap-2">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">날짜</label>
                  <input 
                    type="date"
                    value={formData.date}
                    onChange={(e) => setFormData({ ...formData, date: e.target.value })}
                    className="w-full px-2 py-2 bg-slate-50 rounded-xl border border-slate-200 text-xs focus:outline-none"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">시작 시간</label>
                  <input 
                    type="time"
                    value={formData.startTime}
                    onChange={(e) => setFormData({ ...formData, startTime: e.target.value })}
                    className="w-full px-2 py-2 bg-slate-50 rounded-xl border border-slate-200 text-xs focus:outline-none"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">종료 시간</label>
                  <input 
                    type="time"
                    value={formData.endTime}
                    onChange={(e) => setFormData({ ...formData, endTime: e.target.value })}
                    className="w-full px-2 py-2 bg-slate-50 rounded-xl border border-slate-200 text-xs focus:outline-none"
                  />
                </div>
              </div>

              {/* Location */}
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">장소 / 위치</label>
                <input 
                  type="text"
                  value={formData.location}
                  onChange={(e) => setFormData({ ...formData, location: e.target.value })}
                  placeholder="예: 3층 수학학원, 이마트 수지점, 우리집"
                  className="w-full px-3 py-2 bg-slate-50 rounded-xl border border-slate-200 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                />
              </div>

              {/* Status */}
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">진행 상태</label>
                <div className="grid grid-cols-3 gap-2">
                  {Object.keys(STATUS_MAP).map(stKey => (
                    <button
                      type="button"
                      key={stKey}
                      onClick={() => setFormData({ ...formData, status: stKey })}
                      className={`py-2 px-2 rounded-xl text-xs font-bold border transition ${
                        formData.status === stKey 
                          ? 'bg-indigo-600 text-white border-indigo-600' 
                          : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                      }`}
                    >
                      {STATUS_MAP[stKey].label}
                    </button>
                  ))}
                </div>
              </div>

              {/* Note */}
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">메모 / 준비물</label>
                <textarea 
                  rows="2"
                  value={formData.note}
                  onChange={(e) => setFormData({ ...formData, note: e.target.value })}
                  placeholder="필요한 준물이나 주의사항을 적어주세요."
                  className="w-full px-3 py-2 bg-slate-50 rounded-xl border border-slate-200 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400"
                ></textarea>
              </div>

              {/* Buttons */}
              <div className="flex gap-2 pt-2 border-t border-slate-100">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 py-2.5 rounded-xl border border-slate-200 font-bold text-xs text-slate-600 hover:bg-slate-50"
                >
                  취소
                </button>
                <button
                  type="submit"
                  className="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 font-bold text-xs text-white shadow-md shadow-indigo-200"
                >
                  {initialData ? '수정 완료' : '등록하기'}
                </button>
              </div>

            </form>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
